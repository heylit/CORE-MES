name: kontrol

on:
  # Yol süzgeci yok: ana dala giren her birleşmenin kendi koşusu olur, birleştirme kapısı yalnız belge taşıyan birleşmede
  # hiç açılmayan koşuyu beklemez. Çekme isteğinde yalnız belge değiştiyse ağır işleri `kapsam` atlar.
  push:
    branches: [main]
  pull_request:
  # Ana dalda ya da bir dalda elle yeniden koşu: boş commit ya da istek kapatıp açma gerekmez.
  workflow_dispatch:

# Çekme isteğinde yeni gönderim eski koşuyu iptal eder. Ana dalda hiçbir koşu iptal edilmez: her commit kendi grubundadır,
# hızlı işler (kapsam, tip, denetim ve göç damgası, lint) ve Windows (3018 a) her birleşmede koşar. Linux'taki ağır test işleri
# (istemci, sunucu, ekran), koşu açılırken ana dal ilerlemişse atlanır (3045 a); ana dal gönderiminde kapsam daraltılmadığı için
# son koşu ondan önceki atlanan birleşmelerin testlerini de koşar. Elle koşu iptal etmez.
concurrency:
  group: kontrol-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Belirteç varsayılan olarak yalnız okur; depo ayarı değişse de böyle kalır. Çekme isteği okuması başlıktaki kart numarası
# denetimi içindir. Yazma yalnız `windows-yesil` işindedir (2964).
permissions:
  contents: read
  pull-requests: read

env:
  TMIV2_ORTAM: test
  TMIV2_PORT: 4100
  TMIV2_PG_HOST: 127.0.0.1
  TMIV2_PG_PORT: 5432
  TMIV2_PG_USER: tmiv2_uygulama
  TMIV2_PG_PASSWORD: tmiv2-uygulama
  TMIV2_PG_GOC_USER: tmiv2_goc
  TMIV2_PG_GOC_PASSWORD: tmiv2-goc
  # Testler yalnız test veritabanına bağlanır; asıl veritabanı adı ondan farklı olmak zorundadır.
  TMIV2_PG_DATABASE: tmiv2
  TMIV2_PG_TEST_DATABASE: tmiv2_test
  TMIV2_PG_BAGLANTI_SURE_MS: 5000
  TMIV2_PG_SORGU_SURE_MS: 10000
  TMIV2_PG_OKUMA_SURE_MS: 5000
  TMIV2_PG_HAVUZ: 10
  TMIV2_PG_KILIT_SURE_MS: 5000
  TMIV2_PG_BOS_TX_SURE_MS: 30000
  # Ölçüm (#25): 3 dosyada 201 sn, 8 dosyada 154 sn. Yerel koşu varsayılanda kalır.
  TMIV2_TEST_ESZAMANLI: 8

# Tek iş 21 dakika sürüyordu; işler ayrı makinelerde aynı anda koşar (#1219). Dal korumasının beklediği `kontrol` en sondaki
# toplayıcı iştir: bir iş bile yeşil değilse kırmızı biter. `kapsam` işinin atladığı test işi "atlandı" sayılır. Ana dala
# gönderimde ve elle koşuda her iş koşar.
jobs:
  # Değişen dosyalara göre hangi ağır işlerin koşacağı (araclar/ci-kapsam.sh; eşleme tablosu belgeler/ci/kapsam.md).
  # Bilinmeyen yol ve ortak parçalar (paylasilan, istemci/src/ortak, sunucu/cekirdek, paketler, iş akışı, araclar) her
  # şeyi koşturur. Süzgeç bu işin içindedir, `on.paths`'e taşınmaz: dal koruması hiç açılmayan `kontrol`'ü bekleyip kalır.
  kapsam:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Hangi işin koşacağını ve parça sayısını plan verir (3310 a): ci-kapsam.sh'in açtığı işte seçilen dosya kalmadıysa iş atlanır.
    outputs:
      sunucu: ${{ steps.plan.outputs.sunucu }}
      istemci: ${{ steps.plan.outputs.istemci }}
      ekran: ${{ steps.plan.outputs.ekran }}
      windows: ${{ steps.plan.outputs.windows }}
      sunucu_matris: ${{ steps.plan.outputs.sunucu_matris }}
      istemci_matris: ${{ steps.plan.outputs.istemci_matris }}
      ekran_matris: ${{ steps.plan.outputs.ekran_matris }}
      windows_matris: ${{ steps.plan.outputs.windows_matris }}
      eski: ${{ steps.uc.outputs.eski }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Ana dalda koşular birbirini iptal etmez (3045 a): iptal grubu sırayı commit'e göre değil gruba giriş anına göre kurar,
      # aynı anda açılan eski koşu yeniyi iptal edebilir. Koşu açılırken ana dalın ucu bu commit değilse (arkadan birleşme
      # geldiyse) ağır işler atlanır, testlerini yeni koşu taşır. Yarışta karar zararsız yöndedir: eski koşu ucu göremezse iki
      # koşu da tam koşar; yeni koşu, ondan da yeni bir birleşme yoksa atlanmaz.
      - id: uc
        if: github.event_name == 'push'
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          uc=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -n "$uc" ] || { echo '::error::Ana dalın ucu okunamadı'; exit 1; }
          if [ "$uc" = "$SHA" ]; then
            echo 'eski=false' >> "$GITHUB_OUTPUT"
          else
            echo "Ana dal ilerlemiş ($uc); bu koşunun ağır test işleri atlanır."
            echo 'eski=true' >> "$GITHUB_OUTPUT"
          fi
      - id: sec
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
        run: |
          hepsi() { printf 'sunucu=true\nistemci=true\nekran=true\n' | tee -a "$GITHUB_OUTPUT"; exit 0; }
          # Ana dalda daraltılmaz: önceki birleşmenin ağır işleri atlanmış olabilir, testleri bu koşu taşır (2705 a, 3045 a).
          case "$OLAY" in
            pull_request) taban=HEAD^1 ;;
            *) hepsi ;;
          esac
          # Süreç ikamesindeki hata yutulur ve testler sessizce atlanırdı: liste önce alınır, alınamazsa iş düşer. Yeniden
          # adlandırmada git yalnız yeni yolu verir; eski yol da listeye girsin diye --no-renames.
          degisenler=$(git diff --name-only --no-renames "$taban" HEAD)
          printf '%s\n' "$degisenler" > "$RUNNER_TEMP/degisenler.txt"
          sonuc=$(printf '%s\n' "$degisenler" | OLAY="$OLAY" bash araclar/ci-kapsam.sh)
          echo "$sonuc"
          tail -n 3 <<< "$sonuc" >> "$GITHUB_OUTPUT"
      # Plan aracı paket istemez: Node'un kendisiyle koşar, npm ci yoktur.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Dosya süreleri ana dal koşularında ölçülür ve önbelleğe yazılır (`sureler` işi); en yenisi alınır. Önbellek yoksa ya da
      # dosyanın ölçüsü yoksa bölme sayıyla yapılır, hiçbir dosya atlanmaz.
      - uses: actions/cache/restore@v4
        with:
          path: .ci-sureler
          key: ci-sureler-${{ github.run_id }}
          restore-keys: ci-sureler-
      # Çekme isteğinde değişen dosyaların ithal grafiğinde etkilediği testler ve etkilenen modüllerin ekran testleri seçilir
      # (araclar/ci-plan.ts); ana dalda ve elle koşuda her dosya. Ana dal koşusu kırılmayı yakalar, canlı paket yalnız Windows
      # yeşili etiketli commit'ten çıkar (3310 a).
      - id: plan
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
          SUNUCU: ${{ steps.sec.outputs.sunucu }}
          ISTEMCI: ${{ steps.sec.outputs.istemci }}
          EKRAN: ${{ steps.sec.outputs.ekran }}
        run: |
          # Ana dalda fark alınmaz (her şey koşar): araca boş girdi gider.
          [ -f "$RUNNER_TEMP/degisenler.txt" ] || : > "$RUNNER_TEMP/degisenler.txt"
          node araclar/ci-plan.ts plan --olay "$OLAY" --cikti ci-plan --sureler .ci-sureler/sureler.json \
            < "$RUNNER_TEMP/degisenler.txt" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
          if-no-files-found: ignore
          retention-days: 7

  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run tip

  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Göç damgası denetimi birleştirme commit'inin ilk ebeveynine bakar.
          fetch-depth: 2
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      # Canlı pakete giren bağımlılıklarda yüksek ya da kritik seviyeli bilinen açık yeni girmesin (2150-1 a, 2162).
      - name: Canlı paketlerde bilinen açık
        run: npm audit --omit=dev --audit-level=high
      # Geliştirme olarak kayıtlı paketlerin bir kısmı (exceljs, jsqr, tesseract, three-147) derlenmiş ekrana girer; yukarıdaki
      # adım onları görmez. Tam ağaç uyarı olarak bakılır, iş kırılmaz (2160-1 b). Depo herkese açık: özete yalnız seviye sayıları
      # yazılır, paket ve açık ayrıntısı yerelde `npm audit` ile okunur.
      - name: Bütün paketlerde bilinen açık (uyarı)
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const s = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/audit.json`, "utf8")).metadata?.vulnerabilities;
            if (!s) { console.log("::warning::npm audit sonucu okunamadı"); process.exit(0); }
            const satir = `Bütün paketler: ${s.critical} kritik, ${s.high} yüksek, ${s.moderate} orta, ${s.low} düşük`;
            if (s.total > 0) console.log(`::warning::${satir}`); else console.log(satir);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${satir}\n`);'
      # Sürüm notundaki satır karta başlıktaki parantezle bağlanır (1565 b; kural araclar/paket.ts kartNoVarMi). Başlık olay
      # yükünden değil API'den okunur: başlık düzeltilince işi yeniden koşturmak yeter, yeni gönderim gerekmez.
      - name: Çekme isteği başlığında kart numarası
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
          ISTEK: ${{ github.event.pull_request.number }}
        run: |
          BASLIK="$(gh api "repos/$DEPO/pulls/$ISTEK" --jq .title)" node --input-type=module -e '
            const { kartNoVarMi } = await import("./araclar/paket.ts");
            const baslik = process.env.BASLIK ?? "";
            if (!kartNoVarMi(baslik)) {
              console.error(`Başlığın sonunda parantez içinde kart numarası yok: "${baslik}". Örnek: "Fix stock search (1501)".`);
              process.exit(1);
            }
            console.log(`Başlık kart numarası taşıyor: ${baslik}`);'
      - run: npm run sinir
      # Modülsüz sınır denetimi göç damgasına bakmaz. Değişenler birleştirme commit'inin ilk ebeveyninden, son göç ana
      # dalın güncel ucundan alınır; eski damgalı göç birleşirse kurulu sistemde göç durur.
      # Var olan göç değişmezdir: değişen ya da silinen göç kurulu sistemde göç koşusunu durdurur; aynı adım yakalar.
      - name: Göç damgası ve var olan göç (yeni göçler ana daldaki son göçten sonra mı, var olan göç değişmiş mi)
        if: github.event_name == 'pull_request'
        env:
          TABAN: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$TABAN:refs/remotes/origin/$TABAN"
          node araclar/goc-damgasi.ts HEAD^1 "origin/$TABAN"
      # Kural 4 (belgeler/adr/README.md): çapalı dosya değişip ADR ve dizin değişmediyse uyarı yazar, kırmaz (1565 d).
      - name: ADR çapası değişti mi (uyarı)
        if: github.event_name == 'pull_request'
        run: node araclar/adr-denetimi.ts --capa HEAD^1
      # Ana dala gönderimde de: istek eski tabanla yeşil kalmış olabilir. Birleştirme commit'inin ilk ebeveyni gönderimden
      # önceki ana daldır; hem değişimin hem son göçün tabanı odur.
      - name: Göç damgası ve var olan göç (ana dala gönderim)
        if: github.event_name == 'push'
        run: node araclar/goc-damgasi.ts HEAD^1 HEAD^1
      - run: npm run lint:css
      - run: npm run derle:istemci

  # Tip bilgili eslint tek süreçte bütün tsconfig programlarını kurar ve 4 GB yığını aşıyordu (#143). Dosyalar programa ve
  # modül klasörüne göre parçalanır (araclar/lint-parcala.ts); her parça ayrı makinede kendi programını kurar.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - run: node --max-old-space-size=4096 araclar/lint-parcala.ts --parca ${{ matrix.parca }}/4

  istemci-test:
    needs: kapsam
    if: needs.kapsam.outputs.istemci == 'true' && needs.kapsam.outputs.eski != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parca: ${{ fromJSON(needs.kapsam.outputs.istemci_matris) }}
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
      # Dosyalar plandan (araclar/ci-plan.ts). vitest süzgeci yolun parçasıyla eşleşir: aynı adın .ts ve .tsx'i ikisi de koşar, eksik kalmaz.
      - name: İstemci testleri, parça ${{ matrix.parca }}
        run: |
          mapfile -t dosyalar < <(sed 's#^istemci/##' "ci-plan/istemci-${{ matrix.parca }}.txt")
          [ "${#dosyalar[@]}" -gt 0 ] || { echo 'Parça boş'; exit 1; }
          npm run test:istemci -- "${dosyalar[@]}"

  # Parçalar ölçülmüş dosya süresiyle bölünür (araclar/ci-plan.ts, 3310 a): node --test-shard sırayla dağıtıyordu, aynı koşuda en
  # kısa parça 6:09, en uzunu 9:39 sürdü (16.11 ölçümü). Parça sayısı üst sınırı araçtadır (PARCA).
  sunucu-test:
    needs: kapsam
    if: needs.kapsam.outputs.sunucu == 'true' && needs.kapsam.outputs.eski != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parca: ${{ fromJSON(needs.kapsam.outputs.sunucu_matris) }}
    services:
      postgres:
        image: postgres:18
        # Süper kullanıcı yalnız kurulum ve taşıma denemesi adımlarında kullanılır; testler iki rolle koşar.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmiv2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Parçanın dosyaları plandan; dosya süreleri bir sonraki planın bölmesi için yazılır (3310 a).
    env:
      TMIV2_TEST_DOSYALARI: ci-plan/sunucu-${{ matrix.parca }}.txt
      TMIV2_TEST_SURE_DOSYASI: sure-sunucu-${{ matrix.parca }}.json
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      # Atılacak test sunucusu: diske yazma beklenmez. Tek işte koşu süresinin önemli kısmı art arda gelen WAL denetim
      # noktalarında geçiyordu. Ayarlar yeniden yüklemeyle geçerli olur; testlerin gördüğü davranış değişmez.
      - name: Test sunucusunu diske yazmayı beklemeyecek biçimde ayarla
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "ALTER SYSTEM SET max_wal_size = '4GB'" \
            -c "SELECT pg_reload_conf()"
      - name: Veritabanı kullanıcılarını aç (iki kez - betik yeniden koşulabilir olmalı)
        env:
          PGPASSWORD: postgres
        run: |
          for tur in 1 2; do
            psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_TEST_DATABASE" \
              -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          done
      - name: Taşıma denemesi (süper kullanıcının kurduğu veritabanında taşıma, doğrulama, geri alma)
        if: matrix.parca == 1
        env:
          VT_SUPER_USER: postgres
          VT_SUPER_PASSWORD: postgres
        run: bash araclar/vt/tasima-denemesi.sh
      # Canlı sunucu PostgreSQL 18'dir (2329-1 b): sürüm imajın etiketinden gelir, burada sayıyla doğrulanır. Asıl veritabanı
      # hiç yokken açılıp bütün göçler boş veritabanına uygulanır; ekran işi kapsam dışında kaldığında da koşar.
      - name: PostgreSQL 18 ve boş veritabanına bütün göçler
        if: matrix.parca == 1
        env:
          PGPASSWORD: postgres
        run: |
          ana=$(psql -X -At -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "SHOW server_version_num")
          echo "PostgreSQL server_version_num: $ana"
          [ "$((ana / 10000))" -eq 18 ] || { echo "PostgreSQL 18 bekleniyordu, sunucu $ana"; exit 1; }
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "CREATE DATABASE $TMIV2_PG_DATABASE"
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          npm run goc
          # Testler CI'da asıl veritabanı yokken koşar; olsaydı ona dayanan test burada yeşil kalırdı (2306).
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "DROP DATABASE $TMIV2_PG_DATABASE WITH (FORCE)"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
      - run: npm run test:sunucu
      - name: Dosya süreleri
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sure-sunucu-${{ matrix.parca }}
          path: sure-sunucu-${{ matrix.parca }}.json
          if-no-files-found: ignore
          retention-days: 3

  # Ekran ve davranış testleri (ekran-testleri/): öncelikli modüllerin sayfaları 360, 768 ve 1280 genişlikte, örnek veriyle.
  # Tarayıcı ağdan indirilmez: çalıştırıcı imajında kurulu Google Chrome kullanılır.
  # Parçalara bölünür ki ekran işi CI süresini belirleyen iş olmasın; her parça kendi veritabanında koşar, oturum kurulumu her
  # parçada yeniden koşar. Playwright'ın kendi bölmesi sayıya göreydi (en kısa parça 4:28, en uzunu 9:20; 16.11): parçalar artık
  # dosya olarak ve ölçülmüş süreyle bölünür, her parça kendi dosyalarını üç genişlikte koşar (araclar/ci-plan.ts, 3310 a).
  ekran:
    needs: kapsam
    if: needs.kapsam.outputs.ekran == 'true' && needs.kapsam.outputs.eski != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parca: ${{ fromJSON(needs.kapsam.outputs.ekran_matris) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmiv2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      TMIV2_EKRAN_TARAYICI: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - name: Kurulu tarayıcı
        run: '"$TMIV2_EKRAN_TARAYICI" --version'
      - name: Veritabanı kullanıcılarını aç
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
      - run: npm run goc
      - run: npm run ekran:hazirla
      - run: npm run derle:istemci
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
      # Dosyalar plandan; her parça kendi dosyalarını üç genişlikte koşar, oturum kurulumu bağımlılık olarak her parçada koşar.
      # Süzgeç playwright'ta düzenli ifadedir: dosya adı tam eşleşsin diye nokta kaçırılır ve başına yol ayırıcı konur.
      - name: Ekran testleri, parça ${{ matrix.parca }}
        env:
          TMIV2_EKRAN_SURE_DOSYASI: ${{ runner.temp }}/ekran-rapor.json
        run: |
          mapfile -t dosyalar < "ci-plan/ekran-${{ matrix.parca }}.txt"
          suzgec=()
          for d in "${dosyalar[@]}"; do [ -n "$d" ] || continue; b=${d#ekran-testleri/}; suzgec+=("[\\/]${b//./\\.}\$"); done
          [ "${#suzgec[@]}" -gt 0 ] || { echo 'Parça boş'; exit 1; }
          npm run ekran -- "${suzgec[@]}"
      - name: Dosya süreleri
        if: github.event_name == 'push' && success()
        run: node araclar/ci-plan.ts ekran-sure "$RUNNER_TEMP/ekran-rapor.json" "sure-ekran-${{ matrix.parca }}.json"
      - if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sure-ekran-${{ matrix.parca }}
          path: sure-ekran-${{ matrix.parca }}.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Düşen testlerin görüntü ve izleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-sonuc-${{ matrix.parca }}
          path: /tmp/tmiv2-ekran/sonuc
          retention-days: 7
          if-no-files-found: ignore

  # Uygulama kurumda Windows'ta çalışır: bekçi, yedek ve güncelleyici orada da denenir; hedef platformda uygulama kodu da
  # denensin diye sunucu testlerinden bir parça (çekirdek ve en riskli üç modül) koşar. Bütün sunucu testleri koşmaz: süre
  # Linux işlerinin toplamını aşar. Atlanan ya da yapılacak diye bırakılan test kırmızıdır, çünkü Windows'a özgü yol sessizce
  # atlanırsa iş yine yeşil görünür. PostgreSQL çalıştırıcı imajında kuruludur, hizmeti kapalı gelir; ağdan bir şey indirilmez.
  # Tek makinede sunucu testleri 20-31 dk sürüyordu; dosyalar en çok dört makineye bölünür (3018 a). Bölme plandan gelir
  # (araclar/ci-plan.ts, Windows'ta ölçülen süreyle): her dosya tek parçaya düşer, birleşimi `windows-butunluk` denetler.
  windows:
    needs: kapsam
    # Çekme isteğinde de koşar (3216 b): bozan iş ana dala girmeden Windows'ta yakalanır. Etiket yine yalnız ana dal koşusundadır.
    # Çekme isteğinde yalnız seçilen sunucu testlerinin Windows kümesindeki kesişimi koşar; kesişim boşsa iş atlanır (3310 a).
    if: needs.kapsam.outputs.windows == 'true'
    # İptal yok (3018 a): yeni birleşme eski Windows koşusunu kesmez, her ana dal commit'inin kendi Windows sonucu olur;
    # kırmızıda bozan birleşme, kırmızı koşunun commit'idir (son yeşilden sonraki ilk kırmızı).
    strategy:
      fail-fast: false
      matrix:
        parca: ${{ fromJSON(needs.kapsam.outputs.windows_matris) }}
    runs-on: windows-latest
    timeout-minutes: 25
    # Windows çalıştırıcısında sekiz paralel test dosyasının yükü altında yeni bağlantının kurulması 5 sn'yi aşabiliyor.
    # Yalnız bu iş uzatılır: Linux işleri ve uygulama ayarı aynı kalır; testler süreyi sabit yazmaz, ayardan okur.
    env:
      TMIV2_PG_BAGLANTI_SURE_MS: 15000
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Logo yardımcısı (ADR 0017) .NET Framework 4.x'in kendi derleyicisiyle x86 derlenir; testleri sahte Logo'yla koşar, COM ve SQL Server gerekmez.
      # Sunucu testi dışındaki adımlar yalnız parça 1'de koşar; öteki parçalar aynı işi tekrarlamaz.
      - name: Logo yardımcısını derle ve testlerini koş
        if: matrix.parca == 1
        shell: cmd
        run: call araclar\logo-yardimcisi\derle.cmd test
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - name: PostgreSQL hizmetini aç
        shell: pwsh
        run: |
          $hizmet = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $hizmet) { throw 'Çalıştırıcıda PostgreSQL hizmeti yok' }
          Set-Service -Name $hizmet.Name -StartupType Manual
          Start-Service -Name $hizmet.Name
      - name: Test veritabanını ve kullanıcılarını aç
        env:
          PGPASSWORD: root
        run: |
          # Linux sunucu test işindeki gibi: atılacak test sunucusu diske yazmayı beklemez, testlerin gördüğü davranış değişmez.
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "ALTER SYSTEM SET max_wal_size = '4GB'" \
            -c "SELECT pg_reload_conf()"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "CREATE DATABASE $TMIV2_PG_TEST_DATABASE"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_TEST_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
      # Çalıştırıcıdaki PostgreSQL 17'dir (2340); sürüm burada zorunlu tutulmaz, PG18 denetimi Linux sunucu test işindedir.
      # Hedef platformda boş veritabanına bütün göçler uygulanır; testler asıl veritabanı yokken koşsun diye sonra silinir.
      - name: Boş veritabanına bütün göçler (PostgreSQL sürümü yazdırılır)
        if: matrix.parca == 1
        env:
          PGPASSWORD: root
        run: |
          "$PGBIN/psql" -X -At -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "SELECT version()"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "CREATE DATABASE $TMIV2_PG_DATABASE"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          npm run goc
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "DROP DATABASE $TMIV2_PG_DATABASE WITH (FORCE)"
      - name: İşletme betiklerinin ve test robotunun testleri
        if: matrix.parca == 1
        run: |
          node --import ./araclar/ortam-yukle-goc.ts --import ./araclar/kablolama-yukle.ts --test --test-reporter=tap \
            araclar/bekci.test.ts araclar/guncelleyici.test.ts araclar/yedek.test.ts 'ekran-testleri/benzetim/**/*.test.ts' 2>&1 | tee test-cikti.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx '# skipped 0' test-cikti.txt && grep -qx '# todo 0' test-cikti.txt \
            || { echo 'Atlanan ya da yapılacak test var; Windows işinde kırmızı sayılır.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
      # Dosyalar plandan (araclar/ci-plan.ts; desenler WINDOWS_DESENLERI, ölçülmüş Windows süresiyle bölünür). Bu parçanın node'a
      # verdiği dosyalar günlüğe ve dosyaya yazılır; parçaların birleşimini `windows-butunluk` planla, ana dalda tam kümeyle de
      # karşılaştırır. Süre raporcusu ayrı dosyaya yazar: tap çıktısı karışmaz.
      - name: Sunucu testleri (çekirdek, stok, üretim emirleri, plan), parça ${{ matrix.parca }}
        env:
          PARCA: ${{ matrix.parca }}
          TMIV2_TEST_SURE_DOSYASI: sure-windows-${{ matrix.parca }}.json
        run: |
          mapfile -t benim < <(tr -d '\r' < "ci-plan/windows-$PARCA.txt" | grep -v '^$')
          [ "${#benim[@]}" -gt 0 ] || { echo "Parça $PARCA boş"; exit 1; }
          printf '%s\n' "${benim[@]}" > "windows-parca-$PARCA.txt"
          echo "Parça $PARCA dosyaları (${#benim[@]}):"; cat "windows-parca-$PARCA.txt"
          node --import ./araclar/ortam-yukle-goc.ts --import ./araclar/kablolama-yukle.ts --test \
            --test-concurrency="$TMIV2_TEST_ESZAMANLI" --test-reporter=tap --test-reporter-destination=stdout \
            --test-reporter=./araclar/test-rapor-github.ts --test-reporter-destination=sure-rapor.txt \
            "${benim[@]}" 2>&1 | tee sunucu-test-cikti.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx '# skipped 0' sunucu-test-cikti.txt && grep -qx '# todo 0' sunucu-test-cikti.txt \
            || { echo 'Atlanan ya da yapılacak test var; Windows işinde kırmızı sayılır.'; exit 1; }
      - name: Dosya süreleri
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sure-windows-${{ matrix.parca }}
          path: sure-windows-${{ matrix.parca }}.json
          if-no-files-found: ignore
          retention-days: 3
      # Liste yalnız testler yeşil bittiyse yüklenir: `windows-butunluk` dört listeyi de bulursa dört parça da yeşildir.
      - name: Parçanın koştuğu dosya listesi
        uses: actions/upload-artifact@v4
        with:
          name: windows-parca-${{ matrix.parca }}
          path: windows-parca-${{ matrix.parca }}.txt
          if-no-files-found: error
          retention-days: 7

  # Windows parçalarının koştuğu dosyaların birleşimi plana eşit mi (3018 a, 3310 a). Eksik, fazla ya da iki parçada koşan dosya
  # varsa ya da bir parçanın listesi yoksa (parça kırmızı ya da iptal) kırmızıdır. Plan araçtan geldiği için ana dalda plan ayrıca
  # aynı desenlerin bulduğu tam kümeyle karşılaştırılır; çekme isteğinde plan tam kümenin alt kümesi olmalıdır. Etiket buna bağlıdır.
  windows-butunluk:
    needs: [kapsam, windows]
    if: needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-parca-*
          merge-multiple: true
          path: parcalar
      - name: Parçaların birleşimi plan, plan tam küme
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
          MATRIS: ${{ needs.kapsam.outputs.windows_matris }}
        run: |
          set -euo pipefail
          mapfile -t parcalar < <(jq -r '.[]' <<< "$MATRIS")
          : > plan.txt; : > kosan.txt
          for p in "${parcalar[@]}"; do
            [ -s "parcalar/windows-parca-$p.txt" ] || { echo "Parça $p listesi yok: parça yeşil bitmemiş"; exit 1; }
            tr -d '\r' < "ci-plan/windows-$p.txt" | grep -v '^$' >> plan.txt
            tr -d '\r' < "parcalar/windows-parca-$p.txt" | grep -v '^$' >> kosan.txt
          done
          LC_ALL=C sort -o plan.txt plan.txt; LC_ALL=C sort -o kosan.txt kosan.txt
          tekrar=$(uniq -d kosan.txt)
          [ -z "$tekrar" ] || { echo "İki parçada koşan dosya:"; echo "$tekrar"; exit 1; }
          diff plan.txt kosan.txt || { echo 'Koşan dosyalar plana eşit değil (< koşmayan, > fazla)'; exit 1; }
          desenler=('sunucu/cekirdek/**/*.test.ts' 'sunucu/moduller/stok/**/*.test.ts'
            'sunucu/moduller/uretim-emirleri/**/*.test.ts' 'sunucu/moduller/plan/**/*.test.ts')
          shopt -s globstar nullglob
          tumu=()
          for desen in "${desenler[@]}"; do tumu+=($desen); done
          shopt -u globstar nullglob
          printf '%s\n' "${tumu[@]}" | LC_ALL=C sort -u > tam.txt
          if [ "$OLAY" = pull_request ]; then
            disarida=$(LC_ALL=C comm -23 plan.txt tam.txt)
            [ -z "$disarida" ] || { echo "Planda Windows kümesi dışında dosya:"; echo "$disarida"; exit 1; }
          else
            diff tam.txt plan.txt || { echo 'Plan tam kümeye eşit değil (< plana girmeyen, > fazla)'; exit 1; }
          fi
          echo "${#parcalar[@]} parça: $(wc -l < kosan.txt) dosya, tam küme: $(wc -l < tam.txt)" | tee -a "$GITHUB_STEP_SUMMARY"

  # Ana dal koşusunun ölçtüğü dosya süreleri önbelleğe yazılır; sonraki koşuların planı en yenisini alır (3310 a). Önceki ölçüyle
  # birleşir: bu koşuda ölçülmeyen dosyanın eski ölçüsü kalır. Yalnız ana dalda yazılır; çekme isteği okur, yazmaz.
  # Kırmızı ya da atlanan parçanın süresi yoktur; o dosyalar eski ölçüyle kalır. Sonuç kapıya girmez.
  sureler:
    needs: [sunucu-test, ekran, windows]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: .ci-sureler
          key: ci-sureler-${{ github.run_id }}
          restore-keys: ci-sureler-
      # Hiç ölçü yüklenmediyse (bütün ağır işler atlandı) indirme boş döner; iş yine de geçer.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sure-*
          path: sure
      - name: Süreleri birleştir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-sureler
          argumanlar=()
          for d in sure/*/*.json; do
            [ -e "$d" ] || continue
            is=$(basename "$d" | sed -E 's/^sure-([a-z]+)-[0-9]+\.json$/\1/')
            argumanlar+=("$is=$d")
          done
          [ "${#argumanlar[@]}" -gt 0 ] || { echo 'Bu koşuda ölçü yok; önbellek değişmez.'; exit 0; }
          node araclar/ci-plan.ts birlestir .ci-sureler/sureler.json .ci-sureler/sureler.json "${argumanlar[@]}"
          echo "Ölçü dosyası: ${#argumanlar[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: hashFiles('.ci-sureler/sureler.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-sureler
          key: ci-sureler-${{ github.run_id }}

  kontrol:
    if: always()
    needs: [kapsam, tip, denetim, lint, istemci-test, sunucu-test, ekran, windows, windows-butunluk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bütün işler yeşil
        env:
          SONUCLAR: ${{ toJSON(needs) }}
          ESKI: ${{ needs.kapsam.outputs.eski }}
        run: |
          echo "$SONUCLAR" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Ana dal ilerlediği için atlanan ağır iş yeşil sayılmaz: bu commit'in testleri sonraki koşudadır (3045 a).
          if [ "$ESKI" = "true" ]; then
            echo "::error::Bu koşu açılırken ana dal ilerlemişti; ağır testler atlandı. Bu commit'in testleri ana daldaki sonraki koşudadır. O koşunun sonucuna bakın."
            exit 1
          fi
          # Elle iptal edilen ağır iş de yeşil sayılmaz.
          if echo "$SONUCLAR" | jq -e 'any(.[]; .result == "cancelled")' > /dev/null; then
            echo "::error::Ağır test işi iptal edildi; bu commit'in testleri ana daldaki sonraki koşudadır. O koşunun sonucuna bakın."
            exit 1
          fi
          # Atlanan iş yalnız kapsam yeşilse kabul edilir; kapsam düşerse ona bağlı işler de atlanır.
          echo "$SONUCLAR" | jq -e '.kapsam.result == "success" and .tip.result == "success" and .denetim.result == "success"
            and .lint.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # Windows dahil bütün işleri yeşil biten ana dal commit'i etiketlenir (2964). Dört Windows parçasının yeşili matris sonucuna
  # bırakılmaz: `windows-butunluk` dört parçanın da yeşil bitince yüklediği listeyi arar ve birleşimini tam kümeyle karşılaştırır: canlı ve güncelleme paketi yalnız etiketli
  # commit'ten çıkar. Etiket commit başına ayrıdır ve hiç taşınmaz, zorla gönderme gerekmez; var olan etiket yeniden yazılmaz.
  # İptal edilen ya da kırmızı koşuda iş atlanır, etiket konmaz. Son yeşil (belgeler/ci/kapsam.md):
  # git fetch --tags && git describe --tags --abbrev=0 --first-parent --match 'windows-yesil/*' origin/main
  windows-yesil:
    needs: [windows, windows-butunluk, kontrol]
    if: >-
      needs.windows.result == 'success' && needs['windows-butunluk'].result == 'success' && needs.kontrol.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Yalnız bu iş etiket yazar; öteki işler üst düzeydeki okuma yetkisiyle kalır.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit'e Windows yeşili etiketi
        env:
          SHA: ${{ github.sha }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Aynı commit'in yeniden koşusu ikinci etiket açmaz. Liste önce değişkene alınır: borudaki `grep -q` erken çıkınca
          # ls-remote SIGPIPE ile düşer ve pipefail altında koşul yanlış olurdu (etiket çoğaldıkça).
          etiketler=$(git ls-remote --tags origin 'refs/tags/windows-yesil/*')
          if grep -q "^$SHA"$'\t'"refs/tags/windows-yesil/.*\^{}$" <<< "$etiketler"; then
            echo "Bu commit zaten etiketli: $SHA"
            exit 0
          fi
          # Ad commit zamanından (UTC) ve sha'dan: yeniden koşuda aynı ad çıkar, adla sıralama zamanla sıralamadır.
          tarih=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d-%H%M "$SHA")
          ad="windows-yesil/$tarih-${SHA:0:8}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$ad" "$SHA" -m "Windows dahil bütün işler yeşil" -m "Koşu: $KOSU"
          # Yeni etiket gönderilir; aynı adda etiket varsa git reddeder, üstüne yazılmaz.
          git push origin "refs/tags/$ad"
          echo "Etiket: $ad" | tee -a "$GITHUB_STEP_SUMMARY"
