name: kontrol

on:
  # Yol süzgeci yok: ana dala giren her birleşmenin kendi koşusu olur, birleştirme kapısı yalnız belge taşıyan birleşmede
  # hiç açılmayan koşuyu beklemez. Çekme isteğinde yalnız belge değiştiyse ağır işleri `kapsam` atlar.
  push:
    branches: [main]
  pull_request:
  # Ana dalda ya da bir dalda elle yeniden koşu: boş commit ya da istek kapatıp açma gerekmez.
  workflow_dispatch:

# Çekme isteğinde yeni gönderim eski koşuyu iptal eder. Ana dalda koşu bütünüyle iptal edilmez: her commit kendi grubundadır,
# hızlı işler (kapsam, tip, denetim ve göç damgası, lint) her birleşmede koşar. Yalnız ağır test işleri (istemci, sunucu,
# ekran, Windows) iş düzeyindeki grupla yeni birleşmeye yer açar (2705 a); ana dal gönderiminde kapsam daraltılmadığı için
# son koşu ondan önceki iptal edilen birleşmelerin testlerini de koşar. Elle koşu iptal etmez.
concurrency:
  group: kontrol-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TMIV2_ORTAM: test
  TMIV2_PORT: 4100
  TMIV2_PG_HOST: 127.0.0.1
  TMIV2_PG_PORT: 5432
  TMIV2_PG_USER: tmiv2_uygulama
  TMIV2_PG_PASSWORD: tmiv2-uygulama
  TMIV2_PG_GOC_USER: tmiv2_goc
  TMIV2_PG_GOC_PASSWORD: tmiv2-goc
  # Testler yalnız test veritabanına bağlanır; asıl veritabanı adı ondan farklı olmak zorundadır.
  TMIV2_PG_DATABASE: tmiv2
  TMIV2_PG_TEST_DATABASE: tmiv2_test
  TMIV2_PG_BAGLANTI_SURE_MS: 5000
  TMIV2_PG_SORGU_SURE_MS: 10000
  TMIV2_PG_OKUMA_SURE_MS: 5000
  TMIV2_PG_HAVUZ: 10
  TMIV2_PG_KILIT_SURE_MS: 5000
  TMIV2_PG_BOS_TX_SURE_MS: 30000
  # Ölçüm (#25): 3 dosyada 201 sn, 8 dosyada 154 sn. Yerel koşu varsayılanda kalır.
  TMIV2_TEST_ESZAMANLI: 8

# Tek iş 21 dakika sürüyordu; işler ayrı makinelerde aynı anda koşar (#1219). Dal korumasının beklediği `kontrol` en sondaki
# toplayıcı iştir: bir iş bile yeşil değilse kırmızı biter. `kapsam` işinin atladığı test işi "atlandı" sayılır. Ana dala
# gönderimde ve elle koşuda her iş koşar.
jobs:
  # Değişen dosyalara göre hangi ağır işlerin koşacağı (araclar/ci-kapsam.sh; eşleme tablosu belgeler/ci/kapsam.md).
  # Bilinmeyen yol ve ortak parçalar (paylasilan, istemci/src/ortak, sunucu/cekirdek, paketler, iş akışı, araclar) her
  # şeyi koşturur. Süzgeç bu işin içindedir, `on.paths`'e taşınmaz: dal koruması hiç açılmayan `kontrol`'ü bekleyip kalır.
  kapsam:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sunucu: ${{ steps.sec.outputs.sunucu }}
      istemci: ${{ steps.sec.outputs.istemci }}
      ekran: ${{ steps.sec.outputs.ekran }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: sec
        shell: bash
        env:
          OLAY: ${{ github.event_name }}
        run: |
          hepsi() { printf 'sunucu=true\nistemci=true\nekran=true\n' | tee -a "$GITHUB_OUTPUT"; exit 0; }
          # Ana dalda daraltılmaz: önceki birleşmenin ağır işleri iptal edilmiş olabilir, testleri bu koşu taşır (2705 a).
          case "$OLAY" in
            pull_request) taban=HEAD^1 ;;
            *) hepsi ;;
          esac
          # Süreç ikamesindeki hata yutulur ve testler sessizce atlanırdı: liste önce alınır, alınamazsa iş düşer. Yeniden
          # adlandırmada git yalnız yeni yolu verir; eski yol da listeye girsin diye --no-renames.
          degisenler=$(git diff --name-only --no-renames "$taban" HEAD)
          sonuc=$(printf '%s\n' "$degisenler" | OLAY="$OLAY" bash araclar/ci-kapsam.sh)
          echo "$sonuc"
          tail -n 3 <<< "$sonuc" >> "$GITHUB_OUTPUT"

  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run tip

  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Göç damgası denetimi birleştirme commit'inin ilk ebeveynine bakar.
          fetch-depth: 2
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      # Canlı pakete giren bağımlılıklarda yüksek ya da kritik seviyeli bilinen açık yeni girmesin (2150-1 a, 2162).
      - name: Canlı paketlerde bilinen açık
        run: npm audit --omit=dev --audit-level=high
      # Geliştirme olarak kayıtlı paketlerin bir kısmı (exceljs, jsqr, tesseract, three-147) derlenmiş ekrana girer; yukarıdaki
      # adım onları görmez. Tam ağaç uyarı olarak bakılır, iş kırılmaz (2160-1 b). Depo herkese açık: özete yalnız seviye sayıları
      # yazılır, paket ve açık ayrıntısı yerelde `npm audit` ile okunur.
      - name: Bütün paketlerde bilinen açık (uyarı)
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const s = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/audit.json`, "utf8")).metadata?.vulnerabilities;
            if (!s) { console.log("::warning::npm audit sonucu okunamadı"); process.exit(0); }
            const satir = `Bütün paketler: ${s.critical} kritik, ${s.high} yüksek, ${s.moderate} orta, ${s.low} düşük`;
            if (s.total > 0) console.log(`::warning::${satir}`); else console.log(satir);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${satir}\n`);'
      # Sürüm notundaki satır karta başlıktaki parantezle bağlanır (1565 b; kural araclar/paket.ts kartNoVarMi). Başlık olay
      # yükünden değil API'den okunur: başlık düzeltilince işi yeniden koşturmak yeter, yeni gönderim gerekmez.
      - name: Çekme isteği başlığında kart numarası
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
          ISTEK: ${{ github.event.pull_request.number }}
        run: |
          BASLIK="$(gh api "repos/$DEPO/pulls/$ISTEK" --jq .title)" node --input-type=module -e '
            const { kartNoVarMi } = await import("./araclar/paket.ts");
            const baslik = process.env.BASLIK ?? "";
            if (!kartNoVarMi(baslik)) {
              console.error(`Başlığın sonunda parantez içinde kart numarası yok: "${baslik}". Örnek: "Fix stock search (1501)".`);
              process.exit(1);
            }
            console.log(`Başlık kart numarası taşıyor: ${baslik}`);'
      - run: npm run sinir
      # Modülsüz sınır denetimi göç damgasına bakmaz. Değişenler birleştirme commit'inin ilk ebeveyninden, son göç ana
      # dalın güncel ucundan alınır; eski damgalı göç birleşirse kurulu sistemde göç durur.
      # Var olan göç değişmezdir: değişen ya da silinen göç kurulu sistemde göç koşusunu durdurur; aynı adım yakalar.
      - name: Göç damgası ve var olan göç (yeni göçler ana daldaki son göçten sonra mı, var olan göç değişmiş mi)
        if: github.event_name == 'pull_request'
        env:
          TABAN: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$TABAN:refs/remotes/origin/$TABAN"
          node araclar/goc-damgasi.ts HEAD^1 "origin/$TABAN"
      # Kural 4 (belgeler/adr/README.md): çapalı dosya değişip ADR ve dizin değişmediyse uyarı yazar, kırmaz (1565 d).
      - name: ADR çapası değişti mi (uyarı)
        if: github.event_name == 'pull_request'
        run: node araclar/adr-denetimi.ts --capa HEAD^1
      # Ana dala gönderimde de: istek eski tabanla yeşil kalmış olabilir. Birleştirme commit'inin ilk ebeveyni gönderimden
      # önceki ana daldır; hem değişimin hem son göçün tabanı odur.
      - name: Göç damgası ve var olan göç (ana dala gönderim)
        if: github.event_name == 'push'
        run: node araclar/goc-damgasi.ts HEAD^1 HEAD^1
      - run: npm run lint:css
      - run: npm run derle:istemci

  # Tip bilgili eslint tek süreçte bütün tsconfig programlarını kurar ve 4 GB yığını aşıyordu (#143). Dosyalar programa ve
  # modül klasörüne göre parçalanır (araclar/lint-parcala.ts); her parça ayrı makinede kendi programını kurar.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - run: node --max-old-space-size=4096 araclar/lint-parcala.ts --parca ${{ matrix.parca }}/4

  istemci-test:
    needs: kapsam
    if: needs.kapsam.outputs.istemci == 'true'
    # Ana dal gönderiminde yeni birleşme bu işin eski koşusunu iptal eder (2705 a); başka olayda grup koşuya özgüdür.
    concurrency:
      group: kontrol-istemci-test-${{ matrix.parca }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:istemci -- --shard=${{ matrix.parca }}/3

  # node --test-shard dosyaları sırayla dağıtır, süreye bakmaz; birkaç uzun dosya ilk parçada toplanıyordu (altı parçada en
  # uzunu ötekilerin ~1,25 katı). Sekiz parçada en uzun parçanın payı ~%30 azalır (1913 ölçümü). Parça sayısı değişirse süreler yeniden ölçülür.
  sunucu-test:
    needs: kapsam
    if: needs.kapsam.outputs.sunucu == 'true'
    # Ana dal gönderiminde yeni birleşme bu işin eski koşusunu iptal eder (2705 a); başka olayda grup koşuya özgüdür.
    concurrency:
      group: kontrol-sunucu-test-${{ matrix.parca }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18
        # Süper kullanıcı yalnız kurulum ve taşıma denemesi adımlarında kullanılır; testler iki rolle koşar.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmiv2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TMIV2_TEST_PARCA: ${{ matrix.parca }}/8
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      # Atılacak test sunucusu: diske yazma beklenmez. Tek işte koşu süresinin önemli kısmı art arda gelen WAL denetim
      # noktalarında geçiyordu. Ayarlar yeniden yüklemeyle geçerli olur; testlerin gördüğü davranış değişmez.
      - name: Test sunucusunu diske yazmayı beklemeyecek biçimde ayarla
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "ALTER SYSTEM SET max_wal_size = '4GB'" \
            -c "SELECT pg_reload_conf()"
      - name: Veritabanı kullanıcılarını aç (iki kez - betik yeniden koşulabilir olmalı)
        env:
          PGPASSWORD: postgres
        run: |
          for tur in 1 2; do
            psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_TEST_DATABASE" \
              -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          done
      - name: Taşıma denemesi (süper kullanıcının kurduğu veritabanında taşıma, doğrulama, geri alma)
        if: matrix.parca == 1
        env:
          VT_SUPER_USER: postgres
          VT_SUPER_PASSWORD: postgres
        run: bash araclar/vt/tasima-denemesi.sh
      # Canlı sunucu PostgreSQL 18'dir (2329-1 b): sürüm imajın etiketinden gelir, burada sayıyla doğrulanır. Asıl veritabanı
      # hiç yokken açılıp bütün göçler boş veritabanına uygulanır; ekran işi kapsam dışında kaldığında da koşar.
      - name: PostgreSQL 18 ve boş veritabanına bütün göçler
        if: matrix.parca == 1
        env:
          PGPASSWORD: postgres
        run: |
          ana=$(psql -X -At -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "SHOW server_version_num")
          echo "PostgreSQL server_version_num: $ana"
          [ "$((ana / 10000))" -eq 18 ] || { echo "PostgreSQL 18 bekleniyordu, sunucu $ana"; exit 1; }
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "CREATE DATABASE $TMIV2_PG_DATABASE"
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          npm run goc
          # Testler CI'da asıl veritabanı yokken koşar; olsaydı ona dayanan test burada yeşil kalırdı (2306).
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "DROP DATABASE $TMIV2_PG_DATABASE WITH (FORCE)"
      - run: npm run test:sunucu

  # Ekran ve davranış testleri (ekran-testleri/): öncelikli modüllerin sayfaları 360, 768 ve 1280 genişlikte, örnek veriyle.
  # Tarayıcı ağdan indirilmez: çalıştırıcı imajında kurulu Google Chrome kullanılır.
  # Parçalara bölünür ki ekran işi CI süresini belirleyen iş olmasın; her parça kendi veritabanında koşar, oturum kurulumu her
  # parçada yeniden koşar. Playwright testleri süreye göre değil, sırayla ve sayıya göre böler; sıra g360, g768, g1280'dir.
  # 1280 testleri öteki iki genişliğin toplamı kadar sürer ve 360'ta atlanan testler de sayıya girer; dört parçada son
  # iki parça ilk ikinin bir buçuk katıydı. Altı parçada en uzun parçanın test süresi ~5:25'ten ~4:00'e iner (1911 ölçümü).
  # Parça sayısı değişirse süreler yeniden ölçülür.
  ekran:
    needs: kapsam
    if: needs.kapsam.outputs.ekran == 'true'
    # Ana dal gönderiminde yeni birleşme bu işin eski koşusunu iptal eder (2705 a); başka olayda grup koşuya özgüdür.
    concurrency:
      group: kontrol-ekran-${{ matrix.parca }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmiv2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      TMIV2_EKRAN_TARAYICI: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - name: Kurulu tarayıcı
        run: '"$TMIV2_EKRAN_TARAYICI" --version'
      - name: Veritabanı kullanıcılarını aç
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
      - run: npm run goc
      - run: npm run ekran:hazirla
      - run: npm run derle:istemci
      - run: npm run ekran -- --shard=${{ matrix.parca }}/6
      - name: Düşen testlerin görüntü ve izleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-sonuc-${{ matrix.parca }}
          path: /tmp/tmiv2-ekran/sonuc
          retention-days: 7
          if-no-files-found: ignore

  # Uygulama kurumda Windows'ta çalışır: bekçi, yedek ve güncelleyici orada da denenir; hedef platformda uygulama kodu da
  # denensin diye sunucu testlerinden bir parça (çekirdek ve en riskli üç modül) koşar. Bütün sunucu testleri koşmaz: süre
  # Linux işlerinin toplamını aşar. Atlanan ya da yapılacak diye bırakılan test kırmızıdır, çünkü Windows'a özgü yol sessizce
  # atlanırsa iş yine yeşil görünür. PostgreSQL çalıştırıcı imajında kuruludur, hizmeti kapalı gelir; ağdan bir şey indirilmez.
  windows:
    needs: kapsam
    # Cekme isteginde kosmaz; ana dala gonderimde ve elle kosuda kosar; atlanan is kontrol'de skipped sayilir.
    if: needs.kapsam.outputs.sunucu == 'true' && github.event_name != 'pull_request'
    # Ana dal gönderiminde yeni birleşme bu işin eski koşusunu iptal eder (2705 a); başka olayda grup koşuya özgüdür.
    concurrency:
      group: kontrol-windows-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 45
    # Windows çalıştırıcısında sekiz paralel test dosyasının yükü altında yeni bağlantının kurulması 5 sn'yi aşabiliyor.
    # Yalnız bu iş uzatılır: Linux işleri ve uygulama ayarı aynı kalır; testler süreyi sabit yazmaz, ayardan okur.
    env:
      TMIV2_PG_BAGLANTI_SURE_MS: 15000
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Logo yardımcısı (ADR 0017) .NET Framework 4.x'in kendi derleyicisiyle x86 derlenir; testleri sahte Logo'yla koşar, COM ve SQL Server gerekmez.
      - name: Logo yardımcısını derle ve testlerini koş
        shell: cmd
        run: call araclar\logo-yardimcisi\derle.cmd test
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Paketler package-lock ve Node sürümüyle anahtarlı önbellekten gelir; anahtar tutmazsa npm ci koşar. Araçların kendi
      # önbelleği (tip denetiminin artımlı dosyaları, vite) alınmaz: her koşu onları kendisi üretir.
      - id: paketler
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.cache
            !node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.paketler.outputs.cache-hit != 'true'
        run: npm ci
      - name: PostgreSQL hizmetini aç
        shell: pwsh
        run: |
          $hizmet = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $hizmet) { throw 'Çalıştırıcıda PostgreSQL hizmeti yok' }
          Set-Service -Name $hizmet.Name -StartupType Manual
          Start-Service -Name $hizmet.Name
      - name: Test veritabanını ve kullanıcılarını aç
        env:
          PGPASSWORD: root
        run: |
          # Linux sunucu test işindeki gibi: atılacak test sunucusu diske yazmayı beklemez, testlerin gördüğü davranış değişmez.
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "ALTER SYSTEM SET max_wal_size = '4GB'" \
            -c "SELECT pg_reload_conf()"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "CREATE DATABASE $TMIV2_PG_TEST_DATABASE"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_TEST_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
      # Çalıştırıcıdaki PostgreSQL 17'dir (2340); sürüm burada zorunlu tutulmaz, PG18 denetimi Linux sunucu test işindedir.
      # Hedef platformda boş veritabanına bütün göçler uygulanır; testler asıl veritabanı yokken koşsun diye sonra silinir.
      - name: Boş veritabanına bütün göçler (PostgreSQL sürümü yazdırılır)
        env:
          PGPASSWORD: root
        run: |
          "$PGBIN/psql" -X -At -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres -c "SELECT version()"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "CREATE DATABASE $TMIV2_PG_DATABASE"
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d "$TMIV2_PG_DATABASE" \
            -v goc_parola="$TMIV2_PG_GOC_PASSWORD" -v uygulama_parola="$TMIV2_PG_PASSWORD" -f araclar/vt/kurulum.sql
          npm run goc
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -h "$TMIV2_PG_HOST" -p "$TMIV2_PG_PORT" -U postgres -d postgres \
            -c "DROP DATABASE $TMIV2_PG_DATABASE WITH (FORCE)"
      - name: İşletme betiklerinin ve test robotunun testleri
        run: |
          node --import ./araclar/ortam-yukle-goc.ts --import ./araclar/kablolama-yukle.ts --test --test-reporter=tap \
            araclar/bekci.test.ts araclar/guncelleyici.test.ts araclar/yedek.test.ts 'ekran-testleri/benzetim/**/*.test.ts' 2>&1 | tee test-cikti.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx '# skipped 0' test-cikti.txt && grep -qx '# todo 0' test-cikti.txt \
            || { echo 'Atlanan ya da yapılacak test var; Windows işinde kırmızı sayılır.'; exit 1; }
      # Node hiçbir dosyayla eşleşmeyen deseni hata saymaz: her desenin dosya bulduğu önceden denetlenir ki yol farkı sessiz
      # yeşil vermesin. Desenler node'a tırnaklı gider, node'un kendi glob'u açar.
      - name: Sunucu testleri (çekirdek, stok, üretim emirleri, plan)
        run: |
          desenler=('sunucu/cekirdek/**/*.test.ts' 'sunucu/moduller/stok/**/*.test.ts'
            'sunucu/moduller/uretim-emirleri/**/*.test.ts' 'sunucu/moduller/plan/**/*.test.ts')
          shopt -s globstar nullglob
          for desen in "${desenler[@]}"; do
            dosyalar=($desen)
            [ "${#dosyalar[@]}" -gt 0 ] || { echo "Desen hiçbir test dosyası bulmadı: $desen"; exit 1; }
            echo "$desen: ${#dosyalar[@]} dosya"
          done
          shopt -u globstar nullglob
          node --import ./araclar/ortam-yukle-goc.ts --import ./araclar/kablolama-yukle.ts --test \
            --test-concurrency="$TMIV2_TEST_ESZAMANLI" --test-reporter=tap "${desenler[@]}" 2>&1 | tee sunucu-test-cikti.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx '# skipped 0' sunucu-test-cikti.txt && grep -qx '# todo 0' sunucu-test-cikti.txt \
            || { echo 'Atlanan ya da yapılacak test var; Windows işinde kırmızı sayılır.'; exit 1; }

  kontrol:
    if: always()
    needs: [kapsam, tip, denetim, lint, istemci-test, sunucu-test, ekran, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bütün işler yeşil
        env:
          SONUCLAR: ${{ toJSON(needs) }}
        run: |
          echo "$SONUCLAR" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Ana dalda iptal edilen ağır iş yeşil sayılmaz: bu commit'in testleri bir sonraki birleşmenin koşusundadır (2705 a).
          if echo "$SONUCLAR" | jq -e 'any(.[]; .result == "cancelled")' > /dev/null; then
            echo "::error::Ağır test işi iptal edildi; bu commit'in testleri ana daldaki sonraki koşudadır. O koşunun sonucuna bakın."
            exit 1
          fi
          # Atlanan iş yalnız kapsam yeşilse kabul edilir; kapsam düşerse ona bağlı işler de atlanır.
          echo "$SONUCLAR" | jq -e '.kapsam.result == "success" and .tip.result == "success" and .denetim.result == "success"
            and .lint.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' > /dev/null
