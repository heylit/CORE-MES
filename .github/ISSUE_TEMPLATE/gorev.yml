name: Görev
description: Her istek bir karttır.
labels: ["durum: yeni"]
body:
  - type: textarea
    id: ne
    attributes:
      label: Ne istiyorum
      description: Sonuç olarak ne görmek istiyorsun? Bir iki cümle.
    validations:
      required: true
  - type: textarea
    id: kabul
    attributes:
      label: Kabul ölçütü
      description: Bittiğini neyle anlarız? Tek cümlelik maddeler.
    validations:
      required: true
  - type: textarea
    id: nasil
    attributes:
      label: Ne yapılacak / Nasıl
      description: Keşif doldurur; boş bırakılabilir.
  - type: textarea
    id: etki
    attributes:
      label: Neyi değiştirecek
      description: Dokunulacak modüller, sözleşmeler, göçler. Keşif doldurur; boş bırakılabilir.
