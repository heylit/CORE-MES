<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finans ve Muhasebe Yönetim Sistemi</title>
<meta name="description" content="KOBİ finans, muhasebe takibi ve otomatik finansal danışman">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EEF1F5; --ink:#17233B; --ink2:#4A5670; --ink3:#7C879C;
  --line:#DCE1E9; --teal:#0F766E; --teal-soft:#DCEFEC; --madder:#B4363F; --madder-soft:#F6E1E2;
  --brass:#A66A12; --brass-soft:#F7EBD6; --navy:#22355E; --focus:#2F6FEB;
  --chart-grid:rgba(23,35,59,.08);
  --font-ui:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-head:"Schibsted Grotesk", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#161F33; --surface2:#1D2840; --ink:#E7EBF3; --ink2:#AEB8CB; --ink3:#7F8AA1;
    --line:#2A3651; --teal:#33B5A7; --teal-soft:#14332F; --madder:#E36F77; --madder-soft:#3A1E24;
    --brass:#E2A94B; --brass-soft:#3A2E17; --navy:#8FA7DB; --focus:#7FA6FF; --chart-grid:rgba(231,235,243,.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#161F33; --surface2:#1D2840; --ink:#E7EBF3; --ink2:#AEB8CB; --ink3:#7F8AA1;
  --line:#2A3651; --teal:#33B5A7; --teal-soft:#14332F; --madder:#E36F77; --madder-soft:#3A1E24;
  --brass:#E2A94B; --brass-soft:#3A2E17; --navy:#8FA7DB; --focus:#7FA6FF; --chart-grid:rgba(231,235,243,.08);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg,canvas{max-width:100%}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:22px 14px 24px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--font-head);font-size:1rem;display:block;line-height:1.2}
.brand small{color:var(--ink3);font-size:.78rem}
.nav-group{margin-top:14px}
.nav-group > span{display:block;font-size:.76rem;color:var(--ink3);padding:0 10px 4px;font-weight:500}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav button .dot{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--madder);color:#fff;font-size:.72rem;display:grid;place-items:center}
.nav-foot{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink3)}

main:focus{outline:none}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{color:var(--ink2);margin-top:4px;max-width:70ch}
.save-state{font-size:.8rem;color:var(--ink3)}
.demo-banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:.9rem}

.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-wide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.panel-head p,.muted{color:var(--ink3);font-size:.86rem}
.stack > * + *{margin-top:18px}

.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.ledger > div{background:var(--surface);padding:14px 18px}
.ledger .lbl{font-size:.82rem;color:var(--ink2)}
.ledger .val{font-family:var(--font-head);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.ledger .sub{font-size:.78rem;color:var(--ink3);margin-top:2px}
.pos{color:var(--teal)} .neg{color:var(--madder)} .warn{color:var(--brass)}

.hero{padding:24px 24px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--hero-c,var(--teal))}
.hero .verdict{font-family:var(--font-head);font-size:clamp(1.2rem,2.2vw,1.6rem);font-weight:700;line-height:1.3;max-width:62ch}
.hero .why{color:var(--ink2);margin-top:6px;max-width:75ch}
.hero-chart{height:260px;margin-top:16px}
.chart{position:relative;height:260px}
.chart.tall{height:320px}
.chart.short{height:210px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--brass-soft);color:var(--brass)}
.pill.risk{background:var(--madder-soft);color:var(--madder)}
.pill.neutral{background:var(--surface2);color:var(--ink2)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink2);background:var(--surface2);font-size:.8rem}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:120px}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.alerts .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.alerts .ic.risk{background:var(--madder-soft);color:var(--madder)}
.alerts .ic.warn{background:var(--brass-soft);color:var(--brass)}
.alerts .ic.ok{background:var(--teal-soft);color:var(--teal)}
.alerts b{font-weight:600}
.alerts small{display:block;color:var(--ink3)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink2);font-weight:500}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px}
input[type=range]{width:100%;accent-color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.8rem}
.btn.danger{color:var(--madder)}
.btn.ghost{border-color:transparent;background:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.metric-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.metric-row:last-child{border-bottom:0}
.metric-row b{font-variant-numeric:tabular-nums}
.big{font-family:var(--font-head);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}

.ratio{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ratio:last-child{border-bottom:0}
.ratio .rv{font-family:var(--font-head);font-weight:700;font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
.ratio p{grid-column:1/-1;color:var(--ink2);font-size:.86rem}
.ratio p.todo{color:var(--ink)}

.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:step}
@media (max-width:1000px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.flow{grid-template-columns:minmax(0,1fr)}}
.step{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--navy)}
.step .n{display:block;font-family:var(--font-head);font-weight:800;font-size:1.6rem;color:var(--navy);line-height:1}
.step h3{margin:8px 0 4px}
.step p{font-size:.85rem;color:var(--ink2)}
.step .go{display:block;margin-top:10px;font-size:.8rem;color:var(--navy);font-weight:600}

.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex:none}
.check small{display:block;color:var(--ink3)}
.progress{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--teal)}

.ccc{margin-top:8px}
.ccc-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:.82rem;color:var(--ink2)}
.ccc-track{position:relative;height:26px}
.ccc-bar{position:absolute;top:0;height:26px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}

.ai-out{white-space:normal;line-height:1.6;max-width:80ch}
.ai-out ul,.ai-out ol{padding-left:22px;margin:8px 0}
.ai-out p{margin:8px 0}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.note{font-size:.8rem;color:var(--ink3);margin-top:10px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface2);font-size:.78rem;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;z-index:5;height:auto;max-height:none;align-items:center;padding:10px 10px 8px;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding-top:calc(10px + env(safe-area-inset-top,0px));top:0}
  :root{padding-top:0}
  .brand,.nav-group > span,.nav-foot{display:none}
  .nav-group{margin:0;display:flex;gap:4px}
  .nav button{width:auto;white-space:nowrap;padding:7px 11px}
  main{padding-top:20px}
  h1{font-size:1.4rem}
}

/* ---- v2 eklemeleri ---- */
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px clamp(16px,3vw,40px);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:4}
.topbar .who{display:flex;gap:12px;align-items:center;min-width:0}
.topbar .who b{font-family:var(--font-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer;font-weight:600;font-size:.85rem}
.score-chip i{display:grid;place-items:center;min-width:30px;height:24px;border-radius:999px;color:#fff;font-style:normal;font-size:.8rem;padding:0 6px}
.sync{font-size:.8rem;color:var(--ink3)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sync-c,var(--ink3));margin-right:6px;vertical-align:1px}
main{padding:0}
.view{padding:26px clamp(16px,3vw,40px) 60px}
kbd{font-family:var(--font-ui);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink3);margin-left:6px}

.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(10,16,30,.42)}
.drawer[hidden]{display:none}
.drawer-panel{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer-body{padding:18px 22px;overflow-y:auto;flex:1}
.drawer-foot{display:flex;gap:8px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.drawer .form{grid-template-columns:1fr 1fr}
.drawer .full{grid-column:1/-1}
.hintline{grid-column:1/-1;font-size:.82rem;padding:8px 10px;border-radius:8px;background:var(--surface2);color:var(--ink2);min-height:20px}
.hintline:empty{display:none}
.seg.full{display:flex}.seg.full button{flex:1;padding:9px}

.gauge{display:block;width:100%;max-width:240px}
.adv-hero{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:24px;align-items:center}
@media (max-width:760px){.adv-hero{grid-template-columns:1fr}}
.subrow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:.86rem}
.subrow .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.subrow .bar i{display:block;height:100%;border-radius:4px}
.subrow b{text-align:right;font-variant-numeric:tabular-nums}

.fnd{border:1px solid var(--line);border-left:4px solid var(--fc,var(--ink3));border-radius:10px;background:var(--surface);margin-bottom:10px}
.fnd > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.fnd > summary::-webkit-details-marker{display:none}
.fnd[open] > summary{border-bottom:1px dashed var(--line)}
.fnd .ft{font-weight:600}
.fnd .fm{font-size:.78rem;color:var(--ink3)}
.fnd .fi{font-family:var(--font-head);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.fnd .fi small{display:block;font-family:var(--font-ui);font-weight:400;font-size:.72rem;color:var(--ink3)}
.fnd .fb{padding:12px 16px 14px}
.fnd .fb ol{margin:8px 0 12px;padding-left:20px}
.fnd .fb li{margin:4px 0}
.fnd.s3{--fc:var(--madder)} .fnd.s2{--fc:var(--brass)} .fnd.s1{--fc:var(--teal)}
.fnd.muted-f{opacity:.62}
.sev{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.sev.s3{background:var(--madder-soft);color:var(--madder)} .sev.s2{background:var(--brass-soft);color:var(--brass)} .sev.s1{background:var(--teal-soft);color:var(--teal)}

details.method{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.method > summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:.86rem}
details.method p,details.method li{font-size:.86rem;color:var(--ink2);max-width:80ch}
details.method p{margin:8px 0}
.formula{display:block;background:var(--surface2);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.86rem;color:var(--ink);overflow-x:auto;white-space:nowrap}
.hint{display:inline-block;position:relative;vertical-align:middle;margin-left:4px}
label.f{position:relative}
label.f > .hint{position:absolute;right:0;top:-2px;margin:0}
label.f > .hint > div{left:auto;right:0}
.hint > summary{list-style:none;cursor:pointer;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--ink3);font-weight:700}
.hint > summary::-webkit-details-marker{display:none}
.hint > div{position:absolute;z-index:6;top:22px;left:-10px;width:min(280px,70vw);background:var(--ink);color:var(--surface);padding:10px 12px;border-radius:8px;font-size:.8rem;line-height:1.45;font-weight:400}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.heat td.n{font-variant-numeric:tabular-nums}
.anchor-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.zone{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--madder) 0 22%,var(--brass) 22% 52%,var(--teal) 52% 100%);margin:14px 0 6px}
.zone i{position:absolute;top:-5px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.set-sec{scroll-margin-top:80px}
.set-sec .panel-head p{max-width:70ch}
.wlist{display:grid;grid-template-columns:1fr 90px;gap:8px 12px;align-items:center}
.okmsg{color:var(--teal)} .errmsg{color:var(--madder)}
@media (max-width:900px){.topbar{position:static}.drawer .form{grid-template-columns:1fr}}
@media (max-width:600px){.topbar .sync,.topbar [data-act=newChq]{display:none}.topbar{padding:10px 16px}}


/* ---- v3: olay bazlı kayıt ---- */
.nav .nav-cta{display:flex;justify-content:center;width:100%;margin:4px 0 6px;padding:10px 12px;border-radius:10px;border:0;background:var(--teal);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.nav .nav-cta:hover{filter:brightness(1.07)}
.nav .nav-cta[aria-current="page"]{outline:2px solid var(--ink);outline-offset:2px}
.ev-g{font-size:.82rem;color:var(--ink3);font-weight:600;margin:16px 0 8px;font-family:var(--font-ui)}
.ev-g:first-child{margin-top:0}
.ev-list{display:grid;gap:8px}
.ev-list.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ev{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;border-left:4px solid var(--teal)}
.ev:hover,.ev:focus-visible{border-color:var(--teal);background:var(--teal-soft)}
.ev b{font-size:.98rem}
.ev span{font-size:.82rem;color:var(--ink2);line-height:1.4}
.flabel{display:block;font-size:.8rem;color:var(--ink2);font-weight:500;margin-bottom:6px}

const TLF = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });
const fmt = n => TLF.format(Math.round(n || 0));

const fmtK = n => { const a = Math.abs(n || 0); if (a >= 1e6) return nf(n / 1e6, 2) + " Mn ₺"; if (a >= 1e3) return nf(n / 1e3, 0) + " B ₺"; return nf(n, 0) + " ₺"; };
const pct = (x, d = 1) => (x < 0 ? "-%" : "%") + nf(Math.abs((x || 0) * 100), d);

const fmtD = s => { if (!s) return "—"; const d = D(s); return d.getDate() + " " + MON[d.getMonth()]; };
const fmtDY = s => { if (!s) return "—"; const d = D(s); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return MON[m - 1] + " " + String(y).slice(2); };

  const totalSales = sum(Object.values(map), c => c.sales12);
  const allDelays = Object.values(map).flatMap(c => c.paid.map(p => p.delay));
  for (const c of Object.values(map)) {
    // yakın tarihli ödemelere daha fazla ağırlık (yarı ömür 180 gün)
    let wsum = 0, wdel = 0, lateW = 0;
    for (const p of c.paid) { const w = Math.pow(0.5, diffDays(TODAY, p.when) / 180); wsum += w; wdel += w * Math.max(0, p.delay); if (p.delay > 15) lateW += w; }

/* 2) Holt doğrusal üstel düzeltme — parametreler ızgara aramasıyla, bir adım ileri hata kareleri toplamını en aza indirerek seçilir */
function holt(y) {

  for (let a = 0.05; a < 0.96; a += 0.05) for (let b = 0.05; b < 0.96; b += 0.05) {
    let L = y[0], T = T0, sse = 0, ape = 0; const fit = [y[0]];

    if (!best || sse < best.sse) best = { alpha: a, beta: b, L, T, sse, fit, mape: ape / (n - 1) };
  }
  const rmse = Math.sqrt(best.sse / (n - 1));
  best.rmse = rmse;
  best.fc = [1, 2, 3].map(h => ({ h, v: Math.max(0, best.L + h * best.T), lo: Math.max(0, best.L + h * best.T - 1.2816 * rmse * Math.sqrt(h)), hi: best.L + h * best.T + 1.2816 * rmse * Math.sqrt(h) }));
  best.trendPct = best.L ? best.T / best.L : 0;

}

/* 3) Alacak tahsil süreci için yutucu Markov zinciri (Cyert–Davidson–Thompson yaklaşımı) */
function matInv(A) {
  const n = A.length, M = A.map((r, i) => r.concat(Array.from({ length: n }, (_, j) => i === j ? 1 : 0)));
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c]; for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c]; for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j]; }
  }

}
const MK_STATES = ["Vadesi gelmemiş", "1–30 gün", "31–60 gün", "61–90 gün", "91+ gün"];
function markovAR() {
  const wo = Number(state.settings.writeOffDays) || 180;
  const bucket = late => late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : late <= wo ? 4 : 6;
  const C = Array.from({ length: 5 }, () => new Array(7).fill(0));
  let obs = 0;
  const lastMe = monthEnd(ymAdd(TODAY.slice(0, 7), -1));
  for (const t of state.tx) {
    if (t.type !== "gelir" || t.status === "cek" || t.date < addDays(TODAY, -730)) continue;
    let ym = t.date.slice(0, 7);
    for (let guard = 0; guard < 30; guard++) {
      const me = monthEnd(ym), nx = monthEnd(ymAdd(ym, 1));
      if (nx > lastMe && nx > TODAY) break;
      if (t.status === "odendi" && t.paidDate && t.paidDate <= me) break;
      const s = bucket(diffDays(me, t.due)); if (s === 6) break;
      const ns = t.status === "odendi" && t.paidDate && t.paidDate <= nx ? 5 : bucket(diffDays(nx, t.due));
      C[s][ns]++; obs++;
      if (ns >= 5) break;
      ym = ymAdd(ym, 1);
    }
  }
  // zayıf ön bilgi (Laplace düzeltmesi): her durumdan tahsil ve bir sonraki yaşa geçiş için küçük sahte gözlemler
  const prior = [[0.5, 0.5, 0, 0, 0, 1, 0], [0, 0, 0.5, 0, 0, 1, 0], [0, 0, 0, 0.5, 0, 0.7, 0.1], [0, 0, 0, 0, 0.5, 0.5, 0.2], [0, 0, 0, 0, 1, 0.3, 0.3]];
  const P = C.map((row, i) => { const r = row.map((v, j) => v + prior[i][j]); const s = sum(r); return r.map(v => v / s); });
  const Q = P.map(r => r.slice(0, 5)), R = P.map(r => r.slice(5));
  const IQ = Q.map((r, i) => r.map((v, j) => (i === j ? 1 : 0) - v));
  const N = matInv(IQ); if (!N) return null;
  const B = N.map(r => [0, 1].map(k => sum(r.map((v, j) => v * R[j][k]))));
  const tAbs = N.map(r => sum(r));
  const bal = new Array(5).fill(0); let written = 0;
  for (const t of openItems("gelir")) { const s = bucket(diffDays(TODAY, t.due)); if (s === 6) written += gross(t); else bal[s] += gross(t); }
  const loss = sum(bal.map((b, i) => b * B[i][1])) + written;
  return { P, C, B, N, tAbs, bal, written, loss, collect: sum(bal.map((b, i) => b * B[i][0])), obs, wo, totalOpen: sum(bal) + written };
}

/* 4) Monte Carlo nakit simülasyonu — Cash-Flow-at-Risk */
function monteCarlo(mk, cs, hf) {
  const S = state.settings, N = clamp(Number(S.sims) || 1000, 200, 5000), r = rngOf(424242);
  const th = Number(state.company.threshold) || 0, p = salesProfile();
  const base = new Array(13).fill(0);
  fixedFlows((d, a) => { const i = weekIndex(d); if (i <= 12) base[i] += a; });
  const bounce = (Number(S.chequeRisk) || 0) / 100;
  const recv = openItems("gelir").map(t => {
    const c = cs.byParty[t.party], late = diffDays(TODAY, t.due);
    const bk = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    const pLoss = late > (mk ? mk.wo : 180) ? 0.9 : mk ? mk.B[bk][1] : 0.05;
    const own = c && c.delays.length >= 3 ? c.delays : null;
    const pool = own || (cs.allDelays.length ? cs.allDelays : [0, 5, 10, 20]);
    return { amt: gross(t), due: t.due, late, pLoss, pool, tail: late > 0 ? pool.filter(v => v > late) : null };
  });
  const chq = state.cheques.filter(q => q.dir === "alinan" && ["portfoy", "tahsilde"].includes(q.status) && q.due >= TODAY);
  const nextMonth = hf && !p.assumed ? hf.fc[0].v * p.grossFactor / 4.345 : p.wkSales;
  const wkMean = Math.max(0, nextMonth || p.wkSales), sig = Math.sqrt(Math.log(1 + Math.min(p.cv, 1.5) ** 2));
  const startCash = cashToday();
  const closes = Array.from({ length: 13 }, () => new Float64Array(N)), mins = new Float64Array(N);
  for (let s = 0; s < N; s++) {

    for (const x of recv) {

      const i = weekIndex(addDays(x.due, Math.round(d))); if (i <= 12) f[i] += x.amt;
    }

    for (let j = 0; j < 13; j++) {
      const sale = wkMean * Math.exp(sig * randn(r) - sig * sig / 2);
      const lag = p.collectDays + (r() - 0.5) * 21;
      const ci = j + Math.round(lag / 7); if (ci <= 12) f[ci] += sale;
      const pi = j + Math.round((p.payDays + (r() - 0.5) * 10) / 7); if (pi <= 12) f[pi] -= sale * p.varRatio;
    }
    let bal = startCash, mn = Infinity;
    for (let i = 0; i < 13; i++) { bal += f[i]; closes[i][s] = bal; if (bal < mn) mn = bal; }
    mins[s] = mn;
  }

  const bands = closes.map(arr => { const s = Array.from(arr).sort((a, b) => a - b); return Object.fromEntries(qs.map(q => ["p" + Math.round(q * 100), quantile(s, q)])); });
  const ms = Array.from(mins).sort((a, b) => a - b);
  const pNeg = ms.filter(v => v < 0).length / N, pBelow = ms.filter(v => v < th).length / N;
  const lo = ms[0], hi = ms[ms.length - 1], bins = 24, w = (hi - lo) / bins || 1;
  const hist = Array.from({ length: bins }, (_, i) => ({ x: lo + w * (i + 0.5), n: 0 }));
  for (const v of ms) hist[Math.min(bins - 1, Math.floor((v - lo) / w))].n++;
  const dipWeek = bands.reduce((a, b, i) => b.p50 < bands[a].p50 ? i : a, 0);
  return { N, bands, pNeg, pBelow, cfar5: quantile(ms, 0.05), cfar10: quantile(ms, 0.10), minP50: quantile(ms, 0.5), hist, dipWeek, startCash, th, wkMean, sig, profile: p };
}

/* 5) Altman Z'' (özel ve imalat dışı şirketler; gelişmekte olan piyasa sabiti ayrıca gösterilir) ve DuPont */
function altman(R) {
  const b = state.balance, n = x => Number(x) || 0;
  const TA = n(b.toplamBorc) + n(b.ozkaynak); if (!TA || !n(b.toplamBorc)) return null;
  const x1 = (n(b.donen) - n(b.kvb)) / TA, x2 = n(b.birikmisKar) / TA, x3 = (R.net + R.faiz) / TA, x4 = n(b.ozkaynak) / n(b.toplamBorc);
  const parts = [6.56 * x1, 3.26 * x2, 6.72 * x3, 1.05 * x4], z = sum(parts);
  return { x: [x1, x2, x3, x4], parts, z, zEM: z + 3.25, zone: z > 2.6 ? "ok" : z >= 1.1 ? "warn" : "risk", TA };
}
function dupont(R) {

  const m = R.net / R.gelir, at = R.gelir / TA, em = TA / E;

/* 6) Anomali tespiti — Iglewicz–Hoaglin değiştirilmiş z-puanı ve kayıt bazında IQR kuralı */
function anomalies() {

  const months = completeMonths(12); if (months.filter(m => m.gelir || m.gider).length < 6) return out;
  const last = months[11], hist = months.slice(0, 11);
  for (const cat of PNL_GIDER) {
    const series = hist.map(m => m.byCat[cat] || 0), x = last.byCat[cat] || 0;
    if (series.filter(v => v > 0).length < 5) continue;
    const med = median(series), mad = median(series.map(v => Math.abs(v - med)));
    const z = mad > 0 ? 0.6745 * (x - med) / mad : (mean(series.map(v => Math.abs(v - mean(series)))) > 0 ? (x - med) / (1.253314 * mean(series.map(v => Math.abs(v - mean(series))))) : 0);
    if (Math.abs(z) > k && Math.abs(x - med) > 2000) out.push({ kind: "ay", cat, ym: last.ym, value: x, median: med, z, diff: x - med });
  }

  for (const [cat, arr] of Object.entries(byCat)) {

  return head("Analiz modelleri", "Danışmanın kullandığı modellerin sonuçları, parametreleri ve yöntemleri. Teknik ayrıntı isteyenler için.") + `
  <nav class="anchor-nav" aria-label="Modeller">${nav.map(([k, l]) => `<button class="btn sm" data-act="toModel" data-m="${k}">${l}</button>`).join("")}</nav>

  <section class="panel set-sec" id="m-mc" style="margin-bottom:18px"><div class="panel-head"><h2>1. Monte Carlo nakit simülasyonu</h2><p>${nf(mc.N)} senaryo, 13 hafta</p></div>
    <div class="grid g2"><div>
      <div class="metric-row"><span>Eksiye düşme olasılığı</span><b>${pct(mc.pNeg, 1)}</b></div>
      <div class="metric-row"><span>Eşik altına inme olasılığı</span><b>${pct(mc.pBelow, 1)}</b></div>
      <div class="metric-row"><span>Riskteki nakit, %5 (CFaR)</span><b>${fmt(mc.cfar5)}</b></div>
      <div class="metric-row"><span>Riskteki nakit, %10</span><b>${fmt(mc.cfar10)}</b></div>
      <div class="metric-row"><span>Ortanca en düşük bakiye</span><b>${fmt(mc.minP50)}</b></div>
      <div class="metric-row"><span>Haftalık yeni satış ortalaması / oynaklık (σ)</span><b>${fmtK(mc.wkMean)} / ${nf(mc.sig, 2)}</b></div>
      <div class="metric-row"><span>Ortalama tahsil / ödeme günü</span><b>${nf(mc.profile.collectDays)} / ${nf(mc.profile.payDays)} gün</b></div>
    </div><div><div class="chart short"><canvas id="cMinHist"></canvas></div><p class="note">Her senaryodaki en düşük bakiyenin dağılımı. Kırmızı çubuklar eşiğin altı.</p></div></div>
    <details class="method"><summary>Yöntem</summary>
      <p>Cash-Flow-at-Risk yaklaşımı: nakit akışını oluşturan kalemler tek tek olasılık dağılımlarıyla simüle edilir ve sonuçların dağılımından olasılıklar okunur.</p>
      <p><b>Açık alacaklar:</b> her fatura için ödeme gecikmesi, o müşterinin geçmiş gecikmelerinden yeniden örneklenir (bootstrap). Vadesi geçmiş faturalarda yalnızca mevcut gecikmeden uzun geçmiş gecikmeler kullanılır (koşullu örnekleme). Batma olasılığı Markov modelinden gelir.</p>
      <p><b>Yeni satışlar:</b> haftalık satış log-normal dağılımdan çekilir; ortalama Holt modelinin gelecek ay tahmininden, oynaklık son 26 haftanın değişim katsayısından türetilir.</p>
      <span class="formula">S = μ · exp(σZ − σ²/2),  σ = √ln(1 + CV²),  Z ~ N(0,1)</span>
      <p><b>Değişken giderler:</b> satışın geçmiş oranı kadar, ortalama ödeme gününe göre kaydırılarak düşülür. <b>Çekler:</b> her biri ayarlardaki olasılıkla karşılıksız çıkar. <b>Sabit kalemler:</b> düzenli ödemeler, açık borçlar ve tahmini KDV her senaryoda aynıdır. Rastgele sayı üreteci sabit tohumla çalışır; aynı veriyle aynı sonuç üretilir.</p></details></section>

  <section class="panel set-sec" id="m-holt" style="margin-bottom:18px"><div class="panel-head"><h2>2. Satış tahmini</h2><p>${hf ? "Kullanılan yöntem: " + (METHOD_NAMES[hf.method] || "Holt") + " · Holt α " + nf(hf.alpha, 2) + ", β " + nf(hf.beta, 2) : "Yetersiz veri"}</p></div>
    ${hf ? `<div class="chart"><canvas id="cHolt"></canvas></div>
    <div class="tbl" style="margin-top:12px"><table><thead><tr><th>Ay</th><th class="n">Tahmin</th><th class="n">%80 alt sınır</th><th class="n">%80 üst sınır</th></tr></thead><tbody>${hf.fc.map(f => `<tr><td>${ymLong(ymAdd(TODAY.slice(0, 7), f.h - 1))}</td><td class="n"><b>${fmt(f.v)}</b></td><td class="n">${fmt(f.lo)}</td><td class="n">${fmt(f.hi)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">En az 4 aylık satış verisi gerekiyor.</p>`}
    <details class="method"><summary>Yöntem</summary>
      <p>Seviye (L) ve eğilim (T) iki ayrı düzeltme katsayısıyla güncellenir. Katsayılar 0,05 adımlı ızgarada, bir adım ileri tahmin hatalarının kareleri toplamını en aza indirecek şekilde seçilir.</p>
      <span class="formula">Lₜ = α·yₜ + (1−α)(Lₜ₋₁ + Tₜ₋₁)   Tₜ = β(Lₜ − Lₜ₋₁) + (1−β)Tₜ₋₁   ŷₜ₊ₕ = Lₜ + h·Tₜ</span>
      <p>Sistem her analizde üç yöntemi geçmişe dönük sınar (Holt, son 3 ayın ortalaması, geçen ayın tekrarı) ve bir ay sonrasını en iyi tahmin edeni kullanır. Satışları dalgalı şirketlerde basit yöntemler sıklıkla daha iyi sonuç verir. Tahmin aralığı: ŷ ± 1,2816 · hata · √h (yaklaşık %80). MAPE, geçmiş tahminlerin ortalama mutlak yüzde hatasıdır; %10'un altı iyi, %20'nin üstü zayıf kabul edilir. 24 aydan uzun veride mevsimsellik için Holt-Winters'a geçilebilir.</p></details></section>

  <section class="panel set-sec" id="m-markov" style="margin-bottom:18px"><div class="panel-head"><h2>3. Alacak tahsil modeli: yutucu Markov zinciri</h2><p>${M ? nf(M.obs) + " aylık geçiş gözlemi" : ""}</p></div>
    ${M ? `<div class="grid"><div><h3 style="margin-bottom:8px">Aylık geçiş olasılıkları</h3><div class="tbl heat"><table><thead><tr><th>Bu ay \\ Gelecek ay</th>${MK_STATES.map(s => `<th class="n">${s.replace(" gün", "")}</th>`).join("")}<th class="n">Tahsil</th><th class="n">Batık</th></tr></thead><tbody>
      ${M.P.map((r, i) => `<tr><td>${MK_STATES[i]}</td>${r.map(v => `<td class="n" style="${heat(v)}">${nf(v * 100, 0)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Değerler yüzde. Satırlar 100'e tamamlanır.</p></div>
      <div><h3 style="margin-bottom:8px">Nihai sonuç olasılıkları ve beklenen kayıp</h3><div class="tbl"><table><thead><tr><th>Yaş grubu</th><th class="n">Bakiye</th><th class="n">Tahsil</th><th class="n">Batık</th><th class="n">Beklenen kayıp</th><th class="n">Ort. süre</th></tr></thead><tbody>
      ${M.B.map((r, i) => `<tr><td>${MK_STATES[i]}</td><td class="n">${fmt(M.bal[i])}</td><td class="n">${pct(r[0], 0)}</td><td class="n ${r[1] > .2 ? "neg" : ""}">${pct(r[1], 1)}</td><td class="n">${fmt(M.bal[i] * r[1])}</td><td class="n">${nf(M.tAbs[i], 1)} ay</td></tr>`).join("")}
      <tr><td>${M.wo}+ gün (batık sayılan)</td><td class="n">${fmt(M.written)}</td><td class="n">—</td><td class="n">%100</td><td class="n">${fmt(M.written)}</td><td></td></tr>
      <tr><td><b>Toplam</b></td><td class="n"><b>${fmt(M.totalOpen)}</b></td><td></td><td></td><td class="n"><b class="neg">${fmt(M.loss)}</b></td><td></td></tr></tbody></table></div></div></div>` : `<p class="empty">Hesaplanamadı.</p>`}
    <details class="method"><summary>Yöntem</summary>
      <p>Her satış faturası her ay sonunda bir yaş grubunda bulunur ve bir sonraki ay sonunda ya tahsil edilmiş, ya başka bir yaş grubuna geçmiş, ya da ${M ? M.wo : 180} günü aşarak batık sayılmıştır. Geçmiş faturalardaki bu geçişler sayılarak geçiş matrisi P tahmin edilir; az gözlemli satırlar için küçük bir ön bilgi (Laplace düzeltmesi) eklenir.</p>
      <span class="formula">P = [Q R; 0 I]   N = (I − Q)⁻¹   B = N·R   Beklenen kayıp = Σ bakiyeᵢ · Bᵢ,batık</span>
      <p>N temel matristir; satır toplamları, bir alacağın sonuçlanmasına kadar beklenen ay sayısını verir. Bu yaklaşım şüpheli alacak karşılığını tahmin etmek için geliştirilmiş klasik bir yöntemdir. Model, ödeme davranışının durağan olduğunu varsayar; davranış değişirse sonuçlar birkaç ay içinde yeni veriye uyum sağlar.</p></details></section>

  <section class="panel set-sec" id="m-cust" style="margin-bottom:18px"><div class="panel-head"><h2>4. Müşteri risk puanı ve yoğunlaşma</h2><p>HHI ${nf(cs.hhi)} · ${cs.hhi > 2500 ? "yüksek" : cs.hhi > 1500 ? "orta" : "düşük"} yoğunlaşma · eşdeğer müşteri sayısı ${cs.hhi ? nf(10000 / cs.hhi, 1) : "—"}</p></div>
    <div class="tbl"><table><thead><tr><th>Müşteri</th><th>Not</th><th class="n">Puan</th><th class="n">Ağırlıklı ort. gecikme</th><th class="n">15+ gün geç ödeme oranı</th><th class="n">Olağan vade</th><th class="n">Açık bakiye</th><th class="n">Portföy çeki</th><th class="n">12 ay satış payı</th></tr></thead><tbody>
    ${cs.list.map(c => `<tr><td>${esc(c.party)}${c.bounced ? ' <span class="pill risk">karşılıksız çek</span>' : ""}</td><td><span class="pill ${{ A: "ok", B: "ok", C: "warn", D: "risk" }[c.grade]}">${c.grade}</span></td><td class="n">${c.score}</td><td class="n">${c.avgDelay === null ? "—" : nf(c.avgDelay, 1) + " gün"}</td><td class="n">${c.lateShare === null ? "—" : pct(c.lateShare, 0)}</td><td class="n">${c.term ? nf(c.term) + " gün" : "—"}</td><td class="n">${fmt(c.openBal)}</td><td class="n">${fmt(c.chequeBal)}</td><td class="n">${pct(c.share, 0)}</td></tr>`).join("")}</tbody></table></div>
    <details class="method"><summary>Yöntem</summary>
      <p>Puan 100'den başlar; ödeme geçmişi yoksa 75'ten. Kesintiler: ağırlıklı ortalama gecikme × 0,6 (en çok 40), 15 günden geç ödenen faturaların ağırlıklı payı × 25, mevcut en uzun gecikme × 0,2 (en çok 25), her karşılıksız çek için 30 (en çok 40). Ağırlıklar yarı ömrü 180 gün olan üstel azalmayla verilir; yakın tarihli davranış daha belirleyicidir. Not: A ≥ 80, B ≥ 65, C ≥ 45, D &lt; 45.</p>
      <span class="formula">wᵢ = 0,5^(gün önceᵢ / 180)    HHI = Σ (müşteri payı %)²</span>
      <p>Herfindahl-Hirschman endeksi 1.500'ün altında dağınık, 1.500–2.500 arasında orta, 2.500'ün üstünde yüksek yoğunlaşma olarak yorumlanır.</p></details></section>

  <section class="panel set-sec" id="m-altman" style="margin-bottom:18px"><div class="panel-head"><h2>5. Finansal sıkıntı: Altman Z'' ve DuPont analizi</h2></div>
    ${alt ? `<div class="grid g2"><div><div class="big">${nf(alt.z, 2)}</div><p class="muted">Gelişmekte olan piyasa sürümü (+3,25): ${nf(alt.zEM, 2)}</p>
      <div class="zone" aria-label="Bölge"><i style="left:${clamp(alt.z / 5, 0, 1) * 100}%"></i></div><div class="muted" style="display:flex;justify-content:space-between;font-size:.75rem"><span>0</span><span>1,1</span><span>2,6</span><span>5+</span></div>
      <div class="tbl" style="margin-top:12px"><table><thead><tr><th>Bileşen</th><th class="n">Oran</th><th class="n">Katsayı</th><th class="n">Katkı</th></tr></thead><tbody>
      ${[["X₁ İşletme sermayesi / toplam aktif", 6.56], ["X₂ Birikmiş kârlar / toplam aktif", 3.26], ["X₃ Faiz ve vergi öncesi kâr / toplam aktif", 6.72], ["X₄ Özkaynak / toplam borç", 1.05]].map(([l, k], i) => `<tr><td>${l}</td><td class="n">${nf(alt.x[i], 3)}</td><td class="n">${nf(k, 2)}</td><td class="n"><b>${nf(alt.parts[i], 2)}</b></td></tr>`).join("")}</tbody></table></div></div>
      <div>${dp ? `<h3 style="margin-bottom:8px">DuPont ayrıştırması</h3><div class="metric-row"><span>Net kâr marjı</span><b>${pct(dp.margin)}</b></div><div class="metric-row"><span>× Aktif devir hızı</span><b>${nf(dp.turnover, 2)}</b></div><div class="metric-row"><span>× Finansal kaldıraç (aktif / özkaynak)</span><b>${nf(dp.multiplier, 2)}</b></div><div class="metric-row"><span>= Özkaynak kârlılığı</span><b>${pct(dp.roe)}</b></div><p class="note">Özkaynak kârlılığının kârlılıktan mı, varlık verimliliğinden mi, yoksa borçtan mı geldiğini gösterir. Kaldıraçtan gelen kârlılık daha risklidir.</p>` : ""}</div></div>` : `<p class="empty">Finansal sağlık ekranında bilanço özetini girin.</p>`}
    <details class="method"><summary>Yöntem</summary>
      <p>Z'' modeli, imalat dışı ve halka açık olmayan şirketler için piyasa değeri yerine defter değeri kullanır ve satış/aktif oranını dışarıda bırakır.</p>
      <span class="formula">Z'' = 6,56·X₁ + 3,26·X₂ + 6,72·X₃ + 1,05·X₄</span>
      <p>2,6'nın üstü güvenli, 1,1–2,6 gri, 1,1'in altı sıkıntı bölgesidir. Gelişmekte olan piyasalar için 3,25 sabiti eklenmiş sürüm bilgi amaçlı gösterilir. Faaliyet kârı, son 12 ay net kâr ile faiz giderinin toplamı olarak yaklaşık alınır. Model iflası öngörmek için tasarlanmış bir tarama aracıdır; zamanlamayı söylemez.</p></details></section>

  <section class="panel set-sec" id="m-anom"><div class="panel-head"><h2>6. Gider anomalileri</h2><p>Hassasiyet eşiği |z| > ${state.settings.anomalyZ}</p></div>
    ${an.length ? `<div class="tbl"><table><thead><tr><th>Tür</th><th>Kategori</th><th>Dönem / kayıt</th><th class="n">Değer</th><th class="n">Olağan (ortanca)</th><th class="n">Ölçü</th></tr></thead><tbody>${an.map(x => `<tr><td>${x.kind === "ay" ? "Aylık toplam" : "Tek kayıt"}</td><td>${esc(x.cat)}</td><td>${x.kind === "ay" ? ymLong(x.ym) : fmtD(x.date) + " · " + esc(x.party)}</td><td class="n">${fmt(x.value)}</td><td class="n">${fmt(x.median)}</td><td class="n">${x.kind === "ay" ? "z = " + nf(x.z, 1) : "sınır " + fmtK(x.limit)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Olağan dışı bir gider bulunmadı.</p>`}
    <details class="method"><summary>Yöntem</summary>
      <p><b>Aylık toplamlar:</b> her gider kategorisinin son tamamlanmış ay toplamı, önceki 11 ayla karşılaştırılır. Ortalama ve standart sapma yerine ortanca ve ortanca mutlak sapma (MAD) kullanılır; böylece aykırı değerler kendilerini gizleyemez.</p>
      <span class="formula">Mᵢ = 0,6745 · (xᵢ − ortanca) / MAD</span>
      <p>|M| > 3,5 olağan dışı kabul edilir (Iglewicz–Hoaglin kuralı). MAD sıfırsa ortalama mutlak sapma kullanılır. <b>Tek kayıtlar:</b> son 60 gündeki bir kayıt, kategorisindeki kayıtların üçüncü çeyreğine 3 × çeyrekler arası açıklık eklenmiş sınırı aşarsa işaretlenir; genellikle yazım hatalarını yakalar.</p></details></section>`;
};
VIEWS.modeller.after = () => {

  mk("cMinHist", { type: "bar", data: { labels: A.mc.hist.map(h => fmtK(h.x)), datasets: [{ label: "Senaryo sayısı", data: A.mc.hist.map(h => h.n), backgroundColor: A.mc.hist.map(h => h.x < A.mc.th ? alpha(c.madder, .75) : alpha(c.navy, .55)), borderRadius: 2, barPercentage: 1, categoryPercentage: 1 }] }, options: baseOpts({ plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => " " + ctx.parsed.y + " senaryo" } } }, scales: { x: { grid: { display: false }, ticks: { color: c.ink3, maxTicksLimit: 6 } }, y: { grid: { color: c.grid }, ticks: { color: c.ink3 } } } }) });

/* ---- Karar araçları ---- */
VIEWS.arac = () => {
  const T = state.tools, be = T.be, inv = T.inv, ln = T.loan, cm = be.price - be.varCost, beU = cm > 0 ? be.fixed / cm : null, safety = beU && be.units ? (be.units - beU) / be.units : null;
  const flows = [-inv.cost].concat(Array.from({ length: inv.years }, (_, i) => inv.cash + (i === inv.years - 1 ? inv.salvage : 0)));
  const NPV = npv(inv.rate / 100, flows), IRR = irr(flows);
  let cum = 0, pb = null; for (let t = 1; t < flows.length; t++) { const prev = cum; cum += flows[t]; if (pb === null && cum >= inv.cost) pb = t - 1 + (inv.cost - prev) / flows[t]; }
  const r = ln.rate / 100, inst = r ? ln.amount * r / (1 - Math.pow(1 + r, -ln.months)) : ln.amount / ln.months;
  const m = completeMonths(3), opCash = sum(m, x => x.cashIn - x.cashOut) / 3;
  const inN = (grp, k, l, step = 1) => `<label class="f">${l}<input type="number" step="${step}" value="${T[grp][k]}" data-tool="${grp}.${k}" inputmode="decimal"></label>`;
  return head("Karar araçları", "Üç sık karar için hesap makinesi: kaç adet satmalıyım, bu yatırım değer mi, bu krediyi taşıyabilir miyim?") + `
  <div class="grid g3">
    <section class="panel"><div class="panel-head"><h2>Başabaş noktası</h2></div>
      <div class="form" style="grid-template-columns:1fr 1fr">${inN("be", "fixed", "Aylık sabit gider", 1000)}${inN("be", "price", "Birim satış fiyatı")}${inN("be", "varCost", "Birim değişken maliyet")}${inN("be", "units", "Aylık satış adedi")}</div>
      <div style="margin-top:14px"><div class="metric-row"><span>Birim katkı payı</span><b>${fmt(cm)}</b></div><div class="metric-row"><span>Başabaş adedi</span><b>${beU ? nf(Math.ceil(beU)) + " adet" : "Fiyat maliyetin altında"}</b></div><div class="metric-row"><span>Başabaş cirosu</span><b>${beU ? fmt(beU * be.price) : "—"}</b></div><div class="metric-row"><span>Güvenlik marjı</span><b class="${safety < 0 ? "neg" : safety < .15 ? "warn" : "pos"}">${safety === null ? "—" : pct(safety, 0)}</b></div></div>
      <p class="note">${safety === null ? "" : safety < 0 ? "Mevcut satış başabaşın altında; her ay zarar ediliyor." : safety < .15 ? "Satışlar başabaşa çok yakın." : "Satışlar başabaşın rahatça üzerinde."}</p>
      <div class="chart short" style="margin-top:8px"><canvas id="cBe"></canvas></div></section>
    <section class="panel"><div class="panel-head"><h2>Yatırım değerlendirme</h2></div>
      <div class="form" style="grid-template-columns:1fr 1fr">${inN("inv", "cost", "Yatırım tutarı", 10000)}${inN("inv", "cash", "Yıllık net nakit katkısı", 10000)}${inN("inv", "years", "Ekonomik ömür (yıl)")}${inN("inv", "rate", "İskonto oranı %")}${inN("inv", "salvage", "Hurda değeri", 10000)}</div>
      <div style="margin-top:14px"><div class="metric-row"><span>Net bugünkü değer</span><b class="${NPV >= 0 ? "pos" : "neg"}">${fmt(NPV)}</b></div><div class="metric-row"><span>İç verim oranı</span><b>${IRR === null ? "—" : pct(IRR)}</b></div><div class="metric-row"><span>Geri dönüş süresi</span><b>${pb === null ? "Ömür içinde dönmüyor" : nf(pb, 1) + " yıl"}</b></div></div>
      <p class="note">${NPV >= 0 ? "İskonto oranının üzerinde değer yaratıyor." : "İskonto oranında değer kaybettiriyor; nakit katkısı artmalı veya tutar düşmeli."} Yüksek enflasyonda iskonto oranını enflasyon ve kredi faizinin üzerinde tutun.</p>

/* Tutarı faturalara dağıt (en eski vadeden başlayarak) */
function planAlloc(side, party, amount, selectedIds) {
  let items = openItems(side).filter(t => t.party === party).sort((a, b) => a.due < b.due ? -1 : 1);
  if (selectedIds && selectedIds.length) items = items.filter(t => selectedIds.includes(t.id));
  let rem = amount; const full = [], part = [];
  for (const t of items) { if (rem <= 0.5) break; const g = gross(t); if (rem >= g - 0.5) { full.push(t); rem -= g; } else { part.push({ t, paid: rem }); rem = 0; } }
  return { full, part, left: Math.max(0, rem) };
}
function autoAlloc() {
  const f = $("#flowForm"); if (!f || !f.party) return;
  const kind = f.dataset.kind, side = kind === "tahsilat" || kind === "cekal" ? "gelir" : "gider", party = f.party.value.trim();
  const boxes = [...f.querySelectorAll("[data-inv]")], amt = Number(f.amount.value) || 0;
  if (!flow.touched && amt) { const p = planAlloc(side, party, amt); const ids = p.full.map(t => t.id).concat(p.part.map(x => x.t.id)); boxes.forEach(b => b.checked = ids.includes(b.dataset.inv)); }
  const sel = boxes.filter(b => b.checked).map(b => b.dataset.inv);
  const total = amt || sum(boxes.filter(b => b.checked), b => Number(b.dataset.g));
  const line = $("#allocLine"); if (!line) return;
  if (!party) { line.innerHTML = ""; return; }
  if (!total) { line.innerHTML = boxes.length ? "Tutarı yazın veya kapatılan faturaları işaretleyin." : ""; return; }

  if (p.left > 0.5) parts.push(`<b class="warn">${fmt(p.left)}</b> hiçbir faturayla eşleşmedi, avans olarak kaydedilecek`);

}
function setMethod(m) {

    const b = f.querySelector(".cq-bank"); if (b) b.style.display = m === "senet" ? "none" : "";

function syncFlowGross() {
  const f = $("#flowForm"); if (!f || !f.incl) return;
  const a = Number(f.amount.value) || 0, k = Number(f.kdv.value) || 0, incl = f.incl.checked;
  const net = incl ? a / (1 + k / 100) : a;
  $("#grossLine").innerHTML = a ? `KDV hariç ${fmt(net)} + KDV ${fmt(net * k / 100)} = <b>${fmt(net * (1 + k / 100))}</b>` : "";
}

function commitFlow(f) {
  const kind = f.dataset.kind, d = Object.fromEntries(new FormData(f));
  const party = (d.party || "").trim(), date = d.date || TODAY;
  const mkCheque = (dir, amount) => state.cheques.push({ id: uid(), dir, kind: flow.method === "senet" || d.ckind === "Senet" ? "Senet" : "Çek", party, bank: flow.method === "senet" || d.ckind === "Senet" ? "—" : ((d.cbank || "").trim() || "—"), no: (d.cno || "").trim() || "—", date, due: d.cdue || addDays(date, 30), amount: Math.round(amount * 100) / 100, status: dir === "alinan" ? "portfoy" : "bekliyor" });
  if (kind === "satis" || kind === "alis") {
    const side = kind === "satis" ? "gelir" : "gider", a = Number(d.amount) || 0, k = Number(d.kdv) || 0;
    if (!party || !(a > 0)) return "Cari adı ve tutar gerekli.";
    const amount = Math.round((d.incl ? a / (1 + k / 100) : a) * 100) / 100;
    const m = flow.method, t = { id: uid(), date, type: side, cat: d.cat, party, desc: (d.desc || "").trim() || (side === "gelir" ? "Satış faturası" : "Alış faturası"), amount, kdv: k, due: m === "vadeli" ? (d.due || date) : date, status: m === "vadeli" ? "acik" : m === "pesin" ? "odendi" : "cek", paidDate: m === "pesin" ? date : null };
    state.tx.unshift(t);
    if (m === "cek") mkCheque(side === "gelir" ? "alinan" : "verilen", gross(t));
    return { msg: `${side === "gelir" ? "Satış" : "Alış"} kaydedildi: ${party}, ${fmt(gross(t))}.` };
  }
  if (["tahsilat", "cekal", "odeme", "cekver"].includes(kind)) {
    const side = kind === "tahsilat" || kind === "cekal" ? "gelir" : "gider";
    if (!party) return "Cari adını girin.";
    const sel = [...f.querySelectorAll("[data-inv]:checked")].map(b => b.dataset.inv);
    const total = Number(d.amount) || sum([...f.querySelectorAll("[data-inv]:checked")], b => Number(b.dataset.g));
    if (!(total > 0)) return "Tutar girin veya kapatılan faturaları işaretleyin.";
    const p = planAlloc(side, party, total, sel.length ? sel : null), byCheque = flow.method !== "banka";
    for (const t of p.full) { t.status = byCheque ? "cek" : "odendi"; t.paidDate = byCheque ? null : date; }
    for (const { t, paid } of p.part) {
      const frac = paid / gross(t), piece = Object.assign({}, t, { id: uid(), amount: Math.round(t.amount * frac * 100) / 100, desc: t.desc + " (kısmi " + (side === "gelir" ? "tahsilat" : "ödeme") + ")", status: byCheque ? "cek" : "odendi", paidDate: byCheque ? null : date });
      t.amount = Math.round((t.amount - piece.amount) * 100) / 100; state.tx.unshift(piece);
    }
    if (p.left > 0.5 && !byCheque) state.tx.unshift({ id: uid(), date, type: side, cat: side === "gelir" ? "Diğer gelir" : "Diğer gider", party, desc: side === "gelir" ? "Avans / faturasız tahsilat" : "Avans / faturasız ödeme", amount: Math.round(p.left * 100) / 100, kdv: 0, due: date, status: "odendi", paidDate: date, np: true });
    if (byCheque) mkCheque(side === "gelir" ? "alinan" : "verilen", total);
    return { msg: `${fmt(total)} kaydedildi. ${p.full.length + p.part.length} fatura güncellendi${p.left > 0.5 ? `, ${fmt(p.left)} avans` : ""}.` };
  }
  if (kind === "sabit") {
    const cat = d.cat;
    if (cat === "kredi") {
      const pr = Number(d.principal) || 0, ir = Number(d.interest) || 0; if (!(pr + ir > 0)) return "Anapara veya faiz tutarı girin.";
      if (pr) state.tx.unshift({ id: uid(), date, type: "gider", cat: "Kredi anapara", party: "Banka", desc: d.desc || "Kredi taksiti (anapara)", amount: pr, kdv: 0, due: date, status: "odendi", paidDate: date });
      if (ir) state.tx.unshift({ id: uid(), date, type: "gider", cat: "Finansman (faiz)", party: "Banka", desc: d.desc || "Kredi taksiti (faiz)", amount: ir, kdv: 0, due: date, status: "odendi", paidDate: date });
      return { msg: `Kredi taksiti kaydedildi: ${fmt(pr + ir)}.` };
    }
    const a = Number(d.amount) || 0; if (!(a > 0)) return "Tutar girin.";
    const party2 = { "Personel (net maaş)": "Personel", "SGK & stopaj": "SGK / Vergi dairesi", "KDV / vergi ödemesi": "Vergi dairesi" }[cat] || "Çeşitli";
    state.tx.unshift({ id: uid(), date, type: "gider", cat, party: party2, desc: (d.desc || "").trim() || cat, amount: a, kdv: 0, due: date, status: "odendi", paidDate: date });
    return { msg: `Ödeme kaydedildi: ${fmt(a)}.` };
  }
  if (kind === "banka") {
    const actual = (Number(d.bank) || 0) + (Number(d.till) || 0), diff = actual - cashToday();
    state.company.openingCash = (Number(state.company.openingCash) || 0) + diff;
    state.cashChecks.push({ d: TODAY, actual, diff: Math.round(diff) });
    return { msg: Math.abs(diff) < 1 ? "Bakiye zaten doğruydu." : `Nakit ${fmt(actual)} olarak eşitlendi (fark ${fmt(diff)}).` };
  }
}

/* ---------------- Cariler ---------------- */
function partyTable(side) {
  const m = {};
  const get = p => m[p] = m[p] || { party: p, open: 0, late: 0, maxLate: 0, last: "", n: 0, chq: 0, vol: 0 };
  for (const t of state.tx) {
    if (t.type !== side) continue; const x = get(t.party); x.n++; if (t.date > x.last) x.last = t.date;
    if (real(t) && t.date > addDays(TODAY, -365)) x.vol += t.amount;
    if (t.status === "acik") { const g = gross(t), l = diffDays(TODAY, t.due); x.open += g; if (l > 0) { x.late += g; x.maxLate = Math.max(x.maxLate, l); } }
  }
  for (const q of state.cheques) if ((side === "gelir" && q.dir === "alinan" && ["portfoy", "tahsilde"].includes(q.status)) || (side === "gider" && q.dir === "verilen" && q.status === "bekliyor")) get(q.party).chq += q.amount;
  return Object.values(m);
}

/* ---------------- Cari hesap kartı ---------------- */
function ekstre(party, side) {
  const rows = [], dirQ = side === "gelir" ? "alinan" : "verilen";
  for (const t of state.tx) {
    if (t.party !== party || t.type !== side) continue;
    const adv = t.np && /Avans/.test(t.desc);
    if (!adv) rows.push({ date: t.date, desc: t.desc + (t.desc === "Açılış bakiyesi" ? "" : ` · ${t.cat}`), d: gross(t), c: 0, id: t.id, o: 0 });
    if (t.status === "odendi" && t.paidDate) rows.push({ date: t.paidDate, desc: side === "gelir" ? (adv ? "Avans tahsilatı" : "Tahsilat") : (adv ? "Avans ödemesi" : "Ödeme"), d: 0, c: gross(t), o: 1 });
  }
  for (const q of state.cheques) {
    if (q.party !== party || q.dir !== dirQ) continue;
    rows.push({ date: q.date, desc: `${q.kind} ${q.dir === "alinan" ? "alındı" : "verildi"} · ${q.bank !== "—" ? q.bank + " · " : ""}vade ${fmtD(q.due)}`, d: 0, c: q.amount, o: 1 });
    if (q.status === "karsiliksiz") rows.push({ date: q.due, desc: `Karşılıksız ${q.kind.toLowerCase()} (borca geri eklendi)`, d: q.amount, c: 0, o: 2 });
  }
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.o - b.o);
  let bal = 0; for (const r of rows) { bal += r.d - r.c; r.bal = bal; }
  return rows;
}

    <section class="panel"><div class="panel-head"><h2>Çek ve senetler</h2></div>

  </div>
  <section class="panel flush" style="margin-top:18px"><div class="panel-head pad"><h2>Hesap ekstresi</h2><div class="toolbar">${rows.length > 15 ? `<button class="btn sm ghost" data-act="ekToggle">${ui.ekAll ? "Son 15 hareket" : `Tüm hareketler (${rows.length})`}</button>` : ""}<button class="btn sm" data-act="ekstreCsv">Ekstreyi indir</button></div></div>

/* ---------- Tahmin karnesi ---------- */
const BADGE = { ok: ["İyi", "ok"], warn: ["Orta", "warn"], risk: ["Zayıf", "risk"], na: ["Veri yetersiz", "neutral"] };
function grades(B) {
  const c = B.cash, s = B.sales, a = B.ar, u = B.cust;
  return {
    cash: !c ? "na" : (c.cov80 >= 0.68 && c.cov80 <= 0.92 && c.errMed < c.errNaive * 0.85) ? "ok" : (c.cov80 >= 0.5 && c.errMed < c.errNaive * 1.05) ? "warn" : "risk",
    sales: !s ? "na" : s.mape[s.best] < 0.12 ? "ok" : s.mape[s.best] < 0.25 ? "warn" : "risk",
    ar: !a ? "na" : Math.abs(a.predLossPct - a.actualOpenPct) < 0.04 ? "ok" : Math.abs(a.predLossPct - a.actualOpenPct) < 0.1 ? "warn" : "risk",
    cust: !u || u.rho === null ? "na" : u.rho >= 0.6 ? "ok" : u.rho >= 0.3 ? "warn" : "risk"
  };
}
const badge = g => `<span class="pill ${BADGE[g][1]}">${BADGE[g][0]}</span>`;

      s ? [`Kullanılan yöntem: <b>${mn(s.best)}</b>. Geçmişte en iyi tutan yöntem otomatik seçildi.`, `Karşılaştırma: ${Object.entries(s.mape).filter(([, v]) => v !== null).map(([k, v]) => `${mn(k)} ${pct(v, 0)}`).join(", ")}.`, `${s.n} ay için sınandı.`] : [],

  </div>
  ${c ? `<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>13 hafta önce yapılan nakit tahmini ve gerçekte olan</h2><p>${fmtDY(c.runs[0].T)} tarihinde yapılmış olsaydı</p></div><div class="chart tall"><canvas id="cBack"></canvas></div>
    <p class="note">Gölge, o gün tahmin edilen olası aralık; koyu çizgi en olası seyir; yeşil noktalar gerçekleşen bakiye. Noktaların çoğu gölgenin içindeyse tahmin güvenilirdir.</p></section>` : ""}

/* ---------- Nakit köprüsü ---------- */
function cashBridge() {
  const f = forecast(emptyState().scen), recNames = new Set(state.recurring.map(r => r.name));
  const groups = [["Mevcut faturaların tahsili", 1], ["Çek ve senet tahsili", 1], ["Yeni satışlardan tahsilat", 1], ["Tedarikçi ödemeleri", -1], ["Yeni alımlar", -1], ["Maaş, kira ve düzenli ödemeler", -1], ["Verilen çekler", -1], ["KDV", -1]];
  const tot = Object.fromEntries(groups.map(([g]) => [g, 0]));
  for (const w of f.weeks) for (const x of w.items) {
    const l = x.label;
    const g = l.startsWith("Tahsilat:") ? groups[0][0] : /(Çek|Senet) tahsili/.test(l) ? groups[1][0] : l.startsWith("Yeni satışlardan") ? groups[2][0] : l.startsWith("Ödeme:") ? groups[3][0] : l.startsWith("Yeni alımlara") ? groups[4][0] : l.startsWith("Verilen") ? groups[6][0] : l.startsWith("Tahmini KDV") ? groups[7][0] : recNames.has(l) ? groups[5][0] : groups[3][0];
    tot[g] += x.amt;
  }

  },
  bildir() {
    this.listelenen = new Map();
    const komutlar = [];
    this.komutOgeleri().forEach((it, i) => { const k = this.komut(it, 'komut-' + i); if (k) { this.listelenen.set(k.anahtar, k.baslik); komutlar.push(k); } });

/* ---------- Firma penceresi (yeni / düzenle) ---------- */
const FIRMA_ALANLARI = [
  ['kod', 'Kod', 'text', 40], ['ad', 'Ad', 'text', 200], ['ulkeKodu', 'Ülke kodu', 'text', 2], ['vergiNo', 'Vergi no', 'text', 30],
  ['vergiDairesi', 'Vergi dairesi', 'text', 100], ['paraBirimi', 'Varsayılan para birimi', 'text', 3], ['vadeGunu', 'Varsayılan vade (gün)', 'number', 3],
  ['adres', 'Adres', 'text', 500], ['ilce', 'İlçe', 'text', 100], ['il', 'İl', 'text', 100], ['postaKodu', 'Posta kodu', 'text', 20],
  ['telefon', 'Telefon', 'text', 40], ['ePosta', 'E-posta', 'text', 200], ['logoCariKodu', 'Logo cari kodu', 'text', 40],
];
function fPencereAc(firma) {
  fDurum.pencere = { firma, taslak: null, hatalar: {}, genel: null, gonderiliyor: false, istekKimligi: firma ? null : yeniKimlik() };
  drawerCtx = { kind: 'firma' };
  fPencereCiz();
  $('#drawer').hidden = false;
  setTimeout(() => { const i = $('#firmaForm [name=ad]'); if (i) i.focus(); }, 30);
}
function yeniKimlik() {
  const b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function fPencereCiz() {
  const p = fDurum.pencere, f = { tur: 'musteri', ulkeKodu: 'TR', paraBirimi: 'TRY', fason: false, ...(p.firma || {}), ...(p.taslak || {}) };
  const kilitli = !!(p.firma && p.firma.logoKayitNo);
  const hata = (a) => p.hatalar[a] ? `<small class="alan-hata">${esc(p.hatalar[a])}</small>` : '';
  const alan = ([ad, etiket, tip, uzunluk]) => {
    const deger = f[ad] === null || f[ad] === undefined ? '' : String(f[ad]);
    const kilit = kilitli && (ad === 'kod' || ad === 'logoCariKodu');
    const genis = ['ad', 'adres'].includes(ad) ? ' full' : '';
    return `<label class="f${genis}">${etiket}${ad === 'ad' ? ' *' : ''}<input name="${ad}" type="${tip}" ${tip === 'number' ? 'min="0" max="365" step="1"' : `maxlength="${uzunluk}"`} value="${esc(deger)}" ${kilit ? 'disabled title="Logo\'ya gönderilmiş firmada değişmez"' : ''}>${hata(ad)}</label>`;
  };
  $('#drawer').innerHTML = `<div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drT">
    <div class="drawer-head"><h2 id="drT">${p.firma ? 'Firmayı düzenle' : 'Yeni firma'}</h2><button class="btn ghost" data-fa="kapat">Kapat</button></div>
    <form class="drawer-body" id="firmaForm" autocomplete="off"><div class="form">
      <div class="full"><span class="flabel">Tür</span><div class="seg full" role="radiogroup">${Object.entries(FIRMA_TUR_ADI).map(([k, l]) => `<button type="button" data-fa="ftur" data-val="${k}" aria-pressed="${f.tur === k}">${l}</button>`).join('')}</div><input type="hidden" name="tur" value="${esc(f.tur)}">${hata('tur')}</div>
      <label class="check full" style="border:0;padding:0"><input type="checkbox" name="fason" ${f.fason ? 'checked' : ''}><span>Fason firma<small>Dışarıda iş yaptırılan tedarikçi</small></span></label>
      ${FIRMA_ALANLARI.map(alan).join('')}
      ${kilitli ? '<p class="muted full">Logo\'ya gönderildiği için kod ve Logo cari kodu değiştirilemez.</p>' : ''}
      ${p.genel ? `<div class="hintline full"><b class="neg">${esc(p.genel)}</b></div>` : ''}
    </div></form>
    <div class="drawer-foot"><span></span><div class="toolbar"><button class="btn" data-fa="kapat">Vazgeç</button><button class="btn primary" type="submit" form="firmaForm" ${p.gonderiliyor ? 'disabled' : ''}>${p.gonderiliyor ? 'Kaydediliyor…' : 'Kaydet'}</button></div></div></div>`;
}
function fKapat() { fDurum.pencere = null; closeDrawer(); }
function fFormOku() {
  const f = $('#firmaForm'), d = {};
  for (const [ad, , tip] of FIRMA_ALANLARI) { const i = f.querySelector(`[name=${ad}]`); if (!i || i.disabled) { d[ad] = fDurum.pencere.firma ? fDurum.pencere.firma[ad] : null; continue; } d[ad] = tip === 'number' ? (i.value === '' ? null : Number(i.value)) : i.value; }
  d.tur = f.querySelector('[name=tur]').value;
  d.fason = f.querySelector('[name=fason]').checked;
  return d;
}
async function fKaydet() {
  const p = fDurum.pencere; if (!p || p.gonderiliyor) return;
  const firma = fFormOku();
  p.gonderiliyor = true; p.hatalar = {}; p.genel = null; p.taslak = firma;
  fPencereCiz();
  try {
    const sonuc = p.firma
      ? await Kopru.istek('firma-guncelle', { id: p.firma.id, firma: { ...firma, surum: p.firma.surum } })
      : await Kopru.istek('firma-ekle', { firma, istekKimligi: p.istekKimligi });
    const yeniMi = !p.firma;
    fKapat();
    fDurum.kart = sonuc.firma; fDurum.liste = null;
    gGit('firmad', { id: sonuc.firma.id, yuklu: true });
    toast(yeniMi ? 'Firma açıldı.' : 'Firma güncellendi.');
  } catch (e) {
    p.gonderiliyor = false;
    if (e.kod === 'CAKISMA' && !e.alan && p.firma) {
      p.genel = 'Bu kart siz düzenlerken başka biri tarafından değiştirildi. Kart yenilendi; değişikliğinizi yeniden girin.';
      const yeni = await Kopru.istek('firma-getir', { id: p.firma.id }).catch(() => null);
      if (yeni) { p.firma = yeni.firma; p.taslak = null; }
    } else if (e.alan) p.hatalar[e.alan] = e.message;
    else p.genel = e.message;
    // Reddedilen yeni kayıt kimliği yenilenmez: aynı istek yeniden gönderilirse sunucu ilk cevabı verir.
    fPencereCiz();
  }
}
async function fDurumDegistir() {
  const f = fDurum.kart; if (!f) return;
  ui.confirm = null;
  try {
    const sonuc = await Kopru.istek('firma-durum', { id: f.id, hedef: f.aktif ? 'pasif' : 'aktif', surum: f.surum });
    fDurum.kart = sonuc.firma; fDurum.liste = null; fDurum.kartUyari = null; gCiz();
    toast(sonuc.firma.aktif ? 'Firma aktif yapıldı.' : 'Firma pasife alındı.');
  } catch (e) {
    if (e.kod === 'CAKISMA') { toast('Kart başka biri tarafından değiştirilmiş; yenilendi.'); return fKartYukle(f.id); }
    // FNS-60: sunucunun nedeni kartta kalır (kapanmamış fatura, ödeme ya da çek).
    if (e.kod === 'GECERSIZ') { fDurum.kartUyari = e.message; gCiz(); return; }
    toast(e.message);
  }
}

/* ---------- Gömülü çizim ve gezinme ---------- */
function gCiz() {
  const fn = VIEWS[view] || VIEWS.firmalar;
  let html;
  try { html = fn(); } catch (e) { html = `<div class="panel empty">Ekran yüklenemedi: ${esc(e.message)}</div>`; }
  $('#main').innerHTML = `<div class="view">${html}</div>`;
}
function gGit(v, secenek = {}) {
  view = v; ui.confirm = null;
  if (v === 'firmalar' && !fDurum.liste) fListeYukle();
  if (v === 'firmad' && secenek.id && !secenek.yuklu) fKartYukle(secenek.id);
  gCiz();
  window.scrollTo({ top: 0 });
  Gorunum.bildir(v);
}
function gomuluBaslat() {
  if (TAM) return tamBaslat();
  document.body.classList.add('gomulu');
  if (GOMULU.tema === 'dark' || GOMULU.tema === 'light') document.documentElement.dataset.theme = GOMULU.tema;
  state = normalize(emptyState());
  // Firma kapsamında bildirim yalnız iletidir: "başka kayıt" ve "geri al" bu kapsamda yok.
  toast = (ileti) => {
    let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = ileti; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 4000);
  };
  render = gCiz;
  go = (v) => gGit(GORUNUM_MADDESI[v] ? v : 'firmalar');
  view = 'firmalar';
  if (yetkiVar('musteri-tedarikci.oku')) fListeYukle(); else { $('#main').innerHTML = '<div class="view"><p class="empty panel">Bu bölüm için yetkiniz yok.</p></div>'; }
  Gorunum.hazir();
}

if (GOMULU) {
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-fa]');
    if (!a) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const k = a.dataset.fa, s = fDurum.suzgec;
    if (k === 'kart') return gGit('firmad', { id: Number(a.dataset.id) });
    if (k === 'liste') { fDurum.liste = null; return gGit('firmalar'); }
    if (k === 'yenile') return fListeYukle();
    if (k === 'tur' || k === 'aktif') { s[k] = a.dataset.val; s.sayfa = 1; return fListeYukle(); }
    if (k === 'sirala') { const alan = a.dataset.alan; s.yon = s.sirala === alan && s.yon === 'artan' ? 'azalan' : 'artan'; s.sirala = alan; return fListeYukle(); }
    if (k === 'sayfa') { s.sayfa = Math.max(1, s.sayfa + Number(a.dataset.yon)); return fListeYukle(); }
    if (k === 'yeni') return fPencereAc(null);
    if (k === 'duzenle') return fPencereAc(fDurum.kart);
    if (k === 'durum') {
      // Tam kipte kalan kayıtlar önceden hesaplanır; varsa onay yerine uyarı çıkar. Kural sunucudadır (FNS-60).
      const on = fDurum.kart && fDurum.kart.aktif && typeof pasifOnKontrol === 'function' ? pasifOnKontrol(fDurum.kart.id) : null;
      if (on) { fDurum.kartUyari = on; return gCiz(); }
      ui.confirm = 'firma-durum'; return gCiz();
    }
    if (k === 'durum-onay') return fDurumDegistir();
    if (k === 'kapat') return fKapat();
    if (k === 'ftur') { const f = $('#firmaForm'); f.querySelector('[name=tur]').value = a.dataset.val; f.querySelectorAll('[data-fa=ftur]').forEach((b) => b.setAttribute('aria-pressed', b === a)); }
  }, true);
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'firmaForm') return;
    e.preventDefault(); e.stopImmediatePropagation();
    fKaydet();
  }, true);
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'fAra') return;
    e.stopImmediatePropagation();
    const deger = e.target.value;
    clearTimeout(fAramaZamani);
    fAramaZamani = setTimeout(() => { fDurum.suzgec.ara = deger.trim(); fDurum.suzgec.sayfa = 1; fListeYukle().then(() => { const i = $('#fAra'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 300);
  }, true);
  document.addEventListener('click', (e) => { if (e.target.id === 'drawer') { e.stopImmediatePropagation(); fKapat(); } }, true);
}

/* =====================================================================
   GÖMÜLÜ MOD, TAM KAPSAM: finans rakamları TMI uçlarından gelir. Prototipin ekranları ve analiz motoru
   aynen çalışır; veri sunucudan okunup prototipin kendi biçimine çevrilir. Her yazma eylemi ayrı bir komuttur
   (köprü türü -> tek uç); prototipin "durumu toplu kaydet" katmanı bu kipte hiç çalışmaz.
   ===================================================================== */
const TAM = !!GOMULU && GOMULU.kapsam === 'tam';
const KAT = {
  urun_satisi: 'Ürün satışı', hizmet_geliri: 'Hizmet geliri', diger_gelir: 'Diğer gelir', kur_farki_geliri: 'Kur farkı geliri',
  mal_alimi: 'Mal / hammadde alımı', personel: 'Personel (net maaş)', sgk_stopaj: 'SGK & stopaj', kira: 'Kira', enerji: 'Enerji & faturalar',
  lojistik: 'Lojistik', pazarlama: 'Pazarlama', faiz: 'Finansman (faiz)', diger_gider: 'Diğer gider', kdv_vergi: 'KDV / vergi ödemesi',
  kredi_anapara: 'Kredi anapara', kur_farki_gideri: 'Kur farkı gideri',
  satis_iadesi: 'Satış iadesi', alis_iadesi: 'Alış iadesi',
};
const KAT_KOD = Object.fromEntries(Object.entries(KAT).map(([k, v]) => [v, k]));
const NAKIT_YONTEMI = { kasa: 'nakit', banka: 'banka', kredi_karti: 'kredi_karti' };
const HESAP_TURU_ADI = { kasa: 'Kasa', banka: 'Banka', kredi_karti: 'Kredi kartı' };
const TEVKIFATLAR = [['', 'Tevkifat yok'], ['2/10', '2/10'], ['3/10', '3/10'], ['4/10', '4/10'], ['5/10', '5/10'], ['7/10', '7/10'], ['9/10', '9/10']];
let V = null; // sunucu verisi ve eşlemeler
const sayi = (v) => Number(v) || 0;
const yuvarla = (v) => Math.round(v * 100) / 100;

/* ---------- Sunucu verisini prototip biçimine çevirme ---------- */
function verileriHazirla(d) {
  const firmaById = new Map(d.firmalar.map((f) => [f.id, f]));
  const adSayisi = {};
  for (const f of d.firmalar) adSayisi[f.ad] = (adSayisi[f.ad] || 0) + 1;
  const etiket = new Map(d.firmalar.map((f) => [f.id, adSayisi[f.ad] > 1 ? `${f.ad} · ${f.kod || '#' + f.id}` : f.ad]));
  const etiketten = new Map([...etiket.entries()].map(([id, e]) => [e, id]));
  // Güncel kur (FNS-57): o güne kadarki son elle girilen kur; yoksa kayıtların kendi kuru.
  const kurlar = {};
  for (const k of d.kurlar) if (k.tarih <= TODAY && (!kurlar[k.paraBirimi] || kurlar[k.paraBirimi].tarih < k.tarih)) kurlar[k.paraBirimi] = { tarih: k.tarih, kur: sayi(k.kur) };
  for (const x of [...d.belgeler, ...d.odemeler, ...d.cekler]) if (x.paraBirimi !== 'TRY' && !kurlar[x.paraBirimi]) kurlar[x.paraBirimi] = { tarih: null, kur: sayi(x.kur) };
  return {

/* ---------- Akış gönderimi -> komutlar ---------- */
function dagitimPlani(side, firmaEt, tutar, seciliTxIdleri, odemePb, caprazKur) {
  let belgeler = (seciliTxIdleri.length ? seciliTxIdleri.map((i) => txBelgesi(i)) : V.belgeler.filter((b) => b.yon === side && b.durum === 'acik' && firmaEtiketi(b.firmaId) === firmaEt))
    .filter((b, i, a) => b && sayi(b.kalan) > 0 && a.findIndex((x) => x && x.id === b.id) === i)
    .sort((a, b) => (a.vade < b.vade ? -1 : a.vade > b.vade ? 1 : a.id - b.id));
  const satirlar = []; let kalan = Math.round(tutar * 100);
  for (const b of belgeler) {
    if (kalan <= 0) break;
    const ayni = b.paraBirimi === odemePb;
    if (!ayni && !(caprazKur > 0)) return { hata: `${b.paraBirimi} belge için çapraz kur girin.` };
    const ihtiyac = ayni ? Math.round(sayi(b.kalan) * 100) : Math.round(sayi(b.kalan) * caprazKur * 100);
    const odenen = Math.min(kalan, ihtiyac);
    const belgeTutari = ayni ? odenen / 100 : Math.floor(odenen / caprazKur) / 100;
    if (belgeTutari <= 0) continue;
    satirlar.push({ belgeId: b.id, belgeTutari, ...(ayni ? {} : { caprazKur }) });
    kalan -= ayni ? odenen : Math.round(belgeTutari * caprazKur * 100);
  }
  return { satirlar };
}

    if (flow.method === 'cek') govde.cek = { tur: d.ckind === 'Senet' ? 'senet' : 'cek', banka: d.cbank || null, seriNo: d.cno || null, vade: d.cdue || addDays(date, 30) };
    return komut('belge-ekle', { govde, istekKimligi }, `${side === 'gelir' ? 'Satış' : 'Alış'} kaydedildi.`);
  }
  if (['tahsilat', 'odeme', 'cekal', 'cekver'].includes(kind)) {

    const cekli = kind === 'cekal' || kind === 'cekver' || flow.method !== 'banka';

    if (!(tutar > 0)) tutar = secili.map(txBelgesi).filter(Boolean).reduce((t, b) => t + (b.paraBirimi === odemePb ? sayi(b.kalan) : sayi(b.kalan) * caprazKur), 0);
    tutar = yuvarla(tutar);
    if (!(tutar > 0)) return hata('Tutar girin veya kapatılan faturaları işaretleyin.');
    const plan = dagitimPlani(side, d.party.trim(), tutar, secili, odemePb, caprazKur); if (plan.hata) return hata(plan.hata);
    if (cekli) {
      const govde = { yon: side === 'gelir' ? 'alinan' : 'verilen', tur: flow.method === 'senet' ? 'senet' : 'cek', firmaId: fr.id, banka: d.cbank || null, seriNo: d.cno || null,
        duzenlemeTarihi: date, vade: d.cdue || addDays(date, 30), paraBirimi: odemePb, kur: kurOdeme, tutar, dagitimlar: plan.satirlar };
      return komut('cek-ekle', { govde, istekKimligi }, `${flow.method === 'senet' ? 'Senet' : 'Çek'} kaydedildi.`);
    }
    const govde = { yon: side, firmaId: fr.id, tarih: date, yontem: NAKIT_YONTEMI[h.tur], hesapId: h.id, paraBirimi: odemePb, kur: kurOdeme, tutar, dagitimlar: plan.satirlar };
    return komut('odeme-ekle', { govde, istekKimligi }, `${fmtPb(tutar, odemePb)} kaydedildi.`);
  }
  if (kind === 'sabit') {
    const h = V.hesapById.get(Number(d.hesap)); if (!h) return hata('Hesap seçin.');
    const pesin = { yontem: NAKIT_YONTEMI[h.tur], hesapId: h.id, tarih: date };
    const belge = (kategori, tutar, ac) => ({ govde: { yon: 'gider', tur: 'faturasiz', kategori, firmaId: null, aciklama: ac, belgeTarihi: date, vade: date, paraBirimi: h.paraBirimi, kur: tlKuru(h.paraBirimi) || 1, tutar, kdvOrani: 0, pesin } });
    if (d.cat === 'kredi') {
      const pr = sayi(d.principal), ir = sayi(d.interest); if (!(pr + ir > 0)) return hata('Anapara veya faiz tutarı girin.');
      if (pr) await komut('belge-ekle', { ...belge('kredi_anapara', pr, d.desc || 'Kredi taksiti (anapara)'), istekKimligi });
      if (ir) await komut('belge-ekle', { ...belge('faiz', ir, d.desc || 'Kredi taksiti (faiz)'), istekKimligi: yeniKimlik() }, 'Kredi taksiti kaydedildi.');
      return true;
    }
    const a = sayi(d.amount); if (!(a > 0)) return hata('Tutar girin.');
    return komut('belge-ekle', { ...belge(KAT_KOD[d.cat], a, (d.desc || '').trim() || d.cat), istekKimligi }, 'Ödeme kaydedildi.');
  }
  if (kind === 'banka') {
    const h = V.hesapById.get(Number(d.hesap)); if (!h) return hata('Hesap seçin.');
    return komut('hesap-esitle', { id: h.id, govde: { tarih: TODAY, gercekBakiye: sayi(d.gercek) }, istekKimligi }, 'Bakiye eşitlendi.');
  }
  return null;
}

// Satış formundaki sipariş seçimi: firmanın onaylı ve kapanmış siparişleri sunucudan gelir (260 a). Firma değişince liste yenilenir;
// yanıt gelene kadar firma yeniden değiştiyse eski yanıt yazılmaz.
function siparisleriDoldur(f) {
  const sec = f.querySelector('[name=siparis]'); if (!sec) return;
  const firmaAlani = () => (f.querySelector('input[name=party]')?.value || '').trim();
  const etiket = firmaAlani();
  sec.innerHTML = '<option value="">Siparişsiz</option>';
  sevkleriDoldur(f);
  const fr = firmaCoz(etiket, 'gelir'); if (fr.hata) return;
  Kopru.istek('satis-siparisleri', { firmaId: fr.id }).then((c) => {
    if (firmaAlani() !== etiket) return;
    const durum = { onayli: 'Onaylı', kapandi: 'Kapandı' };
    sec.innerHTML = '<option value="">Siparişsiz</option>' + c.siparisler.map((s) => `<option value="${s.id}">${esc(s.no)} · ${durum[s.durum]} · ${fmtD(s.siparisTarihi)}${s.musteriSiparisNo ? ' · ' + esc(s.musteriSiparisNo) : ''}</option>`).join('');
  }).catch(() => {});
}

// Sevk seçimi seçilen siparişin iptal edilmemiş teslimatlarıdır (302 a); sipariş yoksa kapalıdır. Sipariş yeniden değiştiyse eski yanıt yazılmaz.
function sevkleriDoldur(f) {
  const sec = f.querySelector('[name=sevk]'); if (!sec) return;
  const siparis = f.querySelector('[name=siparis]')?.value || '';
  sec.innerHTML = '<option value="">Sevksiz</option>';
  sec.disabled = !siparis;
  if (!siparis) return;
  Kopru.istek('satis-sevkleri', { siparisId: Number(siparis) }).then((c) => {
    if ((f.querySelector('[name=siparis]')?.value || '') !== siparis) return;
    const durum = { havuzda: 'Bekliyor', planlandi: 'Planlandı', yolda: 'Yolda', tamamlandi: 'Teslim edildi' };
    sec.innerHTML = '<option value="">Sevksiz</option>' + c.sevkler.map((s) => `<option value="${s.id}">${fmtD(s.tarih)}${s.belgeNo ? ' · ' + esc(s.belgeNo) : ''} · ${durum[s.durum] || esc(s.durum)}</option>`).join('');
  }).catch(() => {});
}
