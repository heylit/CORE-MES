async function ekFormGonder(f) {
  const d = Object.fromEntries(new FormData(f)), tur = f.dataset.tur, istekKimligi = f.dataset.istek;
  if (tur === 'virman') return komut('virman-ekle', { govde: { kaynakHesapId: Number(d.kaynak), hedefHesapId: Number(d.hedef), tarih: d.tarih, tutar: sayi(d.tutar), aciklama: d.aciklama || null }, istekKimligi }, 'Aktarım kaydedildi.');
  if (tur === 'mahsup') {
    const s = V.belgeById.get(Number(d.satis));
    if (!s) return toast('Satış faturası seçin.');
    return komut('mahsup-ekle', { govde: { firmaId: s.firmaId, satisBelgeId: Number(d.satis), alisBelgeId: Number(d.alis), satisTutari: sayi(d.satisTutari), ...(sayi(d.alisTutari) > 0 ? { alisTutari: sayi(d.alisTutari) } : {}), tarih: d.tarih }, istekKimligi }, 'Mahsup kaydedildi.');
  }
  if (tur === 'iade') {
    const a = V.belgeById.get(Number(d.asil));
    if (!a) return toast('İade edilen faturayı seçin.');
    if (!(sayi(d.tutar) > 0)) return toast('İade tutarını girin.');
    return komut('belge-ekle', { govde: {
      yon: a.yon === 'gelir' ? 'gider' : 'gelir', tur: 'iade', kategori: a.yon === 'gelir' ? 'satis_iadesi' : 'alis_iadesi', firmaId: a.firmaId, iadeBelgeId: a.id,
      aciklama: (d.aciklama || '').trim() || null, belgeTarihi: d.tarih, vade: d.tarih, paraBirimi: a.paraBirimi, kur: sayi(a.kur), tutar: sayi(d.tutar), kdvOrani: sayi(a.kdvOrani),
      ...(a.tevkifatPay ? { tevkifatPay: a.tevkifatPay, tevkifatPayda: a.tevkifatPayda } : {}),
    }, istekKimligi }, 'İade kaydedildi.');
  }
  if (tur === 'avans') return komut('odeme-dagit', { id: Number(d.odeme), govde: { tarih: d.tarih, dagitimlar: [{ belgeId: Number(d.belge), belgeTutari: sayi(d.tutar), ...(sayi(d.capraz) > 0 ? { caprazKur: sayi(d.capraz) } : {}) }] }, istekKimligi }, 'Avans faturaya düşüldü.');
  if (tur === 'ciro') {
    const fr = firmaCoz(d.party, 'gider'); if (fr.hata) return toast(fr.hata);
    const c = V.cekById.get(Number(d.cek));
    const plan = dagitimPlani('gider', d.party.trim(), sayi(c.tutar), [], c.paraBirimi, 0);
    return komut('cek-komut', { id: c.id, komut: 'ciro', govde: { surum: c.surum, firmaId: fr.id, tarih: d.tarih, dagitimlar: plan.hata ? [] : plan.satirlar }, istekKimligi }, 'Ciro kaydedildi.');
  }
  if (tur === 'cek-sonuc') {
    const c = V.cekById.get(Number(d.cek));
    return komut('cek-komut', { id: c.id, komut: d.komut, govde: { surum: c.surum, hesapId: Number(d.hesap), tarih: d.tarih } }, d.komut === 'tahsil' ? 'Çek tahsil edildi; tutar hesaba girdi.' : 'Verilen çek ödendi.');
  }
  if (tur === 'hesap') return komut(d.id ? 'hesap-guncelle' : 'hesap-ekle', { ...(d.id ? { id: Number(d.id) } : {}), govde: { ad: d.ad, tur: d.htur, paraBirimi: d.pb, acilisBakiyesi: sayi(d.acilis), acilisTarihi: d.acilisTarihi, bankaAdi: d.bankaAdi || null, logoKodu: d.logoKodu || null, ...(d.id ? { surum: Number(d.surum) } : {}) } }, 'Hesap kaydedildi.');
  if (tur === 'kur') {
    const pb = String(d.pb || '').trim().toUpperCase();
    // Aynı güne ikinci giriş düzeltmedir: önceki değer denetim kaydına geçer, başka günün kuru değişmez.
    const onceki = V.kurlar_listesi.find((k) => k.paraBirimi === pb && k.tarih === d.tarih);
    if (onceki) return komut('kur-guncelle', { govde: { paraBirimi: pb, tarih: d.tarih, kur: sayi(d.kur), surum: onceki.surum } }, 'O günün kuru düzeltildi.');
    return komut('kur-ekle', { govde: { paraBirimi: pb, tarih: d.tarih, kur: sayi(d.kur) } }, 'Kur kaydedildi.');
  }
  if (tur === 'sabit-kiymet') {
    const devir = !!d.devirTarihi;
    return komut('sabit-kiymet-ekle', { govde: {
      ad: d.ad, makineKodu: d.makineKodu || null, paraBirimi: String(d.pb || 'TRY').trim().toUpperCase(), bedel: sayi(d.bedel), ...(sayi(d.kur) > 0 ? { kur: sayi(d.kur) } : {}),
      alisTarihi: d.alisTarihi, omurAy: Math.round(sayi(d.omurAy)), yontem: d.yontem, kalintiDegeri: sayi(d.kalinti),
      devirTarihi: devir ? d.devirTarihi : null, devirBirikmisTl: devir ? sayi(d.devirBirikmis) : null, aciklama: d.aciklama || null,
    }, istekKimligi }, 'Sabit kıymet eklendi.');
  }
  if (tur === 'kiymet-pasif') {
    const k = V.sabitKiymetler.find((x) => x.id === Number(f.dataset.id));
    ui.confirm = null;
    return komut('sabit-kiymet-pasif', { id: k.id, govde: { pasifTarihi: d.pasifTarihi, surum: k.surum } }, 'Sabit kıymet pasife alındı; amortismanı bu aydan sonra durur.');
  }
  if (tur === 'faiz') return komut('faiz-ekle', { govde: { paraBirimi: d.pb, gecerlilikBaslangic: d.baslangic, aylikYuzde: sayi(d.yuzde) } }, 'Faiz kaydedildi.');
  if (tur === 'kur-payi') return komut('ayar-guncelle', { govde: ayarGovdesi({ caprazKurPayi: sayi(d.pay) }) }, 'Çapraz kur payı kaydedildi.');
  if (tur === 'kdv') return komut('kdv-ekle', { govde: { oran: sayi(d.oran), gecerlilikBaslangic: d.baslangic } }, 'KDV oranı eklendi.');
  if (tur === 'kurulum') {
    const a = ayarGovdesi({ sirketAdi: d.ad || 'Şirketim', sektor: d.sektor, nakitEsigi: sayi(d.esik), kurulumTamam: true });
    if (sayi(d.banka) !== 0 || d.bankaAd) await Kopru.istek('hesap-ekle', { govde: { ad: d.bankaAd || 'Banka', tur: 'banka', paraBirimi: 'TRY', acilisBakiyesi: sayi(d.banka), acilisTarihi: TODAY } }).catch((e) => toast(e.message));
    if (sayi(d.kasa) !== 0) await Kopru.istek('hesap-ekle', { govde: { ad: 'Kasa', tur: 'kasa', paraBirimi: 'TRY', acilisBakiyesi: sayi(d.kasa), acilisTarihi: TODAY } }).catch((e) => toast(e.message));
    return komut('ayar-guncelle', { govde: a }, 'Kurulum tamamlandı.');
  }
  return null;
}

/* ---------- Tam kipin kurulumu ---------- */
function tamBaslat() {
  document.body.classList.add('gomulu', 'tam');
  if (GOMULU.tema === 'dark' || GOMULU.tema === 'light') document.documentElement.dataset.theme = GOMULU.tema;
  state = normalize(emptyState());
  const asilRender = render;
  gCiz = () => render();
  VIEWS.cariler = () => { view = 'firmalar'; if (!fDurum.liste) fListeYukle(); return VIEWS.firmalar(); };
  ALIAS.cari = ['firmalar'];
  ALIAS.kurlar = ['ayar', 'kurlar'];
  ALIAS['sabit-kiymetler'] = ['ayar', 'sabit'];
  render = () => { asilRender(); sirketAlaniniKilitle(); tamBildir(); };
  save = () => {};
  connectStorage = async () => {};
  recordHistory = (A) => {
    if (A.score === null || state.history.some((h) => h.d === TODAY) || !yazabilir()) return false;
    Kopru.istek('skor-kaydet', { govde: { gun: TODAY, skor: A.score, nakit: yuvarla(cashToday()) } }).then(() => { state.history.push({ d: TODAY, score: A.score, cash: cashToday(), src: 'sunucu' }); }).catch(() => {});
    return false;
  };
  // Menü (ikinci menü) plan ve rapor sekmelerini taşır; prototipin sekme şeridi bu iki bölümde gösterilmez.
  const asilSekme = tabsBar;
  tabsBar = (v) => (v === 'plan' || v === 'rapor' ? '' : asilSekme(v));
  TABS.ayar = [...TABS.ayar.filter(([k]) => k !== 'sistem'), ['hesaplar', 'Hesaplar'], ['kdv', 'KDV oranları'], ['kurlar', 'Kurlar ve faiz'], ['sabit', 'Sabit kıymetler'], ['kurulum', 'İlk kurulum']];
  // Siparişten beklenen ödemeler (#1124): satın almanın siparişte girdiği plan; fatura bağlanınca borç faturaya geçer ve buradan düşer.
  // Tahmine ayrı satır olarak girer (siparisPlani): tutar KDV hariç tahmindir, fatura gelince açık borç olarak zaten girer.
  const asilNakit = VIEWS.nakit, asilNakitSonra = VIEWS.nakit.after;
  VIEWS.nakit = () => asilNakit() + beklenenOdemelerPaneli();
  VIEWS.nakit.after = asilNakitSonra;
  PLAN.nakit = VIEWS.nakit;
  const asilAyar = VIEWS.ayar;
  VIEWS.ayar = () => (['hesaplar', 'kdv', 'kurlar', 'sabit', 'kurulum'].includes(ui.tab.ayar) ? head('Ayarlar', '') + tabsBar('ayar') + `<div class="stack">${ayarEkSekmesi(ui.tab.ayar)}</div>` : asilAyar());
  // Geri al (K-6), örnek veri ve tarayıcı saklaması bu kipte yok.
  delBtn = (kind, id) => {
    if (!yonetebilir()) return '';
    const k = kind + ':' + id;
    return ui.confirm === k ? `<button class="btn sm danger" data-t9="iptal" data-kind="${kind}" data-id="${id}">İptali onayla</button>` : `<button class="btn sm ghost danger" data-act="askDel" data-k="${k}">İptal et</button>`;
  };
  EVENTS.push({ g: 'Aktarım ve mahsup', items: [
    ['virman', 'Hesaplar arası para aktardım', 'Kasadan bankaya, bankadan kredi kartı borcuna; kâr/zararı etkilemez.'],
    ['mahsup', 'Alacak ve borcu mahsup ettim', 'Aynı firmanın satış ve alış faturası parasız birbirini kapatır.'],
    ['avans', 'Avansı faturaya mahsup et', 'Faturaya dağıtılmamış tahsilat ya da ödemeyi sonradan bir faturaya düşer.']] });
  for (const i of EVENTS[EVENTS.length - 1].items) EV[i[0]] = i;
  // 260 a: iade olayları kendi gruplarının sonunda.
  for (const [g, olay] of [['Satış ve tahsilat', ['iadesat', 'Müşteri iade etti', 'Satış faturasının iadesi; tutarı siz girersiniz, KDV ve kur asıl faturadan gelir.']],
    ['Alış ve ödeme', ['iadealis', 'Tedarikçiye iade ettim', 'Alış faturasının iadesi; tutarı siz girersiniz, KDV ve kur asıl faturadan gelir.']]]) {
    EVENTS.find((x) => x.g === g)?.items.push(olay);
    EV[olay[0]] = olay;
  }
  const asilFlow = openFlow;
  openFlow = (kind, opts = {}) => {
    if (kind === 'virman') return virmanAc();
    if (kind === 'mahsup') return mahsupAc(opts.party);
    if (kind === 'avans') return avansAc(opts.party);
    if (kind === 'iadesat' || kind === 'iadealis') return iadeAc(kind === 'iadesat' ? 'gelir' : 'gider', opts.party);
    asilFlow(kind, opts);
    akisaAlanEkle(kind, opts);
  };
  // Eski "kurulum" görünümüne giden her yol (komut paleti, sihirbaz düğmeleri) Ayarlar > İlk kurulum'a düşer.
  VIEWS.kurulum = () => { view = 'ayar'; ui.tab.ayar = 'kurulum'; return VIEWS.ayar(); };
  view = 'home';
  tamYukle().then(() => {
    if (!state.setupDone) ui.tab.ayar = 'kurulum';
    render();
    Gorunum.hazir();
  }).catch((e) => { $('#main').innerHTML = `<div class="view"><p class="empty panel">Finans verisi okunamadı: ${esc(e.message)} <button class="btn sm" onclick="location.reload()">Yeniden dene</button></p></div>`; Gorunum.hazir(); });
}

/* ---------- Pasife alma ön denetimi (FNS-60; asıl kural sunucuda) ---------- */
function pasifOnKontrol(firmaId) {
  if (!TAM || !V) return null;
  const belgeler = V.belgeler.filter((b) => b.firmaId === firmaId && b.durum === 'acik');
  const avanslar = V.odemeler.filter((o) => o.firmaId === firmaId && !o.iptal && sayi(o.kalan) > 0.004);
  const cekler = V.cekler.filter((c) => c.firmaId === firmaId && ['portfoy', 'tahsilde', 'bekliyor'].includes(c.durum));
  const tl = (l, f) => fmt(l.reduce((t, x) => t + f(x), 0));
  const kalan = [];
  if (belgeler.length) kalan.push(`${belgeler.length} açık fatura (${tl(belgeler, (b) => sayi(b.kalan) * sayi(b.kur))})`);
  if (avanslar.length) kalan.push(`${avanslar.length} faturaya dağıtılmamış ödeme (${tl(avanslar, (o) => sayi(o.kalan) * sayi(o.kur))})`);
  if (cekler.length) kalan.push(`${cekler.length} sonuçlanmamış çek/senet (${tl(cekler, (c) => sayi(c.tutarTl))})`);
  return kalan.length ? `Firma pasife alınamaz: ${kalan.join(', ')} var. Alınacak ve verilecek ödeme kalmayınca pasife alınabilir.` : null;
}

/* ---- CSV ---- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "", delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const normKey = s => s.toLocaleLowerCase("tr").replace(/[^a-zçğıöşü0-9%]/g, "");
function parseDate(s) {
  s = (s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
function parseNum(s) {
  s = String(s || "").replace(/[₺\s]|TL/gi, "");
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(",", ".");
  const n = Number(s); return isFinite(n) ? n : NaN;
}
function csvToTx(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { ok: [], bad: ["Dosyada veri satırı yok"] };
  const h = rows[0].map(normKey);
  const col = (...names) => { for (const n of names) { const i = h.findIndex(x => x === n || x.startsWith(n)); if (i >= 0) return i; } return -1; };
  const ci = { date: col("tarih", "belgetarihi"), type: col("tür", "tur", "tip"), cat: col("kategori"), party: col("cari", "müşteri", "tedarikçi"), desc: col("açıklama", "aciklama"), amt: col("kdvhariç", "kdvharic", "tutar", "matrah"), kdv: col("kdv%", "kdvoranı", "kdv"), due: col("vade"), st: col("durum"), paid: col("ödemetarihi", "odemetarihi", "tahsiltarihi") };
  if (ci.date < 0 || ci.amt < 0 || ci.party < 0) return { ok: [], bad: ["Başlıkta Tarih, Cari ve KDV hariç (veya Tutar) sütunları bulunamadı"] };
  const ok = [], bad = [];
  rows.slice(1).forEach((r, i) => {
    const ln = i + 2, g = k => ci[k] >= 0 ? (r[ci[k]] || "").trim() : "";
    const date = parseDate(g("date")), amount = parseNum(g("amt"));
    if (!date) return bad.push(`satır ${ln}: tarih okunamadı`);
    if (!(amount > 0)) return bad.push(`satır ${ln}: tutar okunamadı`);
    if (!g("party")) return bad.push(`satır ${ln}: cari boş`);
    const tr = g("type").toLocaleLowerCase("tr");
    const type = /gider|alış|alis|ödeme|odeme|masraf/.test(tr) ? "gider" : "gelir";
    let cat = g("cat"); if (!CATS[type].some(c => c.k === cat)) cat = CATS[type][0].k;
    const kdvRaw = parseNum(g("kdv")), kdv = [0, 1, 10, 20].includes(kdvRaw) ? kdvRaw : 20;
    const due = parseDate(g("due")) || date, stx = g("st").toLocaleLowerCase("tr"), paidDate = parseDate(g("paid"));
    let status = /çek|cek|senet/.test(stx) ? "cek" : /açık|acik|vadeli|bekl/.test(stx) ? "acik" : /kapan|ödendi|odendi|tahsil/.test(stx) ? "odendi" : (paidDate ? "odendi" : due > TODAY ? "acik" : "odendi");
    ok.push({ id: uid(), date, type, cat, party: g("party"), desc: g("desc") || (type === "gelir" ? "Satış" : "Gider"), amount, kdv, due, status, paidDate: status === "odendi" ? (paidDate || due) : null });
  });
  return { ok, bad };
}

  if (f.id === "txForm") {
    const amount = Number(d.amount); if (!(amount > 0) || !d.party.trim()) return;
    const rec = { date: d.date, type: d.type, cat: d.cat, party: d.party.trim(), desc: d.desc.trim() || (d.type === "gelir" ? "Satış" : "Gider"), amount, kdv: Number(d.kdv), status: d.status, due: d.status === "acik" ? (d.due || d.date) : (d.status === "odendi" ? (d.paidDate || d.date) : d.date), paidDate: d.status === "odendi" ? (d.paidDate || d.date) : null };
    if (drawerCtx && drawerCtx.id) Object.assign(state.tx.find(x => x.id === drawerCtx.id), rec); else state.tx.unshift(Object.assign({ id: uid() }, rec));
    if (state.demo) state.demo = false;
    save(); render();
    if (again) openDrawer("tx"); else closeDrawer();
  }
  if (f.id === "chqForm") {
    const amount = Number(d.amount); if (!(amount > 0) || !d.party.trim()) return;
    const rec = { dir: d.dir, kind: d.kind, party: d.party.trim(), bank: d.bank.trim() || "—", no: d.no.trim() || "—", due: d.due, amount };
    if (drawerCtx && drawerCtx.id) { const q = state.cheques.find(x => x.id === drawerCtx.id); Object.assign(q, rec); if (d.status) q.status = d.status; }
    else state.cheques.push(Object.assign({ id: uid(), date: TODAY, status: d.dir === "alinan" ? "portfoy" : "bekliyor" }, rec));
    save(); closeDrawer(); render();
  }
  if (f.id === "setupForm") {
    state.company.name = d.name.trim() || "Şirketim"; state.settings.sector = d.sector; state.company.openingCash = Number(d.cash) || 0; state.company.openingDate = addDays(TODAY, -1); state.company.threshold = Number(d.th) || 0; state.demo = false;
    save(); render(); openDrawer("tx");
  }
});

let inputTimer = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "txSearch") { ui.txQ = el.value; clearTimeout(inputTimer); inputTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $("#txSearch"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); return; }
  if (el.dataset.scen) { state.scen[el.dataset.scen] = Number(el.value); const l = $("#lbl_" + el.dataset.scen); if (l) l.textContent = el.dataset.unit === "%" ? "%" + el.value : el.value + " " + el.dataset.unit; clearTimeout(inputTimer); inputTimer = setTimeout(() => { save(); render(); const n = $(`[data-scen="${el.dataset.scen}"]`); if (n) n.focus(); }, 200); return; }
  const f = el.form;
  if (f && f.id === "txForm") {
    if (el.name === "party") {
      $("#partyHint").innerHTML = partyHint(f.type.value, el.value);
      const c = f.type.value === "gelir" ? runAnalysis().cs.byParty[el.value] : null;
      if (c && c.term && !(drawerCtx && drawerCtx.id) && !f.due.dataset.touched) f.due.value = addDays(f.date.value, Math.round(c.term));
    }
    if (el.name === "due") f.due.dataset.touched = "1";
    syncTxForm();
  }
  if (f && f.id === "chqForm" && el.name === "party") $("#partyHint").innerHTML = f.dir.value === "alinan" ? partyHint("gelir", el.value) : "";
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.form && el.form.id === "txForm") { syncTxForm(); return; }
  if (el.form && el.form.id === "chqForm") return;
  if (el.dataset.act === "chqStatus") { const q = state.cheques.find(x => x.id === el.dataset.id); if (q) { q.status = el.value; tSave(); } return; }
  if (el.dataset.scenBool) { state.scen[el.dataset.scenBool] = el.checked; return tSave(); }
  if (el.dataset.company) { const k = el.dataset.company; state.company[k] = ["threshold", "openingCash", "expSales", "expTerm"].includes(k) ? Number(el.value) || 0 : el.value; return tSave(); }
  if (el.dataset.setting) { const k = el.dataset.setting; state.settings[k] = k === "sector" ? el.value : Number(el.value); return tSave(); }
  if (el.dataset.weight) { state.settings.weights[el.dataset.weight] = clamp(Number(el.value) || 0, 0, 100); return tSave(); }
  if (el.dataset.budget) { state.budget[el.dataset.budget] = Number(el.value) || 0; return tSave(); }
  if (el.dataset.target) { state.revenueTarget = Number(el.value) || 0; return tSave(); }
  if (el.dataset.bal) { state.balance[el.dataset.bal] = Number(el.value) || 0; return tSave(); }
  if (el.dataset.tool) { const [g, k] = el.dataset.tool.split("."); state.tools[g][k] = Number(el.value) || 0; return tSave(); }
  if (el.dataset.close) { const ym = ui.closeYm; state.closing[ym] = state.closing[ym] || {}; state.closing[ym][el.dataset.close] = el.checked; return tSave(); }
  if (el.dataset.rec) { const r = state.recurring.find(x => x.id === el.dataset.rec); if (r) { r[el.dataset.field] = ["name", "cat"].includes(el.dataset.field) ? el.value : Number(el.value) || 0; tSave(); } return; }
  if (el.id === "csvFile" && el.files && el.files[0]) { const rd = new FileReader(); rd.onload = () => { ui.importRows = csvToTx(String(rd.result)); ui.importMsg = ui.importRows.ok.length ? "" : "Okunabilir kayıt bulunamadı: " + (ui.importRows.bad[0] || ""); if (!ui.importRows.ok.length) ui.importRows = null; render(); go("ayar", "s-veri"); }; rd.readAsText(el.files[0], "utf-8"); return; }
  if (el.id === "importFile" && el.files && el.files[0]) { const rd = new FileReader(); rd.onload = () => { try { const s = JSON.parse(rd.result); if (!s || !Array.isArray(s.tx)) throw 0; state = normalize(s); state.demo = false; save(); go("ozet"); } catch (err) { const m = $("#ioMsg"); if (m) m.textContent = "Dosya okunamadı. Bu sistemden alınmış bir JSON yedeği seçin."; } }; rd.readAsText(el.files[0]); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#drawer").hidden) { closeDrawer(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && !["input", "textarea", "select"].includes(tag) && $("#drawer").hidden) { e.preventDefault(); openPicker(); }
});

/* ============ Başlat ============ */
(function init() {
  if (GOMULU) { gomuluBaslat(); return; }
  try { const t = localStorage.getItem("finmod-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) { }
  let local = null; try { const raw = localStorage.getItem(LS_KEY); if (raw) local = JSON.parse(raw); } catch (e) { }
  state = local ? normalize(local) : normalize(makeDemo());
  stateRev = 1;
  if (window.Chart) Chart.defaults.font.family = CF;
  render();
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render()); } catch (e) { }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (Object.keys(charts).length) render(); });
  setInterval(() => { const d = iso(new Date()); if (d !== TODAY) { setToday(d); render(); } }, 60000);
  connectStorage();
})();

</script>
</body>
