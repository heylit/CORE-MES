/* ----- takvim senkronu ----- */
const icsDate = ts => new Date(ts).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const fold = l => { const out = []; let s = l; while(s.length > 72){ out.push(s.slice(0, 72)); s = ' ' + s.slice(72); } out.push(s); return out.join('\r\n'); };
function icsEvent(uid, start, end, title, desc, loc, remindMin){
  return ['BEGIN:VEVENT', `UID:${uid}@mesai`, `DTSTAMP:${icsDate(now())}`, `DTSTART:${icsDate(start)}`, `DTEND:${icsDate(end)}`, `SUMMARY:${icsEsc(title)}`, desc ? `DESCRIPTION:${icsEsc(desc)}` : '', loc ? `LOCATION:${icsEsc(loc)}` : '',
    ...(remindMin != null && remindMin !== false ? ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:-PT${remindMin}M`, 'END:VALARM'] : []), 'END:VEVENT'].filter(Boolean).map(fold).join('\r\n');
}
const icsWrap = evs => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mesai//TR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Mesai', ...evs, 'END:VCALENDAR'].join('\r\n');
const mtDesc = mt => [mt.agenda, mt.link ? 'Bağlantı: ' + mt.link : '', 'Düzenleyen: ' + pname(mt.by)].filter(Boolean).join('\n\n');
async function saveFile(name, data, type){
  if(S.env.downloads){ try{ const r = await S.env.downloads.save({filename:name, data:new Blob([data], {type})}); if(r && r.status === 'saved') toast('Kaydedildi: ' + name); }catch(e){ if(e && e.code !== 'declined') toast('Dosya kaydedilemedi.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function calAdd(id){
  const mt = byId(S.meetings, id); if(!mt) return;
  saveFile(slug(mt.title) + '.ics', icsWrap([icsEvent(mt.id, mt.start, mtEnd(mt), mt.title, mtDesc(mt), mt.loc || mt.link, mt.remind ? mt.remind : null)]), 'text/calendar;charset=utf-8');
}
function calAddTask(id){
  const t = byId(S.tasks, id); if(!t) return;
  const at = t.remind || t.due; if(!at) return toast('Önce son tarih ya da hatırlatma ekle.');
  saveFile(slug(t.title) + '.ics', icsWrap([icsEvent('t' + t.id, at, at + 30 * M, '✅ ' + t.title, 'Mesai görevi. Veren: ' + pname(t.by), '', 0)]), 'text/calendar;charset=utf-8');
}
function calAddAll(){
  const mine = S.meetings.filter(mt => !mt.cancelled && isAttendee(mt) && mtEnd(mt) > now() && myRsvp(mt) !== 'no');
  const tasks = S.tasks.filter(t => t.to === S.me.id && t.status !== 'done' && (t.remind || t.due) && (t.remind || t.due) > now());
  if(!mine.length && !tasks.length) return toast('Takvime aktarılacak yaklaşan toplantı ya da görev yok.');
  saveFile('mesai-takvimim.ics', icsWrap([...mine.map(mt => icsEvent(mt.id, mt.start, mtEnd(mt), mt.title, mtDesc(mt), mt.loc || mt.link, mt.remind ? mt.remind : null)), ...tasks.map(t => { const at = t.remind || t.due; return icsEvent('t' + t.id, at, at + 30 * M, '✅ ' + t.title, 'Mesai görevi', '', 0); })]), 'text/calendar;charset=utf-8');
}
const gcalUrl = mt => 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(mt.title) + '&dates=' + icsDate(mt.start) + '/' + icsDate(mtEnd(mt)) + '&details=' + encodeURIComponent(mtDesc(mt)) + '&location=' + encodeURIComponent(mt.loc || mt.link || '');
const outlookUrl = mt => 'https://outlook.office.com/calendar/0/deeplink/compose?subject=' + encodeURIComponent(mt.title) + '&startdt=' + encodeURIComponent(new Date(mt.start).toISOString()) + '&enddt=' + encodeURIComponent(new Date(mtEnd(mt)).toISOString()) + '&body=' + encodeURIComponent(mtDesc(mt)) + '&location=' + encodeURIComponent(mt.loc || mt.link || '');
function mailtoMeeting(id){
  const mt = byId(S.meetings, id); if(!mt) return;
  const to = (mt.attendees || []).map(u => P[u] && P[u].email).filter(Boolean);
  const body = `Merhaba,\n\n${mt.title} toplantısına davetlisin.\n\nZaman: ${whenText(mt)}${mt.loc ? '\nYer: ' + mt.loc : ''}${mt.link ? '\nBağlantı: ' + mt.link : ''}${mt.agenda ? '\n\nGündem:\n' + plainText(mt.agenda) : ''}\n\n${pname(S.me.id)}`;
  const a = document.createElement('a'); a.href = `mailto:${to.join(',')}?subject=${encodeURIComponent('Davet: ' + mt.title)}&body=${encodeURIComponent(body)}`; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
  if(!to.length) toast('Katılımcıların e-posta adresleri görünmüyor; alıcıları e-posta uygulamanda ekle.');
}

/* ----- takvim sekmesi ----- */
function calEvents(scope){
  const me = S.me.id, ev = {};
  const push = (ts, e) => { const k = isoDate(ts); (ev[k] = ev[k] || []).push(Object.assign({ts}, e)); };
  S.meetings.forEach(mt => { if(scope === 'me' && !isAttendee(mt)) return; push(mt.start, {k:'m', r:mt}); });
  S.tasks.forEach(t => { if(!t.due || (scope === 'me' && t.to !== me)) return; push(t.due, {k:'t', r:t}); });
  S.orders.forEach(o => { if(!o.due || o.status === 'sevk') return; push(o.due, {k:'o', r:o}); });
  Object.values(ev).forEach(l => l.sort((a, b) => (a.k === 'm' ? a.ts : 9e15) - (b.k === 'm' ? b.ts : 9e15)));
  return ev;
}
function calChip(e){
  if(e.k === 'm') return `<button class="cchip mtg${e.r.cancelled ? ' done' : ''}" data-act="open-meet" data-id="${esc(e.r.id)}"><b>${hm(e.r.start)}</b> ${esc(e.r.title)}</button>`;
  if(e.k === 't') return `<button class="cchip${e.r.status === 'done' ? ' done' : ''}" style="--c:${TSTAT[e.r.status].c}" data-act="open-task" data-id="${esc(e.r.id)}">${esc(e.r.title)}</button>`;
  return `<button class="cchip ord" data-act="open-order" data-id="${esc(e.r.id)}">📦 #${esc(e.r.no)} ${esc(e.r.customer)}</button>`;
}
const dotC = e => e.k === 'm' ? 'var(--accent)' : e.k === 'o' ? '#C2671C' : TSTAT[e.r.status].c;
function calMonth(ev){
  if(!S.cal){ const d = new Date(); S.cal = {y:d.getFullYear(), m:d.getMonth(), sel:isoDate(now())}; }
  const {y, m, sel} = S.cal, first = new Date(y, m, 1), start = (first.getDay() + 6) % 7, today = isoDate(now());
  const total = Math.ceil((start + new Date(y, m + 1, 0).getDate()) / 7) * 7;
  let cells = '';
  for(let i = 0; i < total; i++){
    const d = new Date(y, m, i - start + 1), k = isoDate(d.getTime()), list = ev[k] || [];
    cells += `<div class="cday${d.getMonth() !== m ? ' out' : ''}${k === today ? ' today' : ''}${k === sel ? ' sel' : ''}" role="button" tabindex="0" data-act="cal-day" data-d="${k}"><span class="dn">${d.getDate()}</span><div class="cev">${list.slice(0, 3).map(calChip).join('')}${list.length > 3 ? `<span class="more">+${list.length - 3}</span>` : ''}</div>${list.length ? `<span class="cdots">${list.slice(0, 4).map(e => `<i style="--c:${dotC(e)}"></i>`).join('')}</span>` : ''}</div>`;
  }
  const selList = ev[sel] || [];
  return `<div class="calbar"><button class="ib" data-act="cal-nav" data-n="-1" aria-label="Önceki ay">${ic('back')}</button><b>${MONTHS[m]} ${y}</b><button class="ib flip" data-act="cal-nav" data-n="1" aria-label="Sonraki ay">${ic('back')}</button><button class="btn sm" data-act="cal-nav" data-n="0">Bugün</button></div>` +
    `<div class="cal"><div class="cwd">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d => `<span>${d}</span>`).join('')}</div><div class="cgrid">${cells}</div></div>` +
    sec(fDay.format(new Date(sel + 'T12:00')), agendaItems(selList) + (S.canWrite ? `<div class="dacts" style="margin-top:10px"><button class="link-btn" data-act="new-meet" data-day="${sel}">${ic('plus', 14)} Bu güne toplantı</button><button class="link-btn" data-act="f-task" data-due="${sel}">${ic('plus', 14)} Bu güne görev</button></div>` : ''));
}
function agendaItems(list){ return list.length ? `<div class="list">${list.map(e => e.k === 'm' ? meetRow(e.r) : e.k === 't' ? taskRow(e.r) : orderCard(e.r, true)).join('')}</div>` : '<p class="empty-s">Bu güne bağlı toplantı, görev ya da teslim yok.</p>'; }
function calAgenda(ev){
  const keys = Object.keys(ev).filter(k => k >= isoDate(now())).sort().slice(0, 30);
  if(!keys.length) return `<div class="big-empty"><div class="ic-w">${ic('cal', 26)}</div><h3>Takvim boş</h3><p>Toplantı planla ya da görevlere son tarih ver; hepsi burada sırayla görünür.</p></div>`;
  return keys.map(k => { const d = new Date(k + 'T12:00'); return `<section class="ag-day"><div class="ag-h"><b>${d.getDate()}</b><div><span>${k === isoDate(now()) ? 'Bugün' : k === isoDate(now() + D) ? 'Yarın' : fWd.format(d)}</span><small>${MONTHS[d.getMonth()]} ${d.getFullYear()}</small></div></div>${agendaItems(ev[k])}</section>`; }).join('');
}
function viewCal(){
  const mode = S.calMode || (isNarrow() ? 'agenda' : 'month'), scope = S.calScope || 'me';
  const ev = calEvents(scope);
  return `<div class="toolbar"><div class="segc"><button class="${scope === 'me' ? 'on' : ''}" data-act="cal-scope" data-v="me">Benim</button><button class="${scope === 'all' ? 'on' : ''}" data-act="cal-scope" data-v="all">Herkes</button></div><div class="segc"><button class="${mode === 'agenda' ? 'on' : ''}" data-act="cal-mode" data-v="agenda">${ic('list', 15)}<span>Ajanda</span></button><button class="${mode === 'month' ? 'on' : ''}" data-act="cal-mode" data-v="month">${ic('cal', 15)}<span>Ay</span></button></div></div>` + (mode === 'month' ? calMonth(ev) : calAgenda(ev));
}

/* ----- hatırlatmalar ----- */
let actx = null;
function beep(){
  if(!(S.prefs.notif || {}).sound) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination); o.frequency.value = 880; g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.15, actx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .5); o.start(); o.stop(actx.currentTime + .5); }catch(e){}
}
function remindCard(title, body, actions){
  const el = document.createElement('div');
  el.className = 'toast remind'; el.setAttribute('role', 'alert');
  el.innerHTML = `<span class="r-ic">${ic('bell', 18)}</span><div class="r-b"><b>${esc(title)}</b><span>${esc(body)}</span><div class="r-a">${actions.map((a, i) => a.href ? `<a class="btn sm ${i === 0 ? 'ok' : ''}" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.t)}</a>` : `<button class="btn sm ${i === 0 ? 'pri' : ''}" data-i="${i}">${esc(a.t)}</button>`).join('')}<button class="btn sm ghost" data-x="1">Kapat</button></div></div>`;
  el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { dismiss(el); actions[+b.dataset.i].fn(); });
  el.querySelector('[data-x]').onclick = () => dismiss(el);
  $('#toasts').appendChild(el); beep();
  if((S.prefs.notif || {}).push && 'Notification' in window && Notification.permission === 'granted'){ try{ new Notification(title, {body, tag:title}); }catch(e){} }
}
function runReminders(){
  if(!S.ready) return;
  const me = S.me.id, t = now();
  for(const mt of S.meetings){
    if(mt.cancelled || !isAttendee(mt) || myRsvp(mt) === 'no' || !mt.remind) continue;
    if(t >= mt.start - mt.remind * M && t < mt.start + 5 * M){
      const key = 'rm:' + mt.id + ':' + mt.start;
      if(LS.get(key)) continue; LS.set(key, 1);
      remindCard(mt.title, `${startsIn(mt.start)}${mt.loc ? ', ' + mt.loc : ''}`, [...(mt.link ? [{t:'Katıl', href:mt.link}] : []), {t:'Aç', fn:() => openDetail('meeting', mt.id)}]);
    }
  }
  for(const tk of S.tasks){
    if(tk.to !== me || tk.status === 'done' || !tk.remind) continue;
    if(t >= tk.remind && t < tk.remind + 12 * H){
      const key = 'rt:' + tk.id + ':' + tk.remind;
      if(LS.get(key)) continue; LS.set(key, 1);
      remindCard('Hatırlatma: ' + tk.title, tk.due ? 'Son tarih: ' + (dueLabel(tk.due) || {}).t : 'Görev hatırlatması', [{t:'Görevi aç', fn:() => openDetail('task', tk.id)}, {t:'Bitti', fn:() => setTaskStatus(tk.id, 'done')}]);
    }
  }
}

/* ----- e-posta kuyruğu ----- */
const MAILK = {gorev:'Görev ataması', onay:'Onay isteği', karar:'Onay kararı', toplanti:'Toplantı daveti', hatirlatma:'Toplantı hatırlatması', ozet:'Günlük özet'};
function enqueueMail(o){
  const to = [...new Set((o.to || []).filter(u => u && !u.startsWith('__')))];
  if(!to.length) return;
  S.st.add('eposta', {to, kind:o.kind, ref:o.ref || null, subject:o.subject, text:o.text, ics:!!o.ics, sendAt:o.sendAt || now(), status:'kuyrukta', by:S.me.id, createdAt:now()}).catch(e => console.warn('[e-posta]', e));
}
function mailPreviewHTML(m){

}
function openMailPreview(id){ const m = byId(S.mails, id); if(!m) return; modal(`<h3>E-posta önizlemesi</h3>${mailPreviewHTML(m)}<div class="mdl-foot"><button class="btn pri" data-act="mdl-close">Kapat</button></div>`, 'sheet wide'); }
function digestText(){
  const me = S.me.id;
  const mts = S.meetings.filter(mt => !mt.cancelled && isAttendee(mt) && sameDay(mt.start, now())).sort((a, b) => a.start - b.start);
  const tasks = S.tasks.filter(t => t.to === me && t.status !== 'done' && t.due && dueLabel(t.due).diff <= 0);
  const aps = S.approvals.filter(apMine), anns = S.anns.filter(annPending);
  return `Günaydın ${firstName(me)}, bugün için özetin:\n\n**Toplantılar (${mts.length})**\n${mts.map(mt => `- ${hm(mt.start)} ${mt.title}`).join('\n') || '- Yok'}\n\n**Bugün ya da gecikmiş görevler (${tasks.length})**\n${tasks.map(t => `- ${t.title} (${dueLabel(t.due).t})`).join('\n') || '- Yok'}\n\n**Onayını bekleyenler (${aps.length})**\n${aps.map(a => `- ${a.title}`).join('\n') || '- Yok'}${anns.length ? `\n\n**Okunmamış duyurular (${anns.length})**` : ''}`;
}
function openDigestPreview(){ modal(`<h3>Günlük özet e-postası</h3><p class="lead">Her sabah ${esc((S.prefs.mail || {}).digestAt || '08:00')} saatinde bu formatta gönderilir.</p>${mailPreviewHTML({to:[S.me.id], subject:'Mesai: bugünün özeti', text:digestText()})}<div class="mdl-foot"><button class="btn pri" data-act="mdl-close">Kapat</button></div>`, 'sheet wide'); }

/* ----- okundu bilgisi ----- */
let readT = 0, readSent = '';
function pushReads(){
  if(!S.st || !S.me.id || !S.canWrite) return;
  clearTimeout(readT);
  readT = setTimeout(() => { const c = {}; Object.entries(S.prefs.lastRead || {}).forEach(([k, v]) => c[sk(k)] = v); const j = JSON.stringify(c); if(j === readSent) return; readSent = j; S.st.set('okuma/' + S.me.id, {c}).catch(() => {}); }, 2500);
}
function readersOf(m, cid = S.cur){ const k = sk(cid); return Object.entries(S.reads).filter(([u, r]) => u !== S.me.id && u !== m.by && r && r.c && r.c[k] >= m.ts).map(([u]) => u); }
function ticksHTML(m){
  if(m.by !== S.me.id || m.deleted) return '';
  const rd = readersOf(m).length;
  return `<button class="tick${rd ? ' read' : ''}" data-act="readinfo" title="${rd ? rd + ' kişi okudu' : 'Gönderildi'}" aria-label="${rd ? rd + ' kişi okudu' : 'Gönderildi'}">${ic(rd ? 'check2' : 'check', 15)}</button>`;
}
function openReadInfo(mid){
  const m = findMsg(mid); if(!m) return;
  const rd = readersOf(m), pend = knownPeople().filter(u => u !== m.by && !rd.includes(u) && !u.startsWith('__'));

  const row = (u, ok) => `<div class="prow">${av(u, 30)}<div class="pn">${esc(pname(u))}</div>${ok ? `<span class="ok">${ic('check2', 15)} Okudu</span>` : '<span class="small muted">Henüz okumadı</span>'}</div>`;
  modal(`<h3>Mesaj bilgisi</h3><div class="info-q">${rich(m.text || previewOf(m))}</div>${rd.map(u => row(u, true)).join('')}${pend.map(u => row(u, false)).join('')}<div class="mdl-foot"><button class="btn pri" data-act="mdl-close">Kapat</button></div>`, 'sheet');
}

/* ----- genel arama ----- */
async function loadAllMsgs(){
  for(const c of S.channels){ if(S.msgs[c.id] || S.searchCache[c.id]) continue; try{ S.searchCache[c.id] = (await S.st.list(`channels/${c.id}/msgs`, {order:['ts', 'desc'], limit:400})).reverse(); }catch(e){} }
}
function openSearch(){
  closePop();
  modal(`<div class="sr-in">${ic('search', 18)}<input id="srQ" placeholder="Mesaj, görev, toplantı, sipariş ara…" autocomplete="off" aria-label="Ara"><button class="ib" data-act="mdl-close" aria-label="Kapat">${ic('close')}</button></div><div class="sr-body" id="srB"><p class="empty-s pad">Yazmaya başla. Kişi adıyla da arayabilirsin.</p></div>`, 'search');
  S.searchCache = S.searchCache || {};
  const inp = $('#srQ');
  const run = () => {
    const q = lower(inp.value.trim()), b = $('#srB'); if(!b) return;
    if(q.length < 2){ b.innerHTML = '<p class="empty-s pad">En az iki harf yaz.</p>'; return; }
    const hit = s => lower(s).includes(q) || ascii(s).includes(ascii(q));
    const grp = (t, items) => items.length ? `<div class="sr-g"><h4>${t}</h4>${items.slice(0, 8).join('')}</div>` : '';
    const chs = S.channels.filter(c => hit(c.name + ' ' + (c.topic || ''))).map(c => `<button class="sr-i" data-act="sr-go" data-k="ch" data-id="${esc(c.id)}"><span class="sr-ic">${esc(c.emoji || '#')}</span><div><b>${esc(c.name)}</b><span>${esc(c.topic || '')}</span></div></button>`);
    const msgs = [];
    for(const c of S.channels) for(const m of (S.msgs[c.id] || S.searchCache[c.id] || [])){ if(m.deleted) continue; const t = plainText(m.text || ''); if(t && (hit(t) || hit(pname(m.by)))) msgs.push({c, m, t}); }
    msgs.sort((a, b) => b.m.ts - a.m.ts);
    const mi = msgs.map(({c, m, t}) => `<button class="sr-i" data-act="sr-go" data-k="msg" data-cid="${esc(c.id)}" data-id="${esc(m.id)}">${av(m.by, 28)}<div><b>${esc(pname(m.by))} <small>#${esc(c.name)}, ${esc(shortWhen(m.ts))}</small></b><span>${esc(t.replace(/\*\*/g, '').slice(0, 140))}</span></div></button>`);
    const ts = S.tasks.filter(t => hit(t.title + ' ' + pname(t.to))).map(t => `<button class="sr-i" data-act="sr-go" data-k="task" data-id="${esc(t.id)}"><span class="sr-ic">✅</span><div><b>${esc(t.title)}</b><span>${esc(TSTAT[t.status].t)}, ${esc(pname(t.to))}</span></div></button>`);
    const mts = S.meetings.filter(mt => hit(mt.title + ' ' + (mt.agenda || ''))).map(mt => `<button class="sr-i" data-act="sr-go" data-k="meet" data-id="${esc(mt.id)}"><span class="sr-ic">📅</span><div><b>${esc(mt.title)}</b><span>${esc(whenText(mt))}</span></div></button>`);
    const os = S.orders.filter(o => hit('#' + o.no + ' ' + o.customer + ' ' + (o.product || ''))).map(o => `<button class="sr-i" data-act="sr-go" data-k="order" data-id="${esc(o.id)}"><span class="sr-ic">📦</span><div><b>#${esc(o.no)} ${esc(o.customer)}</b><span>${esc(o.product || '')}, ${esc((OSTAT[o.status] || {}).t || '')}</span></div></button>`);
    const as = S.approvals.filter(a => hit(a.title)).map(a => `<button class="sr-i" data-act="sr-go" data-k="appr" data-id="${esc(a.id)}"><span class="sr-ic">🖋</span><div><b>${esc(a.title)}</b><span>${esc(ASTAT[apState(a).s].t)}</span></div></button>`);
    const html = grp('Kanallar', chs) + grp('Toplantılar', mts) + grp('Görevler', ts) + grp('Siparişler', os) + grp('Onaylar', as) + grp('Mesajlar', mi);

  S.st.watch('channels', {order:['createdAt', 'asc'], limit:200}, chs => {
    const first = !S.chLoaded; S.chLoaded = true; S.channels = chs;
    if(!S.cur){ const pick = chs.find(c => c.id === S.prefs.lastChannel) || chs.find(c => c.id === 'genel') || chs[0]; if(pick){ S.cur = pick.id; watchChannel(pick.id); const ta = $('#input'); ta.value = S.drafts[pick.id] || ''; } }
    else markRead();
    if(first) ready(); else { render(); notifyChecks(); }
  });
  env.onPeers(onPeers);
  S.st.watch('okuma', {limit:500}, rows => { const o = {}; rows.forEach(r => o[r.id] = r); S.reads = o; if(S.view === 'chat') render('view'); });
  setInterval(runReminders, 20000); setTimeout(runReminders, 3000);
  setInterval(computeTyping, 4000);
  setInterval(() => render(), 60000);
  setInterval(() => { runScheduler(); runRules(); }, 30000);
  setTimeout(kick, 2500);
}
boot();
})();

</script>
</body>
