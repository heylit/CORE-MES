<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14203A">
<title>Mesai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14203A;--ink-2:#1E2C49;--ink-3:#2A3B5E;--side-text:#D5DCEA;--side-dim:#8E9CB7;
  --bg:#F4F6F9;--surface:#FFFFFF;--surface-2:#F0F3F7;--hover:#F6F8FB;--line:#E3E8EF;--line-strong:#CDD5E0;
  --text:#18212F;--muted:#5B677C;--faint:#8792A5;
  --accent:#0E8C89;--accent-hover:#0B7673;--accent-soft:#DDF1F0;--accent-text:#0A6D6A;
  --imp:#B7791F;--imp-soft:#FFF5DE;--urg:#C93C24;--urg-soft:#FDEBE6;
  --gold:#A67A1F;--gold-soft:#FBF2DF;--ment:#FFF8E1;--ment-me:#FFE39A;--ment-me-text:#5A3E00;
  --online:#2DB36A;--focus:#8467D7;
  --shadow:0 12px 32px rgba(15,23,42,.16),0 2px 6px rgba(15,23,42,.06);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0B111D;--ink-2:#152036;--ink-3:#20304F;--side-text:#CED6E6;--side-dim:#7E8BA5;
    --bg:#0F141D;--surface:#151B26;--surface-2:#1C2432;--hover:#19202C;--line:#263042;--line-strong:#344157;
    --text:#E6EAF2;--muted:#9AA6BB;--faint:#717E95;
    --accent:#22A8A4;--accent-hover:#2BBAB6;--accent-soft:#123634;--accent-text:#5ED0CB;
    --imp:#E0A43C;--imp-soft:#2A2213;--urg:#EE6A50;--urg-soft:#331914;
    --gold:#D5A84A;--gold-soft:#2A2314;--ment:#2A2615;--ment-me:#5A4712;--ment-me-text:#FFE7A6;
    --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0B111D;--ink-2:#152036;--ink-3:#20304F;--side-text:#CED6E6;--side-dim:#7E8BA5;
  --bg:#0F141D;--surface:#151B26;--surface-2:#1C2432;--hover:#19202C;--line:#263042;--line-strong:#344157;
  --text:#E6EAF2;--muted:#9AA6BB;--faint:#717E95;
  --accent:#22A8A4;--accent-hover:#2BBAB6;--accent-soft:#123634;--accent-text:#5ED0CB;
  --imp:#E0A43C;--imp-soft:#2A2213;--urg:#EE6A50;--urg-soft:#331914;
  --gold:#D5A84A;--gold-soft:#2A2314;--ment:#2A2615;--ment-me:#5A4712;--ment-me-text:#FFE7A6;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.i{flex:none;display:block}
.muted{color:var(--muted)} .small{font-size:13px} .pad{padding:10px}
kbd{font-family:var(--font);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr) auto;height:100%}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}

/* ---------- sidebar ---------- */
.side{background:var(--ink);color:var(--side-text);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:11px;padding:16px 16px 14px}
.logo{width:36px;height:36px;flex:none}
.ws-name{font-weight:700;font-size:18px;letter-spacing:-.015em;color:#fff;line-height:1.15}
.ws-sub{font-size:12.5px;color:var(--side-dim)}
.me-card{display:flex;align-items:center;gap:10px;margin:0 10px 8px;padding:8px 10px;border-radius:12px;background:var(--ink-2);width:calc(100% - 20px);transition:background .15s}
.me-card:hover{background:var(--ink-3)}
.me-txt{min-width:0}
.me-name{font-weight:600;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-st{font-size:12.5px;color:var(--side-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:4px 8px 2px}
.nv,.ch{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--side-text);font-size:14.5px;line-height:1.3}
.nv:hover,.ch:hover{background:var(--ink-2)}
.nv.on,.ch.on{background:var(--accent);color:#fff}
.nv .i{opacity:.85}
.nv .cnt{margin-left:auto;font-size:12px;font-weight:600;background:var(--ink-3);color:#fff;padding:0 7px;border-radius:999px;min-width:20px;text-align:center}
.nv .cnt.late{background:var(--urg)}
.nv.on .cnt{background:rgba(255,255,255,.22)}
.nv kbd{margin-left:auto;background:transparent;border-color:var(--ink-3);color:var(--side-dim)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 4px 18px;font-size:13px;color:var(--side-dim);font-weight:600}
.sec-add{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--side-dim)}
.sec-add:hover{background:var(--ink-2);color:#fff}
.chs{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent}
.ch .em{width:22px;text-align:center;font-size:15px;flex:none}
.ch .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ch.unread{color:#fff;font-weight:650}
.ch .badge{margin-left:auto;background:var(--urg);color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.ch .udot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#fff}
.side-empty{padding:8px 12px;color:var(--side-dim);font-size:13.5px;margin:0}
.demo-note{margin:0 12px 10px;padding:10px 12px;border-radius:10px;background:var(--ink-2);font-size:12.5px;color:var(--side-dim);line-height:1.45}
.demo-note b{color:var(--side-text)}
.side-foot{display:flex;gap:6px;padding:10px;border-top:1px solid var(--ink-2)}
.sf-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--side-text);background:var(--ink-2)}
.sf-btn:hover{background:var(--ink-3)}
.sf-btn.on{background:var(--focus);color:#fff}
.sf-btn.sq{flex:0 0 38px}
.side .av .dot{border-color:var(--ink-2)}
.side-scrim{display:none}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 20px;border-bottom:1px solid var(--line);min-height:64px}
.h-main{min-width:0;flex:1}
.h-title{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.h-em{font-size:18px}
.h-topic{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.h-actions{display:flex;gap:4px;flex:none}
.hb{height:36px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap}
.hb:hover,.hb.on{background:var(--surface-2);color:var(--text)}
.hb.ai{color:var(--accent-text);background:var(--accent-soft)}
.hb.ai:hover{filter:brightness(.97)}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--surface-2);color:var(--text)}
.menu-btn{display:none}
.pinbar{display:flex;align-items:center;gap:10px;width:100%;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--muted)}
.pinbar:hover{background:var(--hover)}
.pinbar .i{color:var(--imp)}
.pb-t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-t b{color:var(--text);font-weight:600}
.pb-n{font-size:12.5px;font-weight:600;color:var(--accent-text);flex:none}

/* ---------- messages ---------- */
.msgs{flex:1;overflow-y:auto;min-height:0;padding:20px 0 12px;overscroll-behavior:contain}
.state{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.state h2{margin:4px 0 0;color:var(--text);font-size:20px}
.state p{margin:0;max-width:40ch}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.intro{padding:12px 24px 18px}
.intro-em{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:30px}
.intro h2{margin:12px 0 2px;font-size:24px;letter-spacing:-.02em}
.intro p{margin:0;color:var(--muted);max-width:68ch}
.intro .when{font-size:13px;color:var(--faint);margin-top:4px}
.older{text-align:center;font-size:12.5px;color:var(--faint);padding:4px 0 12px}
.day{display:flex;align-items:center;gap:12px;margin:16px 20px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.day::before,.day::after{content:'';flex:1;height:1px;background:var(--line)}
.day span{padding:2px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.newline{display:flex;align-items:center;gap:10px;margin:8px 20px 4px;color:var(--urg);font-size:12px;font-weight:700}
.newline::after{content:'';flex:1;height:1px;background:var(--urg);opacity:.6}
.msg{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);padding:7px 24px 7px 16px}
.msg.cont{padding-top:1px;padding-bottom:3px}
.msg:hover,.msg.active{background:var(--hover)}
.msg.ment{background:var(--ment);box-shadow:inset 3px 0 0 var(--gold)}
.msg.p-important{background:var(--imp-soft);box-shadow:inset 3px 0 0 var(--imp)}
.msg.p-urgent{background:var(--urg-soft);box-shadow:inset 3px 0 0 var(--urg)}
.msg.flash{animation:flash 2s ease}
@keyframes flash{0%,30%{background:var(--ment-me)}100%{background:transparent}}
.gut{padding-top:2px}
.avb{border-radius:11px;display:block}
.htime{visibility:hidden;display:block;font-size:11px;color:var(--faint);padding-top:3px;width:40px;text-align:center}
.msg:hover .htime,.msg.active .htime{visibility:visible}
.mb{min-width:0}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35;margin-bottom:1px}
.who{font-weight:650;font-size:15px}
.who:hover{text-decoration:underline;text-underline-offset:2px}
.meta time{font-size:12px;color:var(--faint)}
.meta .st{font-size:14px;cursor:default}
.edited{font-size:12px;color:var(--faint)}
.pinned{color:var(--imp)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;line-height:1.5}
.tag.important{background:var(--imp)} .tag.urgent{background:var(--urg)}
.msg.sys .who{color:var(--accent-text)}
.text{overflow-wrap:anywhere;line-height:1.55}
.text.del{color:var(--faint);font-style:italic}
.text.jumbo{font-size:36px;line-height:1.25}
.text strong{font-weight:650}
.text code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.text pre{margin:6px 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%}
.text pre code{border:0;padding:0;background:none;font-size:13px;line-height:1.5}
.text a{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.li{display:block;padding-left:18px;position:relative}
.li::before{content:'';position:absolute;left:6px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.quote{display:block;border-left:3px solid var(--line-strong);padding-left:10px;color:var(--muted)}
.mention{display:inline;font:inherit;font-weight:600;background:var(--accent-soft);color:var(--accent-text);border-radius:5px;padding:0 4px}
.mention.me,.mention.all{background:var(--ment-me);color:var(--ment-me-text)}
button.mention:hover{text-decoration:underline}
.tools{position:absolute;right:20px;top:-18px;display:none;gap:1px;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(15,23,42,.12);z-index:4}
.msg:hover .tools,.msg.active .tools,.msg:focus-within .tools{display:flex}
.tb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.tb:hover{background:var(--surface-2);color:var(--text)}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;transition:border-color .12s}
.rc:hover{border-color:var(--line-strong)}
.rc b{font-weight:600;font-size:12.5px;color:var(--muted)}
.rc.mine{border-color:var(--accent);background:var(--accent-soft)}
.rc.mine b{color:var(--accent-text)}
.rc.add{color:var(--faint);opacity:0}
.msg:hover .rc.add,.msg.active .rc.add{opacity:1}
.thr{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:4px 10px 4px 4px;border-radius:9px;border:1px solid transparent;font-size:13px}
.thr:hover{background:var(--surface);border-color:var(--line)}
.thr b{color:var(--accent-text);font-weight:650}
.thr span:last-child{color:var(--faint)}
.stack{display:inline-flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--surface)}
.stack .av + .av{margin-left:-6px}
.fxtag{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--gold);padding:2px 8px;border-radius:999px;background:var(--gold-soft)}
.trn{display:flex;gap:8px;margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.trn .i{margin-top:3px}
.edit{margin-top:2px}
.edit-ta{width:100%;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;resize:none;background:var(--surface);outline:0;box-shadow:0 0 0 3px var(--accent-soft);line-height:1.5;max-height:240px}
.edit-bar{display:flex;align-items:center;gap:6px;margin-top:6px}
.edit-bar span{font-size:12px;color:var(--faint);margin-right:auto}

/* poll / kudos / ack / attachments */
.poll{margin-top:8px;max-width:460px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.pq{display:flex;gap:8px;align-items:flex-start;font-weight:650;margin-bottom:4px}
.pq .i{color:var(--accent);margin-top:3px}
.po{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-top:6px;border-radius:9px;border:1px solid var(--line);overflow:hidden;font-size:14px}
.po:hover{border-color:var(--line-strong)}
.po .bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);transition:width .35s ease}
.po > :not(.bar){position:relative}
.po.mine{border-color:var(--accent)}
.pchk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;color:#fff}
.po.mine .pchk{background:var(--accent);border-color:var(--accent)}
.pt{flex:1;min-width:0}
.po .pct{font-size:13px;font-weight:650;color:var(--muted);min-width:38px;text-align:right}
.pfoot{font-size:12.5px;color:var(--faint);margin-top:8px}
.kudos{margin-top:6px;display:flex;gap:16px;align-items:flex-start;max-width:500px;padding:16px 18px;border-radius:16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.kd-medal{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);border:2px dashed var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 14%,transparent)}
.kd-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.01em}
.kd-to{font-size:18px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.3}
.kd-to:hover{text-decoration:underline}
.kd-line{font-size:13px;color:var(--muted)}
.kd-text{margin-top:8px;line-height:1.55}
.ack{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.ack-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:#fff;background:var(--imp)}
.p-urgent .ack-btn{background:var(--urg)}
.ack-btn:hover{filter:brightness(1.06)}
.ack-done{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent-text)}
.ack-who{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:3px 6px;border-radius:8px}
.ack-who:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
.att{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:10px 14px 10px 12px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;max-width:100%}
.att:hover{border-color:var(--line-strong);background:var(--hover)}
.att .i{color:var(--accent)}
.att span{display:flex;flex-direction:column;min-width:0}
.att b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att small{font-size:12px;color:var(--faint)}
.att-img{display:inline-block;margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:min(420px,100%)}
.att-img img{display:block;max-width:100%;max-height:320px;object-fit:cover}

/* avatars */
.av{position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);background:var(--c,#8592A6);color:#fff;display:inline-grid;place-items:center;font-weight:650;font-size:calc(var(--s) * .38);flex:none;line-height:1;letter-spacing:.01em}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
.av.sys{background:var(--accent)}
.dot{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--faint);border:2px solid var(--surface)}
.dot.on{background:var(--online)}
.dot.focus{background:var(--focus)}

/* ---------- composer ---------- */
.typing{min-height:22px;padding:0 24px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.composer{padding:0 20px 14px;position:relative}
.cmp-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text);background:var(--imp-soft);border:1px solid color-mix(in srgb,var(--imp) 30%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.cmp{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.cmp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cmp.p-important{border-color:var(--imp);box-shadow:0 0 0 3px var(--imp-soft)}
.cmp.p-urgent{border-color:var(--urg);box-shadow:0 0 0 3px var(--urg-soft)}
.cmp textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;padding:12px 14px 4px;max-height:220px;min-height:46px;line-height:1.5}
.cmp textarea:disabled{cursor:not-allowed}
.cmp-bar{display:flex;align-items:center;gap:2px;padding:4px 6px 6px;flex-wrap:wrap}
.cb{height:32px;min-width:32px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:13px;font-weight:600}
.cb:hover{background:var(--surface-2);color:var(--text)}
.cb.prio-important{color:var(--imp);background:var(--imp-soft)}
.cb.prio-urgent{color:var(--urg);background:var(--urg-soft)}
.cb.ai-b{color:var(--accent-text)}
.cb.busy .i{animation:spin 1s linear infinite}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.send{margin-left:auto;height:34px;padding:0 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,opacity .15s}
.send:hover:not(:disabled){background:var(--accent-hover)}
.send:disabled{opacity:.38}
.cmp-hint{font-size:11.5px;color:var(--faint);margin:7px 4px 0;display:flex;gap:14px;flex-wrap:wrap}
.cmp-hint kbd{font-size:10.5px;padding:0 5px;margin-right:3px}
.ro{font-size:13.5px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line-strong);border-radius:12px;text-align:center}

/* autocomplete */
.ac{position:fixed;z-index:55;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:300px;overflow-y:auto}
.ac-h{font-size:12px;font-weight:600;color:var(--faint);padding:4px 8px 6px}

/* ---------- panel ---------- */
.panel{width:400px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.pn-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);min-height:64px}
.pn-head > div{flex:1;min-width:0}
.pn-title{font-weight:700;font-size:16px}
.pn-sub{font-size:12.5px;color:var(--muted)}
.pn-search{display:flex;align-items:center;gap:8px;margin:12px 16px 4px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;color:var(--faint)}
.pn-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.bare{border:0;box-shadow:none!important;padding:0;height:40px;background:transparent}
.pn-body{flex:1;overflow-y:auto;min-height:0}
.pn-body .msg{padding-right:16px;padding-left:12px}
.pn-foot{padding:6px 12px 12px;border-top:1px solid var(--line)}
.pn-foot .typing{padding:0 4px;min-height:20px}
.pn-empty{padding:40px 28px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:8px}
.pn-empty p{margin:0;max-width:34ch;font-size:14px}
.pn-empty .i{color:var(--faint)}
.th-div{display:flex;align-items:center;gap:10px;margin:6px 16px;font-size:12.5px;color:var(--faint);font-weight:600}
.th-div::after{content:'';flex:1;height:1px;background:var(--line)}
.th-ai{padding:10px 16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:600;color:var(--accent-text)}
.chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.ai-box{margin:10px 16px;padding:12px;border-radius:12px;background:var(--accent-soft);display:grid;gap:8px}
.ai-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--accent-text)}
.ai-h .link-btn{margin-left:auto}
.sugg{text-align:left;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.sugg:hover{border-color:var(--accent)}
.ai-task{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface)}
.ai-task > div{flex:1;min-width:0;display:flex;flex-direction:column}
.ai-task b{font-weight:600;font-size:14px}
.ai-task small{font-size:12px;color:var(--muted)}
.ok{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.seg{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.seg button{padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--text);color:var(--surface)}
.seg .btn{margin-left:auto}
.tk{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.tk input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none;cursor:pointer}
.tk-main{flex:1;min-width:0}
.tk-t{font-weight:550;font-size:14.5px;overflow-wrap:anywhere}
.tk.done .tk-t{text-decoration:line-through;color:var(--faint)}
.tk-meta{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap;align-items:center}
.tk-meta .who-s{display:inline-flex;align-items:center;gap:6px}
.due{font-weight:600}
.due.late{color:var(--urg)} .due.today{color:var(--imp)}
.lnk{color:var(--accent-text);font-weight:500}
.lnk:hover{text-decoration:underline}
.res{display:flex;gap:10px;width:100%;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.res:hover{background:var(--hover)}
.res > div{flex:1;min-width:0}
.res-meta{display:flex;gap:8px;font-size:12.5px;color:var(--faint);align-items:baseline;flex-wrap:wrap}
.res-meta b{color:var(--text);font-weight:600;font-size:13.5px}
.res-t{font-size:14px;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--ment-me);color:var(--ment-me-text);border-radius:3px;padding:0 1px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 16px;width:100%}
button.prow:hover{background:var(--hover)}
.prow > div{flex:1;min-width:0}
.prow .pn{font-weight:600;font-size:14px}
.prow .ps{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist{margin:0 -16px}
.sum{padding:16px 18px}
.sum h4{margin:14px 0 6px;font-size:14px;color:var(--accent-text)}
.sum h4:first-child{margin-top:0}
.sum p{margin:0 0 8px;line-height:1.55}
.sum .li{margin-bottom:5px;line-height:1.5}
.sum-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sum-foot .btn{margin-left:auto}

/* ---------- popover / modal / toast ---------- */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:min(340px,calc(100vw - 16px))}
.pop-h{font-size:12px;font-weight:600;color:var(--faint);padding:4px 10px 6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px}
.mi:hover,.mi.sel{background:var(--surface-2)}
.mi.danger{color:var(--urg)}
.mi small{margin-left:auto;color:var(--faint);font-size:12px;padding-left:8px;white-space:nowrap}
.mi .ac-d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi > span{min-width:0}
.egrid{display:grid;grid-template-columns:repeat(8,36px);gap:2px}
.egrid button{font-size:20px;height:36px;border-radius:8px}
.egrid button:hover{background:var(--surface-2)}
.pc{display:grid;justify-items:center;text-align:center;gap:4px;padding:12px 10px 6px;width:260px}
.pc-name{font-weight:700;font-size:16px;margin-top:6px}
.pc-st{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.on-dot{width:8px;height:8px;border-radius:50%;background:var(--online);display:inline-block}
.pc-focus{font-size:12.5px;background:color-mix(in srgb,var(--focus) 14%,transparent);color:var(--text);border-radius:8px;padding:6px 10px;margin-top:4px}
.pc-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(9,14,24,.5);display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px))}
.mdl{width:min(480px,100%);max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.mdl.palette{padding:0;width:min(560px,100%);align-self:start;margin-top:10vh}
.mdl h3{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.mdl h4.sub{margin:18px 0 2px;font-size:14px}
.mdl .lead{margin:0 0 18px;color:var(--muted);font-size:14px}
.fld{display:block;margin-bottom:16px}
.fld > span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld > span small{font-weight:400;color:var(--faint)}
.inp{width:100%;height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);outline:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.opt{margin-bottom:8px}
.mdl-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.mdl-foot .left{margin-right:auto}
.btn{height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.danger{background:var(--urg);border-color:var(--urg);color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent-text)}
.link-btn:hover{text-decoration:underline}
.em-row{display:flex;flex-wrap:wrap;gap:6px}
.em-opt input,.bdg input{position:absolute;opacity:0;pointer-events:none}
.em-opt span{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;cursor:pointer}
.em-opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.em-opt input:focus-visible + span,.bdg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg span{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:500;cursor:pointer;height:100%}
.bdg em{font-style:normal;font-size:18px}
.bdg input:checked + span{border-color:var(--gold);background:var(--gold-soft)}
.st-in{display:flex;gap:8px;margin-bottom:12px}
.em-in{width:56px;flex:none;text-align:center;font-size:18px;padding:0}
.presets{display:grid;gap:2px;margin:0 -8px 16px}
.preset{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;font-size:14px}
.preset:hover{background:var(--surface-2)}
.preset span{font-size:17px;width:24px;text-align:center}
.preset small{margin-left:auto;color:var(--faint);font-size:12.5px}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);margin-bottom:12px;cursor:pointer}
.switch input{accent-color:var(--focus);width:18px;height:18px;margin:2px 0 0;flex:none}
.switch span{display:flex;flex-direction:column;gap:2px}
.switch small{color:var(--muted);font-size:12.5px;line-height:1.45}
.picker{position:relative}
.pick-list{display:grid;gap:2px;margin-top:6px}
.pick,.picked{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;font-size:14px}
.pick:hover{background:var(--surface-2)}
.picked{border:1px solid var(--line);padding:8px 10px}
.picked b{font-weight:600}
.picked .link-btn{margin-left:auto}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--faint)}
.pal-in input{flex:1;height:56px;border:0;outline:0;background:transparent;font-size:16px}
.pal-list{max-height:min(360px,55vh);overflow-y:auto;padding:6px}
.pal-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.pal-foot kbd{margin-right:3px}
.toasts{position:fixed;z-index:90;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--text);color:var(--surface);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease;max-width:100%}
.toast button{font-weight:700;color:var(--accent-soft);padding:4px 8px;border-radius:7px;white-space:nowrap}
.toast button:hover{background:rgba(255,255,255,.12)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95;display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:276px minmax(0,1fr)}
  .panel{position:fixed;right:0;top:0;bottom:0;z-index:40;width:min(420px,100%);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(304px,86vw);z-index:45;transform:translateX(-104%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
  .app.side-open .side{transform:none}
  .app.side-open .side-scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(9,14,24,.45)}
  .menu-btn{display:grid}
  .head{padding:8px 10px;gap:6px;min-height:58px}
  .hb .lbl{display:none}
  .hb{padding:0 9px}
  .msg{grid-template-columns:44px minmax(0,1fr);padding:7px 12px 7px 10px}
  .htime{width:34px}
  .tools{right:8px}
  .composer{padding:0 10px 10px}
  .cmp-hint,.sep,.cb[data-act=fmt]{display:none}
  .send span{display:none}
  .send{padding:0 12px}
  .panel{width:100%}
  .day,.newline{margin-left:12px;margin-right:12px}
  .intro{padding:8px 14px 14px}
  .pinbar{padding:8px 12px}
  .egrid{grid-template-columns:repeat(7,36px)}
}
@media (hover:none){ .rc.add{opacity:1} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== v3: sade düzen ===== */
.app{grid-template-columns:248px minmax(0,1fr)}
.main{position:relative}
.side-scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent;padding-bottom:8px}
.side .chs{flex:none;overflow:visible}
.me-card{cursor:default}
.me-card:hover{background:var(--ink-2)}
.nav .nv{font-size:15px;padding:9px 12px}
.nv .cnt.warn{background:var(--imp)}
.viewwrap,.chatwrap{display:flex;flex-direction:column;min-height:0;height:100%}
.vbody{flex:1;overflow-y:auto;min-height:0;padding:22px 24px 48px}
.wrapc{max-width:860px;margin:0 auto}
.head .btn{flex:none}
.back-btn{display:none}
.greet{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:700}
.greet-s{color:var(--muted);margin:4px 0 22px;font-size:15px}
.sec2{margin-bottom:26px}
.sec2-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sec2-h h2{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.sec2-h .link-btn{margin-left:auto}
.list{display:grid;gap:8px}
.empty-s{color:var(--muted);font-size:14px;margin:4px 0 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.segc{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.segc button{height:36px;padding:0 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.segc button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.14)}
.segc .n{font-size:12px;color:var(--faint)}
.showdone{margin:6px 0 12px}
.big-empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:10px}
.big-empty .ic-w{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;color:var(--faint)}
.big-empty h3{margin:0;color:var(--text);font-size:17px}
.big-empty p{margin:0;max-width:42ch;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap;line-height:1.6}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .4s ease}
.late{color:var(--urg)!important;font-weight:650}
.soon{color:var(--imp)!important;font-weight:650}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 7px}
/* iş satırları */
.it{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer}
.it:hover{border-color:var(--line-strong)}
.it.ap,.it.ann{cursor:default}
.it.inmsg{border-radius:12px;margin-top:6px;max-width:540px}
.inmsg-task{margin-top:6px;max-width:540px}
.it-b{flex:1;min-width:0;display:grid;gap:6px}
.it-t{font-weight:600;font-size:15px;line-height:1.4;overflow-wrap:anywhere;text-align:left}
.lnk2:hover{text-decoration:underline;text-underline-offset:2px}
.it-n{font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.it-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.it-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.it-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;flex:none;margin-top:-1px;transition:all .15s}
.ck:hover:not(:disabled){border-color:#2E8B57;color:#2E8B57}
.it.done .ck{background:#2E8B57;border-color:#2E8B57;color:#fff}
.it.done .it-t{text-decoration:line-through;color:var(--faint)}
.it.ann{background:var(--imp-soft);border-color:color-mix(in srgb,var(--imp) 35%,var(--line))}
.apv{display:flex;gap:6px;flex-wrap:wrap}
.apv-i{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 2px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;background:var(--surface)}

.chatwrap .msgs{background-image:radial-gradient(color-mix(in srgb,var(--text) 5%,transparent) 1px,transparent 1px);background-size:22px 22px}
.msg.b{display:flex;align-items:flex-start;gap:8px;padding:2px 64px 2px 12px;grid-template-columns:none;background:transparent!important;box-shadow:none!important}
.msg.b:not(.cont){margin-top:10px}
.msg.b .gut{width:30px;flex:none;padding:0}
.msg.b.me{flex-direction:row-reverse;padding:2px 14px 2px 64px}
.bw{max-width:min(600px,100%);min-width:0;display:flex;flex-direction:column;align-items:flex-start;transition:transform .15s ease}
.msg.b.me .bw{align-items:flex-end}
.bub{background:var(--bub);border-radius:4px 16px 16px 16px;padding:6px 10px 7px 11px;box-shadow:0 1px 1.5px rgba(15,23,42,.1);position:relative;min-width:90px;max-width:100%}
.bub::after{content:'';display:block;clear:both}
.msg.b.cont .bub{border-radius:16px}
.msg.b.me .bub{background:var(--me);border-radius:16px 4px 16px 16px}
.msg.b.me.cont .bub{border-radius:16px}
.bn{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:650;margin-bottom:2px;flex-wrap:wrap}
.bub .text{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.bub .text.jumbo{font-size:40px;line-height:1.15}
.bt{float:right;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--faint);margin:8px -3px -3px 12px;line-height:1;white-space:nowrap}
.tick{display:inline-flex;color:var(--faint);padding:0;margin-left:1px}
.tick.read{color:var(--tick)}
.msg.b .rx{margin:-6px 8px 0;position:relative;z-index:1;gap:4px}
.msg.b .rc{height:26px;padding:0 8px;box-shadow:0 1px 2px rgba(15,23,42,.12);background:var(--bub);font-size:13px}
.msg.b.ment .bub{box-shadow:inset 3px 0 0 var(--gold),0 1px 1.5px rgba(15,23,42,.1)}
.msg.b.annm .bub{background:var(--imp-soft);border:1px solid color-mix(in srgb,var(--imp) 35%,transparent)}
.msg.b.auto .bub{background:color-mix(in srgb,#B7791F 10%,var(--bub))}
.msg.b.cardm .bub{padding:6px;min-width:280px}
.msg.b.cardm .bt{margin:6px 4px 0 10px}
.msg.b .bub .it.inmsg,.msg.b .bub .inmsg-task,.msg.b .bub .mcard.inmsg{margin-top:2px}
.msg.b .qref{background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:8px;border-left-width:4px;margin:2px 0 6px}
.msg.b .tools{top:-14px;right:20px}
.msg.b.me .tools{right:auto;left:20px}
.msg.b.flash{animation:none}
.msg.b.flash .bub{animation:flash 2s ease}
.msg.b.swiping .bub{box-shadow:0 0 0 2px var(--accent)}
.msg.b .edit{min-width:min(420px,70vw)}
.msg.b.sysm .bub{background:var(--surface-2)}
/* sayfa (Notion tarzı) */
.scrim:has(.mdl.detail){place-items:stretch end;padding:0}
.mdl.detail{width:min(640px,100%);max-height:none;height:100%;border-radius:0;animation:peek .2s ease;box-shadow:-12px 0 40px rgba(15,23,42,.18)}
@keyframes peek{from{transform:translateX(28px);opacity:0}}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.pg{padding:30px 44px 36px;display:grid;gap:18px}
.pg-h{display:grid;gap:8px}
.pg-ic{font-size:46px;line-height:1}
.pg-t{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.pg .dt-title{font-size:26px;letter-spacing:-.02em}
.pg-sub{font-size:14px;color:var(--muted)}
.props{display:grid;gap:2px;margin-top:-4px}
.prop{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:40px;gap:8px}
.pk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.pv{font-size:14px;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pv a{color:var(--accent-text)}
.inp.ghost{border-color:transparent;background:transparent;height:34px;padding:0 8px;margin-left:-8px;width:auto;box-shadow:none}
.inp.ghost:hover:not(:disabled){background:var(--surface-2)}
.inp.ghost:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp.ghost.note{width:calc(100% + 8px);height:auto;padding:8px;resize:vertical;line-height:1.5}
.pg-sec{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.pg-sec h4{margin:0;font-size:13px;font-weight:650;color:var(--muted);display:flex;gap:12px;align-items:center}
.pg-sec h4 .link-btn:first-of-type{margin-left:auto}
.big-btn{height:48px;justify-content:center;font-size:15px}
.sh-h{padding:10px 12px 10px 24px}
/* toplantı */
.mcard{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.mcard.inmsg{max-width:470px}
.mcard.cancel{opacity:.6}
.cal-ic{width:46px;flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line);text-align:center;background:var(--surface);align-self:flex-start}
.cal-ic span{display:block;background:var(--urg);color:#fff;font-size:10px;font-weight:700;padding:2px 0;letter-spacing:.06em}
.cal-ic b{display:block;font-size:20px;padding:3px 0 4px;font-variant-numeric:tabular-nums}
.rsvp{display:flex;gap:6px;flex-wrap:wrap}
.rsvp button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:600;background:var(--surface)}
.rsvp button:hover{border-color:var(--c)}
.rsvp button.on{background:var(--c);border-color:var(--c);color:#fff}
.apv-i.maybe{border-color:color-mix(in srgb,#B7791F 55%,var(--line))} .apv-i.maybe b{color:#B7791F}
.it.mt{border-left:3px solid var(--accent)}
.it.mt.past{opacity:.6}
.it.mt.cancel{border-left-color:var(--urg);opacity:.6}
.mt-time{width:54px;flex:none;display:grid;gap:1px;padding-top:1px}
.mt-time b{font-size:15px;font-variant-numeric:tabular-nums}
.mt-time span{font-size:12px;color:var(--muted)}
.it.mt .join{align-self:center}
.nextm{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:18px;background:var(--accent);color:#fff;margin-bottom:26px;flex-wrap:wrap}
.nm-l{display:grid;gap:3px;min-width:0}
.nm-k{font-size:12.5px;font-weight:700;opacity:.9}
.nextm b{font-size:18px;letter-spacing:-.01em}
.nm-l > span:last-child{font-size:13.5px;opacity:.92}
.nm-a{display:flex;gap:8px}
.nextm .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.nextm .btn.ok{background:#fff;color:var(--accent-text);border-color:#fff}
.chipr input{position:absolute;opacity:0;pointer-events:none}
.chipr span{display:inline-flex;height:34px;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;cursor:pointer}
.chipr input:checked + span{background:var(--text);color:var(--surface);border-color:var(--text)}
.chipr input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
/* ajanda */
.ag-day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;margin-bottom:22px}
.ag-h{display:grid;justify-items:center;align-content:start;gap:2px;padding-top:6px;text-align:center}
.ag-h b{font-size:28px;line-height:1;letter-spacing:-.03em}
.ag-h span{display:block;font-size:12px;font-weight:650;color:var(--accent-text)}
.ag-h small{font-size:11px;color:var(--faint)}
.cchip.mtg{--c:var(--accent);background:var(--accent-soft)}
.cchip b{font-variant-numeric:tabular-nums}
/* ayarlar */
.setbox{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);justify-content:space-between}
.setrow:first-child{border-top:0}
.setrow > div:first-child{display:grid;gap:2px;min-width:0}
.setrow > div:first-child b{font-size:14px;font-weight:600}
.setrow > div:first-child span{font-size:12.5px;color:var(--muted);line-height:1.4}
label.setrow{cursor:pointer}
.inl-r{display:flex;gap:10px;align-items:center}
.subh{margin:20px 0 8px;font-size:13px;color:var(--muted)}
/* e-posta önizleme */
.mailpv{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.mp-head{display:grid;gap:5px;padding:10px 14px;background:var(--surface-2);font-size:13px}
.mp-head div{display:flex;gap:10px}
.mp-head span{width:72px;color:var(--muted);flex:none}
.mp-body{background:#F1F4F7;padding:22px;color:#18212F}
.mp-brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:14px}
.mp-logo{width:28px;height:28px;border-radius:8px;background:#0E8C89;display:grid;place-items:center}
.mp-card{background:#fff;border-radius:12px;padding:20px 22px}
.mp-card h3{margin:0 0 10px;font-size:17px;color:#18212F}
.mp-text{font-size:14px;line-height:1.6}
.mp-cta{display:inline-block;margin-top:16px;background:#0E8C89;color:#fff;font-weight:600;padding:10px 18px;border-radius:9px;font-size:14px}
.mp-att{font-size:12.5px;color:#5B677C;margin:12px 0 0}
.mp-foot{font-size:12px;color:#8792A5;margin:14px 0 0;text-align:center}
.info-q{background:var(--me);border-radius:12px;padding:10px 12px;margin:10px 0 14px;font-size:14px}
/* arama */
.mdl.search{padding:0;width:min(640px,100%);align-self:start;margin-top:8vh;max-height:80vh;display:flex;flex-direction:column}
.sr-in{display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);color:var(--faint)}
.sr-in input{flex:1;height:58px;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.sr-body{overflow-y:auto;padding:6px 8px 14px}
.sr-g h4{margin:12px 8px 4px;font-size:12px;color:var(--faint);font-weight:650}
.sr-i{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border-radius:10px;text-align:left}
.sr-i:hover{background:var(--surface-2)}
.sr-i > div{min-width:0;display:grid}
.sr-i b{font-size:14px;font-weight:600}
.sr-i b small{font-weight:400;color:var(--faint)}
.sr-i span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-ic{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none}
/* hatırlatma kartı */
.toast.remind{align-items:flex-start;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:14px;gap:12px;width:100%}
.toast.remind .r-ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.r-b{display:grid;gap:2px;flex:1;min-width:0}
.r-b > span{font-size:13px;color:var(--muted)}
.r-a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast.remind .btn{color:var(--text);padding:0 12px;font-weight:600}
.toast.remind .btn.pri,.toast.remind .btn.ok{color:#fff}
@media (max-width:760px){
  .msg.b{padding:2px 40px 2px 8px}
  .msg.b.me{padding:2px 10px 2px 40px}
  .msg.b .gut{width:28px}
  .msg.b.cardm .bub{min-width:0;width:100%}
  .bw{max-width:100%}
  .scrim:has(.mdl.detail),.scrim:has(.mdl.search){place-items:stretch}
  .mdl.detail{height:auto;max-height:94vh;border-radius:20px 20px 0 0;align-self:end;animation:none;box-shadow:var(--shadow)}
  .mdl.search{margin-top:0;height:100%;max-height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .pg{padding:20px 18px 24px}
  .prop{grid-template-columns:108px minmax(0,1fr)}
  .pg-ic{font-size:38px}
  .pg-t,.pg .dt-title{font-size:22px}
  .ag-day{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .setrow{flex-wrap:wrap}
  .tabbar button{font-size:10.5px}
}
a.btn{text-decoration:none}
/* ===== v6: kişilik — vardiya sarısı, mürekkep, gün şeridi ===== */
:root{
  --ink:#1C1A2E;--ink-2:#29263F;--ink-3:#3A3658;--side-text:#E7E4F3;--side-dim:#9D99B8;
  --bg:#F3F3F8;--surface:#FFFFFF;--surface-2:#F0EFF6;--hover:#F7F6FB;--line:#E6E4EE;--line-strong:#D0CDDD;
  --text:#1C1A2E;--muted:#5D5973;--faint:#8F8BA6;
  --accent:#FFC83D;--accent-hover:#FFB800;--accent-soft:#FFF3CC;--accent-text:#7A5300;
  --imp:#E07B00;--imp-soft:#FFF1DE;--urg:#E5484D;--urg-soft:#FDECEC;--online:#12B886;
  --grape:#7357FF;--grape-soft:#EEEAFF;--mint:#12B886;--sky:#2F6BFF;
  --chatbg:#EFEEF6;--bub:#FFFFFF;--me:#FFEDB0;--tick:#2F6BFF;
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --shadow:0 18px 40px rgba(28,26,46,.16),0 2px 6px rgba(28,26,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0E0D16;--ink-2:#1B1928;--ink-3:#2A2740;--bg:#13121B;--surface:#1C1A27;--surface-2:#24222F;--hover:#211F2C;--line:#2E2B3C;--line-strong:#3D3A4F;
  --text:#F1EFF8;--muted:#B0ACC4;--faint:#7F7B95;--accent-soft:#3A3115;--accent-text:#FFD56B;--imp-soft:#3A2A14;--urg-soft:#3A1C1F;
  --grape-soft:#2A2350;--chatbg:#121119;--bub:#211F2D;--me:#4A3B10;--tick:#7FA8FF;--accent:#FFC83D;--accent-hover:#FFB800}}
:root[data-theme="dark"]{--ink:#0E0D16;--ink-2:#1B1928;--ink-3:#2A2740;--bg:#13121B;--surface:#1C1A27;--surface-2:#24222F;--hover:#211F2C;--line:#2E2B3C;--line-strong:#3D3A4F;--text:#F1EFF8;--muted:#B0ACC4;--faint:#7F7B95;--accent-soft:#3A3115;--accent-text:#FFD56B;--imp-soft:#3A2A14;--urg-soft:#3A1C1F;--grape-soft:#2A2350;--chatbg:#121119;--bub:#211F2D;--me:#4A3B10;--tick:#7FA8FF;--accent:#FFC83D;--accent-hover:#FFB800}
body{font-family:var(--font);letter-spacing:-.003em}
:focus-visible{outline-color:var(--sky)}
.text a{color:var(--sky)}
/* başlıklar */
.h-title,.ws-name,.greet,.pg-t,.pg .dt-title,.sec2-h h2,.big-empty h3,.mdl h3,.oc-c,.crow .cn,.ch2-t .nm,.it-t,.mcard .it-t,.calbar b,.ag-h b,.cd-n,.nextm b,.clean b{font-family:var(--disp)}
.head{border-bottom:0;background:var(--bg)}
.chatwrap .head{background:var(--surface);border-bottom:1px solid var(--line)}
.head .h-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.chatwrap .head .h-title{font-size:17px}
.h-em{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;background:hsl(var(--h,45) 85% 90%)}
.sec2-h h2{font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.015em}
.sec2{margin-bottom:30px}
/* düğmeler */
.btn{border-radius:999px;font-weight:600}
.btn.pri,.send{background:var(--accent);border-color:var(--accent);color:#1C1A2E}
.btn.pri:hover,.send:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ok{background:var(--mint);border-color:var(--mint)}
.btn.sm{height:34px}
.ib{border-radius:50%}
.link-btn{color:var(--sky)}
.segc{border-radius:999px;padding:4px}
.segc button{border-radius:999px}
.segc button.on{background:var(--ink);color:#fff;box-shadow:none}
:root[data-theme="dark"] .segc button.on{background:var(--accent);color:#1C1A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .segc button.on{background:var(--accent);color:#1C1A2E}}
.chipf.on,.chipr input:checked + span{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{font-weight:650}
.av{border-radius:50%}
.av.sys{border-radius:50%}
/* yan menü */
.side{background:var(--ink)}
.ws{padding:18px 18px 14px}
.ws-name{font-size:21px;font-weight:800;letter-spacing:-.03em}
.logo rect{fill:var(--accent)}
.logo g{stroke:#1C1A2E}.logo circle{fill:#1C1A2E}
.me-card{border-radius:16px}
.nav .nv{border-radius:999px;font-weight:500}
.nav .nv.on{background:var(--accent);color:#1C1A2E;font-weight:650}
.nv .cnt{background:var(--urg)}
.nav .nv.on .cnt{background:#1C1A2E;color:#fff}
.ch2{border-radius:14px}
.ch2 .em{border-radius:50%;background:hsl(var(--h,45) 45% 25%)}
.ch2.on{background:var(--ink-2);box-shadow:inset 3px 0 0 var(--accent)}
.ch2.unread time{color:var(--accent)}
.ch2 .udot{background:var(--accent)}
.ch2 .badge{background:var(--accent);color:#1C1A2E}
.demo-note{border-radius:14px}
/* kahraman alan: gökyüzü + fabrika + gün şeridi */
.hero{border-radius:28px;overflow:hidden;background:var(--surface);margin:2px 0 18px;box-shadow:0 1px 0 var(--line)}
.sky{position:relative;height:210px;overflow:hidden;background:linear-gradient(180deg,var(--s1),var(--s2));--fac:rgba(28,26,46,.13);--win:rgba(255,255,255,.5)}
.hero.ph-dawn{--s1:#FFB98F;--s2:#FFE9B0}
.hero.ph-day{--s1:#9CC3FF;--s2:#E6F0FF}
.hero.ph-dusk{--s1:#9B83F2;--s2:#FFC29E}
.hero.ph-night .sky{--fac:#0D0C1F;--win:#FFC83D}
.hero.ph-night{--s1:#151436;--s2:#3B2F75}
.orb{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#FFC83D;box-shadow:0 0 0 14px rgba(255,200,61,.22),0 0 60px 20px rgba(255,200,61,.45)}
.orb.moon{background:#F3EFFF;box-shadow:inset -14px -6px 0 0 #D8D0FF,0 0 40px 6px rgba(243,239,255,.25)}
.orb.rise{animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(120px) scale(.7);opacity:0}}
.factory{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px}
.factory path{fill:var(--fac)}
.factory .win{fill:transparent}
.hero.ph-night .factory .win.on,.hero.ph-dusk .factory .win.on{fill:var(--win)}
.factory .smoke{fill:var(--fac);opacity:.7}
.hero-t{position:absolute;left:28px;top:24px;right:28px}
.hero-t h1{margin:0;font-family:var(--disp);font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:#1C1A2E}
.hero-t p{margin:8px 0 0;font-size:15.5px;font-weight:500;color:rgba(28,26,46,.78);max-width:46ch}
.hero.ph-night .hero-t h1{color:#fff}
.hero.ph-night .hero-t p{color:rgba(255,255,255,.8)}
.strip{overflow-x:auto;padding:14px 22px 16px;scrollbar-width:thin}
.strip-in{position:relative;height:112px}
.strip .hr{font-style:normal;position:absolute;top:18px;bottom:0;width:1px;background:var(--line)}
.strip .hr.edge{background:transparent}
.strip .hr span{position:absolute;top:-18px;left:0;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.blk{position:absolute;height:32px;border-radius:10px;background:var(--grape-soft);border-left:4px solid var(--grape);font-size:12.5px;font-weight:600;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);text-align:left;line-height:32px;z-index:1}
.blk:hover{filter:brightness(.97)}
.blk b{font-variant-numeric:tabular-nums;color:var(--grape)}
.blk.l0{top:26px}.blk.l1{top:62px}
.blk.past{opacity:.5}
.pinx{position:absolute;bottom:0;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface);border:2.5px solid var(--c);color:var(--text);z-index:1}
.needle{position:absolute;top:14px;bottom:-4px;width:2px;margin-left:-1px;background:var(--urg);z-index:2;pointer-events:none}
.needle::after{content:'';position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--urg)}

  s = s.replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${c}</code>`));

  s = s.replace(/(^|\s)@herkes(?=$|[\s.,!?;:])/gi, (_, p) => p + hold('<span class="mention all">@herkes</span>'));
  s = s.replace(/\bhttps?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s\u0001])+/g, u => { let t = ''; const m = u.match(/[.,;:!?)\]]+$/); if(m){ t = m[0]; u = u.slice(0, -t.length); } return hold(`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`) + t; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^(?:-|•) (.*)$/gm, '<span class="li">$1</span>');
  s = s.replace(/\n/g, '<br>').replace(/<\/span><br>/g, '</span>');
  return s.replace(/\u0001(\d+)\u0002/g, (_, i) => keep[+i]);
}

function liveStore(db){
  const q = {};
  const serial = (k, fn) => { const p = (q[k] || Promise.resolve()).catch(() => {}).then(fn); q[k] = p; return p; };
  const rows = s => s.docs.map(d => Object.assign({id:d.id}, d.data()));
  const build = (coll, o = {}) => { let r = db.collection(coll); if(o.order) r = r.orderBy(o.order[0], o.order[1] || 'asc'); return r.limit(o.limit || 500); };
  return {
    watch(coll, o, cb){ return build(coll, o).onSnapshot(s => cb(rows(s)), e => { if(e && e.code !== 'unavailable') dbErr(e); }); },
    async add(coll, data){ const ref = db.collection(coll).doc(); await serial(ref.path, () => ref.set(data)); return ref.id; },
    set(path, data){ return serial(path, () => db.doc(path).set(data)); },
    update(path, patch){ return serial(path, () => db.doc(path).update(patch)); },
    del(path){ return serial(path, () => db.doc(path).delete()); },
    async get(path){ const s = await db.doc(path).get(); return s.exists ? s.data() : null; },
    acquire(path, o){ return db.doc(path).acquire(o); },
    async list(coll, o){ return rows(await build(coll, o).get()); }
  };
}
function memStore(seed){
  const docs = new Map(Object.entries(seed)), subs = new Set();
  const parent = p => p.split('/').slice(0, -1).join('/');
  const run = (coll, o = {}) => {
    let r = [];
    for(const [p, v] of docs) if(parent(p) === coll) r.push(Object.assign({id:p.split('/').pop()}, clone(v)));
    if(o.order){ const [f, d] = o.order; r.sort((a, b) => ((a[f] || 0) - (b[f] || 0)) * (d === 'desc' ? -1 : 1)); }
    return r.slice(0, o.limit || 500);
  };
  const fire = coll => { for(const s of subs) if(s.coll === coll) s.cb(run(s.coll, s.o)); };
  const api = {
    hooks:[],
    watch(coll, o, cb){ const s = {coll, o:o || {}, cb}; subs.add(s); setTimeout(() => subs.has(s) && cb(run(coll, o)), 0); return () => subs.delete(s); },
    async add(coll, data){ const id = rid(); docs.set(coll + '/' + id, clone(data)); fire(coll); api.hooks.forEach(h => h(coll, id, data)); return id; },
    async set(path, data){ docs.set(path, clone(data)); fire(parent(path)); },
    async update(path, patch){ const d = docs.get(path); if(!d) throw {code:'invalid_argument'}; deepMerge(d, clone(patch)); fire(parent(path)); },
    async del(path){ docs.delete(path); fire(parent(path)); },
    async get(path){ const d = docs.get(path); return d ? clone(d) : null; },
    async acquire(){ return {acquired:true}; },
    async list(coll, o){ return run(coll, o); }
  };
  return api;
}

    }
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch()){ e.preventDefault(); submit(); }
    if(e.key === 'ArrowUp' && !ta.value && ta.id === 'input'){ const last = [...(S.msgs[S.cur] || [])].reverse().find(m => m.by === S.me.id && m.kind === 'msg' && !m.deleted); if(last){ e.preventDefault(); startEdit(last.id); } }
  });
  ta.addEventListener('blur', () => setTimeout(() => { if(AC.ta === ta && document.activeElement !== ta) acClose(); }, 160));
}
async function peopleSearch(q){
  let r = [];
  try{ r = await S.env.search(q); }catch(e){}
  for(const p of r) if(!P[p.id] || !P[p.id].name) P[p.id] = {name:p.name, avatarUrl:p.avatarUrl, color:p.color};
  if(!r.length){ const ql = lower(q); r = Object.entries(P).filter(([id, p]) => p.name && lower(p.name).includes(ql)).map(([id, p]) => ({id, name:p.name})); }
  return r.filter(p => p.name).slice(0, 8);
}
async function acUpdate(ta){
  const pos = ta.selectionStart, m = /(^|\s)@([^\s@]{0,24})$/.exec(ta.value.slice(0, pos)), tok = ++AC.tok;
  if(!m) return acClose();
  let items = await peopleSearch(m[2]);
  if(tok !== AC.tok) return;
  items = items.filter(p => p.id !== S.me.id);
  if(ta.id === 'input' && 'herkes'.startsWith(lower(m[2]))) items.push({id:'__all', name:'herkes'});
  if(!items.length) return acClose();
  Object.assign(AC, {ta, items, sel:0, start:pos - m[2].length - 1});
  drawAc();
}
function drawAc(){
  const el = $('#ac'), r = AC.ta.getBoundingClientRect();
  el.innerHTML = AC.items.map((it, i) => `<button class="mi${i === AC.sel ? ' sel' : ''}" data-i="${i}">${it.id === '__all' ? '<span class="av" style="--s:26px;--c:var(--imp)">@</span><span><b>@herkes</b> <small>kanaldaki herkese bildir</small></span>' : av(it.id, 26, true) + `<span>${esc(it.name)}</span>`}</button>`).join('');
  el.hidden = false;
  el.style.left = Math.max(8, r.left) + 'px'; el.style.width = Math.min(340, r.width) + 'px'; el.style.bottom = (innerHeight - r.top + 8) + 'px';
  $$('.mi', el).forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); acPick(+b.dataset.i); }));
}
function acClose(){ const el = $('#ac'); el.hidden = true; el.innerHTML = ''; }
function acPick(i){
  const it = AC.items[i], ta = AC.ta; if(!it || !ta) return;
  const name = it.id === '__all' ? 'herkes' : it.name; if(it.id !== '__all') S.mentionMap[name] = it.id;
  const pos = ta.selectionStart, ins = '@' + name + ' ';
  ta.value = ta.value.slice(0, AC.start) + ins + ta.value.slice(pos);
  acClose(); ta.focus(); ta.setSelectionRange(AC.start + ins.length, AC.start + ins.length); ta.dispatchEvent(new Event('input'));
}
async function submitMain(){
  const ta = $('#input'), raw = ta.value, text = raw.trim();
  if(!text || !S.cur || !S.canWrite) return;
  ta.value = ''; autosize(ta); acClose(); stopTyping(); delete S.drafts[S.cur]; LS.set('drafts', S.drafts);
  const reply = S.replyTo, ann = S.annMode;
  S.replyTo = null; S.annMode = false; updateComposer();
  try{
    if(ann) await postAnnouncement(text);
    else await send(text, reply ? {replyTo:{id:reply.id, by:reply.by, text:String(reply.text || '').slice(0, 200)}} : {});
  }catch(e){ ta.value = raw; autosize(ta); S.replyTo = reply; S.annMode = ann; updateComposer(); }
}
async function send(text, extra = {}, cid = S.cur){
  const enc = encodeMentions(text || '');
  const ids = [...new Set([...enc.ids, ...(extra.mentions || [])])]; delete extra.mentions;
  const everyone = /(^|\s)@herkes(?=$|[\s.,!?;:])/i.test(text || '');
  const m = Object.assign({by:S.me.id, ts:now(), kind:'msg', text:enc.out, rx:{}}, extra);
  if(ids.length) m.mentions = ids; if(everyone) m.everyone = true;
  S.forceBottom = true;
  let id;
  try{ id = await S.st.add(`channels/${cid}/msgs`, m); }catch(e){ dbErr(e); throw e; }
  const patch = {lastAt:m.ts, lastBy:m.by, lastText:previewOf(m)};
  const others = ids.filter(x => x !== m.by);
  if(others.length){ patch.mentions = {}; others.forEach(x => patch.mentions[sk(x)] = m.ts); }
  if(everyone){ patch.everyone = m.ts; patch.everyoneBy = m.by; }
  save('channels/' + cid, patch);
  return id;
}
async function postAnnouncement(text, cid = S.cur, extra = {}){
  const enc = encodeMentions(text), ts = now(), by = extra.by || S.me.id;
  const aid = await S.st.add('duyurular', {by, ts, text:enc.out, cid, mid:null, ack:{}});
  const mid = await send(text, Object.assign({kind:'ann', ref:aid}, extra), cid);
  save('duyurular/' + aid, {mid});
  save('channels/' + cid, {everyone:ts, everyoneBy:by});
}
async function attachFile(f){
  if(!S.env.assets) return toast('Bu görünümde dosya paylaşımı kullanılamıyor.');
  if(!S.cur || !S.canWrite) return;
  if(f.size > 20 * 1048576) return toast('Dosya 20 MB sınırını aşıyor.');
  const ta = $('#input'), caption = ta.value.trim(), tt = toast(`“${f.name}” yükleniyor…`, {sticky:true});
  try{
    const r = await S.env.assets.upload(f);
    const att = {name:String(f.name || 'dosya').slice(0, 120), type:f.type || r.contentType || '', size:f.size};
    if(S.mode === 'demo') att.url = r.url; else att.id = r.id;
    ta.value = ''; autosize(ta); updateComposer();
    await send(caption, {att});
  }catch(e){ toast('Dosya yüklenemedi. Desteklenen türler: görsel, video, PDF, metin, CSV.'); }
  finally{ dismiss(tt); }
}

function watchChannel(cid){

}
function openChannel(cid){
  if(!cid) return;

    S.cur = cid; S.editing = null; S.replyTo = null; S.annMode = false;

let prefsTimer = 0;
function savePrefsSoon(){ if(!S.st || !S.prefsPath) return; clearTimeout(prefsTimer); prefsTimer = setTimeout(() => S.st.set(S.prefsPath, clone(S.prefs)).catch(e => console.warn(e)), 1200); }
function markRead(){
  if(S.view !== 'chat' || document.hidden) return;
  const cid = S.cur, list = S.msgs[cid], ch = curCh();
  if(!list || !ch) return;
  const latest = Math.max(list.length ? list[list.length - 1].ts : 0, ch.lastAt || 0, (ch.mentions && ch.mentions[sk(S.me.id)]) || 0, ch.everyone || 0);
  if((S.prefs.lastRead[cid] || 0) < latest){ S.prefs.lastRead[cid] = latest; savePrefsSoon(); pushReads(); render('side'); }
}
function notifyChecks(){
  if(!S.ready) return;
  const me = S.me.id;
  const once = (key, fn) => { if(!S.seen[key]){ S.seen[key] = 1; fn(); } };
  for(const c of S.channels){
    if(c.id === S.cur && S.view === 'chat' && !document.hidden) continue;
    const m = c.mentions && c.mentions[sk(me)], lr = S.prefs.lastRead[c.id] || 0;
    if(m && m > lr && m > S.bootTs) once('m' + c.id + m, () => toast(`#${c.name} kanalında senden bahsedildi.`, {action:'Göster', fn:() => openChannel(c.id)}));
  }
  for(const a of S.approvals) if(apMine(a) && (a.createdAt > S.bootTs || (a.last && a.last.ts > S.bootTs))) once('a' + a.id + (a.round || 1), () => toast(`${firstName(a.by)} onayını istiyor: ${a.title}`, {action:'Aç', fn:() => openDetail('approval', a.id)}));
  for(const a of S.approvals) if(a.by === me && a.last && a.last.by !== me && a.last.ts > S.bootTs) once('al' + a.id + a.last.ts, () => toast(`${firstName(a.last.by)} isteğini ${a.last.t}: ${a.title}`));
  for(const t of S.tasks) if(t.to === me && t.by !== me && t.createdAt > S.bootTs) once('t' + t.id, () => toast(`${firstName(t.by)} sana görev verdi: ${t.title}`, {action:'Aç', fn:() => openDetail('task', t.id)}));
  for(const a of S.anns) if(annPending(a) && a.ts > S.bootTs) once('d' + a.id, () => toast(`${firstName(a.by)} bir duyuru yaptı.`, {action:'Oku', fn:() => setView('today')}));
}

function onKey(e){

  if(tg.classList && tg.classList.contains('dt-title') && e.key === 'Enter'){ e.preventDefault(); tg.blur(); return; }
  if(e.defaultPrevented) return;

const busy = {};
async function claim(path){

async function runScheduler(){
  if(!S.ready || !S.canWrite) return;
  for(const z of S.sched){
    if(z.status !== 'bekliyor' || z.sendAt > now() || busy['z' + z.id]) continue;
    busy['z' + z.id] = 1;
    try{
      if(!await claim('zamanli/' + z.id)) continue;
      const cur = await S.st.get('zamanli/' + z.id);
      if(!cur || cur.status !== 'bekliyor' || cur.sendAt > now()) continue;
      if(!S.channels.some(c => c.id === cur.cid)){ await S.st.update('zamanli/' + z.id, {status:'iptal'}); continue; }
      if(cur.repeat && cur.repeat !== 'none') await S.st.update('zamanli/' + z.id, {sendAt:nextTime(cur.sendAt, cur.repeat), lastSent:now()});
      else await S.st.update('zamanli/' + z.id, {status:'gonderildi', sentAt:now()});
      if(cur.ann) await postAnnouncement(cur.text, cur.cid, {by:cur.by, scheduled:true});
      else await send(cur.text, {by:cur.by, scheduled:true}, cur.cid);
    }catch(e){ console.warn('[zamanlayıcı]', e); }
    finally{ delete busy['z' + z.id]; }
  }
}

const P_ = (r, k) => r.params && r.params[k] != null ? r.params[k] : RULES[r.type].p[k][1];
function evalRules(){
  const out = [];
  for(const r of S.rules){
    if(!r.on || !RULES[r.type] || !S.channels.some(c => c.id === r.cid)) continue;
    const since = (r.createdAt || 0) - D;
    if(r.type === 'order_risk') for(const o of S.orders){
      if(o.status === 'sevk' || !o.due || !o.target) continue;
      const dl = dueLabel(o.due), pct = sumQty(o) / o.target * 100;
      if(dl.diff <= +P_(r, 'days') && pct < +P_(r, 'pct')) out.push({r, key:`${r.id}_${o.id}`, text:`⚠️ **#${o.no} ${o.customer}** teslime ${dl.diff < 0 ? (-dl.diff) + ' gün gecikti' : dl.diff === 0 ? 'bugün çıkacak' : dl.diff + ' gün kaldı'} ama üretim %${Math.round(pct)} (${nf(sumQty(o))} / ${nf(o.target)} ${o.unit || 'adet'}).${o.by ? ` <@${o.by}>` : ''}`, ids:[o.by]});
    }
    if(r.type === 'order_ready') for(const o of S.orders){
      if(o.status !== 'hazir' || !o.last || o.last.ts < r.createdAt) continue;
      out.push({r, key:`${r.id}_${o.id}`, text:`✅ **#${o.no} ${o.customer}** hazır: ${nf(sumQty(o))} ${o.unit || 'adet'} tamamlandı, sevke alınabilir.${o.by ? ` <@${o.by}>` : ''}`, ids:[o.by]});
    }
    if(r.type === 'order_new') for(const o of S.orders){
      if((o.createdAt || 0) < r.createdAt) continue;
      out.push({r, key:`${r.id}_${o.id}`, text:`🆕 Yeni sipariş **#${o.no} ${o.customer}**: ${o.product ? o.product + ', ' : ''}${nf(o.target)} ${o.unit || 'adet'}${o.due ? ', teslim ' + fDate.format(o.due) : ''}.`, ids:[]});
    }
    if(r.type === 'prod_word'){
      const words = String(P_(r, 'words')).split(',').map(w => lower(w.trim())).filter(Boolean);
      for(const o of S.orders){ const le = o.lastEntry; if(!le || !le.note || le.ts < r.createdAt) continue; const hit = words.find(w => lower(le.note).includes(w)); if(hit) out.push({r, key:`${r.id}_${o.id}_${le.ts}`, text:`🚨 **#${o.no}** üretim notunda “${hit}”: ${le.note} (${pname(le.by)})${o.by ? ` <@${o.by}>` : ''}`, ids:[o.by]}); }
    }
    if(r.type === 'task_late') for(const t of S.tasks){
      if(t.status === 'done' || !t.due || !t.to || t.due >= now() || t.due < since) continue;
      const dl = dueLabel(t.due); if(dl.c !== 'late') continue;
      out.push({r, key:`${r.id}_${t.id}_${isoDate(t.due)}`, text:`⏰ <@${t.to}> “${t.title}” görevinin süresi geçti${t.by && t.by !== t.to ? ` (veren: ${pname(t.by)})` : ''}.`, ids:[t.to]});
    }
    if(r.type === 'appr_wait') for(const a of S.approvals){
      const st = apState(a), hrs = +P_(r, 'hours'), base = a.last && a.last.t === 'yeniden onaya sundu' ? a.last.ts : a.createdAt;
      if(st.s !== 'wait' || base < since || now() - base < hrs * H) continue;
      const pend = st.ds.filter(x => !x.v).map(x => x.id);
      if(pend.length) out.push({r, key:`${r.id}_${a.id}_${a.round || 1}`, text:`🔔 ${pend.map(u => '<@' + u + '>').join(' ')} “${a.title}” ${hrs} saattir onayınızı bekliyor.`, ids:pend});
    }
    if(r.type === 'ann_unread') for(const a of S.anns){
      const hrs = +P_(r, 'hours');
      if(a.ts < since || now() - a.ts < hrs * H) continue;
      const acks = Object.values(a.ack || {}), pend = knownPeople().filter(u => u !== a.by && !acks.includes(u) && !u.startsWith('__'));
      if(pend.length) out.push({r, key:`${r.id}_${a.id}`, text:`📣 ${pend.map(u => '<@' + u + '>').join(' ')} şu duyuruyu henüz okumadınız: “${plainText(a.text).replace(/\*\*/g, '').slice(0, 120)}”`, ids:pend, cid:a.cid, reply: a.mid ? {id:a.mid, by:a.by, text:a.text.slice(0, 200)} : undefined});
    }
  }
  return out;
}
let rulesRunning = false;
async function runRules(){
  if(!S.ready || !S.canWrite || rulesRunning) return;
  rulesRunning = true;
  try{
    let n = 0;
    for(const f of evalRules()){
      if(n >= 5) break;
      const key = f.key.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 190);
      if(S.fired[key]) continue;
      if(!await claim('tetikler/' + key)){ continue; }
      const ex = await S.st.get('tetikler/' + key);
      S.fired[key] = 1;
      if(ex) continue;
      await S.st.set('tetikler/' + key, {rule:f.r.id, ts:now(), by:S.me.id});
      await send(f.text, {by:'__bot', kind:'auto', rule:f.r.type, mentions:f.ids.filter(Boolean), replyTo:f.reply}, f.cid || f.r.cid);
      n++;
    }
  }catch(e){ console.warn('[uyarılar]', e); }
  finally{ rulesRunning = false; }
}

function parseNum(v){
  if(typeof v === 'number') return v;
  let s = String(v || '').trim().replace(/\s/g, '');
  if(!s) return NaN;
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if(s.includes(',')) s = s.replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return +s;
}
function parseDate(v){
  if(v == null || v === '') return null;
  if(typeof v === 'number' && v > 20000 && v < 80000) return Math.round((v - 25569) * D) + new Date().getTimezoneOffset() * M + 18 * H;
  if(v instanceof Date) return v.getTime();
  const s = String(v).trim();
  let m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(s);
  if(m){ const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1], m[4] ? +m[4] : 18, m[5] ? +m[5] : 0).getTime(); }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s](\d{1,2}):(\d{2}))?/.exec(s);
  if(m) return new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 18, m[5] ? +m[5] : 0).getTime();
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
function parseDelimited(text){
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if(!lines.length) return [];
  const d = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  const rows = [];
  for(const line of lines){
    const out = []; let cur = '', q = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(q){ if(ch === '"'){ if(line[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if(ch === '"') q = true; else if(ch === d){ out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur); rows.push(out.map(x => x.trim()));
  }
  return rows;
}
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => window.XLSX ? res(window.XLSX) : rej(); s.onerror = rej; document.head.appendChild(s); });
}
async function readTableFile(f){
  if(/\.(xlsx|xls)$/i.test(f.name)){
    const X = await loadXLSX(), wb = X.read(await f.arrayBuffer(), {type:'array', cellDates:true});
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}).filter(r => r.some(c => String(c).trim() !== ''));
  }
  let txt = await f.text();
  if(txt.includes('\uFFFD')){ try{ txt = new TextDecoder('windows-1254').decode(await f.arrayBuffer()); }catch(e){} }
  return parseDelimited(txt);
}

async function importOrders(data){
  let add = 0, upd = 0, skip = 0;
  for(const r of data){
    const no = String(r.no || '').trim().replace(/^#/, ''), target = parseNum(r.target);
    if(!no || !r.customer || !(target > 0)){ skip++; continue; }
    const rec = {no, customer:String(r.customer).trim(), product:String(r.product || '').trim(), target, unit:String(r.unit || '').trim() || 'adet', due:parseDate(r.due)};
    const ex = S.orders.find(o => String(o.no) === no);
    if(ex){ await S.st.update('orders/' + ex.id, Object.assign(rec, {last:L('ERP’den güncellendi')})); upd++; }
    else { await S.st.add('orders', Object.assign(rec, {status:'sirada', qty:{}, by:S.me.id, createdAt:now(), source:'erp', last:L('ERP’den aktarıldı')})); add++; }
  }
  return `${add} yeni sipariş, ${upd} güncelleme${skip ? `, ${skip} satır atlandı (eksik bilgi)` : ''}.`;
}
function hashKey(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'imp' + (h >>> 0).toString(36); }
async function importProd(data){
  let ok = 0, miss = 0, bad = 0; const touched = {};
  for(const r of data){
    const no = String(r.no || '').trim().replace(/^#/, ''), qty = parseNum(r.qty);
    if(!no || !qty){ bad++; continue; }
    const o = S.orders.find(x => String(x.no) === no);
    if(!o){ miss++; continue; }
    const ts = parseDate(r.date) || now(), note = String(r.note || '').trim();
    const key = hashKey([no, qty, ts, note].join('|'));
    await S.st.set(`orders/${o.id}/giris/${key}`, {qty, note: note || 'MES aktarımı', by:S.me.id, ts, source:'mes'});
    (touched[o.id] = touched[o.id] || {})[key] = qty;
    ok++;
  }
  for(const [id, imp] of Object.entries(touched)){
    const o = byId(S.orders, id), total = sumQty(o) + Object.entries(imp).filter(([k]) => !(o.imp && o.imp[k] != null)).reduce((a, [, v]) => a + v, 0);
    const patch = {imp, last:L('MES’ten üretim aktardı')};
    if(o.status === 'sirada') patch.status = 'uretimde';
    if(total >= (+o.target || Infinity) && o.status !== 'sevk') patch.status = 'hazir';
    await S.st.update('orders/' + id, patch);
  }
  return `${ok} üretim satırı aktarıldı${miss ? `, ${miss} satırın siparişi bulunamadı` : ''}${bad ? `, ${bad} satır okunamadı` : ''}.`;
}
function csvOf(head, rows){ const q = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return '\uFEFF' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n'); }
async function download(name, text){
  if(S.env.downloads){ try{ const r = await S.env.downloads.save({filename:name, data:new Blob([text], {type:'text/csv;charset=utf-8'})}); if(r && r.status === 'saved') toast('İndirildi: ' + name); }catch(e){ if(e && e.code !== 'declined') toast('İndirilemedi.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
