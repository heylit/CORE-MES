<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO 9001 Denetim Hazırlığı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: denetim kokpiti — koyu kenar menü + açık çalışma alanı; her görünüm bir "masa": üstte özet, altta etkileşimli araç */
:root{
  --c-iso:#0E8C8E; --c-as:#4B4FD6; --c-ey:#A3308F; --c-iso-soft:#DDF2F1; --c-as-soft:#E6E7FB; --c-ey-soft:#F6E3F2; --on-pc:#FFFFFF; --c-firm:#3E4C63; --c-firm-soft:#E7EBF1;
  --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F1F4F8; --ink:#0D1726; --ink-2:#4A5568; --ink-3:#8793A5; --line:#E2E7EE;
  --side:#0C1A2E; --side-2:#132640; --side-ink:#AFBED2; --side-hi:#FFFFFF;
  --accent:#0E8C8E; --accent-ink:#FFFFFF; --accent-soft:#DDF2F1; --amber:#D9900A; --amber-soft:#FCF0D6;
  --good:#1D9A57; --good-soft:#DDF3E6; --warn:#D48A06; --warn-soft:#FBEFD5; --bad:#D2433F; --bad-soft:#FADFDD; --obs:#3576D0; --obs-soft:#E0EBFA;
  --shadow:0 1px 2px rgba(13,23,38,.05),0 4px 16px rgba(13,23,38,.06);
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-iso:#2DB9B8; --c-as:#9A9DFF; --c-ey:#E68AD8; --c-iso-soft:#0F2E33; --c-as-soft:#1D2048; --c-ey-soft:#3A1733; --on-pc:#0B0F1A; --c-firm:#A9B6CC; --c-firm-soft:#1C2636;
  --bg:#0A111D; --panel:#101A2A; --panel-2:#162236; --ink:#E7EDF5; --ink-2:#A9B6C8; --ink-3:#6E7C91; --line:#213049;
  --side:#060C17; --side-2:#0F1B2E; --side-ink:#8E9DB3; --side-hi:#FFFFFF;
  --accent:#2DB9B8; --accent-ink:#04161A; --accent-soft:#0F2E33; --amber:#F2B64A; --amber-soft:#35290F;
  --good:#3CC57F; --good-soft:#113222; --warn:#F0B52E; --warn-soft:#352810; --bad:#F2716C; --bad-soft:#3A1A1A; --obs:#6BA5F2; --obs-soft:#15263F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --c-iso:#2DB9B8; --c-as:#9A9DFF; --c-ey:#E68AD8; --c-iso-soft:#0F2E33; --c-as-soft:#1D2048; --c-ey-soft:#3A1733; --on-pc:#0B0F1A; --c-firm:#A9B6CC; --c-firm-soft:#1C2636;
  --bg:#0A111D; --panel:#101A2A; --panel-2:#162236; --ink:#E7EDF5; --ink-2:#A9B6C8; --ink-3:#6E7C91; --line:#213049;
  --side:#060C17; --side-2:#0F1B2E; --side-ink:#8E9DB3; --side-hi:#FFFFFF;
  --accent:#2DB9B8; --accent-ink:#04161A; --accent-soft:#0F2E33; --amber:#F2B64A; --amber-soft:#35290F;
  --good:#3CC57F; --good-soft:#113222; --warn:#F0B52E; --warn-soft:#352810; --bad:#F2716C; --bad-soft:#3A1A1A; --obs:#6BA5F2; --obs-soft:#15263F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.clause{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:22px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--accent),#0A5F73);display:grid;place-items:center;color:#fff}
.brand .logo .ic{width:21px;height:21px}
.brand b{display:block;color:var(--side-hi);font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--side-ink)}
.nav{display:grid;gap:3px}
.nav button{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--side-ink);transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:var(--side-2);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-2);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav button .badge{margin-left:auto;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--side-hi)}
.nav button .badge.hot{background:var(--bad);color:#fff}
.side .mini{margin-top:auto;background:var(--side-2);border-radius:12px;padding:14px;display:grid;gap:10px}
.side .mini .row{display:flex;justify-content:space-between;align-items:baseline}
.side .mini b{color:var(--side-hi);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.side .mini .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.side .mini .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.side .mini small{font-size:11.5px;line-height:1.4}

main{min-width:0;padding:28px 32px 72px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.topbar h1{font-size:clamp(22px,3vw,28px);font-weight:800}
.topbar p{color:var(--ink-2);margin-top:4px;max-width:64ch}
.chip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.chip .ic{width:15px;height:15px;color:var(--accent)}
.chip.warnc .ic{color:var(--bad)}

.view{display:grid;gap:20px;animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700;display:flex;gap:9px;align-items:center}
.card-h h3 .ic{color:var(--accent)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g4{grid-template-columns:1fr}}
.kpi > div{min-width:0}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}

.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--panel);transition:transform .1s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;pointer-events:none}
.seg{display:inline-flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.seg button .ic{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:inline-flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .tr{background:var(--accent)}
.switch input:checked + .tr::after{transform:translateX(16px)}
.switch input:focus-visible + .tr{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;background:
  radial-gradient(120% 140% at 100% 0%,var(--accent-soft) 0%,transparent 55%),var(--panel)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(22px,3.2vw,30px);font-weight:800;margin-top:6px}
.hero p{color:var(--ink-2);margin-top:8px;max-width:58ch}
.datebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--panel-2)}
.datebox label{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.datebox label .ic{color:var(--accent)}
.datebox input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13.5px}
.days{display:flex;gap:6px;align-items:baseline}
.days b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.hero .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.gauge{width:100%;max-width:276px;justify-self:center}
.gauge text{font-family:var(--ui)}
.g-track{stroke:var(--panel-2)}
.g-val{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}

.kpi{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;width:100%}
.kpi:hover{transform:translateY(-2px);border-color:var(--accent)}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.kpi .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.kpi .sub{font-size:12px;color:var(--ink-3)}
.ring text{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink)}
.ring .rt{stroke:var(--panel-2)}
.ring .rv{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.riskdots{display:flex;gap:10px;margin-top:4px}
.riskdots span{display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bg-bad{background:var(--bad)}.bg-warn{background:var(--warn)}.bg-obs{background:var(--obs)}.bg-good{background:var(--good)}.bg-na{background:var(--line)}

.radar text{font-family:var(--ui);font-size:11.5px;fill:var(--ink-2);font-weight:600}
.radar .grid{stroke:var(--line);fill:none}
.radar .axis{stroke:var(--line)}
.radar .area{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .target{fill:none;stroke:var(--amber);stroke-width:1.5;stroke-dasharray:4 4}
.radar .pt{fill:var(--accent);stroke:var(--panel);stroke-width:2;cursor:pointer}
.radar .tick{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3);font-weight:400}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .sw{width:14px;height:3px;border-radius:2px;background:var(--accent)}
.legend .sw.dash{background:repeating-linear-gradient(90deg,var(--amber) 0 4px,transparent 4px 7px)}

.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--panel-2);text-align:left;width:100%;transition:background .15s}
.step:hover{background:var(--accent-soft)}
.step .si{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel);color:var(--accent)}
.step.risk .si{color:var(--bad)}
.step .st{font-weight:600;font-size:13.5px;line-height:1.35}
.step .ss{font-size:12px;color:var(--ink-3);margin-top:2px}
.step > .ic{color:var(--ink-3)}

.phasebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.phasebar{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pb{padding:12px;border-radius:11px;background:var(--panel-2);display:grid;gap:8px;text-align:left;position:relative;border:1.5px solid transparent;transition:border-color .15s}
.pb:hover{border-color:var(--line)}
.pb.now{border-color:var(--accent);background:var(--accent-soft)}
.pb.now::before{content:"Şu an";position:absolute;top:-9px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.pb b{font-size:14px;font-weight:700}
.pb small{font-size:11.5px;color:var(--ink-3)}
.pb .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pb .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.pb.sel{box-shadow:0 0 0 2px var(--ink) inset}

/* ---------- rehber ---------- */
.journey{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:0;position:relative}
.journey::before{content:"";position:absolute;left:calc(50% / var(--n,4));right:calc(50% / var(--n,4));top:26px;height:2px;background:var(--line)}
.jn{display:grid;justify-items:center;gap:8px;text-align:center;padding:0 6px;position:relative}
.jn .jc{width:54px;height:54px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;color:var(--ink-2);transition:all .2s;position:relative;z-index:1}
.jn .jc .ic{width:22px;height:22px}
.jn b{font-size:13.5px;font-weight:700}
.jn small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.jn[aria-pressed="true"] .jc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08);box-shadow:0 0 0 6px var(--accent-soft)}
.jdetail{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:16px;border-radius:12px;background:var(--panel-2)}
@media (max-width:700px){.jdetail{grid-template-columns:1fr}.journey{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.journey::before{display:none}}
.jdetail ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.jdetail li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.jdetail li .ic{width:16px;height:16px;color:var(--accent);margin-top:2px}
.tipbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--amber-soft);font-size:13.5px}
.tipbox .ic{color:var(--amber);margin-top:1px}

.wheelwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:860px){.wheelwrap{grid-template-columns:1fr;justify-items:center}}
.wheel{width:100%;max-width:340px}
.wheel .seg{cursor:pointer;transition:opacity .2s}
.wheel .seg path{stroke:var(--panel);stroke-width:3;transition:transform .2s}
.wheel .seg:hover path{opacity:.85}
.wheel text{font-family:var(--ui);pointer-events:none}
.wheel .lbl-n{font-family:var(--mono);font-size:17px;font-weight:600}
.wdetail{display:grid;gap:14px;width:100%}
.wdetail .hd{display:flex;gap:12px;align-items:center}
.wdetail .big{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.wdetail .big .ic{width:24px;height:24px}
.wdetail h3{font-size:20px;font-weight:800}
.wcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.wcols{grid-template-columns:1fr}}
.wcols ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.wcols li{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.wcols li .ic{width:16px;height:16px;margin-top:2px}
.wcols .ok .ic{color:var(--good)}.wcols .no .ic{color:var(--bad)}
.phase-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.phase-legend span{display:inline-flex;gap:6px;align-items:center}
.phase-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.sev{display:grid;gap:12px;align-content:start}
.sev .top{display:flex;justify-content:space-between;align-items:center}
.sev h4{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}
.meter{display:flex;gap:3px}
.meter i{width:8px;height:18px;border-radius:2px;background:var(--line)}
.sev.major .meter i:nth-child(-n+3){background:var(--bad)}
.sev.minor .meter i:nth-child(-n+2){background:var(--warn)}
.sev.obs .meter i:nth-child(-n+1){background:var(--obs)}
.sev.major{border-top:3px solid var(--bad)}.sev.minor{border-top:3px solid var(--warn)}.sev.obs{border-top:3px solid var(--obs)}
.sev ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.sev .cons{font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--panel-2)}

.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--panel);min-width:0;flex:1 1 200px;max-width:320px}
.search .ic{color:var(--ink-3);width:16px;height:16px}
.search input{border:0;outline:0;background:none;width:100%;font-size:13.5px}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:700px){.docs{grid-template-columns:1fr}}
.doc{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:background .15s,border-color .15s}
.doc:hover{background:var(--panel-2)}
.doc input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.doc.on{border-color:var(--good);background:var(--good-soft)}
.doc .dt{font-size:13px;line-height:1.35}
.doc .ty{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}

.tl{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;padding-top:30px}
.tl::before{content:"";position:absolute;left:0;right:0;top:36px;height:2px;background:var(--line)}
.tl .ev{display:grid;gap:4px;position:relative;padding-top:18px}

/* =====================================================================

:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --panel-2:#F3F4F6; --ink:#111827; --ink-2:#4B5563; --ink-3:#9CA3AF; --line:#E5E7EB; --line-2:#EEF0F3;
  --brand:#3550D6; --brand-soft:#EEF1FD; --brand-ink:#FFFFFF;
  --side:#FBFBFC; --side-2:#F1F2F5; --side-ink:#4B5563; --side-hi:#111827;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1017; --panel:#121823; --panel-2:#171F2C; --ink:#E8ECF2; --ink-2:#A3ADBD; --ink-3:#6B7586; --line:#232C3A; --line-2:#1C2431;
  --brand:#8DA0FF; --brand-soft:#1B2340; --brand-ink:#0C1017;
  --side:#0F141D; --side-2:#18202C; --side-ink:#A3ADBD; --side-hi:#F2F5F9;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#0C1017; --panel:#121823; --panel-2:#171F2C; --ink:#E8ECF2; --ink-2:#A3ADBD; --ink-3:#6B7586; --line:#232C3A; --line-2:#1C2431;
  --brand:#8DA0FF; --brand-soft:#1B2340; --brand-ink:#0C1017;
  --side:#0F141D; --side-2:#18202C; --side-ink:#A3ADBD; --side-hi:#F2F5F9}
:root[data-pg]{--accent:var(--brand);--accent-soft:var(--brand-soft);--accent-ink:var(--brand-ink)}

function ncVerdict(t){ /* ISO 9001 ve AS9100 için bulgu tabanlı karar */
  return function(pct,ci){
    if(ci.major>0) return {k:"bad",t:"Hazır değil",d:t.bad};
    if(pct>=85&&ci.minor<=2) return {k:"ok",t:"Denetime hazır",d:t.ok};
    if(pct>=70) return {k:"warn",t:"Kısmen hazır",d:t.warn};
    return {k:"bad",t:"Riskli",d:t.risk};
  };
}

/* ================= SCORING (pure) ================= */
function activeQs(def){return Q.filter(function(x){return def||!x.d;});}
function computeScore(qs,ans,prog){
  var num=0,den=0,dnum=0,dden=0,answered=0,na=0,groups={},risks=[],good=0,ci={major:0,minor:0};
  qs.forEach(function(x){
    var g=groups[x.g]||(groups[x.g]={num:0,den:0,n:0,a:0});
    g.n++;
    var a=ans[x.id]; if(a===undefined) return;
    answered++; g.a++;
    if(a==="na"){na++;return;}
    var v=Number(a); if(x.g==="S"){dnum+=v*x.w;dden+=3*x.w;}else{num+=v*x.w;den+=3*x.w;} g.num+=v*x.w; g.den+=3*x.w;
    var lvl=null;
    if(v===0&&x.w===3) lvl="major"; else if(v<=1) lvl="minor"; else if(v===2) lvl="obs"; else good++;
    if(lvl){risks.push({q:x,v:v,lvl:lvl}); if(x.g!=="S"&&ci[lvl]!==undefined) ci[lvl]++;}
  });
  var ord={major:0,minor:1,obs:2};
  risks.sort(function(a,b){return ord[a.lvl]-ord[b.lvl]||b.q.w-a.q.w||a.v-b.v;});
  var pct=den?Math.round(num/den*100):null;
  var c={major:0,minor:0,obs:0}; risks.forEach(function(r){c[r.lvl]++;});
  var v=null;
  if(pct!==null) v=(prog||PG).verdict(pct,ci,c);
  return {pct:pct,defPct:dden?Math.round(dnum/dden*100):null,isoMajor:ci.major,isoMinor:ci.minor,answered:answered,na:na,total:qs.length,groups:groups,risks:risks,major:c.major,minor:c.minor,obs:c.obs,good:good,verdict:v};
}
function groupPct(G){return G&&G.den?Math.round(G.num/G.den*100):null;}
function suggestScore(arr){if(!arr||!arr.length) return null; var k=arr.filter(Boolean).length,n=arr.length; if(k===0) return "0"; if(k===n) return "3"; return k/n<0.5?"1":"2";}

function importBackup(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result),arr=[];
      if(j&&Array.isArray(j.profiller)) arr=j.profiller;
      else if(j&&Array.isArray(j.order)&&j.data) arr=j.order.map(function(id){return j.data[id];});
      else if(j&&typeof j==="object"&&(j.pw||j.ans||j.checks)) arr=[j];
      arr=arr.filter(function(x){return x&&typeof x==="object";});
      if(!arr.length) throw 0;
      var replaceBlank=store.order.length===1&&isEmptyProfile(state),names=replaceBlank?[]:store.order.map(function(id){return profName(store.data[id]);}),first=null;
      if(replaceBlank){delete store.data[store.active];store.order=[];}
      arr.forEach(function(x){var ns=fill(x);ns.view="profil";if(ns.profile.firma&&names.indexOf(ns.profile.firma)>=0) ns.profile.firma+=" (yedekten)";names.push(ns.profile.firma);var id=uid();store.data[id]=ns;store.order.push(id);if(!first) first=id;});
      if(replaceBlank){store.active=first;state=store.data[first];applyProg();}
      save(); render(); toast(arr.length+" profil yedekten yüklendi");
    }catch(e){toast("Bu dosya geçerli bir yedek değil");}
  };
  rd.onerror=function(){toast("Dosya okunamadı");};
  rd.readAsText(file);
}

function perfMatrix(ev){

function perKey(f,d){var s_=perStart(f,d||todayISO());if(f==="h") return "W"+s_;if(f==="a") return s_.slice(0,7);if(f==="c") return s_.slice(0,4)+"-Q"+(Math.floor((+s_.slice(5,7)-1)/3)+1);if(f==="y") return s_.slice(0,4);return s_;}
function perList(f,n){var out=[],d=todayISO(),i=0;
  if(f==="g"){while(out.length<n&&i<60){var dd=addDays(d,-i),wd=new Date(dd+"T00:00:00").getDay();if(wd!==0&&wd!==6) out.push({k:perKey("g",dd),s:dd});i++;}return out;}
  var st=perStart(f,d);for(i=0;i<n;i++){var s2=f==="h"?addDays(st,-7*i):f==="a"?addMonths(st,-i):f==="c"?addMonths(st,-3*i):addMonths(st,-12*i);out.push({k:perKey(f,s2),s:s2});}return out;}

  if(f==="h") return wkRange(s_);if(f==="a") return new Date(s_+"T00:00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"});

  ["uyg","Uygulama","1. Süreç sahipleri, bağlam analizi ve ilgili taraf listesini girdi olarak kullanarak süreçlerindeki riskleri ve fırsatları belirler.\n2. Her risk için olasılık (1–5) ve etki (1–5) puanlanır; risk puanı = olasılık × etki.\n3. Risk puanı 12 ve üzeri olan riskler için önlem zorunludur; 6–11 arası riskler için önlem değerlendirilir; 5 ve altı izlenir.\n4. Önlem, sorumlu ve termin risk tablosuna yazılır. Fırsatlar için fayda ve uygulanabilirlik değerlendirilir.\n5. Önlem tamamlandığında risk yeniden puanlanır; önlemin etkinliği kaydedilir.\n6. Risk tablosu yılda en az bir kez ve süreç, ürün, organizasyon veya tedarik zincirinde önemli bir değişiklik olduğunda gözden geçirilir.\n7. Sonuçlar yönetimin gözden geçirmesine girdi olarak sunulur."],

 ]),

  ["kayit","Kayıtlar","| Kayıt | Sorumlu | Saklama |\n| Yetkinlik matrisi | Birim yöneticileri | Güncel |\n| Yıllık eğitim planı | İK / {kys} | 3 yıl |\n| Eğitim katılım formu ({ref:f_egitim}) | İK | Çalışan firmada olduğu sürece + 2 yıl |\n| Eğitim etkinlik değerlendirmesi | Birim yöneticileri | Çalışan firmada olduğu sürece + 2 yıl |"]
 ]),

  ["amac","Amaç","Ürün uygunluğunu doğrulamak için kullanılan ölçüm cihazlarının uygun, kalibre ve güvenilir olmasını sağlamak."],

  ["sorum","Sorumluluklar","- **Kalibrasyon sorumlusu:** Cihaz listesini ve kalibrasyon planını tutmak, dış kalibrasyonu organize etmek, sertifikaları değerlendirmek.\n- **Kullanıcılar:** Cihazın kalibrasyon etiketini kullanmadan önce kontrol etmek, hasarlı cihazı bildirmek.\n- **Kalite:** Uygun çıkmayan cihaz için geriye dönük etki değerlendirmesini yapmak."],

  ["kayit","Kayıtlar","| Kayıt | Sorumlu | Saklama |\n| Ölçüm cihazları ve kalibrasyon takip listesi | Kalibrasyon sorumlusu | Güncel |\n| Kalibrasyon sertifikaları | Kalibrasyon sorumlusu | Cihaz kullanımda olduğu sürece + 2 yıl |\n| Geriye dönük etki değerlendirmesi | Kalite | 5 yıl |"]
 ]),

  var csv="\ufeff"+rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(";");}).join("\r\n");
  download(safeName("kalibrasyon-listesi-"+(state.profile.firma||"firma"))+".csv",csv,"text/csv");toast("Kalibrasyon listesi indirildi");}
function kIcs(){var t=todayISO(),now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),firma=state.profile.firma,L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Denetim Hazirlik//TR","CALSCALE:GREGORIAN","METHOD:PUBLISH"],n=0;
  KL().devs.forEach(function(d){if(d.st!=="aktif") return;var nx=kNext(d);if(!nx) return;var day=nx<t?t:nx;n++;var title="Kalibrasyon: "+d.no+" "+d.ad+(firma?" · "+firma:"");
    L.push("BEGIN:VEVENT","UID:kal-"+store.active+"-"+d.id+"@denetim-hazirlik","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+day.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(day,1).replace(/-/g,""),"SUMMARY:"+icsEsc(title),
      "DESCRIPTION:"+icsEsc([d.yer?"Yer: "+d.yer:"",d.sorumlu?"Sorumlu: "+d.sorumlu:"",d.lab?"Kalibrasyonu yapan: "+d.lab:"",d.last?"Son kalibrasyon: "+fmtDate(d.last):"",nx<t?"GECİKMİŞ (planlanan: "+fmtDate(nx)+")":""].filter(Boolean).join("\n")),"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P14D","DESCRIPTION:"+icsEsc(title),"END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D","DESCRIPTION:"+icsEsc(title),"END:VALARM","END:VEVENT");});
  L.push("END:VCALENDAR");if(!n){toast("Takvime eklenecek kalibrasyon tarihi yok");return;}
  download(safeName("kalibrasyon-takvimi-"+(firma||"firma"))+".ics",L.map(icsFold).join("\r\n")+"\r\n","text/calendar");toast(n+" cihazın kalibrasyon tarihi takvim dosyasına eklendi (14 ve 1 gün önce hatırlatma)");}
function kalTable(){var D=KL().devs.slice().filter(function(d){return d.st!=="hurda";}).sort(function(a,b){return a.no<b.no?-1:1;});
  if(!D.length) return "| Cihaz no | Cihaz adı / tip | Ölçüm aralığı | Çözünürlük | Yeri | Periyot | Son kalibrasyon | Sonraki | Sonuç |\n"+new Array(11).join("| | | | | | | | | |\n").trim();
  return tblRows(["Cihaz no","Cihaz adı / tip","Ölçüm aralığı","Çözünürlük","Yeri","Periyot","Son kalibrasyon","Sonraki","Durum"],D.map(function(d){var st=kStat(d),n=kNext(d);return [d.no,d.ad+(d.marka?" ("+d.marka+")":""),d.aralik,d.coz,d.yer,d.per+" ay",d.last?fmtDate(d.last):"",n?fmtDate(n):"",st.k==="pasif"?KDUR[d.st]:(d.res?KSON[d.res]+" · ":"")+st.t];}));}
function kalAct(d,t){var K=KL();
  if(d.kview){K.view=d.kview;save();render();return true;}
  if(d.kfilter){K.filter=K.filter===d.kfilter&&d.kfilter!=="all"?"all":d.kfilter;if(K.view==="takvim"&&K.filter!=="all") K.view="tablo";save();render();return true;}
  if(d.kmon){K.month=d.kmon;save();render();return true;}
  if(d.knew){kform={id:"k"+uid(),no:kNextNo(),ad:"",marka:"",seri:"",aralik:"",coz:"",yer:"",sorumlu:"",lab:"",cert:"",kabul:"",note:"",tur:"dis",st:"aktif",res:"",per:12,last:"",nx:""};krec=null;kimp=false;armed=null;render();jump("kform");var fa=$("kf-ad");if(fa) fa.focus();return true;}
  if(d.kedit){var x=K.devs.filter(function(q){return q.id===d.kedit;})[0];if(x){kform=JSON.parse(JSON.stringify(x));delete kform.hist;krec=null;kimp=false;armed=null;render();jump("kform");}return true;}
  if(d.kcancel){kform=null;armed=null;render();return true;}
  if(d.ksave&&kform){if(!String(kform.ad||"").trim()){toast("Cihaz adını girin");var fa2=$("kf-ad");if(fa2) fa2.focus();return true;}
    var no=String(kform.no||"").trim()||kNextNo();if(K.devs.some(function(q){return q.no===no&&q.id!==kform.id;})){toast("Bu cihaz numarası zaten kullanılıyor");return true;}
    kform.no=no;snap("Cihaz kaydı");var ex=K.devs.filter(function(q){return q.id===kform.id;})[0],src=JSON.parse(JSON.stringify(kform));src.hist=ex?ex.hist:[];
    var nv=normKal({devs:[src]}).devs[0];if(ex) K.devs[K.devs.indexOf(ex)]=nv; else K.devs.push(nv);kform=null;save();render();toastU(no+" kaydedildi");return true;}
  if(d.kdel){armed="kdel";render();return true;}
  if(d.kdelno){armed=null;render();return true;}
  if(d.kdelyes&&kform){snap("Cihaz silme");var id=kform.id;K.devs=K.devs.filter(function(q){return q.id!==id;});kform=null;armed=null;save();render();toastU("Cihaz silindi");return true;}
  if(d.krec){var dv=K.devs.filter(function(q){return q.id===d.krec;})[0];if(dv){krec={id:dv.id,date:todayISO(),res:"uygun",lab:dv.lab||"",cert:"",note:""};kform=null;kimp=false;render();jump("krec");}return true;}
  if(d.krcancel){krec=null;render();return true;}
  if(d.krsave&&krec){var dv2=K.devs.filter(function(q){return q.id===krec.id;})[0];if(!dv2||!/^\d{4}-\d{2}-\d{2}$/.test(krec.date)){toast("Kalibrasyon tarihini girin");return true;}
    snap("Kalibrasyon kaydı");dv2.hist.unshift({date:krec.date,res:krec.res,lab:krec.lab,cert:krec.cert,note:krec.note});dv2.hist.sort(function(a,b){return a.date<b.date?1:-1;});
    var newest=dv2.hist[0];dv2.last=newest.date;dv2.res=newest.res;dv2.nx="";if(krec.lab) dv2.lab=krec.lab;if(krec.cert) dv2.cert=krec.cert;
    if(krec.res==="red"){dv2.st="disi";kwarn=dv2.id;}
    var msg=krec.res==="red"?dv2.no+" kullanım dışına alındı":dv2.no+" kaydedildi; sonraki: "+fmtDate(kNext(dv2));krec=null;save();render();window.scrollTo({top:0});toastU(msg);return true;}
  if(d.kwarnx){kwarn=null;render();return true;}
  if(d.kdof){kwarn=null;state.kys.tab="uret";docOpen="f_dof";go("kys");return true;}
  if(d.kimp){kimp=true;kform=null;krec=null;render();jump("kimp");var ta=$("kimpta");if(ta) ta.focus();return true;}
  if(d.kimpno){kimp=false;render();return true;}
  if(d.kimpok){var ta2=$("kimpta"),r=kImport(ta2?ta2.value:"");kimp=false;save();render();toastU(r.add+" cihaz eklendi, "+r.upd+" güncellendi");return true;}
  if(d.kcsv2){kCsv();return true;}
  if(d.kics2){kIcs();return true;}
  if(d.kprint){printDocs(["f_kal"]);return true;}
  return false;}

function quickRound(){

  pool.sort(function(a,b){return b.k-a.k;});

  pick.sort(function(a,b){return Q.indexOf(a)-Q.indexOf(b);});

}
