function bagliOpDegisti(el, id, f){
  const d = opdef(id); if (!d) return;
  const g = {id:Number(d.id)}, eski = {proc:d.proc, chg:d.chg};
  if (f === "abbr") g.kisaltma = String(el.value).toLocaleUpperCase("tr-TR").trim().slice(0, 6) || null;
  else if (f === "code") g.kod = el.value.trim();
  else if (f === "name") g.ad = el.value.trim();
  else if (f === "bStationId") g.varsayilanIstasyonId = el.value === "" ? null : Number(el.value);
  else if (f === "setup" || f === "proc" || f === "chg") {
    const x = sureGirisi(el.value, f === "setup" ? "hazirlik" : f === "proc" ? "islem" : "degisim");
    if (!x.ok) { toast(esc(x.ileti)); render(); return; }
    if (f === "setup") g.varsayilanAyarDk = sureMetniSunucu(x.deger, 2);
    else {
      const proc = f === "proc" ? x.deger : d.proc, chg = f === "chg" ? x.deger : d.chg;
      d[f] = x.deger;
      g.varsayilanBirimDk = proc === null && chg === null ? null : sureMetniSunucu(cevrimToplami(proc, chg), 4);
    }
  } else return;
  baglaKomut("operasyon-tipi-duzenle", g).then(r => { if (r === null) { d.proc = eski.proc; d.chg = eski.chg; render(); } });
}
function baglaKimlik(kind, eskiId, yeniId){
  const liste = kind === "item" ? st.items : st.opdefs;
  const eski = liste.find(x => x.id === eskiId), yeni = liste.find(x => x.id === yeniId);
  if (!eski || !yeni || !yeni.bagli || eski.bagli) return;
  if (kind === "item" && st.routes[eskiId] && st.routes[yeniId]) { toast("Bu kartın rotası zaten var; iki rota birleştirilemez."); render(); return; }
  if (kind === "item") { if (!MAL.var && !yeni.cost) yeni.cost = eski.cost || 0; }
  else if (eski.stationId && !yeni.stationId) yeni.stationId = eski.stationId;
  const i = liste.indexOf(eski); liste.splice(i, 1);
  kimlikDegistir(kind === "item" ? new Map([[eskiId, yeniId]]) : new Map(), kind === "item" ? new Map() : new Map([[eskiId, yeniId]]));
  save(); render();
  toast(`<b>${esc(eski.code)}</b> ${esc(yeni.code)} ile bağlandı.`);
}
/* ================= Bağlı rota (kart #1184) =================
   Köprü (window.tmi) varken bağlı ürünlerin rota revizyonları rota modülünden okunur (durum.routes, durum.routeRevs) ve oraya yazılır:
   taslak aç, kaydet, onaya gönder, geri gönder, onayla, yürürlüğe al, iptal. Düzenleme önce yerel taslakta yapılır (routeEdit); kısa bir
   beklemeden sonra taslak rota modülüne bütün olarak kaydedilir. Sunucu reddederse iletisi uyarıda görünür ve taslak ekranda kalır.
   Revizyon kimliği sunucu kimliğinin dizesidir, adım kimliği o<OP no>; seq adımın sırasıdır (sürükleyince yeniden 10, 20...), OP numarası
   adımla kalır. Sunucuda karşılığı olmayan alanlar (girdi statüsü, adım çıktısı, baz miktar) bu kayıtta kalır. Rotanın okuma yetkisi yoksa
   (durum.routeRevs null) ürünün rotası eskisi gibi yerel kayıtla çalışır. Kişi ve fason kaynağı ile makine/kişi adayları prototipte
   gösterilmez: adımda aynen taşınır, kaydet onları silmez. */
/* duzenlenen: bu açılışta kullanıcının düzenlediği ya da onay akışına soktuğu ürünler. Sayfa açılışı rotaya yazmaz: önceki oturumdan
   kalan ya da yerel düzeltmeyle imzası değişen revizyon sunucuya gönderilmez, sunucudaki hâl alınır (uçtan uca deneme Y6). */
const ROTA = {zaman:null, is:null, tekrar:false, duzenlenen:new Set()};
const rotaSunucuda = id => /^\d+$/.test(String(id));
const rotaImza = r => JSON.stringify([r.data, r.note || ""]);
const rotaDirty = r => r.imza !== rotaImza(r);
const rotaBagliMi = itemId => { const S = liveState(); return !!(S && window.tmi && BAGLI.durum && Array.isArray(BAGLI.durum.routeRevs) && S.items.some(i => i.id === itemId && i.bagli)); };
const REVIZYON_DURUMU_SUNUCU = {taslak:"taslak", onay:"onay", onayli:"onayli", yururlukte:"yururlukte"};

/* Eski bağlı adım kimliği "o<opNo>" malzemeyi taşımıyordu; iki ürünün OP 10'u aynı anahtarı alıyordu. Statü anahtarı adımın ürünüyle yeni
   kimliğe ("<malzeme>-o<opNo>") çevrilir. */
const yeniAdimAnahtari = (key, itemId) => { const m = /^step:o(\d+)$/.exec(String(key || "")); return m && itemId ? `step:${itemId}-o${m[1]}` : (key || ""); };
function rotaAdimiCevir(s, eski){
  const e = eski || {}, sahip = (/^(\d+)-o\d+$/.exec(s.id) || [])[1];
  const o = {id:s.id, opNo:s.opNo, seq:s.seq, opId:s.opId, name:s.name, sunucuOp:s.opId, stationId:s.stationId || "", setup:s.setup, proc:s.proc, chg:s.chg,
    dep:s.dep, depQty:s.depQty > 0 ? s.depQty : 1, rejectPct:s.rejectPct, split:s.split, minLot:s.minLot || 0, resetup:s.resetup, transfer:0,
    alts:s.alts.slice(), altTimes:{}, kisiId:s.kisiId, fasonId:s.fasonId, terminGun:s.terminGun, digerAdaylar:s.digerAdaylar.map(x => Object.assign({}, x)),
    ins:s.ins.map((x, k) => ({id:"n" + s.opNo + "_" + k, itemId:x.itemId, qty:x.qty, scrap:x.scrap, status:yeniAdimAnahtari(((e.ins || []).find(y => y.itemId === x.itemId) || {}).status, x.itemId)})),
    outs:s.outs.map((x, k) => ({id:"u" + s.opNo + "_" + k, itemId:x.itemId, qty:x.qty, kind:"yan", status:"", self:false})),
    outItem:e.outItem || "", outStatus:yeniAdimAnahtari(e.outStatus, sahip)};
  if (s.machineId) o.machineId = s.machineId;
  for (const id of Object.keys(s.altTimes)) { const t = s.altTimes[id], a = {}; if (t.setup !== null) a.setup = t.setup; if (t.cycle !== null) a.cycle = t.cycle; o.altTimes[id] = a; }
  Object.assign(o, sureNormalle({proc:s.proc, chg:s.chg}));
  return o;
}
/* Sunucu durumunu S durumuna uygular. Sunucudan gelen revizyon yerelin yerine geçer; yalnız henüz kaydedilmemiş değişikliği olan taslak
   ve henüz sunucuya açılmamış yerel taslak korunur. Dönen: ekranda görünen bir şey değişti mi. */
function uyumlaRota(d, S){
  if (!S || !Array.isArray(d.routeRevs) || !d.routes) return false;
  const once = JSON.stringify([S.routes, S.routeRevs]);
  const kalemler = new Set(S.items.filter(i => i.bagli).map(i => i.id));
  const sunucuUrunleri = new Set(d.routeRevs.map(r => r.itemId).filter(id => kalemler.has(id)));
  const eskiler = new Map((S.routeRevs || []).map(r => [r.id, r]));
  const eskiRotalar = S.routes || {};
  const yeni = [], tasinan = [];
  for (const r of d.routeRevs) {
    if (!kalemler.has(r.itemId)) continue;
    const eski = eskiler.get(r.id);
    const acik = x => x === "taslak" || x === "onay";
    if (eski && eski.sunucu && acik(eski.status) && rotaDirty(eski) && ROTA.duzenlenen.has(eski.itemId)) {
      /* Kaydedilmemiş yerel değişiklik yalnız sunucudaki sürümün üstündeyse korunur. Sunucu ilerlemişse (eski oturumdan kalan kayıt) her
         kayıt eski sürümle reddedilirdi; sunucudaki hâl alınır. */
      if (acik(r.status) && eski.surum === r.surum) { yeni.push(eski); continue; }
      if (acik(r.status)) ROTA.eskiAtildi = (ROTA.eskiAtildi || []).concat([`${((S.items || []).find(i => i.id === r.itemId) || {}).code || ""} Rev ${r.no}`]);
      else
      /* Revizyon başka yerde onaylandı ya da yürürlüğe alındı: sunucu onu artık değiştirmez ("onaylı durumundayken bu işlem yapılamaz").
         Kaydedilmemiş değişiklik kaybolmasın diye, ekrandaki adım düzenlemesinde olduğu gibi yeni taslak revizyona taşınır. */
      if (JSON.stringify(eski.data) !== JSON.stringify(r.data) || (eski.note || "") !== (r.note || "")) tasinan.push(eski);
    }
    const eskiRota = eski ? eski.data : eskiRotalar[r.itemId];
    /* Yerel adım sunucudakiyle kimlikle eşlenir (eski "o<opNo>" kimliği de); kaydedilince OP numarası alan yeni adım, aynı sıradaki OP numarasız
       yerel adımdır. Böylece çıktı kartı ve statüler kayıttan sonra kaybolmaz. */
    const eskiAdimlar = (eskiRota && eskiRota.steps) || [], eskiSirali = eskiAdimlar.slice().sort((a, b) => a.seq - b.seq);
    const eskiAdim = (s, i) => eskiAdimlar.find(x => x.id === s.id) || eskiAdimlar.find(x => x.id === "o" + s.opNo)
      || (eskiSirali[i] && !eskiSirali[i].opNo ? eskiSirali[i] : null) || (eski ? null : eskiAdimlar.find(x => x.seq === s.seq));
    const rev = {id:r.id, itemId:r.itemId, no:r.no, status:r.status, data:{base:(eskiRota && eskiRota.base) || 1, steps:r.data.steps.map((s, i) => rotaAdimiCevir(s, eskiAdim(s, i)))},
      note:r.note, created:r.created, updated:r.created, approvedAt:r.approvedAt, approver:"", surum:r.surum, sunucu:true, sunucuDurum:r.status, opNolar:r.data.steps.map(s => s.opNo)};
    rev.imza = rotaImza(rev);
    if (eski && eski.sunucu && JSON.stringify([eski.status, eski.no, eski.note, eski.data]) === JSON.stringify([rev.status, rev.no, rev.note, rev.data])) {
      Object.assign(eski, {surum:rev.surum, imza:rev.imza, sunucuDurum:rev.sunucuDurum, opNolar:rev.opNolar, approvedAt:rev.approvedAt}); yeni.push(eski);
    } else yeni.push(rev);
  }
  /* Ürünün sunucuda açık revizyonu varsa ikinci yerel taslak tutulmaz: ekran yalnız sunucudakini gösterir ve ona yazar (uçtan uca deneme Y5;
     yerel taslak için taslak-ac her denemede 409 dönüyordu). Bu açılışta düzenlenmiş yerel taslağın içeriği sunucudaki açık revizyona taşınır,
     eşitleme onu oraya kaydeder; düzenlenmemiş eski yerel kopya bırakılır. */
  const sunucuAcik = new Map(yeni.filter(r => r.status === "taslak" || r.status === "onay").map(r => [r.itemId, r]));
  for (const r of (S.routeRevs || [])) {
    const hedef = !r.sunucu && (r.status === "taslak" || r.status === "onay") && !rotaSunucuda(r.id) ? sunucuAcik.get(r.itemId) : null;
    if (!hedef || !ROTA.duzenlenen.has(r.itemId)) continue;
    const sunucuAdim = (hedef.data.steps || []).slice().sort((a, b) => a.seq - b.seq);
    hedef.data = clone(r.data);
    (hedef.data.steps || []).slice().sort((a, b) => a.seq - b.seq).forEach((x, i) => {
      const k = sunucuAdim[i];
      if (!x.opNo && k && k.opId === x.opId) { x.opNo = k.opNo; x.id = k.id; }
    });
    if (r.note) hedef.note = r.note;
    if (ui.revSel && ui.revSel[r.itemId] === r.id) ui.revSel[r.itemId] = hedef.id;
    if (revHist[r.id]) { revHist[hedef.id] = revHist[r.id]; delete revHist[r.id]; }
  }
  const korunan = (S.routeRevs || []).filter(r => !r.sunucu && (!kalemler.has(r.itemId) || !sunucuUrunleri.has(r.itemId)
    || ((r.status === "taslak" || r.status === "onay") && !rotaSunucuda(r.id) && !sunucuAcik.has(r.itemId))));
  for (const e of tasinan) {
    const yerel = korunan.concat(yeni).filter(x => x.itemId === e.itemId);
    if (yerel.some(x => x.status === "taslak" || x.status === "onay")) continue;
    korunan.push({id:"rv-" + e.id + "-tasindi", itemId:e.itemId, no:yerel.length < 26 ? String.fromCharCode(65 + yerel.length) : "R" + (yerel.length + 1), status:"taslak",
      data:clone(e.data), note:e.note || "", created:Date.now(), updated:Date.now()});
    ROTA.tasindi = (ROTA.tasindi || []).concat([`${((S.items || []).find(i => i.id === e.itemId) || {}).code || ""} Rev ${e.no}`]);
  }
  S.routeRevs = korunan.concat(yeni);
  S.routes = S.routes || {};
  for (const id of sunucuUrunleri) {
    if (d.routes[id]) {
      const baz = (S.routes[id] && S.routes[id].base) || ((yeni.find(r => r.itemId === id && r.status === "yururlukte") || {data:{}}).data.base) || 1;
      S.routes[id] = {base:baz, steps:JSON.parse(JSON.stringify((yeni.find(r => r.itemId === id && r.status === "yururlukte") || {data:{steps:[]}}).data.steps))};
    } else delete S.routes[id];
  }
  return JSON.stringify([S.routes, S.routeRevs]) !== once;
}
/* Prototip taslağını rota modülünün kaydet gövdesine çevirir. Sunucuya gidemeyecek kayıt (karta ya da kaynağa bağlı olmayan eski kimlik) açıklamayla durur. */
function rotaGovdesi(r){
  const izinli = new Set(r.opNolar || []);
  const sayiya = v => (v === null || v === undefined || v === "" ? null : Number(v));
  const kimlik = (v, adim, ne) => { if (!/^\d+$/.test(String(v))) throw new Error(`OP ${adim.seq}: ${ne} sunucudaki kayıtla eşleşmiyor (eski kayıt); rota rota modülüne kaydedilmedi.`); return Number(v); };
  const ss = (r.data.steps || []).slice().sort((a, b) => a.seq - b.seq);
  return ss.map(s => {
    const op = opdef(s.opId);
    if (!op || !op.bagli) throw new Error(`OP ${s.seq}: operasyon tanımı Operasyonlar bölümündeki karta bağlı değil; rota rota modülüne kaydedilmedi.`);
    const mk = s.machineId ? kimlik(s.machineId, s, "Makine") : null, ist = s.stationId ? kimlik(s.stationId, s, "İstasyon") : null;
    const kaynak = mk ? {tur:"makine", id:mk} : ist ? {tur:"istasyon", id:ist} : s.fasonId ? {tur:"fason", id:Number(s.fasonId)} : s.kisiId ? {tur:"kisi", id:Number(s.kisiId)} : null;
    const fason = !!kaynak && kaynak.tur === "fason";
    const proc = sureSayisi(s.proc) > 0 ? s.proc : null, chg = proc === null ? null : sureSayisi(s.chg);
    return {
      opNo:s.opNo && izinli.has(s.opNo) ? s.opNo : null,
      operasyonTipiId:Number(op.id),
      ad:s.name && s.sunucuOp === s.opId ? s.name : op.name,
      kaynak,
      ayarSuresiDk:fason ? null : sureSayisi(s.setup) ?? 0, islemSuresiDk:fason ? null : proc, degisimSuresiDk:fason ? null : chg, birimSureDk:null,
      terminGun:fason ? sayiya(s.terminGun) : null,
      bagimlilik:({bagimli:"bekleyen", ortulu:"akisli", bagimsiz:"bagimsiz"})[s.dep] || "bekleyen",
      devirAdedi:s.dep === "ortulu" ? Math.max(1, Math.round(s.depQty || 1)) : null,
      firePayiYuzde:Number(s.rejectPct) || 0,
      makineKullanimi:s.split === "bol" ? "paralel" : "tek",
      enKucukParca:s.split === "bol" && s.minLot > 0 ? Math.round(s.minLot) : null,
      yenidenAyar:s.resetup !== false,
      adaylar:(s.alts || []).map(id => { const t = (s.altTimes || {})[id] || {};
        return {kaynak:{tur:"istasyon", id:kimlik(id, s, "Alternatif istasyon")}, ayarSuresiDk:t.setup === undefined || t.setup === "" ? null : sureSayisi(t.setup), birimSureDk:t.cycle > 0 ? Number(t.cycle) : null, islemSuresiDk:null, degisimSuresiDk:null}; })
        .concat((s.digerAdaylar || []).map(x => ({kaynak:{tur:x.tur, id:Number(x.id)}, ayarSuresiDk:x.setup, birimSureDk:null, islemSuresiDk:x.proc > 0 ? x.proc : null, degisimSuresiDk:x.proc > 0 ? x.chg : null}))),
      bilesenler:(s.ins || []).map(x => ({malzemeId:kimlik(x.itemId, s, "Girdi kalemi"), miktar:Number(x.qty) || 0, fireYuzde:Number(x.scrap) || 0})),
      yanUrunler:(s.outs || []).map(x => ({malzemeId:kimlik(x.itemId, s, "Yan ürün"), miktar:Number(x.qty) || 0}))
    };
  });
}
/* Yeni sunucu taslağının kopyalanacağı revizyon: yerel taslağın OP numaralarının hepsini taşıyan (önce yürürlükteki) sunucu revizyonu. */
function rotaKaynakRev(S, r){
  const nolar = (r.data.steps || []).map(s => s.opNo).filter(n => n);
  const adaylar = (S.routeRevs || []).filter(x => x.sunucu && x.itemId === r.itemId && (x.status === "yururlukte" || x.status === "onayli"))
    .sort((a, b) => (b.status === "yururlukte") - (a.status === "yururlukte") || b.created - a.created);
  return adaylar.find(x => nolar.every(n => (x.opNolar || []).includes(n))) || null;
}
/* Sunucunun reddettiği alan "adimlar.<n>..." ise ileti, adımı ekrandaki OP numarası ve operasyon adıyla başlar (sunucunun OP numarası
   adımlar taşınınca ekrandakinden farklıdır). Son kaydetme hatası revizyonda kalır: onaya gönderirken yeniden söylenir. */
function rotaHataMetni(h, r){
  const m = (h && h.message) || "İşlem yapılamadı.";
  const n = /^adimlar\.(\d+)\b/.exec((h && h.alan) || "");
  const s = n && r && r.data ? (r.data.steps || []).slice().sort((a, b) => a.seq - b.seq)[Number(n[1])] : null;
  if (!s) return m;
  const d = opdef(s.opId);
  return `OP ${s.seq}${d ? " " + d.name : ""}: ${m.replace(/^OP \d+: /, "")}`;
}
function rotaHata(h, r, baslik){
  const m = rotaHataMetni(h, r);
  /* Yalnız kaydetme hatası "taslağa kaydedilemedi" olarak revizyonda kalır; onay gibi bir komutun reddi kaydı bozmaz, başlığıyla söylenir. */

  modal(`<h3>${esc(f.baslik)}</h3><div class="kyform">${alanlar}</div><p id="kyErr" class="hint kb-hata" role="alert"></p><div class="btnrow"><button class="btn primary" data-act="kaynakKaydet">Kaydet</button><button class="btn" data-close="1">Vazgeç</button></div>`);
  setTimeout(()=>{ const e = $(tur==="person" || tur==="shift" ? "#kyAd" : "#kyKod"); if (e) e.focus(); }, 0);
}
async function kaynakKaydet(){
  const F = ui.kaynakForm; if (!F) return;
  const v = id => (($(id)||{}).value||"").trim(), hata = t => { const e = $("#kyErr"); if (e) e.textContent = t; };
  let ad, govde;
  if (F.tur==="person") {
    if (!v("#kyAd")) return hata("Ad soyad boş olamaz.");
    ad = "kisi-ekle"; govde = {ad:v("#kyAd"), sicilNo:v("#kySicil")||null};
  } else {
    if (!v("#kyKod") || !v("#kyAd")) return hata("Kod ve ad boş olamaz.");
    const ortak = {kod:v("#kyKod"), ad:v("#kyAd")};
    if (F.tur==="wc") { ad = "is-merkezi-ekle"; govde = ortak; }
    else if (F.tur==="station") { ad = "istasyon-ekle"; govde = Object.assign(ortak, {isMerkeziId:Number(F.hedef)}); }
    else { ad = "makine-ekle"; govde = Object.assign(ortak, {istasyonId:Number(F.hedef)}); }
  }
  const r = await kaynakKomut(ad, govde, {sessiz:true});
  if (r.ok) { ui.kaynakForm = null; closeModal(); toast(KB_FORM[F.tur].eklendi); }
  else hata(r.hata);
}
/* Tek düzenleme yeri: istasyonun plan ayarı ve makine durumu İstasyonlar'da; vardiya, iş merkezi haftası, mola, tatil ve kişi vardiyası
   Vardiya'da düzenlenir. Motor bunları yalnız okur; düzenleme isteği sahibinin sayfasına götürür. */
const SAHIP_SAYFASI = {istasyon:["/istasyonlar/is-merkezleri", "İstasyonlar"], makine:["/istasyonlar/makineler", "İstasyonlar"],
  vardiya:["/vardiya", "Vardiya"], personel:["/vardiya/personel", "Vardiya başına personel"]};
function sahibindeDuzenle(ne){
  const [yol, ad] = SAHIP_SAYFASI[ne];
  toast(`Bu bilgi ${esc(ad)} sayfasında düzenlenir.`);
  if (window.tmi && window.tmi.git) window.tmi.git(yol);
  render(); return true;
}
function kaynakDegisti(el){
  if (!kaynakBagli()) return false;
  const s = el.dataset.s, id = el.dataset.id, f = el.dataset.f;
  if (!["wc","station","machine","person","shift","brk","skilladd","wcpreset"].includes(s)) return false;
  const v = el.type==="checkbox" ? el.checked : el.value, t = String(v).trim();
  const geri = () => { render(); return true; };
  const bos = etiket => { toast(`${etiket} boş olamaz.`); return geri(); };
  const komut = (ad, govde, basari) => { kaynakKomut(ad, govde, {basari}); return true; };
  if (s==="wc") {
    if (!t) return bos(f==="code" ? "Kod" : "Ad");
    return komut("is-merkezi-guncelle", {id, [f==="code" ? "kod" : "ad"]:t});
  }
  if (s==="station") {
    const x = station(id); if (!x) return geri();
    if (f==="code" || f==="name") { if (!t) return bos(f==="code" ? "Kod" : "Ad"); return komut("istasyon-guncelle", {id, [f==="code" ? "kod" : "ad"]:t}); }
    if (f==="eff" || f==="opPer") return sahibindeDuzenle("istasyon");
    if (f==="capSrc") { if (v!=="makine" && v!=="insan") return geri(); return komut("istasyon-guncelle", {id, kapasiteKaynagi:v}); }
    return geri();
  }
  if (s==="machine") {
    const m = machine(id); if (!m) return geri();
    if (f==="code" || f==="name") { if (!t) return bos(f==="code" ? "Kod" : "Ad"); return komut("makine-guncelle", {id, [f==="code" ? "kod" : "ad"]:t}); }
    if (f==="status" || f==="note") return sahibindeDuzenle("makine");
    return geri();
  }
  if (s==="wcpreset") return sahibindeDuzenle("vardiya");
  if (s==="person") {
    if (f==="shiftId") return sahibindeDuzenle("personel");
    if (f==="name") { if (!t) return bos("Ad"); return komut("kisi-duzenle", {id, ad:t}); }
    if (f==="code") return komut("kisi-duzenle", {id, sicilNo:t||null});
    return geri();
  }
  if (s==="skilladd") {
    const p = person(id); if (!p || !t) return geri();
    return komut("yetkinlik-belirle", {kisiId:id, istasyonIdleri:[...p.skills, t].map(Number)});
  }
  if (s==="shift" || s==="brk") return sahibindeDuzenle("vardiya");
  return false;
}
function kaynakAct(a, d){
  if (a==="kaynakUyariKapat") { KB.uyari = null; render(); return true; }
  if (a==="kaynakKaydet") { kaynakKaydet(); return true; }
  if (!kaynakBagli()) return false;
  const komut = (ad, govde, basari) => { kaynakKomut(ad, govde, {basari}); return true; };
  if (a==="tab" && d.tab==="res") { if (!KB.okundu || Date.now() - KB.okundu > 60000) kaynakYukle(); return false; }
  if (a==="addWc") { kaynakFormu("wc"); return true; }
  if (a==="addStation") { kaynakFormu("station", d.id); return true; }
  if (a==="addMachine") { kaynakFormu("machine", d.id); return true; }
  if (a==="addPerson") { kaynakFormu("person"); return true; }
  if (["addShift","toggleShift","copyWeek","addBreak","addHoliday","delHoliday","natHolidays","clearHolidays"].includes(a)) return sahibindeDuzenle("vardiya");
  if (a==="toggleSkill") {
    const p = person(d.id); if (!p) return true;
    const liste = p.skills.includes(d.st) ? p.skills.filter(x=>x!==d.st) : [...p.skills, d.st];
    return komut("yetkinlik-belirle", {kisiId:d.id, istasyonIdleri:liste.map(Number)});
  }
  if (a==="del" && (d.kind==="shift" || d.kind==="brk")) return sahibindeDuzenle("vardiya");
  if (a==="del" && ["wc","station","machine"].includes(d.kind)) {
    const key = d.kind+":"+d.id;
    if (ui.armed!==key) { ui.armed = key; render(); setTimeout(()=>{ if (ui.armed===key) { ui.armed = null; render(); } }, 3000); return true; }
    ui.armed = null;
    if (d.kind==="wc") return komut("is-merkezi-sil", {id:d.id}, "İş merkezi silindi.");
    if (d.kind==="station") return komut("istasyon-sil", {id:d.id}, "İstasyon silindi.");
    return komut("makine-sil", {id:d.id}, "Makine silindi.");
  }
  return false;
}

/* ================= Başlat ================= */
try { const raw = localStorage.getItem(LS_KEY); if (raw) st = normalize(JSON.parse(raw)); } catch(e) { bozuk = true; }
studioLoadLocal();
if (!st) { st = normalize(blank()); ui.sel = {kind:"newProduct"}; pristine = true; }
/* Zaman ilerledikçe plan "şimdi"ye göre kendiliğinden yenilenir */
setInterval(()=>{ if (!st || !["plan","op","kanban","orders"].includes(ui.tab)) return; if ($("#modal").innerHTML) return; const a = document.activeElement; if (a && a.closest && a.closest("input,select,textarea")) return; invalidate(); livePlanCache = null; render(); }, 5*60000);
render();
baglaYukle();
kaynakYukle(true);
if (window.tmiGorunum) window.tmiGorunum.kaydet(ad => Gorunum.al(ad));

</script>
