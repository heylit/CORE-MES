<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reçete ve Rota Motoru</title>
<style>
:root{
  --bg:#E7E5E0; --panel:#F7F6F3; --panel2:#EEECE7; --ink:#14213D; --muted:#59627A; --line:#CBC8C0;
  --accent:#F5C400; --accent-ink:#14213D; --ok:#0E7F81; --bad:#C8102E; --warn:#B35E00; --focus:#2F6FEB;
  --display:"Chakra Petch","Barlow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C2B; --panel:#1B2537; --panel2:#223047; --ink:#E8ECF3; --muted:#9DA9BF; --line:#34435D;
    --accent:#F5C400; --accent-ink:#14213D; --ok:#33BDB8; --bad:#FF5D70; --warn:#FFAA45; --focus:#86AEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141C2B; --panel:#1B2537; --panel2:#223047; --ink:#E8ECF3; --muted:#9DA9BF; --line:#34435D;
  --accent:#F5C400; --accent-ink:#14213D; --ok:#33BDB8; --bad:#FF5D70; --warn:#FFAA45; --focus:#86AEFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* Header */

/* Tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--body);font-weight:500;font-size:.78rem;opacity:.8;margin-left:4px}

main{padding:22px 0 60px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.hint{color:var(--muted);font-size:.93rem;max-width:68ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.93rem;min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.group{display:flex;flex-direction:column;gap:6px}
.group h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.count{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.empty{color:var(--muted);font-size:.93rem;padding:14px;border:1px dashed var(--line);border-radius:6px}
.kb-uyari{border-left:4px solid var(--warn);margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.kb-uyari b{color:var(--warn)}
.calc.sol,.g-sr .calc.sol{text-align:left}.kb-not{margin:10px 0}.kb-bg{align-self:flex-start;white-space:normal}.kb-hata{color:var(--bad);min-height:1.2em}.kyform{display:grid;gap:10px;margin:12px 0}

/* Grid rows */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grid{display:grid;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.grid:first-child{border-top:0}
.grid.head{font-size:.78rem;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:6px;background:var(--panel2)}
.g-items{grid-template-columns:7.5rem minmax(10rem,1fr) 9rem 5.5rem 10rem 6.2rem}
.g-stk{grid-template-columns:minmax(10rem,1fr) 7rem 6.5rem 6.5rem 3.5rem 8rem 6.5rem}
.g-bi{grid-template-columns:7rem minmax(10rem,1fr) 4.5rem minmax(6rem,9rem) 6rem 8rem 4.6rem}
.opgrp{margin:0 0 10px}
.calc.sol{text-align:left}
.hint.mb8{margin-bottom:8px}
.hint.mb6{margin-bottom:6px}
.hint.hata{color:var(--bad);margin-top:8px}
.hint.kucuk{font-size:.82rem}
.grid.head .sag{text-align:right}
.opgrp>summary{cursor:pointer;padding:8px 2px;font-size:1rem;display:flex;gap:8px;align-items:center}
.opgrp>summary .count{color:var(--muted);font-size:.8rem}
.opgrp:not([open])>summary{opacity:.75}
.f{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.f input,.f select,.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:38px}
.f input:focus,.f select:focus,.inp:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.f input.num{text-align:right;font-variant-numeric:tabular-nums}
.calc{font-variant-numeric:tabular-nums;font-size:.93rem;text-align:right;color:var(--muted)}
.calc.strong{color:var(--ink);font-weight:600}
.seq{font-family:var(--display);font-weight:700;font-size:1.05rem;text-align:center}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ib{background:none;border:1px solid transparent;border-radius:4px;min-width:34px;height:34px;cursor:pointer;color:var(--muted);font-size:.95rem;padding:0 6px}
.ib:hover{border-color:var(--line);color:var(--ink)}
.ib.del:hover,.ib.del.armed{color:var(--bad);border-color:var(--bad)}
.ib.del.armed{font-weight:700;font-size:.8rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.wcname{display:flex;align-items:center;gap:8px}
.wcname .f{flex:1}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ham{border-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.tag.yari{color:var(--ok);border-color:var(--ok)}
.tag.mamul{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media (max-width:760px){
  .grid{grid-template-columns:1fr 1fr !important;padding:12px;gap:10px}
  .grid.head{display:none}
  .grid .wide{grid-column:1/-1}
  .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.75rem;color:var(--muted);font-weight:600}
  .calc{text-align:left}
  .acts{grid-column:1/-1;justify-content:flex-start;border-top:1px dashed var(--line);padding-top:8px}
  .seq{text-align:left}
}

/* Picker */
.picker{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:.9rem;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;font-size:.75rem}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .f{width:auto}
.toolbar .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.78rem;color:var(--muted);font-weight:600}
.toolbar .f input,.toolbar .f select{min-width:7rem}

/* Tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:14px;border-left:2px solid var(--line)}
.tree li{padding:4px 0}
.node{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.node .q{font-variant-numeric:tabular-nums;font-weight:600}
.node .c{color:var(--muted);font-size:.85rem}

/* Sim */
.order{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:.8rem;font-weight:600}
.kpi b{font-family:var(--display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi em{font-style:normal;font-size:.8rem;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.msgs li{padding:8px 12px;border-left:4px solid var(--warn);background:var(--panel2);border-radius:0 4px 4px 0;font-size:.92rem}
.msgs li.tip{border-left-color:var(--ok)}
.msgs li.bad{border-left-color:var(--bad)}
.cap{display:flex;flex-direction:column;gap:10px}
.caprow{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr 4.5rem;gap:10px;align-items:center;font-size:.9rem}
.captrack{position:relative;height:16px;background:var(--panel2);border-radius:3px;overflow:visible}
.captrack i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
.captrack .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.capv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.capv.bad{color:var(--bad)}
@media (max-width:520px){.caprow{grid-template-columns:1fr 4rem}.caprow .captrack{grid-column:1/-1;grid-row:2}}
.gantt-wrap{overflow-x:auto}
.gantt{min-width:620px;display:flex;flex-direction:column;gap:6px}
.grow{display:grid;grid-template-columns:9rem 1fr;gap:10px;align-items:center;font-size:.85rem}
.glane{position:relative;height:28px;background:var(--panel2);border-radius:3px}
.gbar{position:absolute;top:3px;bottom:3px;border-radius:3px;color:#fff;font-size:.72rem;font-weight:600;padding:0 5px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;min-width:3px}
@media (prefers-reduced-motion:no-preference){.gantt.anim .gbar{animation:grow .7s ease both;transform-origin:left}}
.gbar.crit{box-shadow:inset 0 0 0 2px var(--accent)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gscale{position:relative;height:18px;font-size:.72rem;color:var(--muted)}
.gscale span{position:absolute;transform:translateX(-50%)}
.hz{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--bad);z-index:2}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:600;background:var(--panel2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.panel h3{margin-bottom:12px}


/* Overlay */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:8px;border:1px solid var(--line);max-width:640px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-left:6px solid var(--accent);padding:10px 14px;border-radius:4px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast b{font-family:var(--display)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .3s ease}}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.lbl{font-size:.78rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.order input[type="date"]{min-width:9.5rem}
.gbar.ovl{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
td.short{color:var(--bad);font-weight:600} td.plus{color:var(--ok);font-weight:600}
.tag.low{color:var(--bad);border-color:var(--bad)} .tag.okk{color:var(--ok);border-color:var(--ok)}
@media (max-width:760px){.g-stk>div:nth-child(2){text-align:right}}
/* v2 eklentileri */
.lbl{font-size:.78rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.order input[type="date"]{min-width:9.5rem}
.gbar.ovl{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.gbar.crit{box-shadow:inset 0 0 0 2px var(--accent)}
td.short{color:var(--bad);font-weight:600} td.plus{color:var(--ok);font-weight:600}
.tag.low{color:var(--bad);border-color:var(--bad)} .tag.okk{color:var(--ok);border-color:var(--ok)}
.capgrp{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.capgrp .lbl{display:flex;gap:6px;align-items:center;margin:4px 0 0}
.linkbtn{background:none;border:0;color:var(--focus);font-weight:600;cursor:pointer;padding:0 0 0 6px;font-size:.85rem}

/* ana veri ızgaraları */
.g-st{grid-template-columns:7rem minmax(9rem,1fr) 6.5rem 5.5rem 6rem 7rem 4.2rem}
.g-sr{grid-template-columns:minmax(8rem,1.4fr) 3rem 3.2rem minmax(6.5rem,1fr) 5.6rem 4.4rem 4.4rem 4.4rem 4.2rem 4.6rem 4.6rem 4.6rem minmax(8.5rem,10rem);align-items:start}
.g-sr.head{align-items:end}.g-sr.sup{padding-bottom:0}.g-sr.head .n{text-align:right}.g-sr.head .c{text-align:center}
.g-sr .sp5{grid-column:span 5}.g-sr .sp4{grid-column:span 4}.g-sr .sp3{grid-column:span 3}
.g-sr .calc{text-align:right}.g-sr .sr-u small,.g-sr .sr-op small{display:block;color:var(--muted);font-weight:400}.g-sr .sr-u .calc,.g-sr .sr-op .calc{text-align:left}
.g-sr .tag{font-weight:600}.g-sr .f .tag{align-self:flex-start}
.sr-plan{gap:4px}.sr-plan small{color:var(--muted);font-size:.72rem}
@media (max-width:1180px){
  .g-sr{grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr)) !important}
  .g-sr.head{display:none}
  .g-sr .sr-u,.g-sr .sr-op,.g-sr .sr-plan{grid-column:1/-1}
  .g-sr .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.72rem;color:var(--muted);font-weight:600;white-space:normal}
  .g-sr .calc{text-align:left}
}
@media (max-width:520px){.g-sr{grid-template-columns:1fr 1fr !important}}
.g-od{grid-template-columns:5.5rem 6.5rem minmax(9rem,1fr) minmax(10rem,14rem) 5.5rem 5.5rem 5.5rem 4.5rem 9rem 4.2rem}
.g-stk{grid-template-columns:minmax(10rem,1fr) 7rem 6.5rem 6.5rem 3.5rem 8rem 6.5rem}
.wcp{padding:14px 16px}
.wchd{display:grid;grid-template-columns:7rem minmax(10rem,1fr) 9rem 6rem 4.2rem;gap:10px;align-items:end}
.wchd .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.75rem;color:var(--muted);font-weight:600}
@media (max-width:760px){.wchd{grid-template-columns:1fr 1fr}.wchd .wgrow{grid-column:1/-1}}
.abbrin{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-left:5px solid var(--c) !important;text-align:center}

/* şema */
.wrap.wide{max-width:1680px}
.sch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1020px){.sch{grid-template-columns:minmax(0,1fr)}}
.sch-main{min-width:0}
.sch-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.sch-bar select,.sch-bar input{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:40px;width:100%}
.rootsel{min-width:220px;flex:0 1 320px}
.qtyf{width:6.5rem}
.qtyf input{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{background:transparent;border:0;border-left:1px solid var(--line);padding:0 12px;min-height:38px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sch-run{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:.9rem}
.sch-run .grow1{flex:1}
.badt{color:var(--bad);font-weight:700}.okt{color:var(--ok);font-weight:700}.warnt{color:var(--warn);font-weight:700}
.viewport{position:relative;height:min(76vh,900px);min-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px;cursor:grab;
  background-color:var(--panel2);background-image:linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:24px 24px;overscroll-behavior:contain}
.viewport.dragging{cursor:grabbing;user-select:none}
.sizer{position:relative}
.inner{position:absolute;top:0;left:0;width:max-content;transform-origin:0 0;padding:24px 32px 40px}
.edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:0}
.edges path{fill:none}
.edges .ef{stroke:var(--ink);stroke-width:3}
.edges .ei{stroke:var(--muted);stroke-width:1.6}
.edges .eo{stroke:var(--ok);stroke-width:1.6;stroke-dasharray:5 3}
.edges .mf{fill:var(--ink)} .edges .mi{fill:var(--muted)} .edges .mo{fill:var(--ok)}
.rcol{position:relative;z-index:1}
.rcol.sub{background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px dashed var(--line);border-radius:10px;padding:10px 12px 12px}
.g3{display:grid;grid-template-columns:max-content 240px max-content;column-gap:40px;row-gap:22px;align-items:center}
.cin{display:flex;flex-direction:column;align-items:flex-end;gap:8px;justify-self:end}
.cout{display:flex;flex-direction:column;align-items:flex-start;gap:8px;justify-self:start}
.cop{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:240px}
.rhd-wrap{display:flex;gap:4px;align-items:center}
.rhd{flex:1;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.rhd .slot{background:var(--bg);color:var(--ink)}
.rhd .ci small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.rhd.sel{outline:3px solid var(--focus);outline-offset:2px}
.coll{color:var(--muted)}
.opbox{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:0 0 8px;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 25%,transparent);overflow:hidden}
.opbox:hover{transform:translateY(-1px)}
.opbox:active{transform:translateY(1px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.obar{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;padding:5px 10px}
.abbr{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.06em;line-height:1}
.oseq{font-family:var(--display);font-weight:600;font-size:.85rem;opacity:.9;margin-left:auto}
.led{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.led.g{background:#2BD47D}.led.y{background:var(--accent)}.led.r{background:#FF3B4E}
.oname{padding:6px 10px 0;font-size:.98rem;line-height:1.2}
.ost{padding:0 10px;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ost em{font-style:normal;font-weight:600}
.otime{padding:0 10px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.opbox.crit{box-shadow:0 0 0 3px var(--accent),0 3px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.opbox.hot .ost{color:var(--bad);font-weight:700}
.opbox.sel{outline:3px solid var(--focus);outline-offset:3px}
.chipw{display:inline-flex;align-items:center;gap:4px}
.chip-it{display:flex;align-items:center;gap:8px;min-width:200px;max-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px 5px 5px;cursor:pointer;text-align:left;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.chip-it:hover{border-color:var(--ink)}
.chip-it.sel{outline:3px solid var(--focus);outline-offset:1px}
.chip-it.k-main{border:2px solid var(--ink)}
.slot{position:relative;flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;font-family:var(--display);font-weight:700;font-size:.78rem;background:var(--panel2);color:var(--muted);border:2px solid var(--line)}
.t-yari .slot,.slot.t-yari{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok);border-color:var(--ok)}
.t-mamul .slot,.slot.t-mamul{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lowdot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
.ci{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.15}
.ci b{font-family:var(--display);font-size:.82rem;font-weight:600}
.ci small{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cq{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--display);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.cq small{font-family:var(--body);font-weight:500;font-size:.7rem;color:var(--muted)}
.kb{display:inline-block;align-self:flex-start;margin-top:3px;font-size:.66rem;font-weight:700;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kb.k-ara{color:var(--focus);border-color:var(--focus)}
.kb.k-yan{color:var(--ok);border-color:var(--ok)}
.kb.k-hurda{color:var(--warn);border-color:var(--warn)}
.kb.k-ana{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kb.k-in{color:var(--ink)}
.exp{background:var(--panel);border:1px dashed var(--line);border-radius:4px;font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 6px;cursor:pointer;white-space:nowrap}
.exp:hover{border-color:var(--ink);color:var(--ink)}
.add{background:transparent;border:1px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:4px;padding:4px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;min-height:30px}
.add:hover{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--panel)}
.add-between{align-self:center;opacity:.8}
.noroute{font-size:.85rem;color:var(--warn);font-weight:600;text-align:center;padding:10px;border:1px dashed var(--warn);border-radius:6px;background:var(--panel)}
.emptycv{width:min(420px,80vw);display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:24px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:22px;height:0;border-top:2px solid}
.lg-in{border-color:var(--muted)} .lg-flow{border-top-width:3px;border-color:var(--ink)} .lg-out{border-color:var(--ok);border-top-style:dashed}
.lg-crit{height:12px;width:16px;border:3px solid var(--accent);border-radius:3px} .lg-hot{height:10px;width:10px;border:0;border-radius:50%;background:#FF3B4E}
/* panel */
.insp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.insp-hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.insp-hd b{flex:1;font-family:var(--display);font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-empty{display:flex;flex-direction:column;gap:8px}
.isec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.isec h4{margin:0 0 10px;font-family:var(--display);font-size:.9rem;font-weight:600;display:flex;gap:6px;align-items:center}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ig .wide{grid-column:1/-1}
.insp .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.75rem;color:var(--muted);font-weight:600}
.insp .f input,.insp .f select,.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:40px}
.insp .f input:focus,.insp .f select:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.opt{margin-top:10px;font-size:.88rem}
.mini{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px 4px 4px;cursor:pointer;text-align:left;font-size:.86rem}
.mrow:hover{border-color:var(--ink)}
.mrow.static{cursor:default}
.mrow em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.mrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--bg);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:6px;padding:6px 8px 8px;cursor:pointer;text-align:left;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 12%,transparent)}
.tile:hover{border-color:var(--ink);border-top-color:var(--c)}
.tile .abbr{font-size:1.15rem}
.tile b{font-size:.82rem;line-height:1.15}
.tile small{font-size:.7rem;color:var(--muted)}
.pickq{margin-top:10px}
.picklist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto;margin-top:10px;padding-right:2px}
.pick{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px 4px 4px;cursor:pointer;text-align:left;font-size:.86rem}
.pick:hover{border-color:var(--ink)}
.pick .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{color:var(--muted);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
@media (max-width:1020px){
  .insp{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:66vh;border-radius:14px 14px 0 0;z-index:40;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.28)}
  .insp.closed{display:none}
  .viewport{height:64vh}
}
@media (max-width:640px){
  .rootsel{flex:1 1 100%}
  .sch-run{gap:4px 12px;font-size:.85rem}
  .sch-run .grow1{display:none}
  main{padding-top:14px}
}


/* vardiya matrisi */
.g-sh{grid-template-columns:minmax(8rem,1fr) 7rem 6rem 4.5rem 3rem}
.wm-wrap,.lm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.wm{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:.88rem}
.wm th,.wm td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap;background:transparent}
.wm thead th{background:var(--panel2);font-family:var(--display);font-weight:600;font-size:.82rem;color:var(--ink);padding:8px 6px;position:sticky;top:0}
.wm thead th.we,.wm .wm-tot td:nth-child(7),.wm .wm-tot td:nth-child(8){color:var(--bad)}
.wm .wm-h,.wm .wm-s,.wm .wm-tot th,.wm tfoot th{text-align:left;font-weight:600;padding-left:12px}
.wm .wm-s small{color:var(--muted);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.wm .wm-wc th{background:var(--panel2);text-align:left;padding:8px 12px;border-top:2px solid var(--line)}
.wm-wch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.wm-pre{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:.8rem;min-height:30px}
.wm-c{width:100%;min-width:38px;height:34px;border-radius:5px;border:2px dashed var(--line);background:var(--bg);cursor:pointer;font-family:var(--display);font-weight:700;font-size:.85rem;color:#fff}
.wm-c:hover{border-color:var(--c)}
.wm-c.on{background:var(--c);border:2px solid color-mix(in srgb,var(--c) 70%,#000);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.wm .wm-tot td,.wm .wm-tot th{font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.wm .wm-tot td.zero{color:var(--muted);font-weight:500}
.wm td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:12px;color:var(--muted)}
.wm tfoot th,.wm tfoot td{font-weight:700;background:var(--panel2);font-variant-numeric:tabular-nums}
.wm.compact{min-width:0;font-size:.8rem}
.wm.compact .wm-c{min-width:26px;height:28px;font-size:.72rem}
.wm.compact .wm-s small{display:block;margin:0}
.insp .wm-wrap{margin-top:4px}
/* Paneldeki dar vardiya matrisi yatay kaydırmadan sığar: saat alt satıra iner, hücreler daralır. */
.insp .wm.compact{min-width:0;font-size:.78rem}
.insp .wm.compact th,.insp .wm.compact td{padding:3px 2px}
.insp .wm.compact .wm-h,.insp .wm.compact .wm-s,.insp .wm.compact .wm-tot th{padding-left:6px;white-space:normal}
.insp .wm.compact .wm-s small{display:block;margin:0}
.insp .wm.compact td.n{padding-right:6px}
.insp .wm.compact .wm-c{min-width:26px;font-size:.72rem}
/* yük matrisi */
.lm{border-collapse:separate;border-spacing:0;font-size:.78rem}
.lm th,.lm td{border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:3px 4px;text-align:center;white-space:nowrap;min-width:46px;height:30px}
.lm thead th{background:var(--panel2);font-weight:600;position:sticky;top:0;z-index:1;line-height:1.1;padding:6px 4px}
.lm thead th span{display:block;font-family:var(--display);font-size:.74rem;color:var(--muted)}
.lm thead th.we span{color:var(--bad)}
.lm thead th.hol{background:repeating-linear-gradient(135deg,var(--panel2) 0 5px,color-mix(in srgb,var(--bad) 18%,var(--panel2)) 5px 10px)}
.lm .lm-h,.lm tbody th{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:4px 10px;min-width:170px;font-weight:600}
.lm thead .lm-h{z-index:3;background:var(--panel2)}
.lm .lm-wc th{background:var(--panel2);border-top:2px solid var(--line)}
.lm .lm-wc th small{color:var(--muted);font-weight:500}
.lm .lm-wc td{background:var(--panel2);font-variant-numeric:tabular-nums;line-height:1}
.lm .lm-wc td b{display:block;font-size:.8rem}
.lm .lm-wc td small{font-size:.62rem;color:var(--muted)}
.lm .lm-st{font-weight:500;padding-left:22px}
.lm tbody td{background:color-mix(in srgb,var(--c,var(--ink)) var(--u,0%),var(--panel));font-weight:700;font-variant-numeric:tabular-nums}
.lm tbody td.full{color:#fff}
.lm td.off{background:repeating-linear-gradient(135deg,var(--panel2) 0 4px,color-mix(in srgb,var(--ink) 8%,var(--panel2)) 4px 8px) !important;color:var(--muted)}
.lm .due{box-shadow:inset -3px 0 0 var(--bad)}
.gclosed{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink) 12%,transparent) 4px 8px)}
.wm thead th:first-child,.wm tbody tr:not(.wm-wc) th:first-child,.wm tfoot th:first-child{position:sticky;left:0;z-index:2;background:var(--panel)}
.wm thead th:first-child{background:var(--panel2);z-index:3}
.wm .wm-tot th:first-child,.wm tfoot th:first-child{background:var(--panel2)}
.wm-wch{position:sticky;left:12px;width:max-content;max-width:calc(100vw - 80px)}
@media (max-width:640px){.wm .wm-s small{display:block;margin:0}.wm{font-size:.82rem}.wm-c{min-width:34px}}
@media (max-width:640px){.lm .lm-h,.lm tbody th{min-width:96px;max-width:110px;white-space:normal;font-size:.7rem;line-height:1.15;padding:4px 6px}.lm .lm-wc th small{display:none}.lm .lm-st{padding-left:8px}.lm th,.lm td{min-width:40px}}

/* vardiya ve mola kartları */
.shcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.shc{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:12px 14px;background:var(--bg)}
.shc-hd{display:grid;grid-template-columns:minmax(7rem,1fr) 6.6rem 6.6rem auto 2.4rem;gap:8px;align-items:end}
.shc .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.72rem;color:var(--muted);font-weight:600}
.shc .f input{background:var(--panel)}
.shc-sum{display:flex;flex-direction:column;line-height:1.15;padding-bottom:4px;min-width:7.5rem}
.shc-sum b{font-family:var(--display);font-size:1.05rem}
.shc-sum small{font-size:.74rem;color:var(--muted)}
.tl{position:relative;height:22px;margin-top:12px;background:var(--panel2);border-radius:4px;overflow:hidden}
.tl-t{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.tl-sh{position:absolute;top:3px;bottom:3px;background:var(--c);border-radius:3px}
.tl-br{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--ink) 3px 6px);border-radius:2px;opacity:.9}
.tl-ruler{position:relative;height:16px;font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-ruler span{position:absolute;transform:translateX(-50%)}
.tl-ruler span:first-child{transform:none}.tl-ruler span:last-child{transform:translateX(-100%)}
.brks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.brk{display:grid;grid-template-columns:minmax(7rem,1fr) 6.6rem 6.6rem 3.4rem 2.4rem;gap:8px;align-items:end;padding:6px 8px;border-left:4px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0}
.brk.bad{border-left-color:var(--bad)}
.brk-d{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;padding-bottom:10px}
.shc-warn{color:var(--bad);font-size:.82rem;font-weight:600;margin-top:6px}
@media (max-width:640px){
  .shc-hd{grid-template-columns:1fr 1fr}
  .shc-hd .shn{grid-column:1/-1}
  .shc-hd .acts,.brk .acts{grid-column:auto;border:0;padding:0;justify-content:flex-end}
  .brk{grid-template-columns:1fr 1fr}
  .brk .shn{grid-column:1/-1}
}
.shc .tin{text-align:center;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600;letter-spacing:.04em}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.82rem}
.shc-hd,.brk{grid-template-columns:minmax(7rem,1fr) 5.4rem 5.4rem auto 2.4rem}
.brk{grid-template-columns:minmax(7rem,1fr) 5.4rem 5.4rem 3.4rem 2.4rem}
@media (max-width:640px){
  .shc-hd{grid-template-columns:1fr 1fr 2.4rem}
  .shc-hd .shn{grid-column:1/-1}
  .shc-hd .shc-sum{grid-column:1/3}
  .brk{grid-template-columns:1fr 1fr 2.4rem}
  .brk .shn{grid-column:1/-1}
  .brk .acts{grid-row:2;grid-column:3}
  .brk .brk-d{grid-row:3;grid-column:1/-1;padding:0;font-size:.8rem}
  .shc{padding:10px}
}

/* üretim emirleri */
.olist{display:flex;flex-direction:column;gap:10px}
.ocard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px}
.ocard.late{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 40%,transparent)}
.ocard.s-tamam,.ocard.s-iptal{opacity:.75}
.oc-hd{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ono{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
.oc-it{flex:1;min-width:10rem}
.prio{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);color:var(--muted)}
.prio.p1{background:var(--bad);color:#fff;border-color:var(--bad)}
.prio.p2{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.ostat{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.ostat.s-serbest{color:var(--focus);border-color:var(--focus)}
.ostat.s-uretimde{background:var(--ok);color:#fff;border-color:var(--ok)}
.ostat.s-tamam{color:var(--ok);border-color:var(--ok)}
.ostat.s-iptal{color:var(--bad);border-color:var(--bad)}
.oc-grid{display:grid;grid-template-columns:6.5rem 9.5rem 9.5rem 7.5rem 8.5rem minmax(8rem,1fr) minmax(8rem,1fr);gap:10px;align-items:end;margin-top:10px}
.oc-grid .f>span:first-child,.order .f>span:first-child{position:static;width:auto;height:auto;clip:auto;font-size:.72rem;color:var(--muted);font-weight:600}

.oc-kpi{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.oc-kpi small{font-size:.72rem;color:var(--muted);font-weight:600}
.oc-kpi b{font-family:var(--display);font-size:1rem}
.oc-kpi em{font-style:normal;font-size:.75rem;color:var(--muted)}
.pbar{display:block;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:4px 0 2px}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--ok) 0 6px,color-mix(in srgb,var(--ok) 80%,#fff) 6px 12px)}
.odet{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.dh{font-family:var(--display);font-size:.95rem;margin:16px 0 8px}
.crit-row td{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.seg button small{opacity:.7;font-weight:500}
.dtf{display:flex;flex-direction:column;gap:1px}.dtf small{font-size:.68rem;color:var(--muted);font-weight:600}
.dtf input{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-height:36px}
.subtabs{margin-bottom:4px}
.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}.ph h3{margin:0}
/* durum rozetleri */
.kst{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap}

<script>
"use strict";
/* ================= Sabitler ================= */
const LS_KEY = "recete-rota-motoru-v1";
const TYPE = {ham:"Ham madde", yari:"Yarı mamul", mamul:"Mamul", sarf:"Sarf malzemesi", demirbas:"Demirbaş", hizmet:"Hizmet"};
const TS = {ham:"HM", yari:"YM", mamul:"MM"};
const OUTK = {yan:"Yan ürün"};
const COLORS = ["#2F6FEB","#0E7F81","#C96A00","#8A4FD3","#C8102E","#3E8E2E","#9A7400","#C2408A","#4B5D7A","#1F9E6A"];
const DAYS = [[1,"Pzt"],[2,"Sal"],[3,"Çar"],[4,"Per"],[5,"Cum"],[6,"Cmt"],[0,"Paz"]];
const EPS = 1e-9;

/* ================= Durum ================= */
let st = null;
const ui = {tab:"schema", root:null, sel:null, qtyMode:"order", zoom:1, fitPending:true, collapsed:new Set(), pickType:"all", armed:null, anim:false};
let pristine = false, bozuk = false, syncText = "Bu cihazda kayıtlı";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n) ? n : 0; };
const fmt = (n,d=2) => Number(n||0).toLocaleString("tr-TR",{maximumFractionDigits:d});
const money = n => Number(n||0).toLocaleString("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
const nv = n => (n===undefined||n===null) ? "" : String(n).replace(".",",");
/* Bağlı birim maliyetler (kart #1187): ayrıntı "Bağlı birim maliyetler" bölümünde. */
const MAL = {m:null, var:false};
const uid = p => p + Math.random().toString(36).slice(2,9);
const lower = s => String(s||"").toLocaleLowerCase("tr-TR");

/* ================= Takvim ================= */
const pad = n => String(n).padStart(2,"0");
const D = s => new Date(s+"T00:00:00Z");
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const todayIso = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")) && !isNaN(D(s));
const fmtDate = s => validDate(s) ? s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4) : "–";
const fmtShort = s => validDate(s) ? s.slice(8,10)+"."+s.slice(5,7) : "";
const DAYNAME = {0:"Paz",1:"Pzt",2:"Sal",3:"Çar",4:"Per",5:"Cum",6:"Cmt"};
const tmin = t => { const m = String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? Math.min(23,+m[1])*60 + Math.min(59,+m[2]) : 0; };
function parseTime(v){
  const t = String(v||"").trim().replace(/[.,;\s]/g,":");
  let h, m;
  let mm = t.match(/^(\d{1,2}):(\d{1,2})$/);
  if (mm) { h = +mm[1]; m = +mm[2]; }
  else if (/^\d{1,4}$/.test(t)) { if (t.length<=2) { h = +t; m = 0; } else { h = +t.slice(0, t.length-2); m = +t.slice(-2); } }
  else return null;
  if (h===24 && m===0) h = 0;
  if (h>23 || m>59) return null;
  return pad(h)+":"+pad(m);
}
const tstr = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ":" + pad(m % 60); };
const SHIFT_DEFAULTS = ()=>[
  {id:"v1", name:"1. vardiya", start:"08:00", end:"16:00", breaks:[{id:"b1", name:"Yemek molası", start:"12:00", end:"12:30"}]},
  {id:"v2", name:"2. vardiya", start:"16:00", end:"00:00", breaks:[{id:"b2", name:"Yemek molası", start:"20:00", end:"20:30"}]},
  {id:"v3", name:"3. vardiya", start:"00:00", end:"08:00", breaks:[{id:"b3", name:"Yemek molası", start:"04:00", end:"04:30"}]}
];
const shiftOf = (id, cal=st.cal) => (cal.shifts||[]).find(x=>x.id===id);
/* Vardiya penceresi dakika cinsinden; bitiş başlangıçtan önceyse gece yarısını geçer */
function shiftSpan(sh){ const a = tmin(sh.start); let b = tmin(sh.end); if (b <= a) b += 1440; return [a, b]; }
function breakSpan(sh, br){ const [a] = shiftSpan(sh); let s = tmin(br.start), e = tmin(br.end); if (e <= s) e += 1440; if (s < a) { s += 1440; e += 1440; } return [s, e]; }
function breakInfo(sh){
  const [a, b] = shiftSpan(sh);
  const spans = (sh.breaks||[]).map(br=>{ const [s,e] = breakSpan(sh, br); return {br, s, e, cs:Math.max(a,s), ce:Math.min(b,e), ok: s>=a && e<=b}; });
  const iv = spans.filter(x=>x.ce > x.cs).map(x=>[x.cs, x.ce]).sort((p,q)=>p[0]-q[0]);
  let tot = 0, cur = null, sum = 0;
  for (const [x,y] of iv) { sum += y-x; if (!cur || x > cur[1]) { if (cur) tot += cur[1]-cur[0]; cur = [x,y]; } else cur[1] = Math.max(cur[1], y); }
  if (cur) tot += cur[1]-cur[0];
  return {a, b, gross:b-a, brk:tot, net:Math.max(0, b-a-tot), spans, overlap: sum > tot + 0.5};
}
const shiftNet = sh => breakInfo(sh).net/60;
/* Vardiyanın başından "upto" dakikasına kadar fiilen çalışılan net dakika (molalar düşülür) */
function shiftWorked(sh, upto){ const [a, b] = shiftSpan(sh); const end = Math.min(b, upto); if (end <= a) return 0;
  const iv = (sh.breaks||[]).map(br=>breakSpan(sh, br)).map(([s0,e0])=>[Math.max(a,s0), Math.min(end,e0)]).filter(([x,y])=>y>x).sort((p,q)=>p[0]-q[0]);
  let br = 0, cur = null; for (const [x,y] of iv) { if (!cur || x > cur[1]) { if (cur) br += cur[1]-cur[0]; cur = [x,y]; } else cur[1] = Math.max(cur[1], y); } if (cur) br += cur[1]-cur[0];

function usageOf(kind, id){

  const seen = new Set(); const add = t => { if (!seen.has(t)) { seen.add(t); out.push(t); } };
  if (kind==="station") { for (const rv of revData) for (const s0 of ((rv.data||{}).steps||[])) if (s0.stationId===id || (s0.alts||[]).includes(id)) add(`${where(rv, s0)} rota adımında`); }

function sTree(id, qty, path, nid){
  const n = {id, qty, nid, steps:[], cycle:false};
  if (path.includes(id)) { n.cycle = true; return n; }
  const it = item(id);
  if (it && it.type!=="ham" && st.routes[id]) {
    const r = st.routes[id], f = qty/(r.base>0?r.base:1), ss = stepsOf(id), fs = stepFactors(ss);
    ss.forEach((s,j)=>n.steps.push({s, q:qty*fs[j],
      ins: s.ins.filter(x=>item(x.itemId)).map(x=>({x, node:sTree(x.itemId, f*fs[j]*(x.qty||0)*(1+(x.scrap||0)/100), [...path,id], nid+">"+x.id)})),
      outs: s.outs.filter(o=>item(o.itemId)).map(o=>({o, qty:f*fs[j]*(o.qty||0)}))}));
  }
  return n;
}

  return `<span class="chipw"><button class="chip-it t-${it.type} k-${c.kind} ${isSt?"stcard":""} ${selected?"sel":""}" data-act="${act}" data-id="${esc(c.id||it.id)}" data-item="${it.id}" data-owner="${c.owner||""}" data-step="${c.stepId||""}" data-nid="${esc(c.nid||"")}" data-qty="${c.qty}" ${c.feed?`data-feed="${esc(c.feed)}"`:""} ${c.from?`data-from="${esc(c.from)}"`:""}>
    <span class="slot">${isSt?`<em>${TS[it.type]}</em><i class="stmark">S</i>`:TS[it.type]}${low&&!isSt?`<i class="lowdot" title="Minimum stoğun altında"></i>`:""}</span>
    <span class="ci"><b>${esc(isSt ? cardTitle(it.id, c.reqStatus) : it.code)}</b><small>${esc(isSt ? `${it.code} ${it.name}` : (it.name||"Adsız"))}</small>${badge}</span>

}
function runStrip(){
  const r = runSim();
  if (!r) return `<span class="hint">Plan için ürünün rotasında en az bir adım olmalı.</span>`;
  const bs = r.bottleneck ? station(r.bottleneck) : null;
  /* Planlanamayan adım varsa bitiş tarihi anlamsızdır (emir listesindeki gibi "Planlanamıyor"); gecikme teslim gününe göre sayılır. */
  return `<span title="Deneme hesabı: yalnızca bu ürün, diğer emirlerin yükü hariç">${r.blocked?`Bitiş <b class="badt">Planlanamıyor</b> <small class="hint">${r.rotaEksik?"Rotada girdi ya da çıktı eksik":`${r.unplanned} adımın makinesi ya da vardiyası yok`}</small>`:`Bitiş <b>${fmtDate(r.finish)}</b> ${r.late?`<span class="badt">${fmt(r.makespan-r.dueEnd,1)} g geç</span>`:`<span class="okt">zamanında</span>`}`}</span>
    <span>Birim <b>${money(r.unit)}</b></span>
    ${bs?`<span title="En yüklü istasyon">${esc(bs.code)} <b class="${r.over?"badt":""}">%${fmt(r.maxU*100,0)}</b></span>`:""}
    ${r.warnings.length?`<span class="warnt">${r.warnings.length} uyarı</span>`:""}
    <span class="grow1"></span>
    <button class="btn primary sm" data-act="orderFromSchema">Üretim emri oluştur</button>`;
}

/* Tek adımda malzeme ekleme: yaz, seç, miktarı gir, Ekle. Listede yoksa kart açılmaz: Malzemeler ve Hizmetler'e yönlendirilir. */
/* Ticari mal ve hizmet reçetede girdi olmaz; TMI kalemde girdiOlabilir:false gönderir (yerel kalemde alan yoktur). */
function girdiOlur(i){ return !!i && i.girdiOlabilir!==false && i.type!=="hizmet"; }
function cardOptions(excludeId, girdi){
  const out = [];
  for (const i of st.items) { if (i.id===excludeId || (girdi && !girdiOlur(i))) continue; out.push({v:`${i.code} ${i.name}`, itemId:i.id, status:""});
    for (const c of statusCardsOf(i.id)) out.push({v:`${cardCode(i.id,c.status)} [statülü] ${cardTitle(i.id,c.status)}, ${i.name}`, itemId:i.id, status:c.status}); }
  return out;
}
function quickAdd(stepId, ownerId, kind){
  const id = `qa-${kind}-${stepId}`;
  return `<div class="qadd"><input id="${id}" placeholder="${kind==="in"?"Malzeme kodu ya da adı yaz…":"Yan ürün kodu ya da adı yaz…"}" aria-label="${kind==="in"?"Giren malzeme":"Yan ürün"}" autocomplete="off"
      role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}-p" data-msec="${kind}" data-owner="${esc(ownerId)}">
    <div class="msec" id="${id}-p" role="listbox" aria-label="Malzeme seçenekleri" hidden></div>
    <input class="num" id="${id}-q" inputmode="decimal" value="1" aria-label="Miktar">

/* ================= Süreler =================
   Her rota adımının teorik ve gerçekleşen süreleri. Gerçekleşen değer elle girilir ya da terminal değeri planlamacıca kabul edilir
   (kaynak: elle | kabul; terminal kaynağı bu sürümde bağlı değil, bekleyen değer alanı ve "kabul et" hazır, değer boştur). Veri bu aşamada kayıt JSON'undadır (st.gercekSure, adım kimliğine bağlı). */
const KAYNAK_YAZI = {elle:"Elle", kabul:"Kabul", terminal:"Terminal"};
function sureSatirlari(){
  const out = [];
  for (const it of st.items.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),"tr"))) {
    if (it.type==="ham" || !st.routes[it.id]) continue;
    const A = activeRev(it.id);
    for (const s of stepsOf(it.id)) out.push({it, s, rev:A ? A.no : "–", d:opdef(s.opId)});
  }
  return out;
}
function sureSatiri(r){
  const s = r.s, k = gercekHazirla(st.gercekSure[s.id]), T = sureNormalle(s), E = etkinSureler({hazirlik:s.setup||0, islem:T.proc, degisim:T.chg}, k);
  const bekler = gercekTerminalBekliyor(k), ad = `${r.it.code} OP ${s.seq}`, ist = station(s.stationId);
  const makineler = ist ? stMachines(ist.id).filter(m=>m.status==="aktif").map(m=>m.code) : [];
  const dk = v => v===null ? "–" : fmt(v,2);
  const okuma = (l, h, c="") => `<div class="f ${c}"><span>${l}</span><div class="calc strong">${h}</div></div>`;
  const gir = a => fld(`Gerçekleşen ${SURE_ETIKET[a].toLocaleLowerCase("tr-TR")} dk`,
    `<input class="num" inputmode="decimal" data-k="gs:${s.id}:${a}" data-s="gsure" data-id="${esc(s.id)}" data-f="${a}" value="${esc(nv(k.deger[a]))}" aria-label="Gerçekleşen ${SURE_ETIKET[a].toLocaleLowerCase("tr-TR")} dakika, ${esc(ad)}">${
      k.kaynak[a] ? `<span class="tag okk" data-kaynak="${a}">${KAYNAK_YAZI[k.kaynak[a]]}</span>` : k.terminal[a]!==null ? `<span class="tag" data-kaynak="${a}">Terminal ${fmt(k.terminal[a],2)} bekliyor</span>` : ""}`);
  return `<div class="grid g-sr" data-sr="${esc(s.id)}">
    ${okuma("Ürün", `<b>${esc(r.it.code)}</b><small>${esc(r.it.name)}</small>`, "sr-u")}
    ${okuma("Revizyon", esc(r.rev))}
    ${okuma("Op no", String(s.seq))}
    ${okuma("Operasyon", r.d ? `${esc(r.d.abbr)} <small>${esc(r.d.name)}</small>` : "–", "sr-op")}
    ${okuma("Kaynak", ist ? `${esc(ist.code)}<small>${esc(ist.name)}${makineler.length ? " · "+esc(makineler.join(", ")) : ""}</small>` : "–", "sr-op")}
    ${okuma("Teorik hazırlık dk", dk(sureSayisi(s.setup)))}
    ${okuma("Teorik işlem dk", dk(T.proc))}
    ${okuma("Teorik değişim dk", dk(T.chg))}
    ${okuma("Değişim %", oranMetni(degisimOrani(T.proc, T.chg)))}
    ${SURE_ALANLARI.map(gir).join("")}
    <div class="f sr-plan"><span>Plan tabanı</span>
      <select data-k="gt:${s.id}" data-s="gtaban" data-id="${esc(s.id)}" data-f="taban" aria-label="Plan tabanı, ${esc(ad)}">
        <option value="teorik" ${k.taban==="teorik"?"selected":""}>Teorik</option>
        <option value="gerceklesen" ${k.taban==="gerceklesen"?"selected":""} ${gercekVarMi(k)?"":"disabled"}>Gerçekleşen</option></select>
      <small>Planda: hazırlık ${dk(E.hazirlik)}, işlem ${dk(E.islem)}, değişim ${dk(E.degisim)} dk</small>
      ${bekler ? `<button class="btn sm" data-act="gKabul" data-id="${esc(s.id)}">Terminal değerini kabul et</button>` : ""}
    </div>
  </div>`;
}
function tabSureler(){
  const satirlar = sureSatirlari();
  return `<section class="sec">
    <div class="sec-head"><h2>Süreler</h2>
      <p class="hint">Her rota adımının teorik ve gerçekleşen süreleri. Çevrim = işlem + değişim; Değişim % = değişim ÷ işlem × 100 (işlem boş ya da 0 ise boş). Plan teorik süreyle hesaplanır. Gerçekleşen süreye yalnız elle girince ya da terminal değerini kabul edince geçer; plan tabanını buradan geri alabilirsin. Terminal kaynağı henüz bağlı değil.</p></div>
    <div class="btnrow"><button class="btn" data-act="tab" data-tab="schema">Ürün ve rotalar</button><button class="btn" data-act="tab" data-tab="ops">Operasyonlar</button></div>
    ${satirlar.length ? `<div class="rows">
      <div class="grid head g-sr sup"><span class="sp5">Adım</span><span class="sp4 c">Teorik (dk)</span><span class="sp3 c">Gerçekleşen (dk)</span><span>Plan</span></div>
      <div class="grid head g-sr"><span>Ürün</span><span>Rev</span><span>Op no</span><span>Operasyon</span><span>Kaynak</span><span class="n">Hazırlık</span><span class="n">İşlem</span><span class="n">Değişim</span><span class="n">Değişim %</span><span class="n">Hazırlık</span><span class="n">İşlem</span><span class="n">Değişim</span><span>Taban</span></div>
      ${satirlar.map(sureSatiri).join("")}</div>` : `<p class="empty">Rotası olan ürün yok. Ürün ve rotalar bölümünde rota oluşturunca adımlar burada görünür.</p>`}
  </section>`;
}
/* Canlı plan varken (ya da taslaktayken) değişiklik taslak senaryoya gider; bildirim planın şimdi ne yaptığını değil, ne olacağını söyler */
function tabanBildirimi(taban){
  const taslakta = !!ui.studio || st.orders.some(o=>o.status==="serbest" || o.status==="uretimde");
  if (taslakta) return taban==="gerceklesen" ? "Taslağa yazıldı; onaylanınca plan gerçekleşen süreyi kullanır." : "Taslağa yazıldı; onaylanınca plan teorik süreyi kullanır.";
  return taban==="gerceklesen" ? "Plan bu adımda gerçekleşen süreyi kullanıyor." : "Plan bu adımda teorik süreyi kullanıyor.";
}
function gercekDegisti(el){
  const id = el.dataset.id; if (!findStep(id)) return;
  const once = gercekHazirla(st.gercekSure[id]);
  const r = el.dataset.s==="gtaban" ? gercekTabanDegistir(once, el.value) : gercekElleGir(once, el.dataset.f, el.value);
  if (!r.ok) { toast(esc(r.ileti)); render(); return; }
  if (gercekVarMi(r.kayit) || gercekTerminalBekliyor(r.kayit)) st.gercekSure[id] = r.kayit; else delete st.gercekSure[id];
  if (once.taban!==r.kayit.taban) toast(tabanBildirimi(r.kayit.taban));
  save(); render();
}

function bolmeHesapla(h){
  const s = bolmeDurum(h), g = bolmeBaglam(h), r = {tur:s.tur, g, hazir:false, ileti:"", bilgi:false, ipucu:"", kalan:null, satirlar:[]};
  if (!g || !s.tur || s.tur==="tek") return r;
  if (!(g.qty > 0)) { r.ileti = "Emir miktarı sıfırdan büyük olmalı."; r.bilgi = true; return r; }
  const bitti = j => !g.yeni && !!g.adimlar[j-1] && st.opStatus[opKey(g.o.id, "root", g.adimlar[j-1].id)]==="tamam";
  const yukte = (kollar, j) => kollar.filter(k=>j > k.n && j < k.m).reduce((t,k)=>t+k.qty, 0);
  const satir = (ad, tur, miktar, isaret) => ({ad, tur, hucre:g.adimlar.map((_, i)=>{ const j = i+1, q = miktar(j); return q==null ? null : {q, bitti:isaret && bitti(j)}; })});
  const icinde = j => j >= g.aralik.lo && j <= g.aralik.hi;
  const anaAd = g.yeni ? "Ana emir" : g.o.no;
  if (s.tur==="kol") {
    if (s.n==null) { r.ipucu = "Önce kolun ayrılacağı adıma dokun."; return r; }
    if (s.m==null) { r.ipucu = "Şimdi ana emre birleşeceği adıma dokun."; return r; }
    const q = sayiOku(s.kolQ);
    if (!(q > 0)) { r.ileti = "Kol miktarını gir."; r.bilgi = true; return r; }
    const tum = [...g.mevcut, {n:s.n, m:s.m, qty:q}];
    let yuk = 0; for (let j = s.n + 1; j < s.m; j++) yuk = Math.max(yuk, yukte(tum, j));
    r.kalan = yuvarla6(g.qty - yuk);
    r.hazir = true;
    r.satirlar = [satir(anaAd, "ana", j=>icinde(j) ? yuvarla6(g.qty - yukte(tum, j)) : null, true),
      {...satir("Yeni kol", "kol", j=>j > s.n && j < s.m ? q : null, false), bos:j=>j <= s.n ? "ana emirde" : j >= s.m ? "katıldı" : ""}];
    return r;
  }
  const p = bolmePartiOku(s);
  if (!p.ok) { r.ileti = p.ileti; return r; }
  if (!p.liste.length) { r.ileti = "Alt emir miktarını gir."; r.bilgi = true; return r; }
  r.kalan = yuvarla6(g.qty - p.liste.reduce((a,b)=>a+b, 0));
  r.hazir = true;
  const kolEmri = !!g.o.kol;
  r.satirlar = [satir(anaAd, "ana", j=>icinde(j) ? yuvarla6(r.kalan - yukte(g.mevcut, j)) : null, true),
    ...p.liste.map((q, i)=>satir(`${kolEmri ? "Kol" : "Parti"} ${p.sira[i]+1}`, kolEmri ? "kol" : "parti", j=>icinde(j) ? q : null, true))];
  return r;
}

function orderCard(o, P){

    <div class="oc-hd" style="display:none">
      <span class="prio p${o.priority||3}">${PRIO[o.priority||3]}</span>
      <b class="ono">${esc(o.no)}</b>${R&&R.revNo?`<span class="rvchip ${R.revPinned?"st-onayli":"st-yururlukte"} sm" title="${R.revEski?"Emir eski rotayla açıldı; Rotayı güncelle ile yeni adımlar eklenir":R.revPinned?"Revizyona sabitlenmiş":"Yürürlükteki revizyon"}">Rev ${esc(R.revNo)}${R.revEski?" eski rota":R.revPinned?" sabit":""}</span>`:""}
      ${it?`<span class="slot t-${it.type}">${TS[it.type]}</span><span class="oc-it"><b>${esc(it.code)}</b> ${esc(it.name)}</span>`:`<span class="oc-it">Ürün silinmiş</span>`}

      ${fld("Başlangıç", kk(`<input type="date" data-k="o:${o.id}:start" data-s="order" data-id="${o.id}" data-f="start" data-r="1" value="${esc(o.start)}" aria-label="Başlangıç">`))}
      ${fld("Teslim", kk(`<input type="date" data-k="o:${o.id}:due" data-s="order" data-id="${o.id}" data-f="due" data-r="1" value="${esc(o.due)}" aria-label="Teslim">`))}
      ${fld("Öncelik", kk(sel(`o:${o.id}:prio`,"order",o.id,"priority",[1,2,3,4].map(n=>`<option value="${n}" ${n===(o.priority||3)?"selected":""}>${PRIO[n]}</option>`).join(""),{n:1,label:"Öncelik"})))}
      ${fld("Durum", kk(sel(`o:${o.id}:st`,"order",o.id,"status",Object.keys(OSTAT).map(k=>`<option value="${k}" ${k===o.status?"selected":""}>${OSTAT[k]}</option>`).join(""),{label:"Durum"})))}

      <div class="oc-kpi"><small>Plan bitiş</small><b class="${R?(R.late?"badt":"okt"):""}">${R?fmtDate(R.finish):o.status==="tamam"?"Tamamlandı":"Plan dışı"}</b>${R?`<em>${bufChip(R)}${R.released?` <span class="hint" style="font-size:.72rem">başlatma ${fmtShort(addDays(P.base,R.rel))}</span>`:""}</em>`:""}</div>
      <div class="oc-kpi"><small>İlerleme</small><span class="pbar"><i style="width:${(prog*100).toFixed(0)}%"></i></span><em>${R?`${R.doneCount}/${R.totalOps} adım`:""}</em></div>
    </div>

function orderDetail(o, R, P){

  const tips = orderTips(R, P);
  return `<div class="odet">
    <div class="kpis">
      <div class="kpi"><small>Birim maliyet</small><b>${money(R.unit)}</b><em>${fmt(o.qty,0)} ${esc(item(o.itemId).unit)}</em></div>
      <div class="kpi"><small>Toplam maliyet</small><b>${money(R.total)}</b><em>Alım ${money(R.matCost)}, stoktan ${money(R.stockValue)}, makine ${money(R.opCost)}${R.laborCost>0?`, işçilik ${money(R.laborCost)}`:""}${R.credit>0?`, yan ürün −${money(R.credit)}`:""}</em></div>
      <div class="kpi ${R.late?"bad":"ok"}"><small>Plan bitiş</small><b>${fmtDate(R.finish)}</b><em>Teslim ${fmtDate(o.due)}</em></div>

    <h4 class="dh">Operasyonlar</h4>${orderOps(R, P)}
    ${o.sunucu?`<p class="hint" style="margin-top:6px">Fason adımlar atölye kapasitesi kullanmaz, bu tabloda yer almaz. Bu emirde bir adımı iç üretimden fasona ya da fasondan içeri almak için: <button class="linkbtn" data-act="emirYerGit" data-id="${esc(o.id)}">Üretim Emirleri'nde iç ve dış üretim</button>. Rota değişmez.</p>`:""}

      ? `<p class="hint">${R.shortages.length} kalem eksik: ${R.shortages.map(k=>{ const e = R.raw[k], it = item(e.itemId); return `${esc(it.code)}${e.status?" ("+esc(statusLabel(e.status))+")":""} ${fmt(e.net,3)} ${esc(cardUnit(it.id, e.status))}`; }).join(", ")}. Stok, plan sırasında önceki emirlere ayrıldıktan sonra kalan miktara göre hesaplanır.</p>
         <div class="btnrow" style="margin-top:8px"><button class="btn primary" data-act="receiveOrder" data-id="${o.id}">Eksikleri teslim al</button></div>`
      : o.kol ? `<p class="hint">Bu kol ana emre bağlıdır; ana emir tamamlanınca birlikte tamamlanır ve girenleri stoktan düşer.</p>`
      : `<p class="hint">Tüm girenler stokta. Tamamladığında girenler stoktan düşülür, yan ürün ve hurdalar ile ${fmt(o.qty,0)} ${esc(item(o.itemId).unit)} ${esc(item(o.itemId).code)} stoğa girer.${R.doneCount<R.totalOps?` ${R.totalOps-R.doneCount} adım henüz bitmedi.`:""}</p>
         <div class="btnrow" style="margin-top:8px"><button class="btn primary" data-act="completeOrder" data-id="${o.id}">${ui.armed==="complete:"+o.id?"Emin misin? Tamamla ve stoktan düş":"Emri tamamla, stoktan düş"}</button></div>`}

}
function atamaDugmesi(e, deger, ad){

function orderOps(R, P){

        :`<div class="kpi ${shortDays?"bad":"ok"}"><small>Personel açığı</small><b>${st.people.length?shortDays+" gün":"Tanımsız"}</b><em>${st.people.length?"İhtiyaç mevcut kişi-saati aşıyor":"Kaynaklar > Personel"}</em></div>`}

/* ================= Planlama parametreleri =================
   Planlama motorunun okuduğu ve bu ekranda karşılığı olmayan alanlar (verim, ışıksız, ayarcı, aile, aparat, kasa, tedarik ve muayene günü,
   fason kapasitesi ve çıkış günleri) kaydın "plan" alt nesnesinde durur; planlama modülü bu kaydı ana veri olarak okur.
   Boş bırakılan isteğe bağlı alan kayıttan çıkar; zorunlu alan boşsa eski değer kalır (sıfır uydurulmaz). */
const PLAN_GUN = [["pzt","Pzt"],["sal","Sal"],["car","Çar"],["per","Per"],["cum","Cum"],["cmt","Cmt"],["paz","Paz"]];
function planHedef(o, id){
  const ust = st.plan = st.plan || {};
  if (o==="machine") { const x = machine(id); return x ? (x.plan = x.plan || {}) : null; }
  if (o==="person") { const x = person(id); return x ? (x.plan = x.plan || {}) : null; }
  if (o==="item") { const x = item(id); return x ? (x.plan = x.plan || {}) : null; }
  if (o==="step") { const x = findStep(id); return x ? (x.step.plan = x.step.plan || {}) : null; }
  if (o==="fason") return (ust.fasoncular || []).find(x=>x.id===id) || null;
  if (o==="aparat") return (ust.aparatlar || []).find(x=>x.id===id) || null;
  if (o==="matris") return (ust.ayarMatrisi || [])[+id] || null;
  return null;
}
function planp(o, id, f, label, val, t="num", ek={}){
  const ortak = `data-s="planp" data-o="${o}" data-id="${esc(id)}" data-f="${f}" data-t="${t}" ${ek.bos?'data-bos="1"':""}`;
  if (t==="bool") return `<label class="check" style="min-height:0"><input type="checkbox" ${ortak} ${val?"checked":""}> ${esc(label)}</label>`;
  if (t==="sec") return fld(esc(label), `<select ${ortak} aria-label="${esc(label)}">${ek.secenek||""}</select>`);
  return fld(esc(label), `<input ${t==="num"?'class="num" inputmode="decimal"':""} ${ortak} value="${esc(t==="num"?nv(val):(val??""))}" aria-label="${esc(label)}" ${ek.ph?`placeholder="${esc(ek.ph)}"`:""} ${ek.liste?`list="${ek.liste}"`:""}>`);
}
function planpDegisti(el){
  const {o, id, f, t} = el.dataset; const h = planHedef(o, id); if (!h) return;
  const ham = String(el.value).trim();
  if (t==="bool") h[f] = el.checked;
  else if (t==="gun") { const l = new Set(h[f] || []); if (el.checked) l.add(el.dataset.g); else l.delete(el.dataset.g); h[f] = PLAN_GUN.map(x=>x[0]).filter(g=>l.has(g)); }
  else if (ham==="" && el.dataset.bos) delete h[f];
  else if (ham==="") { toast("Bu alan boş bırakılamaz; eski değer kaldı."); render(); return; }
  else if (t==="num") { if (!/^[0-9]+([.,][0-9]+)?$/.test(ham)) { toast("Sıfır ya da sıfırdan büyük bir sayı girin; eski değer kaldı."); render(); return; } h[f] = num(ham); }
  else h[f] = ham;
  save(); queueRender();
}
function planMakine(m){ const p = m.plan || {};
  return `<div class="plan-ek" aria-label="${esc(m.code)} planlama değerleri">
    ${planp("machine",m.id,"verim","Verim (1 = tam)",p.verim)}
    ${planp("machine",m.id,"opOran","Operatör oranı",p.opOran)}
    ${planp("machine",m.id,"ucret","₺ / saat (plan)",p.ucret)}
    ${planp("machine",m.id,"isiksiz","Işıksız çalışır",p.isiksiz,"bool")}
  </div>`; }
function planAdim(step){ const p = step.plan || {}, U = st.plan || {};
  const aileler = [...new Set(Object.values(st.routes).flatMap(r=>(r.steps||[]).map(x=>(x.plan||{}).aile)).filter(Boolean))];
  const mat = (U.ayarMatrisi || []).map((x,i)=>({x,i})).filter(({x})=>p.aile && (x.den===p.aile || x.ye===p.aile));
  const aparat = (U.aparatlar || []);
  return `<div class="isec"><h4>Planlama</h4><div class="ig">
    ${planp("step",step.id,"aile","Ayar ailesi",p.aile,"text",{bos:true,ph:"aile yok",liste:"plan-aileler"})}<datalist id="plan-aileler">${aileler.map(a=>`<option value="${esc(a)}">`).join("")}</datalist>
    ${aparat.length?planp("step",step.id,"aparat","Aparat",p.aparat,"sec",{bos:true,secenek:`<option value="">Aparat yok</option>`+aparat.map(a=>`<option value="${esc(a.id)}" ${a.id===p.aparat?"selected":""}>${esc(a.ad)}</option>`).join("")}):""}
    ${fld("En küçük parti (Qmin)", inp(`p:${step.id}:ml`,"step",step.id,"minLot",step.minLot,{num:1,label:"En küçük parti"}))}
    ${planp("step",step.id,"kasa","Kasa (adet)",p.kasa,"num",{bos:true,ph:"ürünün kasası"})}
  </div>
  <p class="hint kucuk">Örtüşme ve aktarma adedi yukarıdaki "Önceki adımla ilişki" bölümündedir: Örtülü, planlamada örtüşebilir demektir.</p>

  </div>`; }
function resPlanEk(){ const U = st.plan || {};

    <div class="panel"><h3>Fason firmalar (${fas.length})</h3>${fas.length?fas.map(f=>`<div class="plan-ek" aria-label="${esc(f.ad)}">
      ${fld("Firma", `<span class="calc sol">${esc(f.ad)}</span>`)}
      ${planp("fason",f.id,"kapasite","Kapasite (iş)",f.kapasite)}

      ${planp("fason",f.id,"cikisSaat","Çıkış saati",f.cikisSaat)}
      ${fld("Çıkış günleri", `<span class="gunler">${PLAN_GUN.map(([g,l])=>`<label class="check" style="min-height:0"><input type="checkbox" data-s="planp" data-o="fason" data-id="${esc(f.id)}" data-f="cikisGunleri" data-t="gun" data-g="${g}" ${(f.cikisGunleri||[]).includes(g)?"checked":""}> ${l}</label>`).join("")}</span>`, "gun-alan")}
    </div>`).join(""):`<p class="hint">Fason firma yok.</p>`}</div>
    <div class="panel"><h3>Aparatlar (${ap.length})</h3>${ap.length?`<div class="plan-ek">${ap.map(a=>planp("aparat",a.id,"adet",a.ad+" (adet)",a.adet)).join("")}</div>`:`<p class="hint">Aparat yok.</p>`}</div>`; }

  if (a==="revReturn") { if (!r) return true; r.status = "taslak"; save(); render(); return true; }
  if (a==="revApprove") { if (!r) return true; const k = "appr:"+r.id; if (ui.armed!==k) { ui.armed = k; render(); return true; } ui.armed = null;
    r.approvedAt = Date.now(); r.approver = oturumKisiAdi(); activateRev(r);

  if (a==="revTry") { if (!r) return true; const L = liveState(), cur = clone(L); cur.routes[r.itemId] = clone(r.data);

function opExpected(x){
  const L = (st.opLog||[]).filter(l=>l.key===x.e.opKey); const lastStart = L.filter(l=>l.act==="basla").slice(-1)[0]; if (!lastStart) return null;
  const after = L.filter(l=>l.t>=lastStart.t); const doneAtStart = Math.max(0, x.done - after.reduce((a,l)=>a+(l.act==="adet"||l.act==="duzelt"?l.qty:0),0));
  const w = wc(x.op.s ? (station(x.e.stationId)||{}).wcId : null); if (!w) return null;
  let mins = 0; const t0 = new Date(lastStart.t), t1 = new Date();
  for (let d = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate()); d <= t1; d.setDate(d.getDate()+1)) {
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; if ((st.cal.holidays||[]).includes(ds)) continue;
    for (const id of ((w.week||{})[d.getDay()]||[])) { const sh = shiftOf(id); if (!sh) continue;
      const from = d.toDateString()===t0.toDateString() ? t0.getHours()*60+t0.getMinutes() : 0, to = d.toDateString()===t1.toDateString() ? t1.getHours()*60+t1.getMinutes() : 2880;
      mins += Math.max(0, shiftWorked(sh, to) - shiftWorked(sh, from)); } }
  const T = stepTimes(x.op.s, station(x.e.stationId)); const setup = x.op.needSetup ? T.setup : 0;
  const rate = T.cycle > 0 ? T.e/T.cycle : 0; return Math.min(x.q, doneAtStart + Math.max(0, mins - setup)*rate);
}

/* ================= Plan stüdyosu =================

   bir stüdyo senaryosuna alınır (canlı geri yüklenir). Senaryo = çatallandığı andaki canlı kopya (base) + üzerindeki çalışma (cur).

/* Senaryo plan modülünün taslağıdır (plan-ekran-verisi-yeri.md 4.2): açılınca sunucuda kişiye ait taslak da açılır; senaryodaki sıra,

const SENARYO_YAZ = {timer:null, uyarilan:new Set(), ayar:new Map()};

function studioAct(a, d){
  if (a==="whatIf") { runWhatIf(d.v); return true; }
  if (a==="newScenario") { const L = liveState(); const id = createScenario(nextScnName(), L, L); enterScenario(id); ui.tab = ui.tab==="studio" ? "studio" : ui.tab; render(); toast(`<b>${esc(scnMeta(id).name)}</b> açıldı. Yaptığın değişiklikler bu senaryoya yazılır.`); return true; }
  if (a==="openScenario") { enterScenario(d.id); render(); return true; }
  if (a==="exitStudio") { exitStudio(); render(); return true; }
  if (a==="dupScenario") { const s0 = studio.data[d.id]; if (!s0 || eskiSenaryo(scnMeta(d.id))) return true; if (ui.studio===d.id) save(); const id = createScenario(scnMeta(d.id).name+" (kopya)", s0.base, s0.cur, scnMeta(d.id).note); render(); toast("Senaryo çoğaltıldı."); return true; }
  if (a==="delScenario") { const k = "dels:"+d.id; if (ui.armed!==k) { ui.armed = k; render(); return true; } ui.armed = null; if (ui.studio===d.id) { st = live; live = null; ui.studio = null; invalidate(); }
    /* Taslak kapanır (vazgeçildi); zaten kapanmışsa (canlıya alınmış) yerel senaryo yine silinir. */
    const t = (scnMeta(d.id) || {}).taslak; if (t && planBagli()) window.tmi.komut("plan-senaryo-vazgec", {taslak:t}).catch(() => {});
    studioRemove(d.id); render(); toast("Senaryo silindi."); return true; }
  if (a==="discardScenario") { if (eskiSenaryo(scnMeta(d.id))) return true; const k = "disc:"+d.id; if (ui.armed!==k) { ui.armed = k; render(); return true; } ui.armed = null; const L = liveState(); studio.data[d.id] = {base:clone(L), cur:normalize(clone(L))}; if (ui.studio===d.id) { st = studio.data[d.id].cur; invalidate(); } studioPersist(d.id); senaryoTaslaginaYazSonra(d.id); render(); toast("Senaryo canlı planla eşitlendi."); return true; }
  if (a==="rebaseScenario") { if (eskiSenaryo(scnMeta(d.id))) return true; const s0 = studio.data[d.id]; if (ui.studio===d.id) save(); const L = clone(liveState()); const cur = clone(L); const cf = mergeDelta(s0.base, s0.cur, cur);
    studio.data[d.id] = {base:L, cur:normalize(cur)}; if (ui.studio===d.id) { st = studio.data[d.id].cur; invalidate(); } studioPersist(d.id); senaryoTaslaginaYazSonra(d.id); render(); toast(`Senaryo canlının son hâline göre yenilendi${cf.length?`; ${cf.length} kayıtta senaryodaki hâl korundu`:""}.`); return true; }
  if (a==="publishScenario") { const k = "pub:"+d.id; if (ui.armed!==k) { ui.armed = k; render(); return true; } ui.armed = null;
    const s0 = studio.data[d.id]; if (!s0 || eskiSenaryo(scnMeta(d.id))) return true; if (ui.studio===d.id) save();
    if (planBagli() && scnMeta(d.id).taslak) { senaryoOnayaGonder(d.id); return true; }
    senaryoYereldeCanliyaAl(d.id); if (planBagli()) planYaz({sessiz:true});
    return true; }
  return false;
}
/* Senaryonun plan dışı değişiklikleri (ürün, rota, takvim) canlıya bu ekranda geçer; plan alanları canlı plandan yeniden kurulur. */
function senaryoYereldeCanliyaAl(id){
  const s0 = studio.data[id], L = liveState(), cf = mergeDelta(s0.base, s0.cur, L), nL = normalize(clone(L)), nm0 = scnMeta(id).name;
  if (ui.studio) { live = nL; } else st = nL;
  if (ui.studio===id) { st = live; live = null; ui.studio = null; }
  invalidate(); livePlanCache = null;
  try { localStorage.setItem(LS_KEY, JSON.stringify(ui.studio ? live : st)); } catch(e) {}
  if (!ui.studio) save();
  studioRemove(id); ui.tab = "plan"; render();
  toast(`<b>${esc(nm0)}</b> canlı plana aktarıldı.${cf.length?` ${cf.length} kayıtta canlıdaki sonraki değişikliğin üzerine yazıldı.`:""}`);
}
/* Canlıya tek kapı: taslak senaryonun son hâliyle yazılır ve onaya gönderilir; canlıya onaylayan Planlama stüdyosunda alır. Onaydaki taslak
   donmuştur (plan modülü yazmayı reddeder): senaryo bu ekranda kalır, sonraki değişiklik yeni senaryo gerektirir. Başaramazsa senaryo olduğu gibi kalır. */
async function senaryoOnayaGonder(id){
  const t = scnMeta(id).taslak;
  clearTimeout(SENARYO_YAZ.timer); PLANB.yaziyor = true; render();
  try { await senaryoTaslaginaYaz(id, true); await window.tmi.komut("plan-senaryo-onaya-gonder", {taslak:t}); }
  catch (h) { toast(esc((h && h.message) || "Senaryo onaya gönderilemedi.")); return; }
  finally { PLANB.yaziyor = false; render(); }
  const m = scnMeta(id); if (m) { m.onayda = true; studioPersist(); }
  toast(`<b>${esc((m && m.name) || "Senaryo")}</b> onaya gönderildi. Canlı plan, onaylayan Planlama stüdyosunda canlıya alınca değişir.`);
}

/* Süreçteki malzeme: atölye bildirimlerinden (biten adet) hesaplanır; her adımın çıktısı, sonraki adım tüketene kadar o statüde bekler */
function wipRows(P){
  const rows = {}; const add = (itemId, sk, q, no) => { if (q <= 1e-6) return; const k = itemId+"|"+sk; const r = rows[k] = rows[k] || {itemId, sk, qty:0, orders:{}}; r.qty += q; r.orders[no] = (r.orders[no]||0) + q; };
  for (const R of P.list) { const no = R.order.no; const dq = op => op.done ? op.qty : Math.min(op.qty, op.prog||0);
    const groups = {}; for (const op of R.ops) (groups[op.n.nid+"#"+op.j] = groups[op.n.nid+"#"+op.j] || []).push(op);
    for (const key in groups) { const g = groups[key], op0 = g[0], n = op0.n, j = op0.j; const made = g.reduce((a,x)=>a+dq(x),0); if (made <= EPS) continue;

      let nx = null; for (let jj = j+1; jj < 99; jj++) { const g2 = groups[n.nid+"#"+jj]; if (!g2) { if (jj > j+20) break; continue; } if (g2[0].dep!=="bagimsiz") { nx = g2; break; } }
      let used = 0;
      if (nx) used = nx.reduce((a,x)=>a+dq(x),0);
      else if (n.pn) { const pg = groups[n.pn.nid+"#"+n.pj]; if (pg) { const pq = pg.reduce((a,x)=>a+x.qty,0), pd = pg.reduce((a,x)=>a+dq(x),0); used = pq>EPS ? n.qty*pd/pq : 0; } }
      const oc = j===n.steps.length-1 ? {itemId:n.id, status:""} : (op0.outCard || {itemId:op0.itemId, status:""}); if (j < n.steps.length-1 || n.pn) add(oc.itemId, oc.status, Math.max(0, good - used), no); } }

function addStepTo(itemId, afterId, opId, qty){
  const r = st.routes[itemId] = st.routes[itemId] || {base:1, steps:[]};
  const list = stepsOf(itemId); let pos = afterId ? list.findIndex(x=>x.id===afterId)+1 : 0; if (pos < 0) pos = list.length;
  const d = opdef(opId);
  const s = Object.assign({id:uid("p"), seq:0, opId:opId||"", stationId:d?d.stationId:"", setup:d?d.setup:15, transfer:0, ins:[], outs:[]}, sureNormalle(d ? {proc:d.proc===undefined ? d.cycle : d.proc, chg:d.chg} : {proc:2, chg:null}));

/* ================= Bağlı veri: malzeme kartları ve operasyon tipleri (kart #1105) ==========   Köprü (window.tmi) varsa malzemeler sahibi modülün kartlarından, operasyonlar istasyonların operasyon tiplerinden gelir; ekle/düzenle

/* Eski kimlikleri yeni kimliğe çevirir. Yalnız kimlik taşıyan alanlar değişir: kalem eşlemesi rota anahtarında, adım girdi ve çıktısında,

function kimlikDegistir(kalem, op){

function uyumlaItems(liste){

function uyumlaOpdefs(liste, istasyonlar){

/* ================= Bağlı birim maliyetler (kart #1187) =================

function maliyetDegeri(tur, id){

const maliyetBagli = (tur, nesne) => MAL.var && !!(window.tmi && window.tmi.komut) && (tur === "malzeme" ? !!(nesne && nesne.bagli) : kaynakBagli());
