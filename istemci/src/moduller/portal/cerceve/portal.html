const DOC_TYPES=['Vergi levhası','İmza sirküleri','Ticaret sicil gazetesi','Faaliyet belgesi','KVKK taahhütnamesi','ISO 9001','IATF 16949','ISO 14001','Diğer'];
const REQ_DOCS={customer:['Vergi levhası','İmza sirküleri'],supplier:['Vergi levhası','İmza sirküleri','ISO 9001','KVKK taahhütnamesi']};
const docsOf=pid=>vals(S.docs).filter(d=>d.partyId===pid);
const docValid=d=>d.status==='approved'&&(!d.expiresAt||daysLeft(d.expiresAt)>=0);
function compliance(pid){
  const p=S.parties[pid];if(!p)return {req:[],missing:[],expired:[],expiring:[],pending:[],pct:100,ok:true};const req=REQ_DOCS[p.type]||[];const ds=docsOf(pid);
  const missing=[],expired=[],expiring=[];
  req.forEach(t=>{const list=ds.filter(d=>d.type===t);const valid=list.filter(docValid);if(valid.length){const best=valid.sort((a,b)=>(b.expiresAt||'9999').localeCompare(a.expiresAt||'9999'))[0];if(best.expiresAt&&daysLeft(best.expiresAt)<=30)expiring.push(best)}
    else if(list.some(d=>d.status==='approved'))expired.push(list.filter(d=>d.status==='approved').sort((a,b)=>(b.expiresAt||'').localeCompare(a.expiresAt||''))[0]);else missing.push(t)});
  const pending=ds.filter(d=>d.status==='pending');const okN=req.length-missing.length-expired.length;
  return {req,missing,expired,expiring,pending,pct:req.length?okN/req.length*100:100,ok:!missing.length&&!expired.length};
}
function partyBlocked(pid){const p=S.parties[pid];if(!p||p.type!=='supplier')return false;return p.status==='blocked'||!compliance(pid).ok}
function blockReason(pid){const p=S.parties[pid];if(p?.status==='blocked')return p.blockReason||'Manuel blokaj';const c=compliance(pid);return [...c.missing.map(t=>t+' eksik'),...c.expired.map(d=>d.type+' süresi doldu')].join(', ')}
function complianceBanner(pid){if(!pid)return '';const c=compliance(pid);const p=S.parties[pid];
  if(partyBlocked(pid))return `<div class="banner bad"><b>${esc(p.name)} sipariş blokajında</b>${esc(blockReason(pid))}. Belgeler tamamlanıp onaylanana kadar yeni satın alma siparişi açılamaz.</div>`;
  if(c.expiring.length)return `<div class="banner warn"><b>Belge süresi yaklaşıyor</b>${c.expiring.map(d=>esc(d.type)+' '+fmtShort(d.expiresAt)).join(', ')}.</div>`;return ''}
function riskFlags(pid){
  const p=S.parties[pid];if(!p)return [];const f=[];const c=compliance(pid);
  if(p.status==='blocked')f.push(['Manuel blokaj: '+(p.blockReason||''),'bad']);
  c.missing.forEach(t=>f.push([t+' eksik','bad']));c.expired.forEach(d=>f.push([d.type+' süresi doldu','bad']));c.expiring.forEach(d=>f.push([d.type+' '+deadlineText(d.expiresAt),'warn']));
  if(p.bankChange?.status==='pending')f.push(['IBAN değişikliği onay bekliyor','warn']);
  const type=p.type==='customer'?'sales':'purchase';const items=openItems(o=>o.partyId===pid&&o.type===type);const od=sum(items.filter(x=>x.dl<0).map(x=>x.rest));
  if(od>0)f.push(['Vadesi geçmiş '+moneyK(od),p.type==='customer'?'bad':'warn']);
  if(p.type==='customer'){if(p.creditLimit){const u=partyBalance(pid)/p.creditLimit;if(u>0.9)f.push(['Kredi limiti %'+num(u*100,0)+' dolu','bad']);else if(u>0.7)f.push(['Kredi limiti %'+num(u*100,0)+' dolu','warn'])}
    if(vals(S.payments).some(x=>x.partyId===pid&&x.status==='bounced'))f.push(['Karşılıksız çek geçmişi','bad'])}
  else{const sc=supplierScore(pid);if(sc.grade==='C')f.push(['Performans sınıfı C','bad']);const crit=vals(S.ncrs).filter(n=>n.partyId===pid&&n.status!=='closed'&&n.severity==='Kritik').length;if(crit)f.push([crit+' açık kritik uygunsuzluk','bad']);
    const sole=vals(S.catalog).filter(c=>c.side==='purchase'&&c.partyId===pid).filter(c=>!vals(S.catalog).some(x=>x.side==='purchase'&&x.partyId!==pid&&x.code===c.code)).length;if(sole)f.push([sole+' kalemde tek kaynak','warn'])}
  const ctr=vals(S.contracts).filter(k=>k.partyId===pid&&cStatus(k)==='expiring');ctr.forEach(k=>f.push(['Sözleşme '+deadlineText(k.endDate),'warn']));
  return f;
}
const flagsHtml=f=>f.length?`<div class="flags">${f.map(([t,tone])=>pill(t,tone)).join('')}</div>`:'<span class="hint">Risk işareti yok</span>';

/* ================= sözleşme, endeks, ceza ================= */
function idxSeries(k){return S.settings?.main?.indexes?.[k]?.values||[]}
function idxNow(k){const v=idxSeries(k);return v.length?v[v.length-1].value:null}
function indexedPrice(l){if(!l.index||!l.index.key)return l.price;const cur=idxNow(l.index.key);if(!cur)return l.price;return r2(l.price*((1-l.index.share)+l.index.share*cur/l.index.base))}
function cStatus(c){if(c.terminated)return 'terminated';if(c.approval==='pending')return 'approval';if(c.approval==='rejected')return 'rejected';if(!c.signed?.firm||!c.signed?.party)return 'signing';
  if(today()>c.endDate)return 'expired';if(today()<c.startDate)return 'scheduled';return daysLeft(c.endDate)<=60?'expiring':'active'}
const CST={approval:['İç onayda','warn'],rejected:['Reddedildi','bad'],signing:['Karşı taraf onayı bekleniyor','warn'],scheduled:['Başlamadı','role'],active:['Yürürlükte','good'],expiring:['Bitiyor','warn'],expired:['Süresi doldu',''],terminated:['Feshedildi','']};
const cPill=c=>{const m=CST[cStatus(c)];return pill(m[0]+(cStatus(c)==='expiring'?', '+deadlineText(c.endDate):''),m[1])};
const cValue=c=>sum(c.lines.map(l=>l.qty*l.price));
function cOrders(c){return vals(S.orders).filter(o=>o.contractId===c.id&&o.status!=='cancelled'&&o.approvalState!=='rejected')}
function consumed(c,l){return sum(cOrders(c).flatMap(o=>o.items.filter(it=>it.code===l.code||it.name===l.name).map(it=>it.qty)))}
function cUse(c){const v=cValue(c);return v?sum(c.lines.map(l=>Math.min(consumed(c,l),l.qty)*l.price))/v:0}
function cTime(c){const a=new Date(c.startDate).getTime(),b=new Date(c.endDate).getTime();return Math.max(0,Math.min(1,(Date.now()-a)/(b-a)))}
function findContract(o){return vals(S.contracts).find(c=>c.partyId===o.partyId&&c.type===o.type&&['active','expiring'].includes(cStatus(c))&&o.items.some(it=>c.lines.some(l=>l.code&&l.code===it.code)))}
const contractOf=o=>o.contractId?S.contracts[o.contractId]:null;
const penaltyApplied=o=>sum((o.penalties||[]).filter(x=>x.status==='applied').map(x=>x.amount));
function penaltyCalc(o){
  const c=contractOf(o);if(!c||!c.penalty||!c.penalty.rate)return null;const g=c.penalty.grace||0;
  const promise=o.termRequest?.status==='approved'&&o.revisedDate?o.revisedDate:o.promisedDate;const rows=[];let total=0;
  (o.deliveries||[]).forEach(d=>{const late=diffDays(d.shipDate,promise)-g;if(late>0){const val=sum(o.items.map((it,i)=>(+d.qtys[i]||0)*priceOf(it.price)));const amt=val*c.penalty.rate*late;rows.push({d,late,val,amt});total+=amt}});
  let accruing=null;if(!fullyShipped(o)&&o.status!=='cancelled'){const late=-daysLeft(promise)-g;if(late>0){const val=sum(o.items.map((it,i)=>Math.max(0,it.qty-shippedQty(o,i))*priceOf(it.price)));accruing={late,val,amt:val*c.penalty.rate*late}}}
  const cap=oNet(o)*c.penalty.cap;return {c,rows,promise,total:r2(Math.min(total,cap)),cap:r2(cap),accruing,applied:penaltyApplied(o),waived:sum((o.penalties||[]).filter(x=>x.status==='waived').map(x=>x.amount))};
}

/* ================= fatura: üçlü eşleştirme ================= */
const invLines=(o,v)=>v.lines||o.items.map((it,i)=>({qty:+(v.qtys||[])[i]||0,price:it.price}));
function matchInv(o,vi){
  const v=o.invoices[vi];if(v.credit)return {status:'credit',rows:[],varNet:0,varGross:0};
  const tol=rules().priceTol/100;const lines=invLines(o,v);let qv=0,pv=0,pend=false;
  const rows=o.items.map((it,i)=>{const prev=sum(o.invoices.slice(0,vi).filter(x=>!x.credit).map(x=>+(invLines(o,x)[i]||{}).qty||0));const L=lines[i]||{qty:0,price:it.price};
    const acc=acceptedQty(o,i),rej=rejectedQty(o,i),transit=sum(inTransit(o).map(d=>+d.qtys[i]||0));const avail=Math.max(0,acc-prev);const r={it,acc,rej,transit,invQty:L.qty,invPrice:L.price,qtyFlag:'',priceFlag:'',qv:0,pv:0};
    const ex=L.qty-avail;if(ex>0.0001){if(transit>=ex){pend=true;r.qtyFlag='grn'}else{r.qv=(ex-transit)*L.price;r.qtyFlag='qty';qv+=r.qv;if(transit>0)pend=true}}
    if(it.price&&Math.abs(L.price-it.price)/it.price>tol){r.pv=(L.price-it.price)*L.qty;r.priceFlag='price';pv+=r.pv}return r});
  const vat=1+(o.vat??KDV);const dec=v.decision?.status;
  const status=dec||(pend&&!qv&&!pv?'pending_grn':(qv+pv)>0.01?'variance':pend?'pending_grn':'matched');
  return {status,rows,varNet:r2(qv+pv),varGross:r2((qv+pv)*vat),qv,pv};
}
const INV_ST={matched:['Eşleşti','good'],pending_grn:['Teslim alma bekleniyor','warn'],variance:['Fark var','bad'],approved:['Fark onaylandı','good'],disputed:['İtiraz edildi','bad'],credited:['Fark faturasıyla kapandı','good'],credit:['İade / fark faturası','']};
const invPill=m=>{const x=INV_ST[m.status]||[m.status,''];return pill(x[0],x[1])};
const BLOCKING=['variance','pending_grn','disputed'];
function purchaseInvoices(){const out=[];vals(S.orders).filter(o=>o.type==='purchase'&&o.status!=='cancelled').forEach(o=>(o.invoices||[]).forEach((v,i)=>{if(!v.credit)out.push({o,v,i,m:matchInv(o,i)})}));return out}

function balanceOf(o){return Math.max(0,r2(invTotal(o)-paidAmt(o)-penaltyApplied(o)))}
function statement(pid){
  const rows=[];
  invoicesOf(pid).forEach(({o,v})=>rows.push(v.credit?{date:v.date,doc:v.no,desc:'İade / fark faturası, '+o.no,debit:0,credit:-v.amount,view:'order',id:o.id}:{date:v.date,doc:v.no,desc:'Fatura, '+o.no,debit:v.amount,credit:0,due:v.dueDate,view:'order',id:o.id}));
  vals(S.orders).filter(o=>o.partyId===pid).forEach(o=>(o.penalties||[]).filter(x=>x.status==='applied').forEach(x=>rows.push({date:dOf(x.at),doc:x.no||'Ceza',desc:'Gecikme cezası kesintisi, '+o.no,debit:0,credit:x.amount,view:'order',id:o.id})));
  vals(S.payments).filter(p=>p.partyId===pid&&!['rejected','awaiting'].includes(p.status)).forEach(p=>{
    rows.push({date:dOf(p.date||p.createdAt),doc:p.no,desc:METHODS[p.method]+(p.cheque?' no '+p.cheque.no+', vade '+fmtShort(p.cheque.dueDate):''),debit:0,credit:p.amount,pending:p.status==='notified',view:'pay',id:p.id});
    if(p.status==='bounced')rows.push({date:dOf(p.history?.[p.history.length-1]?.at||p.date),doc:p.no,desc:'Karşılıksız çek iadesi',debit:p.amount,credit:0,view:'pay',id:p.id})});
  rows.sort((a,b)=>a.date.localeCompare(b.date));let bal=0;rows.forEach(r=>{if(!r.pending)bal+=r.debit-r.credit;r.bal=bal});return rows;
}
function openItems(filter){
  const out=[];vals(S.orders).filter(o=>o.status!=='cancelled'&&(!filter||filter(o))).forEach(o=>{
    const inv=(o.invoices||[]).map((v,i)=>({v,i})).filter(x=>!x.v.credit).sort((a,b)=>a.v.date.localeCompare(b.v.date));
    let paid=paidAmt(o)+penaltyApplied(o)-sum((o.invoices||[]).filter(v=>v.credit).map(v=>v.amount));
    inv.forEach(({v,i})=>{const used=Math.min(paid,v.amount);paid-=used;const rest=r2(v.amount-used);if(rest>0.01)out.push({o,v,rest,dl:daysLeft(v.dueDate),m:o.type==='purchase'?matchInv(o,i):null})})});
  vals(S.payments).filter(p=>p.status==='bounced'&&(!filter||filter({type:p.direction==='in'?'sales':'purchase',partyId:p.partyId}))).forEach(p=>out.push({o:{id:p.orderId,no:p.no,partyId:p.partyId,type:'sales'},v:{no:p.no,dueDate:dOf(p.date),amount:p.amount},rest:p.amount,dl:daysLeft(dOf(p.date)),bounced:true}));
  return out;
}
function visible(col,d){

function orderStage(o){
  if(o.status==='cancelled')return 'cancelled';if(o.approvalState==='pending')return 'approval';if(o.approvalState==='rejected')return 'apprej';
  if(o.type==='purchase'&&!o.confirmedAt)return 'unconfirmed';
  if(!(o.deliveries||[]).length)return lateDays(o)?'late':'production';
  if(inTransit(o).length)return 'transit';
  if(!fullyShipped(o))return lateDays(o)?'late':'partial';

  if(invTotal(o)>0)return 'invoiced';return 'delivered';
}

function newContract(){

function invMatchView(){
  const [oid,ix]=String(UI.id||'').split('|');const o=S.orders[oid];if(!o||!visible('orders',o)||!o.invoices?.[+ix])return notFound(isFirm()?'invoices':'orders');

  if(m.status==='credited')banner=`<div class="banner good"><b>Fark, iade faturasıyla kapatıldı</b>${esc(v.decision?.note||'')}</div>`;

    `<div class="panel"><div class="panel-h"><h3>Üçlü karşılaştırma</h3><p>Sipariş, teslim alma (irsaliye ve giriş kontrolü), fatura</p></div><div class="scroll"><table class="tbl cmp3"><thead><tr><th>Kalem</th><th class="r">Sipariş miktarı</th><th class="r">Sipariş fiyatı</th><th class="r">Kabul edilen</th><th class="r">Ret</th><th class="r">Yolda</th><th class="r">Fatura miktarı</th><th class="r">Fatura fiyatı</th><th class="r">Fark</th></tr></thead><tbody>

function updateLive(f){
  const kind=f.dataset.live;
  if(kind==='pr'){const opt=f.elements.cat?.selectedOptions[0];const old=+(opt?.dataset.price||0);const np=parseNum(f.elements.price?.value);const o=f.querySelector('[data-out="delta"]');if(o)o.textContent=isNaN(np)||!old?'—':(np>=old?'+':'')+num((np-old)/old*100,1)+'% ('+money(old)+' → '+money(np)+')';return}
  let items,cur,disc=0;
  if(kind==='quote'){const q=S.requests[f.dataset.id];if(!q)return;items=q.items;cur=q.currency;disc=parseNum(f.elements.discount?.value)||0}
  else{const r=S.rfqs[f.dataset.id];if(!r)return;items=r.items;cur=r.currency}
  const prices=items.map((_,i)=>parseNum(f.elements['p'+i]?.value));
  items.forEach((it,i)=>{const o=f.querySelector(`[data-out="l${i}"]`);if(o)o.textContent=isNaN(prices[i])?'—':money(it.qty*prices[i],cur)});
  const c=calcQuote(items,prices.map(p=>isNaN(p)?0:p),disc);
  const n=f.querySelector('[data-out="net"]');if(n)n.textContent=money(c.net,cur);
  const g=f.querySelector('[data-out="grand"]');if(g)g.textContent=money(c.grand,cur);
}
function isEditing(){const a=document.activeElement;return !!(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.closest('.content,.topbar')&&a.type!=='range'&&a.type!=='file')}
function render(force){
  if(!force&&isEditing()){pendingRender=true;return}
  pendingRender=false;document.body.dataset.role=role()||'firm';
  const sy=window.scrollY;
  $('#app').innerHTML=shell();
  restoreDrafts();$$('form[data-live]').forEach(updateLive);updateScores();
  $$('.msgs').forEach(m=>{m.scrollTop=m.scrollHeight});
  if(!force)window.scrollTo(0,sy);
  if(typeof afterRender==='function')afterRender();
}
function restoreDrafts(){
  $$('form[data-draft]').forEach(f=>{const d=drafts[f.dataset.draft];if(!d)return;Object.entries(d).forEach(([k,v])=>{const el=f.elements[k];if(!el)return;
    if(el instanceof RadioNodeList||el.length&&el[0]?.type==='radio'){[...el].forEach(x=>x.checked=x.value===v);return}
    if(el.type==='checkbox')el.checked=v==='1';else if(el.type!=='file')el.value=v});
    if(d.method)f.dataset.method=d.method;if(d.chqmode)f.dataset.chq=d.chqmode});
}

function applyPrice(p,price){
  const c=S.catalog[p.catalogId];
  if(c)put('catalog',{...c,history:(c.history||[]).concat([{price:r2(price),from:p.effectiveDate,note:p.no+' fiyat güncelleme talebi onaylandı ('+p.reason+')',at:nowISO()}]).sort((a,b)=>a.from.localeCompare(b.from))});
  put('priceReqs',{...p,status:'approved',finalPrice:r2(price),decidedAt:nowISO(),history:addHist(p,'Onaylandı: '+money(price))});
}

/* ---------- form gönderimleri ---------- */
function readRows(f,withSpec){const items=[];for(let i=0;i<(UI.rows||1);i++){const name=(f.elements['name'+i]?.value||'').trim();const qty=parseNum(f.elements['qty'+i]?.value);if(!name&&isNaN(qty))continue;if(!name||!(qty>0))return {error:`${i+1}. kalemde ad ve sıfırdan büyük miktar gerekli.`};items.push({name,qty,unit:f.elements['unit'+i].value,spec:withSpec?(f.elements['spec'+i]?.value||'').trim():''})}if(!items.length)return {error:'En az bir kalem ekleyin.'};return {items}}
function fail(f,msg){const e=f.querySelector('[data-err]');if(e)e.textContent=msg;else toast(msg,'bad')}
const SUBMIT={
  modal:f=>{modalHandler&&modalHandler(f)},
  search:f=>{UI.q=fv(f,'q');go('search')},
  msg:f=>{const t=fv(f,'text');if(!t)return;put('messages',{id:uid('m'),thread:f.dataset.thread,from:me(),text:t,at:nowISO()});delete drafts[f.dataset.draft];render(true);const i=document.querySelector(`form[data-thread="${f.dataset.thread}"] input`);i&&i.focus()},
  newrfq:f=>{
    const title=fv(f,'title');if(!title)return fail(f,'Talep başlığı yazın.');const rows=readRows(f,true);if(rows.error)return fail(f,rows.error);
    const invited=partiesOf('supplier').filter(s=>f.elements['inv_'+s.id]?.checked).map(s=>s.id);if(!invited.length)return fail(f,'En az bir tedarikçi seçin.');
    const deadline=fv(f,'deadline');if(!deadline||daysLeft(deadline)<0)return fail(f,'Son teklif tarihi bugün veya ileri bir tarih olmalı.');
    const r={id:uid('r'),no:nextNo('rfqs','SAT'),title,category:fv(f,'category'),currency:f.elements.currency.value,deadline,createdAt:nowISO(),status:'open',invited,items:rows.items,note:fv(f,'note'),photos:takeUploads('newrfq'),history:[{at:nowISO(),by:'firm',text:'Teklif talebi gönderildi'}]};
    put('rfqs',r);delete drafts.newrfq;toast(r.no+' '+invited.length+' tedarikçiye gönderildi');go('rfq',r.id)},

document.addEventListener('click',e=>{
  if(UI.notifOpen&&!e.target.closest('.notif')&&!e.target.closest('[data-act="bell"]')){UI.notifOpen=false;if(!e.target.closest('[data-act]')){render(true);return}}
  const t=e.target.closest('[data-act]');if(!t)return;e.preventDefault();e.stopPropagation();if(!allowed(t.dataset.act,'act',t.dataset))return;const fn=ACT[t.dataset.act];fn&&fn(t.dataset,t)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#lightbox').classList.contains('open'))$('#lightbox').classList.remove('open');else if($('#modal').classList.contains('open'))closeModal();else if(UI.notifOpen){UI.notifOpen=false;render(true)}}
  if(e.key==='Enter'&&e.target.matches('tr[data-act]')){e.preventDefault();const fn=ACT[e.target.dataset.act];fn&&fn(e.target.dataset)}});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();if(!allowed(k,'submit',f.dataset))return;SUBMIT[k]&&SUBMIT[k](f)});
function onField(e){
  const el=e.target;
  if(el.type==='file'&&el.dataset.upload){if(e.type==='change'){handleFiles(el.dataset.upload,el.files);el.value=''}return}
  if(el.dataset.weight!==undefined){UI.weight=+el.value;saveUI();updateScores();return}
  const f=el.closest('form[data-draft]');
  if(f&&el.name){const d=(drafts[f.dataset.draft]=drafts[f.dataset.draft]||{});d[el.name]=el.type==='checkbox'?(el.checked?'1':''):el.value;
    if(el.name==='method')f.dataset.method=el.value;if(el.name==='chqmode')f.dataset.chq=el.value;
    if(el.dataset.rerender&&e.type==='change'){if(el.name==='party'){delete d.order;delete d.amount}if(el.name==='order')delete d.amount;if(UI.payPrefill){delete UI.payPrefill.order;delete UI.payPrefill.party}el.blur();render(true);return}
    if(f.dataset.live)updateLive(f)}
}

  const type=f.dataset.type;const pid=f.elements.party.value;const title=fv(f,'title');if(!title)return fail(f,'Başlık yazın.');const start=fv(f,'start'),end=fv(f,'end');if(!start||!end||end<=start)return fail(f,'Geçerli bir dönem seçin.');

    lines.push({code:c.code,name:c.name,unit:c.unit,qty:q,price:pr>0?r2(pr):priceNow(c),...(ik?{index:{key:ik,share:sh/100,base:idxNow(ik)}}:{})})}
  if(!lines.length)return fail(f,'En az bir kalem ekleyin.');
  const rate=(parseNum(fv(f,'rate'))||0)/1000,cap=(parseNum(fv(f,'cap'))||0)/100;

function greet(){const h=new Date().getHours();return h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar'}
function kpi(icn,val,label,tone,view,id){return `<a href="#" class="kpi ${tone||''}" data-act="nav" data-view="${view}" data-id="${id||''}"><span class="kpi-ic">${ic(icn,20)}</span><span><b>${val}</b><small>${esc(label)}</small></span></a>`}
const V_IC={approvals:'check',order:'box',sale:'quote',req:'quote',rfq:'quote',inv:'quote',pay:'wallet',ncr:'shield',pricereq:'tag',pricelist:'tag',party:'building',contract:'file',invmatch:'file',recons:'wallet',profile:'building',home:'home'};
const BTN={order:'Siparişi aç',approvals:'İncele',sale:'Teklife git',req:'Teklifi aç',pay:'Ödemeyi aç',ncr:'Kaydı aç',party:'Kartı aç',contract:'Sözleşmeyi aç',invmatch:'Faturayı incele',recons:'Mutabakata git',pricereq:'Talebi aç',rfq:'Teklifleri gör',inv:'Daveti aç',pricelist:'Listeyi aç',profile:'Belgelere git'};
function todoBoard(items){
  if(!items.length)return `<div class="allclear">${ic('check',28)}<div><b>Bekleyen işiniz yok</b><p>Yeni bir iş geldiğinde burada aciliyet sırasıyla görünecek.</p></div></div>`;
  const G=[['bad','Acil','Gecikmiş, süresi geçmiş veya bloke eden işler'],['warn','Bugün','Sizi bekleyen onay ve yanıtlar'],['','Takipte','Yaklaşan ve bilgi amaçlı işler']];
  const all=UI.todoAll;
  return G.map(([tone,label,hint])=>{const list=items.filter(x=>(x.tone==='bad'?'bad':x.tone==='warn'?'warn':'')===tone);if(!list.length)return '';
    const shown=all?list:list.slice(0,5);
    return `<section class="tgroup ${tone||'info'}"><h3>${label}<span class="tcount">${list.length}</span><small>${hint}</small></h3><ul>${shown.map(x=>{const i=x.t.indexOf(': ');const verb=i>0&&i<34?x.t.slice(0,i):'';const title=i>0&&i<34?x.t.slice(i+2):x.t;
      const btn=verb&&verb.length<=18?verb:(BTN[x.v]||'Aç');const tag=verb&&btn!==verb?verb:'';
      return `<li><span class="tico">${ic(V_IC[x.v]||'clock',17)}</span><a href="#" class="tmain" data-act="nav" data-view="${x.v}" data-id="${x.id||''}">${tag?`<em class="ttag">${esc(tag)}</em>`:''}<b>${esc(title)}</b><small>${esc(x.s||'')}</small></a><span class="twhen">${esc(x.w||'')}</span><button class="btn small ${tone==='bad'?'primary':''}" data-act="nav" data-view="${x.v}" data-id="${x.id||''}">${esc(btn)}</button></li>`}).join('')}</ul>${list.length>5&&!all?`<button class="morebtn" data-act="todoall">${list.length-5} iş daha göster</button>`:''}</section>`}).join('');
}
function hero(sub){const u=curUser();const p=S.parties[me()];
  return `<section class="hero"><div class="hero-txt"><p class="hero-date">${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</p><h1>${greet()}, ${esc(u.name.split(' ')[0])}</h1><p>${sub}</p></div>
    <div class="qa-row">${quickItems().slice(0,4).map(x=>`<button class="qa" ${qiAttrs(x)}><span class="qi">${ic(x.ic,20)}</span><b>${esc(x.t)}</b><small>${esc(x.d)}</small></button>`).join('')}</div></section>`;
}
function summaryLine(t){const a=t.filter(x=>x.tone==='bad').length,b=t.filter(x=>x.tone==='warn').length;if(!t.length)return 'Bekleyen işiniz yok. Yeni bir iş başlatmak için aşağıdaki kısayolları kullanın.';if(a)return `${a} acil iş sizi bekliyor; toplam ${t.length} açık iş var.`;if(b)return `${b} iş yanıtınızı bekliyor; acil iş yok.`;return `Acil iş yok; ${t.length} iş takipte.`}
function pipeline(type){
  const os=vals(S.orders).filter(o=>o.type===type&&!['closed','cancelled'].includes(orderStage(o)));
  const ST=type==='purchase'?[['approval','İç onayda','open'],['unconfirmed','Tedarikçi onayında','unconf'],['production','Hazırlanıyor','open'],['late','Gecikmede','late'],['transit','Yolda','transit'],['delivered|invoiced|partial','Teslim alındı','unpaid']]
    :[['production','Üretimde','open'],['late','Gecikmede','late'],['partial','Kısmi sevk','open'],['transit','Yolda','transit'],['delivered|invoiced','Tahsilat bekliyor','unpaid']];
  return `<div class="pipe">${ST.map(([k,l,f])=>{const n=os.filter(o=>k.split('|').includes(orderStage(o))).length;return `<a href="#" class="pstep ${k==='late'&&n?'late':''} ${n?'':'zero'}" data-act="pipe" data-type="${type}" data-f="${f}"><b>${n}</b><span>${l}</span></a>`}).join('')}</div>`;
}
function orderTracker(list){if(!list.length)return '<div class="empty"><p>Açık sipariş yok.</p></div>';
  return list.slice(0,4).map(o=>`<a href="#" class="trk" data-act="nav" data-view="order" data-id="${o.id}"><div class="trk-h"><b>${esc(o.no)}</b><span>${esc(o.title)}</span>${stagePill(o)}</div>${orderSteps(o)}</a>`).join('')}
const TODO_PERM=[['Tedarikçi ödemesi','finance'],['Faturalayın',['sales','finance']],['Gecikme cezası','finance'],['Müşteri siparişi gecikmede',['sales']],['Tedarikçi gecikmesi',['purchase','receive']],['Teslim alın',['receive','purchase']],['Termin değişikliği',['purchase']],['Tahsilatı onaylayın','finance'],['Çeki','finance'],['Senedi','finance'],['Takip',['partners']]];
function todoNeeds(x){
  const t=x.t;const st=(...a)=>a.some(k=>t.startsWith(k));
  if(st('8D yanıtını','Müşteri şikayetine'))return ['quality'];
  if(st('Belge onayı'))return ['docs','quality'];
  if(st('Takip:'))return x.s&&curUser()&&x.s.endsWith(curUser().name)?null:['admin'];
  if(x.v==='party'&&/süresi doldu|süresi yaklaşıyor| eksik/.test(t)){const p=S.parties[x.id];return p?.type==='supplier'?['purchase','quality','docs']:['sales','finance']}
  if(x.v==='contract'){const c=S.contracts[x.id];return c?.type==='sales'?['sales']:['purchase']}
  const r=TODO_PERM.find(([k])=>t.startsWith(k));return r?r[1]:null;
}

    <div class="homegrid"><div class="panel board"><div class="panel-h"><h2>Yapılacaklar</h2><p>Her işin yanındaki düğme sizi doğrudan o işe götürür.</p></div>${todoBoard(t)}</div>

    ${chartPanel('Zamanında teslim','Orijinal termine göre, hedef %95',lineChart({labels:months.map(m=>m.label),series:[{name:'Tedarikçilerden',values:monthlyOnTime('purchase',months),color:'var(--c3)'},{name:'Müşterilere',values:monthlyOnTime('sales',months),color:'var(--c1)'}],min:0,max:100,target:95,h:190}))}</div>`:''}`;

function hashId(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return (h>>>0).toString(36)}
function inQuiet(p){const n=new Date();const hm=n.getHours()*60+n.getMinutes();const t=x=>{const [a,b]=String(x||'0:0').split(':');return +a*60+ +b};const f=t(p.quietFrom),to=t(p.quietTo);if(f===to)return false;return f<to?hm>=f&&hm<to:(hm>=f||hm<to)}
function nextMorning(p){const d=new Date();const [h,m]=String(p.quietTo||'08:00').split(':');const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+h,+m);if(x<=d)x.setDate(x.getDate()+1);return x.toISOString()}
function recipients(pid,need,role){
  const us=vals(S.users).filter(u=>u.partyId===pid&&u.active!==false);
  if(role){const r=us.filter(u=>u.role===role);return r.length?r:us.filter(u=>u.role==='Genel müdür')}
  const ok=us.filter(u=>{const ps=ROLE_PERMS[u.role]||[];return !ps.includes('*')&&need.some(n=>ps.includes(n))});
  return ok.length?ok:us.filter(u=>(ROLE_PERMS[u.role]||[]).includes('*'));
}
let nBusy=false;
function enqueue(e){
  let n=0;const actor=UI.session?.user;
  (e.to||[]).forEach(u=>{if(!u||u.id===actor)return;const p=defPrefs(u);
    if(p.mute?.[e.cat]&&!e.urgent)return;
    if(e.dedupe&&vals(S.notifs).some(x=>x.dedupe===e.dedupe&&x.to===u.id))return;
    const id='nt'+(e.dedupe?hashId(e.dedupe+'|'+u.id):Date.now().toString(36)+Math.random().toString(36).slice(2,6));if(S.notifs[id])return;
    const ch=[];if(p.email)ch.push('email');if(p.whatsapp)ch.push('whatsapp');if(p.sms==='all'||(p.sms==='urgent'&&e.urgent))ch.push('sms');if(!ch.length)ch.push('email');
    let status='sent',sendAt=null;if(!e.urgent&&p.digest==='daily')status='digest';else if(!e.urgent&&inQuiet(p)){status='scheduled';sendAt=nextMorning(p)}
    nBusy=true;put('notifs',{id,at:nowISO(),event:e.event,cat:e.cat,title:e.title,text:e.text||'',to:u.id,party:u.partyId,channels:ch,urgent:!!e.urgent,ref:e.ref||null,action:e.action||null,token:Math.random().toString(36).slice(2,8).toUpperCase()+String(Math.floor(Math.random()*90)+10),status,sendAt,dedupe:e.dedupe||null,by:actor||null});nBusy=false;n++});
  return n;
}

    c.expiring.filter(d=>daysLeft(d.expiresAt)<=R.docDays).forEach(d=>{n+=enqueue({dedupe:'docs-'+p.id+'-'+d.type+'-'+d.expiresAt,event:'doc',cat:'belge',title:d.type+' belgenizin süresi '+deadlineText(d.expiresAt).replace('kaldı','sonra doluyor'),text:'Yenilenmiş belgeyi portaldan yükleyin.',to:recipients(p.id,['docs']),ref:{view:'profile',id:''}})})});
  vals(S.notifs).filter(x=>x.status==='scheduled'&&x.sendAt&&x.sendAt<=nowISO()).forEach(x=>{nBusy=true;put('notifs',{...x,status:'sent',at:x.sendAt});nBusy=false;n++});

function magicState(n){
  const a=n.action;if(!a)return {ok:false,info:true};const k=a.kind;
  if(k==='confirm'){const o=S.orders[a.id];if(!o)return {ok:false,msg:'Sipariş bulunamadı.'};return {ok:!o.confirmedAt&&o.status!=='cancelled',msg:o.confirmedAt?'Bu sipariş '+fmtDT(o.confirmedAt)+' tarihinde onaylandı.':'',sum:`<b>${esc(o.no)}</b><p>${esc(o.title)}</p><ul class="mg-lines">${o.items.map(it=>`<li><span>${esc(it.name)}</span><b>${num(it.qty)} ${esc(it.unit)}</b></li>`).join('')}</ul><dl class="mg-kv"><dt>Tutar</dt><dd>${money(oGross(o))} KDV dahil</dd><dt>İstenen termin</dt><dd>${fmtDate(o.promisedDate)}</dd><dt>Ödeme</dt><dd>${esc(o.payment||'')}</dd></dl>`}}
  if(k==='receive'){const o=S.orders[a.id];const d=o?.deliveries?.find(x=>x.id===a.did);if(!d)return {ok:false,msg:'Sevkiyat bulunamadı.'};if(o.type==='purchase')return {ok:false,msg:'Satın alma teslimi Stok > Mal kabul ekranında alınır.'};return {ok:d.status==='in_transit',msg:d.status!=='in_transit'?'Bu sevkiyat '+fmtDT(d.receivedAt)+' tarihinde teslim alındı.':'',sum:`<b>${esc(o.no)}, irsaliye ${esc(d.no)}</b><p>${esc(partyName(o.partyId))}, ${fmtDate(d.shipDate)} sevk</p><ul class="mg-lines">${o.items.map((it,i)=>+d.qtys[i]?`<li><span>${esc(it.name)}</span><b>${num(d.qtys[i])} ${esc(it.unit)}</b></li>`:'').join('')}</ul><p class="hint">Eksik veya hasarlı ürün varsa "Portalda aç" ile ret miktarı ve fotoğraf girin.</p>`}}
  if(k==='approve'){const ap=S.approvals[a.id];if(!ap)return {ok:false,msg:'Onay kaydı bulunamadı.'};const can_=asUser(n.to,()=>canApprove(ap));return {ok:ap.status==='pending'&&can_,reject:true,msg:ap.status!=='pending'?'Bu talep '+(ap.status==='approved'?'onaylandı':'reddedildi')+'.':!can_?'Sıradaki onay adımı size ait değil.':'',sum:`<b>${esc(AP_KIND[ap.kind])}</b><p>${esc(ap.title)}</p><dl class="mg-kv">${ap.amount!=null?`<dt>Tutar</dt><dd>${money(ap.amount)}</dd>`:''}<dt>Talep eden</dt><dd>${esc(userName(ap.requestedBy))}</dd><dt>Adım</dt><dd>${esc(apCurrent(ap)?.role||'')}</dd></dl>${ap.kind==='iban'&&ap.payload?`<p class="hint">Yeni IBAN: ${esc(ibanFmt(ap.payload.iban))}. Onaylamadan önce firmayı kayıtlı telefonundan arayıp teyit edin.</p>`:''}`}}
  if(k==='acceptquote'){const q=S.requests[a.id];if(!q)return {ok:false,msg:'Teklif bulunamadı.'};const v=lastV(q);const c=v&&calcQuote(q.items,v.prices,v.discount);return {ok:reqStatus(q)==='quoted',msg:reqStatus(q)!=='quoted'?'Bu teklif artık yanıt beklemiyor.':'',sum:`<b>${esc(q.no)}, sürüm ${v?.v||''}</b><p>${esc(q.title)}</p>${v?`<dl class="mg-kv"><dt>Toplam</dt><dd>${money(c.grand)} KDV dahil</dd><dt>Teslim</dt><dd>${v.deliveryDays} gün</dd><dt>Ödeme</dt><dd>${esc(v.payment)}</dd><dt>Geçerlilik</dt><dd>${fmtDate(v.validUntil)}</dd></dl>`:''}`}}
  if(k==='paidrecv'){const p=S.payments[a.id];if(!p)return {ok:false,msg:'Ödeme bulunamadı.'};return {ok:p.status==='sent',msg:p.status!=='sent'?'Bu ödeme zaten onaylandı.':'',sum:`<b>${money(p.amount)}</b><p>${esc(METHODS[p.method])}${p.cheque?', çek '+esc(p.cheque.no)+', vade '+fmtDate(p.cheque.dueDate):''}</p><dl class="mg-kv"><dt>Fatura</dt><dd>${esc(p.invoiceNo||'Cari hesaba')}</dd><dt>Tarih</dt><dd>${fmtDate(p.date)}</dd></dl>`}}
  if(k==='reconagree'){const r=S.recons[a.id];if(!r)return {ok:false,msg:'Mutabakat bulunamadı.'};return {ok:r.status==='sent',msg:r.status!=='sent'?'Bu mutabakat yanıtlandı.':'',sum:`<b>${r.kind==='cari'?'Cari bakiye, '+fmtDate(r.period):'Ba/Bs, '+esc(r.period)}</b><dl class="mg-kv"><dt>Atlas Metal kaydı</dt><dd>${money(reconAmt(r))}</dd></dl><p class="hint">Fark varsa "Portalda aç" ile kendi tutarınızı ve açıklamanızı girin.</p>`}}
  if(k==='termok'){const o=S.orders[a.id];const tr=o?.termRequest;return {ok:tr?.status==='pending',reject:true,msg:tr?.status!=='pending'?'Bu talep sonuçlandı.':'',sum:tr?`<b>${esc(o.no)}</b><p>${esc(partyName(o.partyId))}</p><dl class="mg-kv"><dt>Geçerli termin</dt><dd>${fmtDate(curPromise(o))}</dd><dt>Önerilen</dt><dd>${fmtDate(tr.date)}</dd></dl><p class="hint">${esc(tr.reason)}</p>`:''}}
  if(k==='pay')return {ok:false,info:true,payInfo:true};
  return {ok:false,info:true};
}

    <p class="mg-hi">Merhaba ${esc((u?.name||'').split(' ')[0])},</p><h2>${esc(n.title)}</h2>
    <div class="mg-card">${st.sum||`<p>${esc(n.text).replace(/\n/g,'<br>')}</p>`}</div>
    ${expired?`<p class="mg-warn">Bu bağlantının süresi doldu. Portala giriş yaparak devam edin.</p>`:n.status==='acted'?`<p class="mg-warn">Bu bağlantı kullanıldı (${fmtDT(n.actedAt)}).</p>`:st.msg?`<p class="mg-warn">${esc(st.msg)}</p>`:''}
    ${!expired&&n.status!=='acted'&&st.ok?`<button class="btn primary mg-cta" data-act="magicdo" data-ok="1">${esc(n.action.label)}</button>${st.reject?`<details class="mg-rej"><summary>Reddet</summary><textarea id="mgnote" placeholder="Gerekçe"></textarea><button class="btn danger" data-act="magicdo" data-ok="0">Gerekçeyle reddet</button></details>`:''}`:''}
    <button class="btn mg-cta2" data-act="magicportal">${st.payInfo?'Portalda ödeme bildir':'Portalda aç'}</button>
    <p class="mg-foot">Bu bağlantı ${esc(u?.name||'')} için oluşturuldu, 7 gün geçerlidir ve bir kez kullanılabilir. Şüpheli bir durum görürseniz kullanmayın, Atlas Metal'i arayın.</p>`);
}

ACT.nrun=()=>{if(!can('admin'))return toast('Bu işlem için yönetici yetkisi gerekir.','bad');const c=runChecks();render(true);toast(c?c+' yeni bildirim oluşturuldu':'Yeni bildirim gerekmedi; tüm hatırlatmalar zaten gönderilmiş.')};
ACT.ntest=()=>{const u=curUser();const p=defPrefs(u);const id='nt'+Date.now().toString(36);nBusy=true;
  put('notifs',{id,at:nowISO(),event:'test',cat:'onay',title:'Deneme bildirimi',text:'Bildirim ayarlarınız çalışıyor. Bu mesaj '+[p.email?'e-posta':'',p.whatsapp?'WhatsApp':'',p.sms!=='off'?'SMS':''].filter(Boolean).join(', ')+' ile gönderilecek şekilde ayarlandı.',to:u.id,party:u.partyId,channels:[p.email?'email':null,p.whatsapp?'whatsapp':null,p.sms!=='off'?'sms':null].filter(Boolean),urgent:false,ref:{view:'notifprefs',id:''},action:null,token:hashId(id).toUpperCase(),status:'sent',by:null});nBusy=false;render(true);ACT.nprev({id})};
SUBMIT.nprefs=f=>{const u=curUser();const phone=fv(f,'phone');if((f.elements.whatsapp.checked||f.elements.sms.value!=='off')&&!/^0?5\d{2}\s?\d{3}\s?\d{2}\s?\d{2}$/.test(phone.replace(/\s+/g,' ').trim()))return fail(f,'WhatsApp veya SMS için geçerli bir cep telefonu girin (05xx xxx xx xx).');
  if(!f.elements.email.checked&&!f.elements.whatsapp.checked)return fail(f,'En az bir kanal (e-posta veya WhatsApp) açık olmalı.');
  const mute={};Object.keys(NCAT).forEach(k=>{if(!f.elements['cat_'+k].checked)mute[k]=true});
  put('users',{...u,phone,prefs:{email:f.elements.email.checked,whatsapp:f.elements.whatsapp.checked,sms:f.elements.sms.value,digest:f.elements.digest.value,quietFrom:fv(f,'quietFrom')||'20:00',quietTo:fv(f,'quietTo')||'08:00',mute}});render(true);toast('Bildirim ayarlarınız kaydedildi')};
SUBMIT.nrules=f=>{if(!can('admin'))return fail(f,'Yönetici yetkisi gerekir.');const N={};for(const k of ['supplierConfirmH','remindH','escalateH','dueDays','docDays']){const v=parseInt(f.elements[k].value,10);if(!(v>=0))return fail(f,'Geçerli sayılar girin.');N[k]=v}
  if(N.escalateH<=N.remindH)return fail(f,'Eskalasyon süresi hatırlatma süresinden uzun olmalı.');const m=S.settings.main;put('settings',{...m,notify:N,history:addHist(m,'Bildirim kuralları güncellendi')});render(true);toast('Kurallar kaydedildi')};

/* ---------- menü ve harita bağlantıları ---------- */
(MODULES.firm.find(m=>m.k==='admin')||{subs:[]}).subs.splice(1,0,['outbox','Bildirim merkezi']);
VIEW_PERM.firm.outbox='admin';ALWAYS.push('notifprefs');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.magicToken){UI.magicToken=null;UI.magicDone=null;render(true)}});

S=loadLocal();render(true);initCaps();

</script>
