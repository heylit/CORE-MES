<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Metal Müşteri ve Tedarikçi Portalı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F3;--surface:#FFFFFF;--ink:#17202A;--muted:#5A6773;--line:#D7DDE1;--soft:#EBEFF0;--soft2:#F6F8F8;
  --firm:#3446B8;--cust:#0B6E62;--sup:#9A5200;
  --good:#1D7448;--good-soft:#E0F1E7;--warn:#985A00;--warn-soft:#FAEFD8;--bad:#B02A20;--bad-soft:#FAE4E1;
  --c1:#3446B8;--c2:#0E8A7A;--c3:#D08A12;--c4:#C2414B;--c5:#7A8794;--c6:#7B4FC4;
  --role:var(--firm);--on-role:#FFFFFF;
  --font:'Archivo','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141A;--surface:#181E25;--ink:#E4E8EC;--muted:#95A1AC;--line:#2A333C;--soft:#1F272F;--soft2:#1B2229;
    --firm:#97A4FF;--cust:#4CC3B0;--sup:#F2A54A;
    --good:#5FD08F;--good-soft:#15301F;--warn:#F0B454;--warn-soft:#32260F;--bad:#FF8A7F;--bad-soft:#3A1916;
    --c1:#8E9BFF;--c2:#3FC1AE;--c3:#F0B454;--c4:#FF7D86;--c5:#8D99A6;--c6:#B38CF2;
    --on-role:#0F1318;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141A;--surface:#181E25;--ink:#E4E8EC;--muted:#95A1AC;--line:#2A333C;--soft:#1F272F;--soft2:#1B2229;
  --firm:#97A4FF;--cust:#4CC3B0;--sup:#F2A54A;
  --good:#5FD08F;--good-soft:#15301F;--warn:#F0B454;--warn-soft:#32260F;--bad:#FF8A7F;--bad-soft:#3A1916;
  --c1:#8E9BFF;--c2:#3FC1AE;--c3:#F0B454;--c4:#FF7D86;--c5:#8D99A6;--c6:#B38CF2;
  --on-role:#0F1318;color-scheme:dark;
}
body[data-role="firm"]{--role:var(--firm)}
body[data-role="customer"]{--role:var(--cust)}
body[data-role="supplier"]{--role:var(--sup)}
body{--role-soft:color-mix(in srgb,var(--role) 13%,var(--surface))}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-stretch:78%;font-weight:750;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(1.55rem,2.5vw,2.05rem)}
h2{font-size:1.2rem}
h3{font-size:1rem;font-stretch:90%;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
img{max-width:100%}

/* Giriş ekranı */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-l{background:var(--ink);color:var(--paper);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login-l h1{font-size:clamp(2rem,4vw,3.1rem);font-stretch:70%;max-width:14ch}
.login-l p{opacity:.78;max-width:46ch;margin-top:14px}
.login-l .logo{background:var(--paper);color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:.82rem}
.flow div{border:1px solid color-mix(in srgb,var(--paper) 25%,transparent);border-radius:10px;padding:12px}
.flow b{display:block;font-size:.95rem;font-stretch:80%;margin-bottom:2px}
.login-r{padding:48px clamp(20px,5vw,64px);overflow:auto}
.login-r h2{margin-bottom:6px}
.acct-group{margin-top:22px}
.acct-group h3{color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:8px}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.acct{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer}
.acct:hover{border-color:var(--ac)}
.acct .av{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-stretch:75%;background:color-mix(in srgb,var(--ac) 15%,var(--surface));color:var(--ac);flex:none}
.acct b{display:block;font-size:.92rem;line-height:1.2}
.acct small{color:var(--muted);font-size:.8rem}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-top:6px solid var(--role)}
.brand{display:flex;gap:11px;align-items:center;padding:0 4px}
.logo{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-stretch:70%;font-size:1rem;flex:none}
.brand b{display:block;font-stretch:80%;font-size:1.08rem;line-height:1.1}
.brand span{color:var(--muted);font-size:.8rem}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--role-soft)}
.me .av{width:34px;height:34px;border-radius:8px;background:var(--role);color:var(--on-role);display:grid;place-items:center;font-weight:800;font-stretch:75%;flex:none}
.me b{display:block;font-size:.88rem;line-height:1.2}
.me small{color:var(--muted);font-size:.78rem}
nav{display:flex;flex-direction:column;gap:1px}
nav .grp{font-size:.76rem;color:var(--muted);font-weight:600;padding:12px 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:7px 10px;border-radius:7px;font-weight:550;color:var(--ink);font-size:.92rem}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--role-soft);color:var(--role);font-weight:700}
.count{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--role);color:var(--on-role);font-size:.72rem;font-weight:700;display:grid;place-items:center}
.count.warn{background:var(--warn);color:var(--surface)}
.mode{margin-top:auto;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.live{background:var(--good)}

.topbar{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px clamp(16px,3.5vw,40px);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.search{flex:1;max-width:440px;margin-right:auto;position:relative}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.notif{position:absolute;right:clamp(16px,3.5vw,40px);top:58px;width:min(420px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);z-index:30}
.notif-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.notif a{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;font-size:.87rem}
.notif a:hover{background:var(--soft)}
.notif a.unread{background:var(--role-soft)}
.notif small{display:block;color:var(--muted);font-size:.77rem}

main{min-width:0}
.content{padding:26px clamp(16px,3.5vw,40px) 60px;max-width:1320px}
.ph{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ph .sub{color:var(--muted);margin-top:6px;max-width:72ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-block;margin-bottom:10px;font-size:.86rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--role)}
.titleline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.docno{font-stretch:75%;font-weight:700;color:var(--muted);font-size:.95rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.88rem;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--role);border-color:var(--role);color:var(--on-role)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel+.panel{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-h p{color:var(--muted);font-size:.85rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2>div>.panel+.panel,.grid2>div>*+.panel,.grid2>div>.panel+*{margin-top:16px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.mt{margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.stat{padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:1.45rem;font-stretch:75%;font-weight:750;line-height:1.15}
.stat span{color:var(--muted);font-size:.82rem}
.stat.alert b{color:var(--bad)}
.stat.okay b{color:var(--good)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.tbl tr.link{cursor:pointer}
.tbl tr.link:hover td{background:var(--soft2)}
.tbl tr.link:focus-visible{outline:2px solid var(--role);outline-offset:-2px}
.tbl .t{font-weight:600}
.tbl .m{color:var(--muted);font-size:.8rem;display:block}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.nowrap{white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--good)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:650;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.role{background:var(--role-soft);color:var(--role)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-weight:800;font-stretch:75%}
.grade.A{background:var(--good-soft);color:var(--good)}.grade.B{background:var(--warn-soft);color:var(--warn)}.grade.C{background:var(--bad-soft);color:var(--bad)}

.prog{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--role);border-radius:4px}
.prog.good i{background:var(--good)}.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}

.todo{display:flex;flex-direction:column}
.todo a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.todo a:last-child{border-bottom:0}
.todo a:hover .tt{color:var(--role)}
.todo .tt{font-weight:650;font-size:.92rem}
.todo .ts{color:var(--muted);font-size:.83rem}
.todo .tw{color:var(--muted);font-size:.8rem;text-align:right;white-space:nowrap}
.mark{width:10px;height:10px;border-radius:3px;background:var(--role)}
.mark.warn{background:var(--warn)}.mark.good{background:var(--good)}.mark.bad{background:var(--bad)}

.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty p{max-width:48ch;margin:0 auto 14px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.83rem;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{border-color:var(--role);color:var(--role);background:var(--role-soft)}

dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:.88rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:550}

/* Süreç adımları */
.steps{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;margin:2px 0 18px;counter-reset:st}
.step{position:relative;padding-top:22px;font-size:.8rem;color:var(--muted);text-align:center}
.step::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);z-index:1}
.step::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::after{display:none}
.step.done{color:var(--ink)}
.step.done::before{background:var(--role);border-color:var(--role)}
.step.done::after{background:var(--role)}
.step.now{color:var(--role);font-weight:700}
.step.now::before{border-color:var(--role);box-shadow:0 0 0 4px var(--role-soft)}
.step.late{color:var(--bad);font-weight:700}
.step.late::before{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.step small{display:block;font-weight:400;color:var(--muted)}

/* Teklif föyü */
.sheet{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--role-soft);border-bottom:2px dashed color-mix(in srgb,var(--role) 40%,var(--line))}
.sheet-h b{font-stretch:78%;font-size:1.2rem}
.sheet-h .k{display:block;font-size:.78rem;color:var(--muted)}
.sheet-b{padding:6px 20px 18px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin:12px 0 0 auto;max-width:360px;font-size:.9rem}
.sum dt{color:var(--muted)}.sum dd{margin:0;text-align:right}
.sum .grand{font-weight:750;font-size:1.08rem;padding-top:6px;border-top:1px solid var(--line);color:var(--ink)}
.terms{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem}
.terms span{color:var(--muted)}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:.88rem}
.diff{margin-top:12px;font-size:.86rem;font-weight:600}
.diff.down{color:var(--good)}.diff.up{color:var(--bad)}

.cmp th.sup{min-width:150px;text-align:right}
.cmp td.v{text-align:right;white-space:nowrap}
.cmp td.best{background:var(--good-soft)}
.cmp td.best b{color:var(--good)}
.cmp tr.total td{font-weight:700;border-top:2px solid var(--line)}
.cmp tr.score td{font-weight:700}
.cmp tr.score td.lead{background:var(--role-soft);color:var(--role)}
.cmp .line{display:block;color:var(--muted);font-size:.76rem;font-weight:400}
.weight{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.86rem;margin:4px 0 14px}
.weight input{accent-color:var(--role);width:180px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:2px}
.chip b{font-weight:650}

/* Form */
form .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.84rem;min-width:0}
.fld>span{color:var(--muted);font-weight:550}
input[type=text],input[type=date],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;font-size:.9rem;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--role) 55%,transparent);outline-offset:0;border-color:var(--role)}
textarea{min-height:72px;resize:vertical}
.itemrows{width:100%;border-collapse:collapse}
.itemrows td{padding:4px 6px 4px 0;vertical-align:top}
.itemrows th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:550;padding:0 6px 4px 0}
.itemrows input,.itemrows select{min-width:70px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:.88rem}
.check input{margin-top:3px;accent-color:var(--role)}
.check small{display:block;color:var(--muted)}
.err{color:var(--bad);font-size:.86rem;font-weight:600;margin-top:8px}
.err:empty{display:none}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.livetotal{font-size:.93rem}
.livetotal b{font-size:1.12rem}
.priceinp{max-width:130px;text-align:right}
.qtyinp{max-width:110px;text-align:right}
.hint{color:var(--muted);font-size:.83rem}
.banner{border-radius:10px;padding:13px 16px;margin-bottom:16px;font-size:.9rem;border:1px solid}
.banner.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.role{background:var(--role-soft);border-color:color-mix(in srgb,var(--role) 30%,transparent)}
.banner.plain{background:var(--surface);border-color:var(--line)}
.banner b{display:block;margin-bottom:2px}
.actbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
[data-m]{display:none}
form[data-method="havale"] [data-m~="havale"],form[data-method="cek"] [data-m~="cek"],form[data-method="senet"] [data-m~="senet"],form[data-method="kart"] [data-m~="kart"],form[data-method="dbs"] [data-m~="dbs"],form[data-method="nakit"] [data-m~="nakit"]{display:grid}
form[data-chq="ciro"] [data-chq-own]{display:none!important}
form[data-chq="own"] [data-chq-ciro]{display:none!important}

/* Dosyalar */
.uploader{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.upbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed color-mix(in srgb,var(--role) 50%,var(--line));color:var(--role);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem;font-weight:600;background:var(--role-soft)}
.upbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upbtn:focus-within{outline:2px solid var(--role);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:.8rem;line-height:1}
.thumb.busy::after{content:"Yükleniyor";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:.72rem}
#lightbox{position:fixed;inset:0;background:rgba(8,10,14,.86);display:none;align-items:center;justify-content:center;z-index:70;padding:24px;flex-direction:column;gap:10px}
#lightbox.open{display:flex}
#lightbox img{max-width:min(1100px,94vw);max-height:82vh;border-radius:8px;background:#fff}
#lightbox p{color:#fff;font-size:.9rem}

/* Mesajlar ve geçmiş */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow:auto;padding:4px 2px 8px}
.msg{max-width:85%;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:.88rem;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--role-soft)}
.msg small{display:block;color:var(--muted);font-size:.74rem;margin-bottom:2px}
.msgform{display:flex;gap:8px;margin-top:10px}
.msgform input{flex:1}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 13px 20px;font-size:.86rem}
.tl li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--role)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl small{display:block;color:var(--muted);font-size:.76rem}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:.86rem}
.ver.cur{border-color:var(--role)}
.dlv{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dlv+.dlv{margin-top:10px}
.dlv-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.eight{display:grid;gap:10px}
.eight div{border-left:3px solid var(--role);padding:2px 0 2px 12px;font-size:.88rem}
.eight b{display:block;font-size:.8rem;color:var(--muted);font-weight:600}

/* Grafikler */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line)}
.chart .tgt{stroke:var(--bad);stroke-dasharray:4 4}
.chart rect.bar:hover,.chart path.arc:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donutwrap .legend{flex-direction:column;gap:6px}
.donutwrap .legend span{display:flex;justify-content:space-between;gap:10px}
.donutwrap .legend b{color:var(--ink);font-weight:650}
.spark{width:90px;height:26px;display:block}

/* Modal ve bildirim */
#modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(10,14,20,.45);padding:5vh 16px;z-index:50;overflow:auto}
#modal.open{display:flex}
.dlg{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{max-width:760px}
.dlg h2{margin-bottom:8px}
.dlg>p{color:var(--muted);margin-bottom:12px;font-size:.9rem}
.dlg .actbar{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:.88rem;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:1080px){.grid2,.cols3{grid-template-columns:1fr}}
@media (max-width:860px){
  .cols2{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px;gap:10px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav .grp{display:none}
  nav a{white-space:nowrap;gap:8px}
  .mode{display:none}
  .topbar{position:static}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .login{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .donutwrap{grid-template-columns:1fr}
  .steps{font-size:.7rem}
}

/* v3 */
.acct-co{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.acct-co h4{margin:0 0 8px;font-size:.9rem;font-stretch:85%}
.ubtns{display:flex;flex-wrap:wrap;gap:6px}
.ubtn{border:1px solid var(--line);background:var(--soft2);border-radius:7px;padding:6px 10px;font-size:.82rem;cursor:pointer;text-align:left;line-height:1.25}
.ubtn:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--surface))}
.ubtn small{display:block;color:var(--muted);font-size:.72rem}
.me select{margin-top:6px;width:100%;font-size:.78rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.cmp3 td.flag{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cmp3 td.warnc{background:var(--warn-soft)}
.cmp3 td.okc{background:var(--good-soft)}
.matrix th,.matrix td{text-align:center;font-size:.8rem}
.chip .hint{font-size:.75rem}

/* ================= v4 görsel katman ================= */
:root{
  --canvas:#EDF0F4;--side:#13243A;--side-2:#1B3150;--side-ink:#B9C6D8;--side-hi:#FFFFFF;
  --firm:#2F55D4;--cust:#0B7A6C;--sup:#B5650C;
  --c1:#2F55D4;--c2:#0E8A7A;--c3:#D08A12;--c4:#C2414B;--c5:#7C8A99;--c6:#7B4FC4;
  --shadow:0 1px 2px rgba(19,36,58,.06),0 2px 8px rgba(19,36,58,.05);
  --shadow-lg:0 12px 40px rgba(19,36,58,.18);
}
body{--hero:var(--role)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--hero:color-mix(in srgb,var(--role) 38%,#0A1320)}}
:root[data-theme="dark"] body{--hero:color-mix(in srgb,var(--role) 38%,#0A1320)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#0E141C;--side:#0A1320;--side-2:#152238;--side-ink:#8FA0B6;--firm:#8EA4FF;--cust:#4CC3B0;--sup:#F2A54A;--c1:#8EA4FF;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--canvas:#0E141C;--side:#0A1320;--side-2:#152238;--side-ink:#8FA0B6;--firm:#8EA4FF;--cust:#4CC3B0;--sup:#F2A54A;--c1:#8EA4FF;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.5)}
body{background:var(--canvas);font-size:15px}
.ic{flex:none;display:inline-block;vertical-align:middle}

/* kenar çubuğu */
.v4.shell{grid-template-columns:236px minmax(0,1fr)}
.v4 .side{background:var(--side);color:var(--side-ink);border:0;border-top:0;padding:18px 12px;gap:18px;box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}
.v4 .brand{padding:2px 8px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.v4 .brand .logo{background:var(--role);color:var(--on-role);border-radius:10px;width:40px;height:40px}
.v4 .brand b{color:var(--side-hi);font-size:1.1rem}
.v4 .brand span{color:var(--side-ink);font-size:.78rem}
.v4 .side nav{gap:2px}
.v4 .side nav a{color:var(--side-ink);padding:10px 12px;border-radius:9px;gap:12px;justify-content:flex-start;font-weight:550;font-size:.94rem}
.v4 .side nav a span{flex:1}
.v4 .side nav a:hover{background:var(--side-2);color:var(--side-hi)}
.v4 .side nav a.on{background:var(--side-hi);color:var(--side)}
.v4 .side nav a.on .ic{color:var(--role)}
.v4 .side nav a em{font-style:normal;font-size:.72rem;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--side-hi)}
.v4 .side nav a em.hot{background:#E5484D;color:#fff}
.v4 .side nav a.on em{background:var(--role);color:var(--on-role)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.who2{display:flex;gap:10px;align-items:center;padding:0 6px}
.who2 .av{width:36px;height:36px;border-radius:50%;background:var(--role);color:var(--on-role);display:grid;place-items:center;font-weight:800;font-stretch:80%;flex:none}
.who2 b{display:block;color:var(--side-hi);font-size:.88rem;line-height:1.2}
.who2 small{color:var(--side-ink);font-size:.76rem;line-height:1.25;display:block}
.sw{display:flex;flex-direction:column;gap:4px;padding:0 6px;font-size:.74rem}
.sw select{background:var(--side-2);color:var(--side-hi);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:6px 8px;font-size:.8rem;width:100%}
.sidebtn{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--side-ink);padding:7px 8px;border-radius:7px;cursor:pointer;font-size:.84rem;text-align:left}
.sidebtn:hover{background:var(--side-2);color:var(--side-hi)}

/* üst çubuk */
.v4 .topbar{gap:10px;padding:10px clamp(16px,3vw,36px);background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tb-title{display:flex;gap:8px;align-items:center;color:var(--muted);min-width:0;margin-right:8px}
.tb-title b{color:var(--ink);font-stretch:85%;font-size:1.05rem;white-space:nowrap}
.v4 .search{max-width:360px;margin-right:auto;margin-left:8px}
.v4 .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.v4 .search input{border-radius:9px;background:var(--soft2);padding:9px 12px 9px 34px}
.newbtn{padding:9px 14px;border-radius:9px}
.v4 .iconbtn{border-radius:9px;width:40px;height:40px;color:var(--muted)}
.v4 .iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.newmenu{position:absolute;right:clamp(16px,3vw,36px);top:60px;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;z-index:30;display:grid;gap:2px}
.newmenu button{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer}
.newmenu button:hover,.newmenu button:focus-visible{background:var(--soft2)}
.newmenu b{display:block;font-size:.92rem}
.newmenu small{color:var(--muted);font-size:.8rem}
.qi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--role-soft);color:var(--role);flex:none}

/* içerik */
.v4 .content{padding:22px clamp(16px,3vw,36px) 64px;max-width:1360px}
.subnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.seg2{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px;box-shadow:var(--shadow);border:1px solid var(--line);flex-wrap:wrap}
.seg2:empty{display:none}
.seg2 button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.seg2 button:hover{color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--role);color:var(--on-role)}
.seg2 .cnt{font-size:.72rem;min-width:20px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg2 button[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--on-role) 22%,transparent);color:var(--on-role)}
.howto{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--role);border-radius:12px;padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.howto-t{display:flex;gap:8px;align-items:center;color:var(--role);white-space:nowrap;padding-top:2px}
.howto-t b{color:var(--ink);font-size:.95rem}
.howto ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;counter-reset:h}
.howto li{counter-increment:h;position:relative;padding-left:30px;font-size:.88rem;color:var(--muted);line-height:1.45}
.howto li::before{content:counter(h);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;background:var(--role-soft);color:var(--role);font-weight:800;font-size:.75rem;display:grid;place-items:center}
.lean .chartp{display:none}
.lean .cols2:not(:has(> :not(.chartp))),.lean .cols3:not(:has(> :not(.chartp))){display:none}

/* başlık */
.v4 .ph{display:block;margin-bottom:18px}
.crumbback{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:.86rem;font-weight:600;margin-bottom:8px;padding:4px 8px 4px 4px;border-radius:7px}
.crumbback:hover{background:var(--surface);color:var(--role)}
.ph-row{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.ph-main{min-width:0;flex:1 1 380px}
.v4 h1{font-size:clamp(1.55rem,2.4vw,2rem)}
.v4 .ph .sub{font-size:.95rem}

/* paneller ve kartlar */
.v4 .panel{border-radius:14px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.v4 .panel-h h3{font-size:1.02rem}
.v4 .stats{gap:12px;border:0;background:none;overflow:visible;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.v4 .stat{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.v4 .stat b{font-size:1.4rem}
.v4 .stat.alert{border-left:4px solid var(--bad)}
.v4 .tbl th{background:var(--soft2);font-size:.78rem;padding:10px 12px;border-bottom:1px solid var(--line)}
.v4 .tbl thead th:first-child{border-top-left-radius:8px}.v4 .tbl thead th:last-child{border-top-right-radius:8px}
.v4 .tbl td{padding:12px}
.v4 .tbl tr.link:hover td{background:color-mix(in srgb,var(--role) 5%,var(--surface))}
.v4 .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;font-size:.78rem}
.v4 .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.v4 .btn{border-radius:9px;padding:9px 15px}
.v4 .btn.small{padding:6px 11px;border-radius:8px}
.v4 .btn.primary{box-shadow:0 1px 2px color-mix(in srgb,var(--role) 40%,transparent)}
.v4 .tabs button{border-radius:8px;padding:7px 13px}
.v4 .banner{border:0;border-left:4px solid;border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);font-size:.92rem}
.v4 .banner b{font-size:1rem;margin-bottom:4px}
.v4 .banner.good{border-left-color:var(--good)}.v4 .banner.warn{border-left-color:var(--warn)}.v4 .banner.bad{border-left-color:var(--bad)}.v4 .banner.role{border-left-color:var(--role)}.v4 .banner.plain{border-left-color:var(--line);background:var(--surface)}
.v4 .steps{background:var(--surface);border-radius:14px;padding:16px 8px 14px;box-shadow:var(--shadow);margin-bottom:18px}
.v4 .step::before{width:16px;height:16px;top:4px}
.v4 .step::after{top:11px;height:3px}
.v4 .step{padding-top:26px;font-size:.82rem}
.v4 input[type=text],.v4 input[type=date],.v4 input[type=email],.v4 input[type=number],.v4 select,.v4 textarea{border-radius:9px;padding:9px 11px}
.v4 .dlg{border-radius:16px}

/* ana sayfa: karşılama bandı */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;margin-bottom:18px;color:#fff;background-color:var(--hero);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:center;
  background-image:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.16) 1.4px,transparent 1.6px);background-size:14px 14px}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero-txt{position:relative;z-index:1}
.hero h1{font-size:clamp(1.7rem,3vw,2.4rem);font-stretch:72%;color:#fff;margin:2px 0 6px}
.hero p{color:rgba(255,255,255,.88);max-width:48ch}
.hero-date{font-size:.88rem;opacity:.8;text-transform:none}
.qa-row{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:rgba(255,255,255,.96);color:var(--ink);border:0;border-radius:12px;padding:13px 14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.qa:hover{background:#fff;transform:translateY(-1px)}
.qa .qi{width:36px;height:36px;margin-bottom:4px}
.qa b{font-size:.9rem;line-height:1.2}
.qa small{color:var(--muted);font-size:.76rem;line-height:1.3}
.qa{color:#17202A}.qa small{color:#5A6773}.qa .qi{background:color-mix(in srgb,var(--role) 14%,#fff);color:color-mix(in srgb,var(--role) 80%,#000)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);text-decoration:none;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.kpi:hover{border-color:var(--role)}
.kpi-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--role-soft);color:var(--role);flex:none}
.kpi.warn .kpi-ic{background:var(--warn-soft);color:var(--warn)}
.kpi.bad .kpi-ic{background:var(--bad-soft);color:var(--bad)}
.kpi b{display:block;font-size:1.5rem;font-stretch:78%;line-height:1.1}
.kpi.bad b{color:var(--bad)}
.kpi small{color:var(--muted);font-size:.84rem}
.homegrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.homeside{display:flex;flex-direction:column;gap:16px}
.homeside .panel+.panel{margin-top:0}
.board .panel-h{margin-bottom:6px}
.tgroup{margin-top:14px}
.tgroup h3{display:flex;align-items:baseline;gap:8px;font-size:.98rem;margin-bottom:6px;flex-wrap:wrap}
.tgroup h3 small{font-weight:400;color:var(--muted);font-size:.8rem;font-stretch:100%}
.tcount{font-size:.75rem;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--muted);font-stretch:100%}
.tgroup.bad h3{color:var(--bad)}.tgroup.bad .tcount{background:var(--bad-soft);color:var(--bad)}
.tgroup.warn h3{color:var(--warn)}.tgroup.warn .tcount{background:var(--warn-soft);color:var(--warn)}
.tgroup ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}

function makeSeed(){
  const now=Date.now(),D=864e5;
  let _s=20261002;const rnd=()=>{_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

  const at=n=>new Date(now+n*D).toISOString();
  const yr=n=>new Date(now+n*D).getFullYear();
  const r2=x=>Math.round(x*100)/100;
  const H=(n,by,text,u)=>u?{at:at(n),by,text,u}:{at:at(n),by,text};

  const parties={};

  P('c1','customer','Marmara Otomotiv Yan Sanayi','Bursa','Elif Aydın','elif.aydin@marmaraoto.example',{term:60,creditLimit:1500000,taxNo:'6120345871'});

  P('c3','customer','Uludağ Tarım Makineleri','İnegöl','Zeynep Kılıç','zeynep@uludagtarim.example',{term:30,creditLimit:600000,taxNo:'8890412563'});
  P('c4','customer','Trakya Raf Sistemleri','Çorlu','Okan Demir','okan@trakyaraf.example',{term:60,creditLimit:500000,taxNo:'8410227390'});

  const CUST_QTY={'BR-120':[800,1600],'BP-40':[1500,3000],'MH-08':[4000,9000],'SP-300':[200,600],'KK-12':[80,250],'RK-25':[3000,8000],'DT-55':[300,900]};
  const PP={'DC01-15':['s1','DC01 sac 1,5 mm','kg',31.2,[3000,6000]],'DC01-20':['s1','DC01 sac 2 mm','kg',30.6,[2000,5000]],'LAMA-405':['s1','S235 lama 40x5','kg',33.5,[800,2000]],
    'KOLI-60':['s2','Oluklu koli 60x40x40','adet',18.5,[1000,3000]],'STREC-50':['s2','Streç film 50 cm','rulo',395,[60,150]],
    'KP-40':['s3','Kutu profil 40x40x2','m',92,[300,900]],'BORU-42':['s3','Boru Ø42x2','m',78,[200,700]],
    'M8-25':['s4','M8x25 civata 8.8 galvaniz','adet',1.85,[10000,30000]],'M8-S':['s4','M8 somun 8 galvaniz','adet',0.62,[10000,30000]],'PUL-8':['s4','M8 pul','adet',0.21,[10000,30000]],
    'GALV':['s5','Sıcak daldırma galvaniz','kg',9.4,[2000,6000]],'BOYA':['s5','Elektrostatik toz boya','m²',46,[400,1200]]};
  const SUP_ITEMS={};Object.entries(PP).forEach(([k,v])=>{(SUP_ITEMS[v[0]]=SUP_ITEMS[v[0]]||[]).push(k)});
  const SUPQ={s1:{ot:.82,dl:[2,6],rj:.006},s2:{ot:.95,dl:[1,3],rj:.003},s3:{ot:.58,dl:[3,9],rj:.015},s4:{ot:.9,dl:[1,4],rj:.002},s5:{ot:.72,dl:[2,6],rj:.022}};

  // Fiyat listeleri (geçmişiyle)
  const catalog={};

  const priceAt=(id,n)=>{const h=catalog[id].history.filter(x=>x.from<=day(n));return (h[h.length-1]||catalog[id].history[0]).price};

  const orders={},payments={},ncrs={};
  let soN=140,poN=290,thN=0,odN=0,inN=500,ncN=30,afN=700;
  const cheques=[];// portföy çekleri ciro için

  const addPayment=p=>{payments[p.id]=p;return p};
  const mkIn=(c,o,inv,n)=>{

    if(m==='cek'){const due=n+ri(30,90);p.cheque={no:String(ri(1000000,9999999)),bank:pick(['Garanti BBVA','İş Bankası','Halkbank','QNB']),branch:pick(['Nilüfer','Osmangazi','Merkez','OSB']),drawer:parties[c].name,dueDate:day(due),status:due<0?'tahsil':'portfoy'};if(due>=0)cheques.push(p)}

    const id='p'+(500+(++odN));const amt=inv.amount;

const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dOf=s=>s?(s.length>10?isoDay(s):s):null;
const daysLeft=day=>day?Math.round((new Date(dOf(day)+'T00:00:00').getTime()-today0())/DAY):null;
const diffDays=(a,b)=>Math.round((new Date(dOf(a)+'T12:00:00')-new Date(dOf(b)+'T12:00:00'))/DAY);
const fmtDate=s=>{if(!s)return '—';const d=new Date(s.length===10?s+'T12:00:00':s);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'})};
const fmtShort=s=>{if(!s)return '—';const d=new Date(s.length===10?s+'T12:00:00':s);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})};
const fmtDT=s=>{if(!s)return '—';const d=new Date(s);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})};
function ago(s){const m=Math.round((Date.now()-new Date(s).getTime())/6e4);if(m<1)return 'şimdi';if(m<60)return m+' dk önce';const h=Math.round(m/60);if(h<24)return h+' sa önce';const d=Math.round(h/24);if(d<45)return d+' gün önce';return fmtDate(s)}
function money(n,c){if(n==null||Number.isNaN(n))return '—';try{return new Intl.NumberFormat('tr-TR',{style:'currency',currency:c||'TRY',maximumFractionDigits:2}).format(n||0)}catch(e){return (n||0).toFixed(2)+' '+(c||'')}}
function moneyK(n){if(n==null||Number.isNaN(n))return '—';const a=Math.abs(n);if(a>=1e6)return '₺'+num(n/1e6,1)+' mn';if(a>=1e3)return '₺'+num(n/1e3,0)+' bin';return '₺'+num(n,0)}
const num=(n,d)=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:d==null?2:d,minimumFractionDigits:0}).format(n||0);
const pct=(n,d)=>'%'+num(n,d==null?1:d);
function parseNum(v){if(v==null)return NaN;let s=String(v).trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
const fmtIn=v=>v===''||v==null||isNaN(v)?'':String(v).replace('.',',');
function deadlineText(day){const d=daysLeft(day);if(d==null)return '—';if(d<0)return -d+' gün geçti';if(d===0)return 'bugün';return d+' gün kaldı'}

const priceOf=p=>p==null?NaN:p;

const initials=n=>String(n||'?').split(/\s+/).filter(w=>/^[A-ZÇĞİÖŞÜ]/.test(w)).slice(0,2).map(w=>w[0]).join('')||'?';

function lastMonths(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({key:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),label:MONTHS[x.getMonth()]})}return out}

/* ---------- veri katmanı ---------- */
const chains={};
function put(col,obj){
  if(typeof beforePut==='function')obj=beforePut(col,obj)||obj;
  const __prev=S[col]?.[obj.id];
  S[col]=Object.assign({},S[col],{[obj.id]:obj});
  if(typeof afterPut==='function'&&col!=='notifs'){try{afterPut(col,obj,__prev)}catch(e){console.warn('bildirim',e)}}
  if(mode==='db'){
    const key=col+'/'+obj.id;const body=JSON.parse(JSON.stringify(obj));delete body.id;
    chains[key]=(chains[key]||Promise.resolve()).then(()=>DB.collection(col).doc(obj.id).set(body)).catch(e=>{
      toast(e&&e.code==='invalid_argument'?'Kaydedilemedi: bu portalda değişiklik yetkiniz yok.':e&&e.code==='quota_exceeded'?'Kaydedilemedi: depolama kotası doldu.':'Kaydedilemedi: bağlantı sorunu, tekrar deneyin.','bad')});
  } else saveLocal();
}
async function initCaps(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    window.claude.use('downloads').then(d=>{DL=d;if(d)render()}).catch(()=>{});
    window.claude.use('assets').then(a=>{ASSETS=a}).catch(()=>{});

        S[c]=m;liveLoaded.add(c);render();

function visible(col,d){
  const r=role(),id=me();if(r==='firm')return true;
  switch(col){
    case 'requests':return r==='customer'&&d.customerId===id;
    case 'orders':return d.partyId===id&&(r==='customer'?d.type==='sales':d.type==='purchase');
    case 'ncrs':return d.partyId===id&&(r==='customer'?d.kind==='customer':d.kind==='supplier');

/* ---------- teklif ---------- */
function rfqStatus(r){if(r.status==='open'&&daysLeft(r.deadline)<0)return 'evaluating';return r.status}
const bidsOf=rid=>vals(S.bids).filter(b=>b.rfqId===rid);
const liveBids=rid=>bidsOf(rid).filter(b=>b.status!=='withdrawn');
const bidOf=(rid,sid)=>bidsOf(rid).find(b=>b.supplierId===sid);
const bidTotal=(r,b)=>sum(r.items.map((it,i)=>it.qty*(+b.prices[i]||0)));
function calcQuote(items,prices,discount){const sub=sum(items.map((it,i)=>it.qty*(prices[i]===null?NaN:(+prices[i]||0))));const disc=sub*(+discount||0)/100;const net=sub-disc;const kdv=net*KDV;return{sub,disc,net,kdv,grand:net+kdv}}
const lastV=q=>q.versions&&q.versions.length?q.versions[q.versions.length-1]:null;
function reqStatus(q){if(q.status==='quoted'){const v=lastV(q);if(v&&daysLeft(v.validUntil)<0)return 'expired'}return q.status}

/* ---------- sipariş, termin, teslimat ---------- */
const oNet=o=>sum(o.items.map(it=>it.qty*priceOf(it.price)));
const oGross=o=>oNet(o)*(1+(o.vat??KDV));
const shippedQty=(o,i)=>sum((o.deliveries||[]).map(d=>+d.qtys[i]||0));
const acceptedQty=(o,i)=>sum((o.deliveries||[]).filter(d=>d.status==='received').map(d=>+(d.acceptedQtys||d.qtys)[i]||0));
const rejectedQty=(o,i)=>sum((o.deliveries||[]).filter(d=>d.status==='received').map(d=>+(d.rejectedQtys||[])[i]||0));
const invoicedQty=(o,i)=>sum((o.invoices||[]).map(v=>+v.qtys[i]||0));
const totalQty=o=>sum(o.items.map(it=>it.qty));
const shipPct=o=>Math.min(1,sum(o.items.map((it,i)=>shippedQty(o,i)))/(totalQty(o)||1));
const recvPct=o=>Math.min(1,sum(o.items.map((it,i)=>acceptedQty(o,i)))/(totalQty(o)||1));
const curPromise=o=>o.revisedDate||o.promisedDate;
const fullyShipped=o=>o.items.every((it,i)=>shippedQty(o,i)>=it.qty);
const fullyReceived=o=>o.items.every((it,i)=>acceptedQty(o,i)>=it.qty);
const inTransit=o=>(o.deliveries||[]).filter(d=>d.status==='in_transit');
const invTotal=o=>sum((o.invoices||[]).map(v=>v.amount));
const paysOf=o=>vals(S.payments).filter(p=>p.orderId===o.id);
const paidOk=p=>['confirmed','sent'].includes(p.status);
const paidAmt=o=>sum(paysOf(o).filter(p=>p.status==='confirmed'||p.status==='sent').map(p=>p.amount));
const pendingAmt=o=>sum(paysOf(o).filter(p=>p.status==='notified').map(p=>p.amount));
function balanceOf(o){return Math.max(0,r2(invTotal(o)-paidAmt(o)))}
function lateDays(o){if(o.status==='cancelled'||fullyShipped(o))return 0;const d=daysLeft(curPromise(o));return d<0?-d:0}
function orderStage(o){
  if(o.status==='cancelled')return 'cancelled';
  if(o.type==='purchase'&&!o.confirmedAt)return 'unconfirmed';
  if(!(o.deliveries||[]).length)return lateDays(o)?'late':'production';
  if(inTransit(o).length)return 'transit';
  if(!fullyShipped(o))return lateDays(o)?'late':'partial';
  if(invTotal(o)>0&&balanceOf(o)<=0.01)return 'closed';
  if(invTotal(o)>0)return 'invoiced';
  return 'delivered';
}
const STAGE={unconfirmed:['Onay bekliyor','warn'],production:['Üretimde / hazırlanıyor','role'],late:['Gecikmede','bad'],partial:['Kısmi teslim','warn'],transit:['Yolda','role'],delivered:['Teslim edildi','good'],invoiced:['Faturalandı','good'],closed:['Kapandı','good'],cancelled:['İptal edildi','']};
const stagePill=o=>{const s=orderStage(o);const m=STAGE[s];return pill(s==='late'?m[0]+' · '+lateDays(o)+' gün':m[0],m[1])};
// teslimat performansı: her sevkiyat için gecikme (orijinal termine göre)
function deliveryRecs(filter){
  const out=[];vals(S.orders).filter(o=>o.status!=='cancelled'&&(!filter||filter(o))).forEach(o=>{
    const total=totalQty(o);
    (o.deliveries||[]).forEach(d=>{const delay=diffDays(d.shipDate,o.promisedDate);const qty=sum(d.qtys.map(Number));
      const rej=d.status==='received'?sum((d.rejectedQtys||[]).map(Number)):0;
      out.push({o,d,delay:Math.max(0,delay),ontime:delay<=0,qty,rej,received:d.status==='received',month:monthKey(d.shipDate),full:d.status==='received'&&rej===0&&(o.deliveries.length===1?qty>=total:true)})});
  });return out;
}
function perf(recs){
  const n=recs.length;const on=recs.filter(r=>r.ontime).length;const otif=recs.filter(r=>r.ontime&&r.full).length;
  const lateR=recs.filter(r=>!r.ontime);const recv=recs.filter(r=>r.received);const q=sum(recv.map(r=>r.qty));const rj=sum(recv.map(r=>r.rej));
  return{n,ontime:n?on/n*100:null,otif:n?otif/n*100:null,avgDelay:lateR.length?sum(lateR.map(r=>r.delay))/lateR.length:0,qty:q,rej:rj,ppm:q?rj/q*1e6:0,rejRate:q?rj/q*100:0};
}
function supplierScore(sid){
  const recs=deliveryRecs(o=>o.type==='purchase'&&o.partyId===sid);const p=perf(recs);
  const nc=vals(S.ncrs).filter(n=>n.kind==='supplier'&&n.partyId===sid);
  const openNc=nc.filter(n=>n.status!=='closed').length;
  const resp=nc.filter(n=>n.response);const respDays=resp.length?sum(resp.map(n=>Math.max(0,diffDays(n.response.at,n.createdAt))))/resp.length:null;
  const qScore=Math.max(0,100-p.rejRate*15-openNc*5);const dScore=p.otif??100;const rScore=respDays==null?90:Math.max(0,100-Math.max(0,respDays-3)*6);
  const score=p.n?qScore*.4+dScore*.4+rScore*.2:null;
  const grade=score==null?'—':score>=88?'A':score>=72?'B':'C';
  return Object.assign(p,{nc:nc.length,openNc,respDays,qScore,dScore,rScore,score,grade});
}
function monthlyOnTime(type,months){return months.map(m=>{const r=deliveryRecs(o=>o.type===type).filter(x=>x.month===m.key);return r.length?r.filter(x=>x.ontime).length/r.length*100:null})}

/* ---------- finans: cari, yaşlandırma, nakit akışı ---------- */
function invoicesOf(pid){const out=[];vals(S.orders).filter(o=>o.partyId===pid&&o.status!=='cancelled').forEach(o=>(o.invoices||[]).forEach(v=>out.push({o,v})));return out}
function statement(pid){
  const rows=[];
  invoicesOf(pid).forEach(({o,v})=>rows.push({date:v.date,doc:v.no,desc:'Fatura, '+o.no,debit:v.amount,credit:0,due:v.dueDate,view:'order',id:o.id}));
  vals(S.payments).filter(p=>p.partyId===pid&&p.status!=='rejected').forEach(p=>{
    rows.push({date:dOf(p.date||p.createdAt),doc:p.no,desc:METHODS[p.method]+(p.cheque?' no '+p.cheque.no+', vade '+fmtShort(p.cheque.dueDate):'')+(p.status==='notified'||p.status==='sent'&&false?' (onay bekliyor)':''),debit:0,credit:p.amount,pending:p.status==='notified',view:'pay',id:p.id});
    if(p.status==='bounced')rows.push({date:dOf(p.history?.[p.history.length-1]?.at||p.date),doc:p.no,desc:'Karşılıksız çek iadesi',debit:p.amount,credit:0,view:'pay',id:p.id});
  });
  rows.sort((a,b)=>a.date.localeCompare(b.date));let bal=0;rows.forEach(r=>{if(!r.pending)bal+=r.debit-r.credit;r.bal=bal});
  return rows;
}
function partyBalance(pid){const rows=statement(pid);return rows.length?rows[rows.length-1].bal:0}
function openItems(filter){// faturalı ve kalan borcu olan
  const out=[];vals(S.orders).filter(o=>o.status!=='cancelled'&&(!filter||filter(o))).forEach(o=>{
    let paid=paidAmt(o);(o.invoices||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(v=>{const used=Math.min(paid,v.amount);paid-=used;const rest=r2(v.amount-used);if(rest>0.01)out.push({o,v,rest,dl:daysLeft(v.dueDate)})})});
  // karşılıksız çekler alacak olarak
  vals(S.payments).filter(p=>p.status==='bounced'&&(!filter||filter({type:p.direction==='in'?'sales':'purchase',partyId:p.partyId}))).forEach(p=>out.push({o:{id:p.orderId,no:p.no,partyId:p.partyId,type:'sales'},v:{no:p.no,dueDate:dOf(p.date),amount:p.amount},rest:p.amount,dl:daysLeft(dOf(p.date)),bounced:true}));
  return out;
}
const AGING=[['Vadesi gelmemiş','var(--c2)'],['1–30 gün','var(--c3)'],['31–60 gün','var(--c4)'],['60+ gün','var(--bad)']];
function aging(items){const b=[0,0,0,0];items.forEach(x=>{const d=-x.dl;b[d<=0?0:d<=30?1:d<=60?2:3]+=x.rest});return b}
function cashForecast(weeks){
  const labels=[],inn=[],out=[];const t0=today0();
  for(let w=0;w<weeks;w++){labels.push(fmtShort(isoDay(t0+w*7*DAY)));inn.push(0);out.push(0)}
  const slot=d=>{const k=Math.floor((new Date(d+'T12:00:00')-t0)/DAY/7);return k<0?0:k<weeks?k:-1};
  openItems().forEach(x=>{const k=slot(x.v.dueDate);if(k<0)return;(x.o.type==='sales'?inn:out)[k]+=x.rest});
  vals(S.payments).forEach(p=>{
    const due=p.cheque?.dueDate||p.senet?.dueDate;if(!due)return;const k=slot(due);if(k<0||daysLeft(due)<0)return;
    if(p.direction==='in'&&p.status!=='rejected'&&p.status!=='bounced'&&['portfoy','tahsilde'].includes(p.cheque?.status||p.senet?.status))inn[k]+=p.amount;
    if(p.direction==='out'&&p.cheque&&p.cheque.status==='verildi')out[k]+=p.amount;
  });
  return{labels,inn,out};
}
function monthly(type,months){return months.map(m=>sum(vals(S.orders).filter(o=>o.type===type&&o.status!=='cancelled').flatMap(o=>(o.invoices||[]).filter(v=>monthKey(v.date)===m.key).map(v=>v.amount/(1+(o.vat??KDV))))))}
const chqOf=p=>p.cheque||p.senet;

function priceNow(c){const h=(c.history||[]).filter(x=>x.from<=today());return (h[h.length-1]||c.history[0]||{}).price}
function priceUpcoming(c){return (c.history||[]).filter(x=>x.from>today()).sort((a,b)=>a.from.localeCompare(b.from))[0]}
function priceLastChange(c){const h=(c.history||[]).filter(x=>x.from<=today());if(h.length<2)return null;return (h[h.length-1].price-h[h.length-2].price)/h[h.length-2].price*100}

/* ---------- grafikler (SVG) ---------- */
const PALETTE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function legend(series){return `<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||PALETTE[i]}"></i>${esc(s.name)}</span>`).join('')}</div>`}
function barChart({labels,series,fmt=moneyK,h=210,stacked=false,target=null,label}){
  const W=640,H=h,L=58,R=8,T=12,B=26;const iw=W-L-R,ih=H-T-B;
  const tot=labels.map((_,i)=>stacked?sum(series.map(s=>s.values[i]||0)):Math.max(...series.map(s=>s.values[i]||0)));
  const max=niceMax(Math.max(...tot,target||0,1));const gw=iw/labels.length;const bw=stacked?Math.min(46,gw*.6):Math.min(26,gw*.75/series.length);
  let g='';for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${esc(fmt(max*k/4))}</text>`}
  labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
    let acc=0;series.forEach((s,j)=>{const v=s.values[i]||0;const bh=ih*v/max;const x=stacked?cx-bw/2:cx-(bw*series.length)/2+j*bw;const y=stacked?T+ih-ih*(acc+v)/max:T+ih-bh;acc+=v;
      if(v>0)g+=`<rect class="bar" x="${x+ (stacked?0:1)}" y="${y}" width="${stacked?bw:bw-2}" height="${Math.max(1,bh)}" rx="3" fill="${s.color||PALETTE[j]}"><title>${esc(lb+' · '+s.name+': '+fmt(v))}</title></rect>`})});
  if(target!=null){const y=T+ih-ih*target/max;g+=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Çubuk grafik')}">${g}</svg>${series.length>1?legend(series):''}`;
}
function lineChart({labels,series,fmt=v=>pct(v,0),h=200,min=null,max=null,target=null,label}){
  const W=640,H=h,L=46,R=10,T=12,B=26;const iw=W-L-R,ih=H-T-B;
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);const lo=min??Math.min(...all,target??Infinity);const hi=max??niceMax(Math.max(...all,1));
  const y=v=>T+ih-(v-lo)/(hi-lo||1)*ih;const x=i=>L+(labels.length===1?iw/2:iw*i/(labels.length-1));
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  labels.forEach((lb,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`);
  if(target!=null)g+=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" style="fill:var(--bad)">Hedef ${esc(fmt(target))}</text>`;
  series.forEach((s,j)=>{const c=s.color||PALETTE[j];let d='';let pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+' '+y(v)+' ';pen=true});
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--surface)" stroke="${c}" stroke-width="2"><title>${esc(labels[i]+' · '+s.name+': '+fmt(v))}</title></circle>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Çizgi grafik')}">${g}</svg>${series.length>1?legend(series):''}`;
}
function donut({items,center,sub,fmt=moneyK}){
  const tot=sum(items.map(i=>i.value));const R=60,r=40,cx=75,cy=75;let a0=-Math.PI/2;let g='';
  if(tot<=0)g=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--soft)" stroke-width="${R-r}"/>`;
  else items.forEach((it,i)=>{if(it.value<=0)return;const a1=a0+it.value/tot*Math.PI*2;const big=a1-a0>Math.PI?1:0;
    const p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];const [x1,y1]=p(a0,R),[x2,y2]=p(a1-0.0001,R),[x3,y3]=p(a1-0.0001,r),[x4,y4]=p(a0,r);
    g+=`<path class="arc" d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" fill="${it.color||PALETTE[i]}"><title>${esc(it.label+': '+fmt(it.value))}</title></path>`;a0=a1});
  g+=`<text x="${cx}" y="${cy+2}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">${esc(center||'')}</text><text x="${cx}" y="${cy+17}" text-anchor="middle">${esc(sub||'')}</text>`;
  return `<div class="donutwrap"><svg class="chart" viewBox="0 0 150 150" role="img" aria-label="Halka grafik">${g}</svg><div class="legend">${items.map((it,i)=>`<span><span><i style="background:${it.color||PALETTE[i]}"></i>${esc(it.label)}</span><b>${esc(fmt(it.value))}${tot?` <small style="color:var(--muted);font-weight:400">${pct(it.value/tot*100,0)}</small>`:''}</b></span>`).join('')}</div></div>`;
}
function hbar({items,fmt=v=>num(v),max:mx,label}){
  const W=640,rowH=26,L=170,R=60;const H=items.length*rowH+6;const max=mx||niceMax(Math.max(...items.map(i=>i.value),1));let g='';
  items.forEach((it,i)=>{const y=i*rowH+4;const w=(W-L-R)*it.value/max;g+=`<text x="${L-8}" y="${y+15}" text-anchor="end" style="fill:var(--ink)">${esc(it.label.length>24?it.label.slice(0,23)+'…':it.label)}</text><rect x="${L}" y="${y+3}" width="${W-L-R}" height="16" rx="4" fill="var(--soft)"/><rect class="bar" x="${L}" y="${y+3}" width="${Math.max(0,w)}" height="16" rx="4" fill="${it.color||'var(--c1)'}"><title>${esc(it.label+': '+fmt(it.value))}</title></rect><text x="${L+Math.max(0,w)+6}" y="${y+15}">${esc(fmt(it.value))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Yatay çubuk grafik')}">${g}</svg>`;
}
function spark(values){if(values.length<2)return '';const W=90,H=26;const lo=Math.min(...values),hi=Math.max(...values);const y=v=>H-3-(v-lo)/(hi-lo||1)*(H-6);const x=i=>2+(W-4)*i/(values.length-1);
  const up=values[values.length-1]>=values[0];return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${values.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ')}" fill="none" stroke="${up?'var(--c4)':'var(--c2)'}" stroke-width="2"/><circle cx="${x(values.length-1)}" cy="${y(values[values.length-1])}" r="2.5" fill="${up?'var(--c4)':'var(--c2)'}"/></svg>`}
function chartPanel(title,sub,body,extra){return `<div class="panel"><div class="panel-h"><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}${extra||''}</div>${body}</div>`}

function gallery(ids,removable,key){

function uploader(key,label){
  return `<div class="uploader" data-upwrap="${key}">${gallery(pendingUp[key],true,key)}<label class="upbtn"><input type="file" accept="image/*" multiple data-upload="${key}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>${label||'Resim ekle'}</label></div>`;
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error('Resim okunamadı'));i.src=u})}
function scaleTo(img,max,type,q){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
async function handleFiles(key,fileList){
  const files=[...fileList].filter(f=>/^image\//.test(f.type)).slice(0,6);
  if(!files.length){toast('Yalnızca resim dosyaları eklenebilir (JPG, PNG, WEBP).','bad');return}
  for(const file of files){
    const id=uid('f');(pendingUp[key]=pendingUp[key]||[]).push(id);refreshUploader(key);
    try{
      const img=await loadImg(file);let doc={id,name:file.name.replace(/\.[^.]+$/,''),kind:'image',at:nowISO(),by:me()};
      if(ASSETS){const canvas=scaleTo(img,1600);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.85));const up=await ASSETS.upload(blob,{type:'image/jpeg'});doc.assetId=up.id}
      else{let q=.72,m=1000,url;for(let t=0;t<4;t++){url=scaleTo(img,m).toDataURL('image/jpeg',q);if(url.length<200000)break;m=Math.round(m*.75);q-=.08}doc.url=url}
      put('files',doc);
    }catch(e){pendingUp[key]=(pendingUp[key]||[]).filter(x=>x!==id);toast('Resim yüklenemedi: '+(e.message||e.code||'bilinmeyen hata'),'bad')}
    refreshUploader(key);
  }
}
function refreshUploader(key){const w=document.querySelector(`[data-upwrap="${key}"]`);if(!w)return;const g=w.querySelector('.thumbs');const html=gallery(pendingUp[key],true,key);if(g)g.outerHTML=html||'';else if(html)w.insertAdjacentHTML('afterbegin',html)}

  vals(S.catalog).filter(c=>r==='customer'&&c.partyId===id).forEach(c=>(c.history||[]).filter(h=>h.at).forEach(h=>ev.push({at:h.at,by:'firm',text:'Fiyat güncellemesi: '+c.name+' '+money(h.price)+' ('+fmtShort(h.from)+' itibarıyla)',view:'pricelist',id:null,label:'Fiyat listesi'})));

function firmTodo(){
  const t=[];const O=vals(S.orders);
  vals(S.requests).filter(q=>['new','revision'].includes(q.status)).forEach(q=>t.push({v:'sale',id:q.id,tone:'warn',t:(q.status==='new'?'Teklif hazırlayın: ':'Revize teklif bekleniyor: ')+q.title,s:partyName(q.customerId),w:ago(q.history?.[q.history.length-1]?.at||q.createdAt)}));
  vals(S.requests).filter(q=>q.status==='accepted').forEach(q=>t.push({v:'sale',id:q.id,tone:'good',t:'Siparişe dönüştürün: '+q.title,s:partyName(q.customerId)+' sürüm '+q.acceptedVersion+' teklifini kabul etti'}));
  vals(S.rfqs).filter(r=>rfqStatus(r)==='evaluating').forEach(r=>t.push({v:'rfq',id:r.id,tone:'warn',t:'Kazanan tedarikçiyi seçin: '+r.title,s:liveBids(r.id).length+' teklif geldi',w:fmtShort(r.deadline)}));
  O.filter(o=>o.type==='purchase'&&o.termRequest?.status==='pending').forEach(o=>t.push({v:'order',id:o.id,tone:'warn',t:'Termin değişikliği onayı: '+o.no,s:partyName(o.partyId)+', yeni tarih '+fmtShort(o.termRequest.date),w:ago(o.termRequest.at)}));
  O.filter(o=>o.type==='purchase'&&inTransit(o).length).forEach(o=>t.push({v:'order',id:o.id,tone:'',t:'Teslim alın: '+o.no,s:partyName(o.partyId)+', irsaliye '+inTransit(o).map(d=>d.no).join(', '),w:fmtShort(inTransit(o)[0].shipDate)}));
  O.filter(o=>orderStage(o)==='late').forEach(o=>t.push({v:'order',id:o.id,tone:'bad',t:(o.type==='sales'?'Müşteri siparişi gecikmede: ':'Tedarikçi gecikmesi: ')+o.no,s:partyName(o.partyId)+', termin '+fmtShort(curPromise(o)),w:lateDays(o)+' gün'}));
  O.filter(o=>o.type==='sales'&&o.items.some((it,i)=>shippedQty(o,i)>invoicedQty(o,i))&&!inTransit(o).length).forEach(o=>t.push({v:'order',id:o.id,tone:'',t:'Faturalayın: '+o.no,s:partyName(o.partyId)+', teslim edilen miktar faturalanmadı'}));
  vals(S.payments).filter(p=>p.status==='notified').forEach(p=>t.push({v:'pay',id:p.id,tone:'warn',t:'Tahsilatı onaylayın: '+money(p.amount),s:partyName(p.partyId)+', '+METHODS[p.method],w:ago(p.createdAt)}));
  vals(S.ncrs).filter(n=>n.kind==='supplier'&&n.status==='answered').forEach(n=>t.push({v:'ncr',id:n.id,tone:'warn',t:'8D yanıtını değerlendirin: '+n.no,s:partyName(n.partyId)+', '+n.defect}));
  vals(S.ncrs).filter(n=>n.kind==='customer'&&n.status==='open').forEach(n=>t.push({v:'ncr',id:n.id,tone:'bad',t:'Müşteri şikayetine yanıt verin: '+n.no,s:partyName(n.partyId)+', '+n.defect,w:deadlineText(n.dueDate)}));
  vals(S.priceReqs).filter(p=>p.status==='pending').forEach(p=>t.push({v:'pricereq',id:p.id,tone:'warn',t:'Fiyat güncelleme talebi: '+p.item,s:partyName(p.partyId)+', '+pct((p.newPrice-p.oldPrice)/p.oldPrice*100)+' artış',w:'Geçerlilik '+fmtShort(p.effectiveDate)}));
  vals(S.payments).filter(p=>p.direction==='in'&&p.status==='confirmed'&&chqOf(p)&&chqOf(p).status==='portfoy'&&daysLeft(chqOf(p).dueDate)<=7).forEach(p=>t.push({v:'pay',id:p.id,tone:daysLeft(chqOf(p).dueDate)<0?'bad':'',t:(p.cheque?'Çeki':'Senedi')+' tahsile verin: '+money(p.amount),s:partyName(p.partyId)+', vade '+fmtShort(chqOf(p).dueDate),w:deadlineText(chqOf(p).dueDate)}));
  openItems(o=>o.type==='purchase').filter(x=>x.dl<=7).forEach(x=>t.push({v:'order',id:x.o.id,tone:x.dl<0?'bad':'warn',t:'Tedarikçi ödemesi: '+money(x.rest),s:partyName(x.o.partyId)+', fatura '+x.v.no,w:deadlineText(x.v.dueDate)}));
  return t.concat(firmTodoExtra()).filter(x=>['approvals','order','party'].includes(x.v)?(x.v!=='party'||can(['partners','docs','quality'])):viewAllowed(x.v));
}
function upcomingDeliveries(filter){
  const rows=vals(S.orders).filter(o=>o.status!=='cancelled'&&!fullyShipped(o)&&(!filter||filter(o))).map(o=>({o,dl:daysLeft(curPromise(o))})).filter(x=>x.dl<=14).sort((a,b)=>a.dl-b.dl);
  if(!rows.length)return `<div class="empty"><p>Önümüzdeki 14 günde teslimat yok.</p></div>`;
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Sipariş</th>${isFirm()?'<th>Yön</th>':''}<th>Firma</th><th>Termin</th><th>Sevk</th><th>Durum</th></tr></thead><tbody>${rows.map(({o,dl})=>`<tr ${rowAttrs('order',o.id)}><td><span class="t">${esc(o.no)}</span><span class="m">${esc(o.title)}</span></td>${isFirm()?`<td>${o.type==='sales'?pill('Müşteriye',''):pill('Tedarikçiden','')}</td>`:''}<td>${esc(partyName(o.partyId))}</td><td class="nowrap">${fmtShort(curPromise(o))}<span class="m ${dl<0?'neg':''}">${deadlineText(curPromise(o))}</span>${o.revisedDate?'<span class="m">revize</span>':''}</td><td style="min-width:90px">${prog(shipPct(o),dl<0?'bad':'')}<span class="m">${pct(shipPct(o)*100,0)}</span></td><td>${stagePill(o)}</td></tr>`).join('')}</tbody></table></div>`;
}

  const cf=cashForecast(8);const ag=aging(recv);
  return head('Genel bakış','Satış, satın alma, kalite ve finansın bugünkü durumu. Kırmızı işaretli işler gecikmiş veya vadesi geçmiş kayıtlardır.',`<button class="btn" data-act="nav" data-view="newrfq">Tedarikçilerden teklif iste</button><button class="btn primary" data-act="nav" data-view="reports">Raporlar</button>`)+
    stats([[todo.length,'Sizi bekleyen iş'],[late.length,'Geciken sipariş',late.length?'alert':''],[vals(S.ncrs).filter(n=>n.status!=='closed').length,'Açık kalite kaydı'],[moneyK(overdue),'Vadesi geçmiş alacak',overdue>0?'alert':''],[moneyK(salesM[5]),'Bu ay satış (KDV hariç)']])+
    `<div class="cols2">${chartPanel('Aylık satış ve satın alma','Faturalanan tutar, KDV hariç',barChart({labels:months.map(m=>m.label),series:[{name:'Satış',values:salesM,color:'var(--c1)'},{name:'Satın alma',values:purchM,color:'var(--c3)'}],label:'Aylık satış ve satın alma'}))}
    ${chartPanel('Zamanında teslim oranı','Sevkiyat bazında, orijinal termine göre',lineChart({labels:months.map(m=>m.label),series:[{name:'Tedarikçilerden',values:monthlyOnTime('purchase',months),color:'var(--c3)'},{name:'Müşterilere',values:monthlyOnTime('sales',months),color:'var(--c1)'}],min:0,max:100,target:95,label:'Zamanında teslim oranı'}))}</div>
    <div class="grid2 mt"><div class="panel"><div class="panel-h"><h2>Sizi bekleyenler</h2><p>${todo.length} iş</p></div>${todoList(todo,'Bekleyen iş yok.',14)}</div><div class="panel"><div class="panel-h"><h2>Son hareketler</h2></div>${eventsList(9)}</div></div>
    <div class="panel mt"><div class="panel-h"><h2>Yaklaşan ve geciken teslimatlar</h2><p>Önümüzdeki 14 gün</p></div>${upcomingDeliveries()}</div>
    <div class="cols2 mt">${chartPanel('Alacak yaşlandırma','Müşterilerden açık fatura bakiyesi',donut({items:AGING.map(([l,c],i)=>({label:l,value:ag[i],color:c})),center:moneyK(sum(ag)),sub:'toplam alacak'}))}

}

function searchView(){

function updateScores(){
  const inp=document.querySelector('[data-weight]');if(!inp)return;const r=S.rfqs[inp.dataset.weight];if(!r)return;

  const tots=bs.map(b=>bidTotal(r,b));const minT=Math.min(...tots);const minD=Math.min(...bs.map(b=>+b.deliveryDays||999));
  const sc=bs.map((b,j)=>w*(minT/tots[j])+(100-w)*(minD/(+b.deliveryDays||999)));const top=Math.max(...sc);
  bs.forEach((b,j)=>{const el=document.querySelector(`[data-score="${b.id}"]`);if(el){el.textContent=num(Math.round(sc[j]*10)/10);el.classList.toggle('lead',sc[j]===top&&bs.length>1)}});
  const wl=document.querySelector('[data-out="wl"]');if(wl)wl.textContent=`Fiyat %${w}, teslim süresi %${100-w}`;
}

function ordersList(type){
  const r=role();const base=r==='firm'?vals(S.orders).filter(o=>o.type===type):mine('orders');
  const F={open:['Açık',o=>!['closed','cancelled'].includes(orderStage(o))],late:['Gecikmede',o=>orderStage(o)==='late'],transit:['Yolda',o=>inTransit(o).length>0],

  const keys=type==='purchase'?['open','unconf','late','term','transit','unpaid','closed','all']:['open','late','transit','unpaid','closed','all'];
  const fk='ord-'+type;const f=keys.includes(fil(fk,'open'))?fil(fk,'open'):'open';
  const list=base.filter(F[f][1]).sort((a,b)=>{const la=lateDays(a),lb=lateDays(b);if(la!==lb)return lb-la;return (curPromise(a)||'').localeCompare(curPromise(b)||'')});
  const recs=deliveryRecs(o=>o.type===type&&(r==='firm'||o.partyId===me())).filter(x=>diffDays(today(),x.d.shipDate)<=90);const p=perf(recs);
  const title=r==='firm'?(type==='sales'?'Satış siparişleri':'Satın alma siparişleri'):(r==='customer'?'Siparişlerim':'Siparişler');
  const sub=type==='sales'?(r==='firm'?'Müşterilere sevkiyat, termin takibi, faturalama ve tahsilat.':'Siparişlerinizin üretim, sevk ve teslim durumu. Teslim aldığınız sevkiyatları buradan onaylayın.'):(r==='firm'?'Tedarikçi onayı, sevk bildirimi, teslim alma ve giriş kalite kontrolü, termin değişiklikleri.':'Atlas Metal siparişlerini onaylayın, sevkiyat ve fatura bildirin, termin değişikliği isteyin.');
  const acts=r==='firm'?`<button class="btn primary" data-act="nav" data-view="neworder" data-id="${type}">Yeni ${type==='sales'?'satış':'satın alma'} siparişi</button>`:'';
  let charts='';

    const parties=partiesOf(type==='sales'?'customer':'supplier').map(pp=>{const rr=recs.filter(x=>x.o.partyId===pp.id);return {label:pp.name,value:rr.length?rr.filter(x=>x.ontime).length/rr.length*100:0,n:rr.length}}).filter(x=>x.n);
    charts=`<div class="cols2" style="margin-bottom:16px">${chartPanel('Termin sapması','Son 90 günün sevkiyatları, sevkiyat adedi',barChart({labels:['Zamanında','1–3 gün','4–7 gün','8+ gün'],series:[{name:'Sevkiyat',values:bins,color:'var(--c1)'}],fmt:v=>num(v,0),h:180}))}
      ${chartPanel(type==='sales'?'Müşteri bazında zamanında teslim':'Tedarikçi bazında zamanında teslim','Son 90 gün',hbar({items:parties.map(x=>({label:x.label,value:x.value,color:x.value>=90?'var(--good)':x.value>=75?'var(--c3)':'var(--c4)'})),fmt:v=>pct(v,0),max:100}))}</div>`;
  }
  return head(title,sub,acts)+

function payPill(p){const r=role();if(p.status==='awaiting')return pill('İç onay bekliyor','warn');
  if(p.status==='bounced')return pill('Karşılıksız','bad');if(p.status==='rejected')return pill('Reddedildi','bad');
  if(p.direction==='in'){if(p.status==='notified')return pill(r==='firm'?'Onay bekliyor':'Bildirildi, onay bekliyor','warn');
    const c=chqOf(p);if(c&&CHQ_IN[c.status]&&c.status!=='tahsil')return pill(CHQ_IN[c.status][0],CHQ_IN[c.status][1]);return pill('Onaylandı','good')}
  if(p.status==='sent')return pill(r==='supplier'?'Onayınız bekleniyor':'Tedarikçi onayı bekleniyor','warn');
  if(p.cheque&&p.cheque.status==='verildi')return pill('Alındı, çek vadesi '+fmtShort(p.cheque.dueDate),'role');return pill('Alındı','good')}
function methodDesc(p){const c=p.cheque,s=p.senet;
  if(c)return `Çek ${esc(c.no)}, ${esc(c.bank)}${c.own===false&&p.direction==='out'?' (müşteri çeki ciro)':''}<span class="m">vade ${fmtShort(c.dueDate)}${daysLeft(c.dueDate)>=0?', '+deadlineText(c.dueDate):''}</span>`;
  if(s)return `Senet ${esc(s.no)}<span class="m">vade ${fmtShort(s.dueDate)}</span>`;
  if(p.card)return `Kredi kartı ****${esc(p.card.last4)}<span class="m">${p.card.installments>1?p.card.installments+' taksit':'Tek çekim'}</span>`;
  if(p.dbs)return `DBS, ${esc(p.dbs.bank)}<span class="m">vade ${fmtShort(p.dbs.dueDate)}</span>`;
  return esc(METHODS[p.method])+(p.bank?`<span class="m">${esc(p.bank)}${p.ref?', '+esc(p.ref):''}</span>`:'')}
function payTable(list,showParty){return list.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Ödeme</th>${showParty?'<th>Firma</th>':''}<th>Yöntem</th><th>Fatura</th><th class="r">Tutar</th><th>Durum</th></tr></thead><tbody>${list.map(p=>`<tr ${rowAttrs('pay',p.id)}><td><span class="t">${esc(p.no)}</span><span class="m">${fmtDate(p.date)}</span></td>${showParty?`<td>${esc(partyName(p.partyId))}<span class="m">${p.direction==='in'?'Tahsilat':'Ödeme'}</span></td>`:''}<td>${methodDesc(p)}</td><td>${esc(p.invoiceNo||'Cari hesaba')}${p.orderId&&S.orders[p.orderId]?`<span class="m">${esc(S.orders[p.orderId].no)}</span>`:''}</td><td class="r nowrap ${p.direction==='out'&&role()==='firm'?'neg':''}">${money(p.amount)}</td><td>${payPill(p)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><p>Kayıt yok.</p></div>'}

    if(steps.length){obj={...obj,status:'awaiting'};createApproval('payment',{refCol:'payments',refId:obj.id,title:'Tedarikçi ödemesi, '+partyName(obj.partyId),amount:obj.amount,partyId:obj.partyId,steps});

        obj={...old,photos:obj.photos,pendingApproval:a.id,history:addHist(old,'Sürüm '+v.v+' hazırlandı, iskonto onayına gönderildi')};muteToast=true;setTimeout(()=>toast('İskonto %'+num(rules().discMgr)+' sınırını aşıyor; sürüm '+steps.join(' → ')+' onayından sonra müşteriye gider.'),60)}}}

function rules(){return Object.assign({payFin:150000,discMgr:10,priceMgr:5,contractGM:2000000,priceTol:1},S.settings?.main?.rules||{})}

function stepsFor(kind,c){const R=rules();
  if(kind==='po'){const s=[];if(!(c.amount<=R.poMgr))s.push('Satın alma müdürü');if(!(c.amount<=R.poGM))s.push('Genel müdür');return s}
  if(kind==='payment')return c.amount>R.payFin?['Finans müdürü']:[];
  if(kind==='iban')return ['Muhasebe','Finans müdürü'];
  if(kind==='discount')return c.discount>R.discMgr?['Satış müdürü']:[];
  if(kind==='pricereq')return c.delta>R.priceMgr?['Satın alma müdürü']:[];
  if(kind==='contract'){const s=[c.type==='sales'?'Satış müdürü':'Satın alma müdürü'];if(c.amount>R.contractGM)s.push('Genel müdür');return s}
  return [];}
function autoSkip(kind,steps){const r=curUser()?.role;if(kind==='iban'||!isFirm())return steps;if(r==='Genel müdür')return [];return steps.filter(s=>s!==r)}

function apDecide(a,ok,note){
  const u=curUser();const steps=a.steps.map(s=>s===apCurrent(a)?{...s,status:ok?'approved':'rejected',u:u.id,at:nowISO(),note}:s);
